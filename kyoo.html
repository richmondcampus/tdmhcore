<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>TDMH Queuing</title>
<link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;text y='.9em' font-size='90'&gt;🏥&lt;/text&gt;&lt;/svg&gt;"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Archivo:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>
<style>
/* ═══ TDMH tokens — indigo, green, gold from the hospital mark ═══ */
:root{
  --ink:#15183a; --ink-2:#262a52;
  --indigo:#3b3fa3; --indigo-2:#5b60d6; --indigo-wash:#ecedf9;
  --green:#1f8a4c; --green-2:#2fa85e; --green-wash:#e7f5ec;
  --gold:#c99a2e; --gold-wash:#faf2de;
  --red:#c0453f; --red-wash:#fbecea;
  --paper:#f7f7fb; --card:#fff; --line:#e4e4ee; --line-2:#f0f0f6;
  --text:#1c1c33; --muted:#6a6a85; --faint:#9a9ab0;
  --r:10px; --r-lg:16px;
  --sh:0 1px 2px rgba(21,24,58,.06),0 1px 3px rgba(21,24,58,.04);
  --sh-lg:0 12px 32px rgba(21,24,58,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{font-family:Figtree,system-ui,sans-serif;background:var(--paper);color:var(--text);
     font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#cfcfdd;border-radius:3px}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}
.num{font-family:Archivo,sans-serif;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}

/* ═══ shell ═══ */
.app{display:flex;height:100vh;overflow:hidden}
.rail{width:214px;flex-shrink:0;background:var(--ink);display:flex;flex-direction:column;
      padding-top:env(safe-area-inset-top,0px)}
.rail-top{padding:17px 16px 14px;display:flex;align-items:center;gap:10px;
          border-bottom:1px solid rgba(255,255,255,.07)}
.mark{width:34px;height:34px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;
      background:linear-gradient(135deg,var(--indigo-2),var(--green));color:#fff;
      font-family:Archivo;font-weight:900;font-size:15px}
.rail-name{color:#fff;font-weight:700;font-size:13.5px;line-height:1.25}
.rail-sub{color:#7b7ea8;font-size:11px}
.rail-nav{flex:1;padding:10px 9px;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;width:100%;
     text-align:left;color:#9ea1c4;font-size:13.5px;font-weight:500;transition:.14s}
.nav:hover{color:#fff;background:rgba(255,255,255,.07)}
.nav.on{color:#fff;background:var(--indigo)}
.nav svg{width:16px;height:16px;flex-shrink:0;opacity:.9}
.nav-head{padding:13px 11px 5px;font-size:11px;font-weight:700;color:#50537a;letter-spacing:.02em}
.rail-foot{padding:9px;border-top:1px solid rgba(255,255,255,.07)}
.who{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;background:rgba(255,255,255,.055)}
.pip{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
     background:var(--indigo);color:#fff;font-size:11px;font-weight:700}
.who-n{color:#fff;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-r{color:#7b7ea8;font-size:11px;text-transform:capitalize}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}

/* ═══ page furniture ═══ */
.head{padding:22px 26px 0}
.h1{font-size:20px;font-weight:800;letter-spacing:-.015em}
.sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.wrap{padding:18px 26px 26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh)}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;
        justify-content:space-between;gap:10px}
.card-t{font-size:13.5px;font-weight:700}

/* ═══ controls ═══ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 15px;
     border-radius:9px;font-size:13.5px;font-weight:600;transition:.13s;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(1px)}
.b-pri{background:var(--indigo);color:#fff}      .b-pri:hover:not(:disabled){background:#32368d}
.b-go{background:var(--green);color:#fff}        .b-go:hover:not(:disabled){background:#1a7442}
.b-gold{background:var(--gold);color:#fff}       .b-gold:hover:not(:disabled){background:#b2871f}
.b-red{background:var(--red);color:#fff}         .b-red:hover:not(:disabled){background:#a93a35}
.b-out{background:#fff;color:var(--text);border:1px solid var(--line)}
.b-out:hover:not(:disabled){background:#fafaff;border-color:#d2d2e2}
.b-ghost{color:var(--muted);padding:6px 9px} .b-ghost:hover{background:var(--line-2);color:var(--text)}
.b-sm{padding:5px 11px;font-size:12.5px} .b-ico{padding:7px;border-radius:8px}
.b-full{width:100%} .b-lg{padding:12px 20px;font-size:15px}
.inp{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;
     color:var(--text);outline:none;transition:.13s}
.inp:focus{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(59,63,163,.11)}
.inp::placeholder{color:var(--faint)}
select.inp{cursor:pointer}
.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.sw{position:relative;width:40px;height:23px;border-radius:12px;background:#d8d8e6;flex-shrink:0;transition:.18s}
.sw.on{background:var(--green)}
.sw i{position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;
      box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.18s}
.sw.on i{left:20px}

/* ═══ tags ═══ */
.tag{display:inline-flex;align-items:center;gap:4px;padding:2.5px 8px;border-radius:20px;
     font-size:11.5px;font-weight:600;white-space:nowrap}
.t-wait{background:var(--gold-wash);color:#8a6713}
.t-serv{background:var(--green-wash);color:#166434}
.t-done{background:var(--line-2);color:var(--muted)}
.t-held{background:var(--indigo-wash);color:#2f3285}
.t-skip{background:var(--red-wash);color:#8f2e2a}
.t-pri{background:var(--gold);color:#fff}
.t-step{background:var(--indigo-wash);color:var(--indigo)}

/* ═══ counter workspace ═══ */
.ws{display:flex;height:100vh;overflow:hidden}
.ws-l{width:296px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);
      display:flex;flex-direction:column}
.ws-r{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--paper)}
.ws-h{padding:12px 13px;border-bottom:1px solid var(--line-2)}
.segs{display:flex;background:var(--line-2);border-radius:9px;padding:3px;gap:2px}
.seg{flex:1;padding:6px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted);
     display:flex;align-items:center;justify-content:center;gap:5px;transition:.13s}
.seg.on{background:#fff;color:var(--text);box-shadow:var(--sh)}
.cnt{padding:1px 6px;border-radius:9px;font-size:11px;font-weight:700;background:#dadae8;color:var(--muted)}
.seg.on .cnt{background:var(--indigo);color:#fff}
.ws-list{flex:1;overflow-y:auto;padding:9px;display:flex;flex-direction:column;gap:6px}
.ws-f{padding:11px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:7px}

.tk{padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;background:#fff;transition:.13s;
    text-align:left;width:100%;display:block}
.tk:hover{border-color:#c3c3d8}
.tk.on{border-color:var(--indigo);background:var(--indigo-wash)}
.tk.pri{border-left:3px solid var(--gold)}
.tk-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tk-n{font-size:16px}
.tk-s{font-size:12px;font-weight:600}
.tk-m{font-size:12px;color:var(--muted);margin-top:2px}

/* ═══ now-serving panel ═══ */
.now{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
     padding:26px;text-align:center}
.now-n{font-family:Archivo;font-weight:900;font-size:clamp(68px,11vw,124px);line-height:.92;
       letter-spacing:-.03em;color:var(--indigo)}
.now-acts{padding:13px;background:#fff;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.kbd{display:inline-block;padding:1px 5px;border:1px solid var(--line);border-bottom-width:2px;
     border-radius:5px;font-size:10.5px;font-weight:700;color:var(--faint);background:#fff;margin-left:5px}

/* ═══ empty + misc ═══ */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 22px;
       text-align:center;color:var(--muted);gap:4px}
.empty-i{width:46px;height:46px;border-radius:50%;background:var(--line-2);display:grid;place-items:center;
         margin-bottom:8px;color:var(--faint)}
.empty-t{font-weight:700;font-size:14.5px;color:var(--text)}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
      border-radius:50%;animation:sp .7s linear infinite;flex-shrink:0}
.spin.d{border-color:rgba(59,63,163,.2);border-top-color:var(--indigo)}
@keyframes sp{to{transform:rotate(360deg)}}
.mid{display:grid;place-items:center;height:100vh}
.live{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;
      background:var(--green-wash);color:#166434;font-size:12px;font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green-2);position:relative}
.dot::after{content:'';position:absolute;inset:-3px;border-radius:50%;background:var(--green-2);
            opacity:.35;animation:pl 1.8s ease infinite}
.dot.off{background:var(--faint)} .dot.off::after{display:none}
@keyframes pl{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.7);opacity:0}}

/* ═══ table ═══ */
.tb{width:100%;border-collapse:collapse}
.tb th{padding:9px 14px;text-align:left;font-size:11.5px;font-weight:700;color:var(--muted);
       background:#fafafd;border-bottom:1px solid var(--line)}
.tb td{padding:10px 14px;border-bottom:1px solid var(--line-2);font-size:13.5px}
.tb tr:last-child td{border-bottom:none}
.tb tbody tr:hover td{background:#fafafd}

/* ═══ modal ═══ */
.ov{position:fixed;inset:0;background:rgba(21,24,58,.42);backdrop-filter:blur(3px);display:flex;
    align-items:center;justify-content:center;z-index:200;padding:16px;animation:fi .14s}
.md{background:#fff;border-radius:18px;box-shadow:var(--sh-lg);width:100%;max-width:460px;
    max-height:88vh;overflow-y:auto;animation:su .18s}
.md-h{padding:17px 19px 14px;border-bottom:1px solid var(--line-2);display:flex;
      align-items:flex-start;justify-content:space-between;gap:12px;position:sticky;top:0;background:#fff;z-index:2}
.md-t{font-size:16.5px;font-weight:800;letter-spacing:-.01em}
.md-s{font-size:12.5px;color:var(--muted);margin-top:2px}
.md-b{padding:19px}
.md-f{display:flex;gap:8px;padding-top:16px;margin-top:16px;border-top:1px solid var(--line-2)}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ═══ toasts ═══ */
.toasts{position:fixed;bottom:18px;right:18px;z-index:400;display:flex;flex-direction:column;
        gap:8px;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 15px;border-radius:10px;font-size:13.5px;
       font-weight:500;box-shadow:var(--sh-lg);animation:su .18s;max-width:310px;
       display:flex;align-items:center;gap:8px;border-left:3px solid var(--indigo-2)}
.toast.ok{border-left-color:var(--green-2)} .toast.err{border-left-color:var(--red)}

/* ═══════════ TV DISPLAY ═══════════ */
.tv{height:100vh;background:var(--ink);color:#fff;display:flex;flex-direction:column;overflow:hidden;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.tv-h{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-shrink:0;
      padding:1.4vh 2vw;background:rgba(0,0,0,.22);border-bottom:1px solid rgba(255,255,255,.08)}
.tv-mark{width:3.1vw;min-width:40px;aspect-ratio:1;border-radius:11px;display:grid;place-items:center;
         background:linear-gradient(135deg,var(--indigo-2),var(--green));
         font-family:Archivo;font-weight:900;font-size:1.5vw}
.tv-name{font-size:clamp(14px,1.45vw,23px);font-weight:800;letter-spacing:-.015em;line-height:1.15}
.tv-where{color:var(--green-2);font-size:clamp(11px,1.05vw,16px);font-weight:700;margin-top:2px}
.tv-clock{font-family:Archivo;font-weight:800;font-size:clamp(20px,2.3vw,38px);font-variant-numeric:tabular-nums;line-height:1}
.tv-date{color:#8e91b8;font-size:clamp(10px,.9vw,14px);text-align:right;margin-top:2px}

.tv-body{flex:1;display:grid;grid-template-columns:44% 1fr;gap:1.4vw;padding:1.4vh 2vw;min-height:0}

/* hero — the one bold thing on this screen */
.hero{border-radius:20px;background:
      radial-gradient(130% 100% at 0% 0%,rgba(47,168,94,.22) 0%,transparent 60%),rgba(255,255,255,.045);
      border:1px solid rgba(255,255,255,.09);display:flex;flex-direction:column;
      justify-content:center;padding:2vh 2.2vw;position:relative;overflow:hidden;min-height:0}
.hero.ring{background:
      radial-gradient(130% 100% at 0% 0%,rgba(47,168,94,.45) 0%,rgba(31,138,76,.16) 60%,transparent 100%),
      rgba(47,168,94,.12);
      border-color:var(--green-2);box-shadow:0 0 0 2px var(--green-2),0 0 70px rgba(47,168,94,.42) inset}
.hero::after{content:'';position:absolute;inset:0;opacity:0;
      background:linear-gradient(100deg,transparent 32%,rgba(255,255,255,.14) 50%,transparent 68%)}
.hero.ring::after{opacity:1;animation:sweep 2.2s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-62%)}100%{transform:translateX(62%)}}
.hero-lbl{font-size:clamp(11px,1vw,16px);font-weight:800;letter-spacing:.14em;
          color:var(--green-2);margin-bottom:.6vh}
.hero.ring .hero-lbl{color:#eafff2}
.hero-num{font-family:Archivo;font-weight:900;font-size:clamp(54px,10.5vw,190px);line-height:.84;
          letter-spacing:-.045em;display:flex;position:relative;z-index:1}
.hero-num span{display:inline-block;animation:drop .42s cubic-bezier(.2,.9,.25,1) backwards}
@keyframes drop{from{opacity:0;transform:translateY(-.3em)}to{opacity:1;transform:none}}
.hero-rule{height:4px;width:clamp(50px,7vw,120px);border-radius:3px;margin:1.6vh 0 1.2vh;
           background:var(--green-2);position:relative;z-index:1}
.hero-go{font-size:clamp(12px,1.15vw,19px);color:#a9acd0;font-weight:600;position:relative;z-index:1}
.hero.ring .hero-go{color:rgba(255,255,255,.8)}
.hero-win{font-size:clamp(20px,2.7vw,52px);font-weight:800;letter-spacing:-.02em;line-height:1.08;
          margin-top:.3vh;position:relative;z-index:1}
.hero-svc{font-size:clamp(11px,1.05vw,17px);color:#8e91b8;margin-top:.8vh;position:relative;z-index:1}
.hero.ring .hero-svc{color:rgba(255,255,255,.72)}
.hero-idle{font-size:clamp(17px,2vw,34px);font-weight:800;color:#5a5d85}
.hero-idle-s{font-size:clamp(11px,1.05vw,17px);color:#43466e;margin-top:.7vh}

/* counter rail */
.rail-wrap{display:flex;flex-direction:column;min-height:0}
.rail-head{display:flex;align-items:center;justify-content:space-between;
           font-size:clamp(10px,.88vw,13px);font-weight:800;letter-spacing:.12em;
           color:#5a5d85;padding:0 .6vw .9vh}
.rail-rows{flex:1;display:grid;gap:.7vh;align-content:start;min-height:0;overflow:hidden}
.rail-rows.two{grid-template-columns:1fr 1fr;gap:.7vh .9vw}
.crow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:1vw;
      padding:1.05vh 1.1vw;border-radius:11px;background:rgba(255,255,255,.045);
      border-left:4px solid transparent;transition:background .4s,border-color .4s;min-width:0}
.crow.live{background:rgba(47,168,94,.14);border-left-color:var(--green-2)}
.crow.lit{background:rgba(47,168,94,.3);border-left-color:#fff}
.crow-w{font-size:clamp(12px,1.25vw,22px);font-weight:700;letter-spacing:-.01em;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow-s{font-size:clamp(9px,.78vw,12.5px);color:#7b7ea8;margin-top:1px;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow-n{font-family:Archivo;font-weight:900;font-size:clamp(17px,2.1vw,40px);line-height:1;
        letter-spacing:-.025em;text-align:right;white-space:nowrap}
.crow-n.idle{color:#3a3d63;font-weight:700;font-size:clamp(13px,1.3vw,22px)}
.pulse{display:inline-block;width:.5em;height:.5em;border-radius:50%;background:var(--green-2);
       margin-right:.4em;vertical-align:middle;animation:pz 1.6s ease infinite}
@keyframes pz{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}

.tv-foot{display:flex;align-items:center;gap:1.4vw;flex-shrink:0;padding:1.1vh 2vw;
         background:rgba(0,0,0,.3);border-top:1px solid rgba(255,255,255,.07);
         font-size:clamp(10px,1vw,15px);color:#8e91b8;overflow:hidden;white-space:nowrap}
.foot-k{font-weight:800;letter-spacing:.1em;color:#5a5d85;flex-shrink:0;font-size:.86em}
.recent{display:flex;gap:1.1vw;overflow:hidden;flex:1}
.recent i{font-style:normal;font-family:Archivo;font-weight:800;color:#c7c9e4}
.waitpill{flex-shrink:0;display:inline-flex;align-items:center;gap:.5em;padding:.35em .9em;
          border-radius:20px;background:rgba(201,154,46,.16);border:1px solid rgba(201,154,46,.35);
          color:var(--gold);font-weight:700}
.unlock{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:50;
        background:var(--indigo-2);color:#fff;padding:11px 22px;border-radius:11px;
        font-size:13.5px;font-weight:600;box-shadow:var(--sh-lg)}
@media(max-aspect-ratio:1/1){
  .tv-body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .rail-rows.two{grid-template-columns:1fr}
}

/* ═══════════ KIOSK ═══════════ */
.kio{min-height:100vh;background:var(--ink);color:#fff;display:flex;flex-direction:column;
     padding:0 0 env(safe-area-inset-bottom,0px)}
.kio-h{text-align:center;padding:4.5vh 22px 2vh}
.kio-mark{width:68px;height:68px;border-radius:17px;margin:0 auto 14px;display:grid;place-items:center;
          background:linear-gradient(135deg,var(--indigo-2),var(--green));
          font-family:Archivo;font-weight:900;font-size:30px}
.kio-t{font-size:clamp(20px,3vw,30px);font-weight:800;letter-spacing:-.02em}
.kio-s{color:#8e91b8;font-size:14.5px;margin-top:5px}
.kio-b{flex:1;padding:0 4vw 4vh;max-width:1000px;margin:0 auto;width:100%}
.kio-ask{font-size:15px;font-weight:600;color:#a9acd0;margin:2.4vh 0 1.2vh}
.pris{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:3vh}
.pri{flex:1;min-width:140px;padding:15px;border-radius:13px;border:1.5px solid rgba(255,255,255,.13);
     background:rgba(255,255,255,.05);color:#fff;font-size:14.5px;font-weight:600;transition:.15s}
.pri:hover{background:rgba(255,255,255,.1)}
.pri.on{background:var(--gold);border-color:var(--gold);color:#fff}

/* ─── toasts ─── */
const TCtx = createContext(()=>{})
const useToast = () => useContext(TCtx)
function Toasts({children}) {
  const [list,setList] = useState([])
  const push = useCallback((msg,kind='info')=>{
    const id = Math.random()
    setList(l=>[...l,{id,msg,kind}])
    setTimeout(()=>setList(l=>l.filter(t=>t.id!==id)), 3200)
  },[])
  return <TCtx.Provider value={push}>{children}
    <div className="toasts">{list.map(t=>
      <div key={t.id} className={'toast '+t.kind}>
        <Ico n={t.kind==='err'?'x':'check'} s={14}/>{t.msg}
      </div>)}
    </div>
  </TCtx.Provider>
}

/* ─── speech ─── */
function useSpeech() {
  const ready = useRef(false)
  const unlock = useCallback(()=>{
    if (ready.current || !('speechSynthesis' in window)) return
    const u = new SpeechSynthesisUtterance(' '); u.volume = 0
    window.speechSynthesis.speak(u); ready.current = true
  },[])
  const say = useCallback((number, where, repeat=2)=>{
    if (!('speechSynthesis' in window)) return
    window.speechSynthesis.cancel()
    const spoken = String(number).replace(/([A-Za-z])/g,'$1 ').replace(/(\d)/g,'$1 ').trim()
    for (let i=0;i<Math.max(1,repeat);i++){
      const u = new SpeechSynthesisUtterance(
        i===0 ? `Number ${spoken}. Please proceed to ${where}.` : `${spoken}. ${where}.`)
      u.lang='en-US'; u.rate=.82; u.pitch=1
      window.speechSynthesis.speak(u)
    }
  },[])
  return {unlock, say, isReady:()=>ready.current}
}

/* ════════════════════════════════════════════════════════════
   AUTH
   ════════════════════════════════════════════════════════════ */
function useAuth() {
  const [user,setUser] = useState(null)
  const [me,setMe] = useState(null)
  const [loading,setLoading] = useState(true)

  const load = async u => {
    const {data} = await sb.from('profiles').select('*').eq('id',u.id).maybeSingle()
    setMe(data); setUser(u)
  }
  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{
      if (session?.user) load(session.user).finally(()=>setLoading(false))
      else setLoading(false)
    })
    const {data:{subscription}} = sb.auth.onAuthStateChange((e,s)=>{
      if (e==='SIGNED_IN' && s?.user) load(s.user)
      if (e==='SIGNED_OUT') { setUser(null); setMe(null) }
    })
    return ()=>subscription.unsubscribe()
  },[])

  return {
    user, me, loading,
    isManager: ['admin','manager'].includes(me?.role),
    signIn: (email,password)=>sb.auth.signInWithPassword({email,password}),
    signOut: async ()=>{ try{ await sb.rpc('go_offline') }catch{}; await sb.auth.signOut() },
  }
}

/* ════════════════════════════════════════════════════════════
   TV DISPLAY
   ════════════════════════════════════════════════════════════ */
function TV({slug}) {
  const [data,setData]   = useState(null)
  const [now,setNow]     = useState(new Date())
  const [ring,setRing]   = useState(false)   // hero is flashing a fresh call
  const [litWin,setLit]  = useState(null)    // which counter row to highlight
  const [live,setLive]   = useState(false)
  const [armed,setArmed] = useState(false)
  const speech = useSpeech()
  const seen   = useRef(new Set())
  const audio  = useRef(null)
  const slugRef = useRef(slug)

  /* two-tone chime, the way a real queue board sounds before the voice */
  const chime = useCallback(()=>{
    try {
      if (!audio.current) audio.current = new (window.AudioContext||window.webkitAudioContext)()
      const ac = audio.current
      if (ac.state === 'suspended') ac.resume()
      const gain = ac.createGain()
      gain.connect(ac.destination)
      gain.gain.setValueAtTime(0.0001, ac.currentTime)
      ;[[880,0],[1174.7,0.17]].forEach(([hz,at])=>{
        const o = ac.createOscillator()
        o.type = 'sine'; o.frequency.value = hz
        const g = ac.createGain(); g.connect(gain)
        g.gain.setValueAtTime(0.0001, ac.currentTime+at)
        g.gain.exponentialRampToValueAtTime(0.22, ac.currentTime+at+0.02)
        g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+at+0.42)
        o.connect(g); o.start(ac.currentTime+at); o.stop(ac.currentTime+at+0.45)
      })
      gain.gain.setValueAtTime(1, ac.currentTime)
    } catch {}
  },[])

  const refresh = useCallback(async ()=>{
    const {data:b, error} = await sb.rpc('board',{p_slug:slugRef.current})
    if (!error && b) setData(b)
  },[])

  useEffect(()=>{
    refresh()
    const tick = setInterval(()=>setNow(new Date()),1000)
    const poll = setInterval(refresh, 20000)   // safety net only

    const ch = sb.channel('tv-'+slug)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'announcements'}, p=>{
        const a = p.new
        if (!a || seen.current.has(a.id)) return
        seen.current.add(a.id)
        refresh().then(()=>{
          setData(d=>{
            const onThisTv = !d || (d.rows||[]).some(r=>r.window_id === a.window_id)
            if (onThisTv) {
              setLit(a.window_id); setRing(true)
              chime()
              const rep = d?.settings?.announce_repeat ?? 2
              if (d?.settings?.voice_enabled !== false)
                setTimeout(()=>speech.say(a.number, a.window_name, rep), 620)
              setTimeout(()=>{ setRing(false); setLit(null) }, 10000)
            }
            return d
          })
        })
      })
      .on('postgres_changes',{event:'*',schema:'public',table:'tickets'}, ()=>refresh())
      .subscribe(s=>setLive(s==='SUBSCRIBED'))

    const mid = setInterval(()=>{
      const d = new Date()
      if (d.getHours()===0 && d.getMinutes()===1) location.reload()
    },60000)

    return ()=>{ clearInterval(tick); clearInterval(poll); clearInterval(mid); ch.unsubscribe() }
  },[slug, refresh, chime])

  const arm = () => { speech.unlock(); chime(); setArmed(true) }

  if (!data) return <div className="tv" style={{display:'grid',placeItems:'center'}}><div className="spin"/></div>

  const rows  = data.rows || []
  const last  = data.last_call && data.last_call !== null ? data.last_call : null
  const twoUp = rows.length > 6

  return (
    <div className="tv" onClick={arm}>
      {!armed && <button className="unlock" onClick={arm}>Pindutin para buksan ang tunog</button>}

      <div className="tv-h">
        <div style={{display:'flex',alignItems:'center',gap:'1vw',minWidth:0}}>
          <div className="tv-mark">T</div>
          <div style={{minWidth:0}}>
            <div className="tv-name">{data.settings?.hospital_name || 'Taytay Doctors Multispecialty Hospital'}</div>
            <div className="tv-where">{data.display?.name || 'Queue Display'}</div>
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:'1.2vw',flexShrink:0}}>
          <span className="dot" style={{opacity:live?1:.25}}/>
          <div>
            <div className="tv-clock">{clock(now)}</div>
            <div className="tv-date">{dateLong(now)}</div>
          </div>
        </div>
      </div>

      <div className="tv-body">
        {/* ── hero: the number being called ── */}
        <div className={'hero '+(ring?'ring':'')}>
          {last ? (
            <>
              <div className="hero-lbl">
                {ring ? (last.kind==='recall' ? 'TINATAWAG ULIT' : 'TINATAWAG NGAYON') : 'HULING TINAWAG'}
              </div>
              <div className="hero-num" key={last.id}
                   style={{color: ring ? '#fff' : (last.service_color || '#fff')}}>
                {String(last.number).split('').map((c,i)=>(
                  <span key={i} style={{animationDelay:(i*55)+'ms'}}>{c}</span>
                ))}
              </div>
              <div className="hero-rule"/>
              <div className="hero-go">Pumunta po sa</div>
              <div className="hero-win">{last.window_name}</div>
              {last.service_name && <div className="hero-svc">{last.service_name}</div>}
            </>
          ) : (
            <div style={{textAlign:'center'}}>
              <div className="hero-idle">Wala pang tinatawag</div>
              <div className="hero-idle-s">Maghintay po lamang ng inyong numero.</div>
            </div>
          )}
        </div>

        {/* ── counter rail ── */}
        <div className="rail-wrap">
          <div className="rail-head"><span>COUNTER</span><span>NUMERO</span></div>
          <div className={'rail-rows '+(twoUp?'two':'')}>
            {rows.length === 0 && (
              <div style={{color:'#43466e',fontSize:'clamp(12px,1.2vw,18px)',padding:'2vh .6vw'}}>
                Walang bukas na counter ngayon.
              </div>
            )}
            {rows.map(r=>(
              <div key={r.window_id}
                   className={'crow '+(litWin===r.window_id ? 'lit' : r.status==='serving' ? 'live' : '')}>
                <div style={{minWidth:0}}>
                  <div className="crow-w">{r.window_name}</div>
                  <div className="crow-s">{r.service_name || '—'}</div>
                </div>
                {r.number
                  ? <div className="crow-n" style={{color: r.status==='done' ? '#55587f'
                                                         : (r.service_color || '#fff')}}>
                      {r.status==='serving' && <span className="pulse"/>}{r.number}
                    </div>
                  : <div className="crow-n idle">—</div>}
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="tv-foot">
        <span className="foot-k">KATATAPOS</span>
        <div className="recent">
          {(data.recent||[]).length === 0
            ? <span style={{color:'#3a3d63'}}>wala pa</span>
            : data.recent.map((a,i)=>(
                <span key={i}><i>{a.number}</i> <span style={{opacity:.55}}>{a.window_name}</span></span>
              ))}
        </div>
        {data.waiting > 0 && (
          <span className="waitpill">{data.waiting} naghihintay</span>
        )}
      </div>
    </div>
  )
}

/* ════════════════════════════════════════════════════════════
   KIOSK
   ════════════════════════════════════════════════════════════ */
function Kiosk() {
  const [svcs,setSvcs]   = useState([])
  const [pri,setPri]     = useState(null)
  const [tk,setTk]       = useState(null)
  const [busy,setBusy]   = useState(false)
  const [note,setNote]   = useState('')
  const [now,setNow]     = useState(new Date())

  useEffect(()=>{
    sb.from('services').select('id,code,name,name_fil,color,allow_priority')
      .eq('is_active',true).eq('show_on_kiosk',true).order('sort_order')
      .then(({data})=>setSvcs(data||[]))
    sb.from('settings').select('kiosk_note').eq('id',1).maybeSingle()
      .then(({data})=>setNote(data?.kiosk_note||''))
    const t = setInterval(()=>setNow(new Date()),1000)
    return ()=>clearInterval(t)
  },[])

  const take = async svc => {
    if (busy) return
    setBusy(true)
    const {data,error} = await sb.rpc('issue_ticket',{
      p_service_id: svc.id, p_priority: svc.allow_priority ? pri : null
    })
    setBusy(false)
    if (error) { alert('Hindi nakuha ang numero. Pakitawag po ang staff.'); return }
    setTk({...data, service:svc})
    setPri(null)
    setTimeout(()=>setTk(null), 14000)
  }

  return (
    <div className="kio">
      <div className="kio-h">
        <div className="kio-mark">T</div>
        <h1 className="kio-t">Taytay Doctors Multispecialty Hospital</h1>
        <p className="kio-s">{dateLong(now)} · {clock(now)}</p>
      </div>

      <div className="kio-b">
        <div className="kio-ask">May kabilang po ba kayo sa mga ito?</div>
        <div className="pris">
          {Object.entries(PRI).map(([k,label])=>(
            <button key={k} className={'pri '+(pri===k?'on':'')}
                    onClick={()=>setPri(p=>p===k?null:k)}>{label}</button>
          ))}
        </div>

        <div className="kio-ask">Ano po ang kailangan ninyo?</div>
        <div className="svcs">
          {svcs.map(s=>(
            <button key={s.id} className="svc" onClick={()=>take(s)} disabled={busy}>
              <div className="svc-bar" style={{background:s.color}}/>
              <div className="svc-n">{s.name_fil || s.name}</div>
              <div className="svc-f">{s.name_fil ? s.name : s.code}</div>
            </button>
          ))}
          {svcs.length===0 && (
            <div style={{gridColumn:'1/-1',textAlign:'center',color:'#4a4d75',padding:40}}>
              Walang available na serbisyo ngayon.
            </div>
          )}
        </div>
      </div>

      {tk && (
        <div className="ticket" onClick={()=>setTk(null)}>
          <div className="ticket-c" onClick={e=>e.stopPropagation()}>
            <div style={{fontSize:12.5,fontWeight:700,color:'var(--muted)'}}>Taytay Doctors Multispecialty Hospital</div>
            <div className="ticket-n" style={{color:tk.service?.color||'var(--indigo)'}}>{tk.number}</div>
            <div style={{fontSize:16,fontWeight:700}}>{tk.service?.name_fil || tk.service?.name}</div>
            {tk.priority_type && <div className="tag t-pri" style={{marginTop:9}}>{PRI[tk.priority_type]}</div>}
            <div style={{marginTop:17,padding:'11px 14px',background:'var(--paper)',borderRadius:11,
                         fontSize:13,color:'var(--muted)'}}>{note}</div>
            <div style={{fontSize:12,color:'var(--faint)',marginTop:11}}>
              {new Date(tk.created_at||Date.now()).toLocaleString('en-PH',
                {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:true})}
            </div>
            <button className="btn b-pri b-lg b-full" style={{marginTop:17}} onClick={()=>setTk(null)}>
              Salamat po
            </button>
          </div>
        </div>
      )}
    </div>
  )
}

/* ════════════════════════════════════════════════════════════
   COUNTER — the daily staff screen
   ════════════════════════════════════════════════════════════ */
function Counter({me}) {
  const toast = useToast()
  const [wins,setWins]   = useState([])
  const [win,setWin]     = useState(null)
  const [waiting,setWaiting] = useState([])
  const [serving,setServing] = useState(null)
  const [tab,setTab]     = useState('waiting')
  const [done,setDone]   = useState([])
  const [q,setQ]         = useState('')
  const [busy,setBusy]   = useState(false)
  const [move,setMove]   = useState(null)   // {kind:'service'|'window'}
  const [, bump]         = useState(0)
  const chRef = useRef(null)

  /* windows this person may use */
  useEffect(()=>{
    (async ()=>{
      let ids = null
      if (!['admin','manager'].includes(me.role)) {
        const {data} = await sb.from('window_staff').select('window_id').eq('user_id',me.id)
        ids = (data||[]).map(r=>r.window_id)
      }
      let qy = sb.from('windows').select('id,name,short_name').eq('is_active',true).order('sort_order')
      if (ids) qy = ids.length ? qy.in('id',ids) : qy.eq('id','00000000-0000-0000-0000-000000000000')
      const {data:w} = await qy
      setWins(w||[])
      const saved = localStorage.getItem('tdmhq-window')
      const pick = (w||[]).find(x=>x.id===saved)
      if (pick) setWin(pick)
    })()
  },[me.id])

  const load = useCallback(async wid=>{
    if (!wid) return
    const {data:svc} = await sb.from('window_services').select('service_id').eq('window_id',wid)
    const ids = (svc||[]).map(r=>r.service_id)
    if (!ids.length) { setWaiting([]); setServing(null); setDone([]); return }
    const today = new Date().toISOString().slice(0,10)

    const [w,s,d] = await Promise.all([
      sb.from('tickets').select('*,services(code,name,color)')
        .eq('ticket_date',today).in('service_id',ids).in('status',['waiting','held'])
        .order('sort_at'),
      sb.from('tickets').select('*,services(code,name,color)')
        .eq('ticket_date',today).eq('window_id',wid).eq('status','serving').maybeSingle(),
      sb.from('tickets').select('*,services(code,name,color)')
        .eq('ticket_date',today).eq('window_id',wid).in('status',['done','skipped'])
        .order('completed_at',{ascending:false}).limit(40),
    ])
    setWaiting(w.data||[]); setServing(s.data||null); setDone(d.data||[])
  },[])

  /* realtime: any ticket change just re-reads this window's lists */
  useEffect(()=>{
    if (!win) return
    localStorage.setItem('tdmhq-window', win.id)
    load(win.id)
    sb.rpc('beat',{p_window_id:win.id})
    const beat = setInterval(()=>sb.rpc('beat',{p_window_id:win.id}), 60000)
    const timer = setInterval(()=>bump(n=>n+1), 1000)   // live serving clock

    chRef.current?.unsubscribe()
    const ch = sb.channel('counter-'+win.id)
      .on('postgres_changes',{event:'*',schema:'public',table:'tickets'},()=>load(win.id))
      .subscribe()
    chRef.current = ch
    return ()=>{ clearInterval(beat); clearInterval(timer); ch.unsubscribe() }
  },[win?.id, load])

  /* keyboard: space = next, r = recall, d = done, h = hold, s = skip */
  useEffect(()=>{
    const onKey = e => {
      if (e.target.matches('input,textarea,select')) return
      const k = e.key.toLowerCase()
      if (k===' ')      { e.preventDefault(); next() }
      else if (k==='r') { if (serving) act('recall') }
      else if (k==='d') { if (serving) act('done') }
      else if (k==='h') { if (serving) act('held') }
      else if (k==='s') { if (serving) act('skipped') }
    }
    window.addEventListener('keydown',onKey)
    return ()=>window.removeEventListener('keydown',onKey)
  })

  const next = async () => {
    if (!win || busy) return
    setBusy(true)
    const {data,error} = await sb.rpc('call_next',{p_window_id:win.id})
    setBusy(false)
    if (error) return toast(error.message,'err')
    if (!data) return toast('Wala nang naghihintay.','info')
    toast('Tinawag: '+data.number,'ok')
  }

  const callThis = async t => {
    setBusy(true)
    const {error} = await sb.rpc('call_ticket',{p_ticket_id:t.id,p_window_id:win.id})
    setBusy(false)
    if (error) return toast(error.message,'err')
    toast('Tinawag: '+t.number,'ok')
  }

  const act = async (what) => {
    if (!serving || busy) return
    setBusy(true)
    const fn = what==='recall'
      ? sb.rpc('recall_ticket',{p_ticket_id:serving.id})
      : sb.rpc('set_ticket_status',{p_ticket_id:serving.id, p_status:what})
    const {error} = await fn
    setBusy(false)
    if (error) return toast(error.message,'err')
    toast({recall:'Tinawag ulit', done:'Tapos na', held:'Naka-hold', skipped:'Nilaktawan'}[what]||'OK','ok')
  }

  /* ── window picker ── */
  if (!win) {
    const hour = new Date().getHours()
    return (
      <div className="mid" style={{padding:22}}>
        <div style={{width:'100%',maxWidth:430}}>
          <div style={{textAlign:'center',marginBottom:22}}>
            <h1 className="h1">{hour<12?'Magandang umaga':hour<18?'Magandang hapon':'Magandang gabi'}, {(me.full_name||'').split(' ')[0]}</h1>
            <p className="sub">Saang counter ka magse-serve ngayon?</p>
          </div>
          <div className="card" style={{padding:6,maxHeight:380,overflowY:'auto'}}>
            {wins.length===0 && <div className="empty"><div className="empty-t">Wala kang nakatalagang counter</div>
              <div>Pakiusap sa admin na i-assign ka.</div></div>}
            {wins.map(w=>(
              <button key={w.id} className="b-out" onClick={()=>setWin(w)}
                style={{display:'flex',width:'100%',alignItems:'center',justifyContent:'space-between',
                        padding:'13px 15px',borderRadius:11,margin:4,border:'1.5px solid var(--line)'}}>
                <span style={{fontWeight:600}}>{w.name}</span>
                <Ico n="right" s={16}/>
              </button>
            ))}
          </div>
        </div>
      </div>
    )
  }

  const shown = (tab==='waiting' ? waiting : done)
    .filter(t=>{ const s=q.trim().toLowerCase(); return !s ||
      t.number.toLowerCase().includes(s) || (t.patient_name||'').toLowerCase().includes(s) })

  return (
    <div className="ws">
      {/* ── queue list ── */}
      <div className="ws-l">
        <div className="ws-h">
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
            <div>
              <div style={{fontSize:11.5,fontWeight:700,color:'var(--faint)'}}>COUNTER</div>
              <div style={{fontWeight:700,fontSize:14.5}}>{win.name}</div>
            </div>
            <button className="btn b-ghost b-sm" onClick={()=>{setWin(null);sb.rpc('go_offline')}}>Palit</button>
          </div>
          <div className="segs">
            <button className={'seg '+(tab==='waiting'?'on':'')} onClick={()=>setTab('waiting')}>
              Naghihintay {waiting.length>0 && <span className="cnt">{waiting.length}</span>}
            </button>
            <button className={'seg '+(tab==='done'?'on':'')} onClick={()=>setTab('done')}>
              Tapos {done.length>0 && <span className="cnt">{done.length}</span>}
            </button>
          </div>
          <div style={{position:'relative',marginTop:9}}>
            <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'var(--faint)'}}>
              <Ico n="search" s={13}/></span>
            <input className="inp" style={{paddingLeft:30,paddingTop:7,paddingBottom:7,fontSize:13}}
                   value={q} onChange={e=>setQ(e.target.value)} placeholder="Hanapin ang numero…"/>
          </div>
        </div>

        <div className="ws-list">
          {shown.length===0 && (
            <div className="empty">
              <div className="empty-i"><Ico n="clock" s={20}/></div>
              <div className="empty-t">{tab==='waiting'?'Walang naghihintay':'Wala pang natapos'}</div>
              <div style={{fontSize:13}}>{tab==='waiting'?'Lalabas dito ang mga bagong ticket.':'Makikita dito ang mga natapos mo.'}</div>
            </div>
          )}
          {shown.map(t=>(
            <div key={t.id} className={'tk '+(t.priority_type?'pri':'')}>
              <div className="tk-top">
                <span className="num tk-n">{t.number}</span>
                <span className="tk-s" style={{color:t.services?.color}}>{t.services?.name}</span>
                {t.priority_type && <span className="tag t-pri">{PRI[t.priority_type]}</span>}
                {t.journey_step>1 && <span className="tag t-step">Hakbang {t.journey_step}</span>}
                {t.status==='held' && <Tag s="held"/>}
              </div>
              {t.patient_name && <div className="tk-m">{t.patient_name}</div>}
              <div className="tk-m">
                {tab==='waiting' ? ago(t.sort_at) : hhmm(t.completed_at)}
                {t.note && ' · ' + t.note}
              </div>
              {tab==='waiting' && (
                <button className="btn b-out b-sm" style={{marginTop:8,width:'100%'}}
                        onClick={()=>callThis(t)} disabled={busy}>Tawagin ito</button>
              )}
            </div>
          ))}
        </div>

        <div className="ws-f">
          <button className="btn b-pri b-lg b-full" onClick={next} disabled={busy}>
            {busy ? <div className="spin"/> : <><Ico n="next" s={17}/>Susunod<span className="kbd" style={{color:'rgba(255,255,255,.7)',borderColor:'rgba(255,255,255,.3)'}}>space</span></>}
          </button>
        </div>
      </div>

      {/* ── now serving ── */}
      <div className="ws-r">
        <div style={{background:'#fff',borderBottom:'1px solid var(--line)',padding:'11px 20px',
                     display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div style={{fontWeight:700,fontSize:15}}>{win.name}</div>
          <span className="live"><span className="dot"/>Live</span>
        </div>

        {serving ? (
          <>
            <div className="now">
              <div style={{fontSize:12.5,fontWeight:700,color:'var(--faint)',marginBottom:8}}>SINE-SERVE NGAYON</div>
              <div className="now-n" style={{color:serving.services?.color||'var(--indigo)'}}>{serving.number}</div>
              <div style={{display:'flex',alignItems:'center',gap:9,marginTop:13,flexWrap:'wrap',justifyContent:'center'}}>
                <span style={{fontWeight:700,fontSize:15,color:serving.services?.color}}>{serving.services?.name}</span>
                {serving.priority_type && <span className="tag t-pri">{PRI[serving.priority_type]}</span>}
                {serving.journey_step>1 && <span className="tag t-step">Hakbang {serving.journey_step}</span>}
              </div>
              {serving.patient_name && <div style={{marginTop:9,fontSize:15}}>{serving.patient_name}</div>}
              {serving.note && <div style={{marginTop:6,color:'var(--muted)',fontSize:13.5,maxWidth:480}}>{serving.note}</div>}
              <div style={{display:'flex',gap:22,marginTop:22,color:'var(--muted)',fontSize:13}}>
                <div><div style={{fontSize:11.5,color:'var(--faint)',fontWeight:700}}>TAGAL</div>
                  <div className="num" style={{fontSize:19,color:'var(--green)'}}>{mmss(serving.called_at)}</div></div>
                <div><div style={{fontSize:11.5,color:'var(--faint)',fontWeight:700}}>TINAWAG</div>
                  <div style={{fontSize:14,marginTop:3}}>{hhmm(serving.called_at)}</div></div>
                {serving.recall_count>0 && <div><div style={{fontSize:11.5,color:'var(--faint)',fontWeight:700}}>ULIT</div>
                  <div style={{fontSize:14,marginTop:3}}>{serving.recall_count}×</div></div>}
              </div>
            </div>

            <div className="now-acts">
              <button className="btn b-out" onClick={()=>act('recall')} disabled={busy}>
                <Ico n="bell" s={15}/>Tawag ulit<span className="kbd">R</span></button>
              <button className="btn b-out" onClick={()=>act('held')} disabled={busy}>
                <Ico n="pause" s={15}/>Hold<span className="kbd">H</span></button>
              <button className="btn b-out" onClick={()=>act('skipped')} disabled={busy}>
                <Ico n="skip" s={15}/>Laktawan<span className="kbd">S</span></button>
              <button className="btn b-out" onClick={()=>setMove({kind:'service'})} disabled={busy}>
                <Ico n="route" s={15}/>Ipasa sa ibang dept</button>
              <div style={{flex:1}}/>
              <button className="btn b-go b-lg" onClick={()=>act('done')} disabled={busy}>
                <Ico n="check" s={17}/>Tapos na<span className="kbd" style={{color:'rgba(255,255,255,.75)',borderColor:'rgba(255,255,255,.35)'}}>D</span></button>
            </div>
          </>
        ) : (
          <div className="empty" style={{flex:1}}>
            <div className="empty-i" style={{width:58,height:58}}><Ico n="desk" s={25}/></div>
            <div className="empty-t" style={{fontSize:16}}>Walang sine-serve</div>
            <div>Pindutin ang <b>Susunod</b> para tawagin ang kasunod sa pila.</div>
            <button className="btn b-pri b-lg" style={{marginTop:14}} onClick={next} disabled={busy}>
              <Ico n="next" s={17}/>Susunod sa pila</button>
          </div>
        )}
      </div>

      {move && serving && (
        <MoveModal ticket={serving} kind={move.kind} windowId={win.id}
          onClose={()=>setMove(null)}
          onDone={msg=>{ setMove(null); toast(msg,'ok') }}/>
      )}
    </div>
  )
}

/* ─── move a patient to the next department (keeps the number) ─── */
function MoveModal({ticket, kind, windowId, onClose, onDone}) {
  const [items,setItems] = useState([])
  const [pick,setPick]   = useState(null)
  const [note,setNote]   = useState('')
  const [busy,setBusy]   = useState(false)
  const [err,setErr]     = useState('')

  useEffect(()=>{
    if (kind==='service')
      sb.from('services').select('id,code,name,name_fil,color').eq('is_active',true)
        .neq('id',ticket.service_id).order('sort_order').then(({data})=>setItems(data||[]))
    else
      sb.from('windows').select('id,name').eq('is_active',true)
        .neq('id',windowId).order('sort_order').then(({data})=>setItems(data||[]))
  },[kind])

  const go = async () => {
    if (!pick) return
    setBusy(true); setErr('')
    const {error} = kind==='service'
      ? await sb.rpc('move_service',{p_ticket_id:ticket.id,p_service_id:pick.id,p_note:note||null})
      : await sb.rpc('move_window',{p_ticket_id:ticket.id,p_window_id:pick.id,p_note:note||null})
    setBusy(false)
    if (error) return setErr(error.message)
    onDone(`${ticket.number} → ${pick.name}`)
  }

  return (
    <div className="ov" onClick={onClose}>
      <div className="md" onClick={e=>e.stopPropagation()}>
        <div className="md-h">
          <div>
            <div className="md-t">Ipasa sa ibang departamento</div>
            <div className="md-s">Dala pa rin ni <b className="num">{ticket.number}</b> ang parehong numero.</div>
          </div>
          <button className="btn b-ghost b-ico" onClick={onClose}><Ico n="x" s={17}/></button>
        </div>
        <div className="md-b">
          <div style={{maxHeight:260,overflowY:'auto',display:'flex',flexDirection:'column',gap:4}}>
            {items.map(it=>(
              <button key={it.id} onClick={()=>setPick(it)}
                style={{display:'flex',alignItems:'center',gap:11,padding:'11px 13px',textAlign:'left',
                  border:`1.5px solid ${pick?.id===it.id?'var(--indigo)':'var(--line)'}`,borderRadius:10,
                  background:pick?.id===it.id?'var(--indigo-wash)':'#fff'}}>
                <span style={{width:17,height:17,borderRadius:'50%',flexShrink:0,display:'grid',placeItems:'center',
                  border:`2px solid ${pick?.id===it.id?'var(--indigo)':'#ccccdd'}`}}>
                  {pick?.id===it.id && <span style={{width:7,height:7,borderRadius:'50%',background:'var(--indigo)'}}/>}
                </span>
                {it.color && <span style={{width:9,height:9,borderRadius:'50%',background:it.color,flexShrink:0}}/>}
                <span style={{fontWeight:600,fontSize:13.5}}>{it.name_fil || it.name}</span>
              </button>
            ))}
          </div>
          <div style={{marginTop:14}}>
            <label className="lbl">Paalala sa susunod na counter</label>
            <input className="inp" value={note} onChange={e=>setNote(e.target.value)}
                   placeholder="Hal. para sa CBC at urinalysis"/>
          </div>
          {err && <div style={{background:'var(--red-wash)',border:'1px solid #f0c9c7',color:'#8f2e2a',
            padding:'9px 12px',borderRadius:9,fontSize:13,marginTop:12}}>{err}</div>}
          <div className="md-f">
            <button className="btn b-out" style={{flex:1}} onClick={onClose}>Bumalik</button>
            <button className="btn b-pri" style={{flex:1}} disabled={!pick||busy} onClick={go}>
              {busy ? <div className="spin"/> : 'Ipasa'}
            </button>
          </div>
        </div>
      </div>
    </div>
  )
}

/* ════════════════════════════════════════════════════════════
   LIVE BOARD (admin home)
   ════════════════════════════════════════════════════════════ */
function Board({me}) {
  const [stat,setStat] = useState({waiting:0,serving:0,done:0,avgWait:null,avgServe:null})
  const [rows,setRows] = useState([])
  const [svcs,setSvcs] = useState([])
  const [now,setNow]   = useState(new Date())

  const load = useCallback(async ()=>{
    const today = new Date().toISOString().slice(0,10)
    const [{data:tk},{data:b}] = await Promise.all([
      sb.from('tickets').select('status,sort_at,called_at,completed_at,service_id,services(name,color)')
        .eq('ticket_date',today),
      sb.rpc('board',{p_slug:'main'}),
    ])
    const t = tk||[]
    const waits = t.filter(x=>x.called_at).map(x=>new Date(x.called_at)-new Date(x.sort_at))
    const servs = t.filter(x=>x.completed_at&&x.called_at).map(x=>new Date(x.completed_at)-new Date(x.called_at))
    const avg = a => a.length ? Math.round(a.reduce((s,v)=>s+v,0)/a.length/60000) : null
    setStat({
      waiting: t.filter(x=>x.status==='waiting').length,
      serving: t.filter(x=>x.status==='serving').length,
      done:    t.filter(x=>x.status==='done').length,
      avgWait: avg(waits), avgServe: avg(servs),
    })
    const m = {}
    t.forEach(x=>{
      const n = x.services?.name||'—'
      m[n] = m[n] || {name:n, color:x.services?.color, waiting:0, serving:0, done:0}
      if (m[n][x.status]!==undefined) m[n][x.status]++
    })
    setSvcs(Object.values(m).filter(s=>s.waiting+s.serving+s.done>0)
      .sort((a,b)=>(b.waiting+b.serving+b.done)-(a.waiting+a.serving+a.done)))
    setRows((b?.rows||[]).filter(r=>r.number))
  },[])

  useEffect(()=>{
    load()
    const t = setInterval(()=>setNow(new Date()),1000)
    const ch = sb.channel('admin-board')
      .on('postgres_changes',{event:'*',schema:'public',table:'tickets'},()=>load()).subscribe()
    return ()=>{ clearInterval(t); ch.unsubscribe() }
  },[load])

  const hour = now.getHours()
  const kpi = [
    ['Naghihintay', stat.waiting, stat.avgWait!=null ? `Katamtamang hintay: ${stat.avgWait} min` : 'Katamtamang hintay: —', 'var(--gold)', 'var(--gold-wash)'],
    ['Sine-serve', stat.serving, 'Kasalukuyang tinatawag', 'var(--indigo)', 'var(--indigo-wash)'],
    ['Natapos', stat.done, stat.avgServe!=null ? `Katamtamang serbisyo: ${stat.avgServe} min` : 'Katamtamang serbisyo: —', 'var(--green)', 'var(--green-wash)'],
  ]

  return (
    <>
      <div className="head">
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:16}}>
          <div>
            <h1 className="h1">{hour<12?'Magandang umaga':hour<18?'Magandang hapon':'Magandang gabi'}, {(me.full_name||'').split(' ')[0]}</h1>
            <p className="sub">{dateLong(now)} · {clock(now)}</p>
          </div>
          <span className="live"><span className="dot"/>Live</span>
        </div>
      </div>

      <div className="wrap">
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(210px,1fr))',gap:12}}>
          {kpi.map(([label,val,sub,c,bg])=>(
            <div key={label} className="card" style={{padding:17}}>
              <div style={{fontSize:12,fontWeight:700,color:'var(--muted)'}}>{label}</div>
              <div className="num" style={{fontSize:34,lineHeight:1.1,marginTop:3,color:c}}>{val}</div>
              <div style={{fontSize:12,color:'var(--faint)',marginTop:3}}>{sub}</div>
              <div style={{height:3,borderRadius:2,background:bg,marginTop:11}}>
                <div style={{height:'100%',borderRadius:2,background:c,width:'38%'}}/>
              </div>
            </div>
          ))}
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1.15fr 1fr',gap:13,marginTop:13}}
             className="two-col">
          <div className="card">
            <div className="card-h"><span className="card-t">Tinatawag ngayon</span>
              <span style={{fontSize:12,color:'var(--muted)'}}>{rows.length} counter</span></div>
            <div style={{maxHeight:330,overflowY:'auto',padding:7}}>
              {rows.length===0 && <div className="empty" style={{padding:30}}>
                <div className="empty-t">Walang aktibong counter</div></div>}
              {rows.map(r=>(
                <div key={r.window_id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',
                  gap:12,padding:'10px 11px',borderRadius:10,background:'var(--paper)',marginBottom:4}}>
                  <div style={{minWidth:0}}>
                    <div style={{fontWeight:700,fontSize:13.5}}>{r.window_name}</div>
                    <div style={{fontSize:12,color:'var(--muted)'}}>{r.service_name}</div>
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:9}}>
                    <Tag s={r.status}/>
                    <span className="num" style={{fontSize:19,color:r.service_color}}>{r.number}</span>
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div className="card">
            <div className="card-h"><span className="card-t">Bawat serbisyo ngayong araw</span></div>
            <div style={{maxHeight:330,overflowY:'auto'}}>
              {svcs.length===0 && <div className="empty" style={{padding:30}}>
                <div className="empty-t">Wala pang ticket ngayon</div></div>}
              {svcs.length>0 && (
                <table className="tb">
                  <thead><tr><th>Serbisyo</th><th style={{textAlign:'center'}}>Hintay</th>
                    <th style={{textAlign:'center'}}>Serve</th><th style={{textAlign:'center'}}>Tapos</th></tr></thead>
                  <tbody>{svcs.map(s=>(
                    <tr key={s.name}>
                      <td><span style={{display:'inline-flex',alignItems:'center',gap:7}}>
                        <span style={{width:8,height:8,borderRadius:'50%',background:s.color}}/>{s.name}</span></td>
                      <td style={{textAlign:'center',fontWeight:700,color:'var(--gold)'}}>{s.waiting||'—'}</td>
                      <td style={{textAlign:'center',fontWeight:700,color:'var(--indigo)'}}>{s.serving||'—'}</td>
                      <td style={{textAlign:'center',color:'var(--muted)'}}>{s.done||'—'}</td>
                    </tr>))}
                  </tbody>
                </table>
              )}
            </div>
          </div>
        </div>
      </div>
      <style>{`@media(max-width:1000px){.two-col{grid-template-columns:1fr!important}}`}</style>
    </>
  )
}

   ADMIN — services

const SWATCH = ['#3b3fa3','#5b60d6','#2f6fb0','#1f8a4c','#2fa85e','#17766f',
                '#c99a2e','#b4881f','#c0453f','#8a6d3b','#6d5bd0','#2a9d5c']

function Services() {
  const toast = useToast()
  const [list,setList] = useState([])
  const [sel,setSel]   = useState(null)
  const [draft,setDraft] = useState({})
  const [adding,setAdding] = useState(false)
  const [nw,setNw] = useState({code:'',name:''})

  const load = async (keep) => {
    const {data} = await sb.from('services').select('*').order('sort_order')
    setList(data||[])
    if (keep) setSel((data||[]).find(s=>s.id===keep)||null)
    else if (!sel && data?.length) setSel(data[0])
  }
  useEffect(()=>{ load() },[])
  useEffect(()=>{ setDraft({}) },[sel?.id])

  const v = k => draft[k] !== undefined ? draft[k] : sel?.[k]
  const set = (k,val) => setDraft(d=>({...d,[k]:val}))
  const dirty = Object.keys(draft).length > 0

  const save = async () => {
    const {error} = await sb.from('services').update({
      code:v('code'), name:v('name'), name_fil:v('name_fil'), color:v('color'),
      is_active:v('is_active'), show_on_kiosk:v('show_on_kiosk'),
      allow_priority:v('allow_priority'), sort_order:Number(v('sort_order'))||0,
    }).eq('id',sel.id)
    if (error) return toast(error.message,'err')
    setDraft({}); await load(sel.id); toast('Na-save','ok')
  }
  const add = async e => {
    e.preventDefault()
    const code = nw.code.trim().toUpperCase()
    if (!code || !nw.name.trim()) return
    const {data,error} = await sb.from('services')
      .insert({code, name:nw.name.trim(), sort_order:(list.length+1)*10}).select().single()
    if (error) return toast(error.message,'err')
    setNw({code:'',name:''}); setAdding(false); await load(data.id); toast('Naidagdag','ok')
  }
  const remove = async () => {
    if (!confirm(`Burahin ang "${sel.name}"? Hindi ito pwede kung may ticket na ito ngayon.`)) return
    const {error} = await sb.from('services').delete().eq('id',sel.id)
    if (error) return toast('Hindi mabura — may naka-ugnay na ticket o window.','err')
    setSel(null); await load(); toast('Nabura','ok')
  }

  return (
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      <div style={{width:252,flexShrink:0,background:'#fff',borderRight:'1px solid var(--line)',
                   display:'flex',flexDirection:'column'}}>
        <div style={{padding:'15px 16px',borderBottom:'1px solid var(--line-2)'}}>
          <div style={{fontWeight:800,fontSize:14.5}}>Mga serbisyo</div>
          <div style={{fontSize:12,color:'var(--muted)'}}>{list.length} lahat</div>
        </div>
        <div style={{flex:1,overflowY:'auto',padding:5}}>
          {list.map(s=>(
            <button key={s.id} onClick={()=>setSel(s)}
              style={{display:'flex',alignItems:'center',gap:9,width:'100%',padding:'9px 11px',
                borderRadius:9,textAlign:'left',background:sel?.id===s.id?'var(--indigo-wash)':'transparent',
                color:sel?.id===s.id?'var(--indigo)':'var(--text)',fontWeight:sel?.id===s.id?600:500,fontSize:13.5}}>
              <span style={{width:9,height:9,borderRadius:'50%',background:s.color,flexShrink:0,
                opacity:s.is_active?1:.3}}/>
              <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.name}</span>
              <span className="num" style={{fontSize:11,color:'var(--faint)'}}>{s.code}</span>
            </button>
          ))}
        </div>
        <div style={{padding:10,borderTop:'1px solid var(--line-2)'}}>
          {adding ? (
            <form onSubmit={add} style={{display:'flex',flexDirection:'column',gap:6}}>
              <input className="inp" style={{fontSize:13}} autoFocus placeholder="Code (hal. LAB)" maxLength={4}
                value={nw.code} onChange={e=>setNw(n=>({...n,code:e.target.value.toUpperCase()}))}/>
              <input className="inp" style={{fontSize:13}} placeholder="Pangalan"
                value={nw.name} onChange={e=>setNw(n=>({...n,name:e.target.value}))}/>
              <div style={{display:'flex',gap:5}}>
                <button className="btn b-pri b-sm" style={{flex:1}}>Idagdag</button>
                <button type="button" className="btn b-out b-sm b-ico" onClick={()=>setAdding(false)}><Ico n="x" s={14}/></button>
              </div>
            </form>
          ) : (
            <button className="btn b-pri b-full b-sm" onClick={()=>setAdding(true)}><Ico n="plus" s={14}/>Bagong serbisyo</button>
          )}
        </div>
      </div>

      <div style={{flex:1,overflowY:'auto',padding:24}}>
        {!sel ? <div className="empty" style={{paddingTop:80}}><div className="empty-t">Pumili ng serbisyo</div></div> : (
          <div style={{maxWidth:620,display:'flex',flexDirection:'column',gap:13}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
              <div>
                <h2 className="h1" style={{fontSize:18}}>{sel.name}</h2>
                <p className="sub">Numero ngayon: <b className="num">{v('code')}001</b> pataas</p>
              </div>
              <button className="btn b-out b-sm" style={{color:'var(--red)'}} onClick={remove}>
                <Ico n="trash" s={14}/>Burahin</button>
            </div>

            <div className="card" style={{padding:17}}>
              <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:15}}>
                <div style={{width:60,height:60,borderRadius:14,background:v('color'),display:'grid',
                  placeItems:'center',color:'#fff',flexShrink:0}}>
                  <span className="num" style={{fontSize:17}}>{v('code')}</span>
                </div>
                <div style={{flex:1}}>
                  <label className="lbl">Pangalan</label>
                  <input className="inp" value={v('name')||''} onChange={e=>set('name',e.target.value)}/>
                </div>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
                <div>
                  <label className="lbl">Code (prefix ng numero)</label>
                  <input className="inp" maxLength={4} value={v('code')||''}
                    onChange={e=>set('code',e.target.value.toUpperCase())}/>
                </div>
                <div>
                  <label className="lbl">Pangalang Filipino</label>
                  <input className="inp" value={v('name_fil')||''} onChange={e=>set('name_fil',e.target.value)}
                    placeholder="Lalabas sa kiosk"/>
                </div>
              </div>
              <div style={{marginTop:13}}>
                <label className="lbl">Kulay</label>
                <div style={{display:'flex',flexWrap:'wrap',gap:7}}>
                  {SWATCH.map(c=>(
                    <button key={c} onClick={()=>set('color',c)} aria-label={c}
                      style={{width:26,height:26,borderRadius:'50%',background:c,
                        outline:v('color')===c?`2px solid ${c}`:'none',outlineOffset:2}}/>
                  ))}
                </div>
              </div>
            </div>

            <div className="card">
              {[['is_active','Aktibo','Kapag patay, hindi na makakakuha ng bagong numero.'],
                ['show_on_kiosk','Ipakita sa kiosk','Makikita ng pasyente sa touchscreen.'],
                ['allow_priority','Payagan ang priority','Senior, PWD at buntis ay mauuna.']].map(([k,t,d],i)=>(
                <div key={k} style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:14,
                  padding:'13px 17px',borderTop:i?'1px solid var(--line-2)':'none'}}>
                  <div><div style={{fontWeight:600,fontSize:13.5}}>{t}</div>
                    <div style={{fontSize:12.5,color:'var(--muted)',marginTop:1}}>{d}</div></div>
                  <button className={'sw '+(v(k)?'on':'')} onClick={()=>set(k,!v(k))}><i/></button>
                </div>
              ))}
            </div>

            {dirty && (
              <div style={{display:'flex',gap:8,position:'sticky',bottom:0,padding:'12px 0',
                background:'linear-gradient(transparent,var(--paper) 28%)'}}>
                <button className="btn b-out" style={{flex:1}} onClick={()=>setDraft({})}>Kanselahin</button>
                <button className="btn b-pri" style={{flex:1}} onClick={save}><Ico n="check" s={15}/>I-save</button>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  )
}

/* ════════════════════════════════════════════════════════════
   ADMIN — windows
   ════════════════════════════════════════════════════════════ */
function Windows() {
  const toast = useToast()
  const [wins,setWins] = useState([])
  const [svcs,setSvcs] = useState([])
  const [staff,setStaff] = useState([])
  const [sel,setSel]   = useState(null)
  const [mySvc,setMySvc] = useState([])
  const [myStaff,setMyStaff] = useState([])
  const [adding,setAdding] = useState(false)
  const [nw,setNw] = useState('')
  const [name,setName] = useState(null)

  const load = async keep => {
    const [{data:w},{data:s},{data:p}] = await Promise.all([
      sb.from('windows').select('*').order('sort_order'),
      sb.from('services').select('id,code,name,color').eq('is_active',true).order('sort_order'),
      sb.from('profiles').select('id,full_name,role').eq('is_active',true).order('full_name'),
    ])
    setWins(w||[]); setSvcs(s||[]); setStaff(p||[])
    const pick = keep ? (w||[]).find(x=>x.id===keep) : (sel ? (w||[]).find(x=>x.id===sel.id) : w?.[0])
    setSel(pick||null)
  }
  useEffect(()=>{ load() },[])
  useEffect(()=>{
    if (!sel) return
    setName(null)
    Promise.all([
      sb.from('window_services').select('service_id').eq('window_id',sel.id),
      sb.from('window_staff').select('user_id').eq('window_id',sel.id),
    ]).then(([a,b])=>{
      setMySvc((a.data||[]).map(r=>r.service_id))
      setMyStaff((b.data||[]).map(r=>r.user_id))
    })
  },[sel?.id])

  const toggleSvc = async id => {
    const has = mySvc.includes(id)
    setMySvc(p=>has?p.filter(x=>x!==id):[...p,id])
    const {error} = has
      ? await sb.from('window_services').delete().eq('window_id',sel.id).eq('service_id',id)
      : await sb.from('window_services').insert({window_id:sel.id,service_id:id})
    if (error) { toast(error.message,'err'); setMySvc(p=>has?[...p,id]:p.filter(x=>x!==id)) }
  }
  const toggleStaff = async id => {
    const has = myStaff.includes(id)
    setMyStaff(p=>has?p.filter(x=>x!==id):[...p,id])
    const {error} = has
      ? await sb.from('window_staff').delete().eq('window_id',sel.id).eq('user_id',id)
      : await sb.from('window_staff').insert({window_id:sel.id,user_id:id})
    if (error) { toast(error.message,'err'); setMyStaff(p=>has?[...p,id]:p.filter(x=>x!==id)) }
  }
  const add = async e => {
    e.preventDefault()
    if (!nw.trim()) return
    const {data,error} = await sb.from('windows')
      .insert({name:nw.trim(), sort_order:(wins.length+1)*10}).select().single()
    if (error) return toast(error.message,'err')
    setNw(''); setAdding(false); await load(data.id); toast('Naidagdag','ok')
  }
  const saveName = async () => {
    const {error} = await sb.from('windows')
      .update({name:name.name, short_name:name.short_name}).eq('id',sel.id)
    if (error) return toast(error.message,'err')
    await load(sel.id); toast('Na-save','ok')
  }

  return (
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      <div style={{width:252,flexShrink:0,background:'#fff',borderRight:'1px solid var(--line)',
                   display:'flex',flexDirection:'column'}}>
        <div style={{padding:'15px 16px',borderBottom:'1px solid var(--line-2)'}}>
          <div style={{fontWeight:800,fontSize:14.5}}>Mga counter</div>
          <div style={{fontSize:12,color:'var(--muted)'}}>{wins.length} lahat</div>
        </div>
        <div style={{flex:1,overflowY:'auto',padding:5}}>
          {wins.map(w=>(
            <button key={w.id} onClick={()=>setSel(w)}
              style={{display:'block',width:'100%',padding:'9px 11px',borderRadius:9,textAlign:'left',
                background:sel?.id===w.id?'var(--indigo-wash)':'transparent',
                color:sel?.id===w.id?'var(--indigo)':'var(--text)',
                fontWeight:sel?.id===w.id?600:500,fontSize:13.5,opacity:w.is_active?1:.45}}>
              {w.name}
            </button>
          ))}
        </div>
        <div style={{padding:10,borderTop:'1px solid var(--line-2)'}}>
          {adding ? (
            <form onSubmit={add} style={{display:'flex',flexDirection:'column',gap:6}}>
              <input className="inp" style={{fontSize:13}} autoFocus placeholder="Pangalan ng counter"
                value={nw} onChange={e=>setNw(e.target.value)}/>
              <div style={{display:'flex',gap:5}}>
                <button className="btn b-pri b-sm" style={{flex:1}}>Idagdag</button>
                <button type="button" className="btn b-out b-sm b-ico" onClick={()=>setAdding(false)}><Ico n="x" s={14}/></button>
              </div>
            </form>
          ) : (
            <button className="btn b-pri b-full b-sm" onClick={()=>setAdding(true)}><Ico n="plus" s={14}/>Bagong counter</button>
          )}
        </div>
      </div>

      <div style={{flex:1,overflowY:'auto',padding:24}}>
        {!sel ? <div className="empty" style={{paddingTop:80}}><div className="empty-t">Pumili ng counter</div></div> : (
          <div style={{maxWidth:620,display:'flex',flexDirection:'column',gap:13}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
              <div>
                <h2 className="h1" style={{fontSize:18}}>{sel.name}</h2>
                <p className="sub">Lalabas sa TV bilang <b>{sel.short_name || sel.name}</b></p>
              </div>
              <div style={{display:'flex',gap:7}}>
                <button className="btn b-out b-sm" onClick={async()=>{
                  await sb.from('windows').update({is_active:!sel.is_active}).eq('id',sel.id); load(sel.id)
                }}>{sel.is_active?'I-off':'I-on'}</button>
                <button className="btn b-out b-sm" style={{color:'var(--red)'}} onClick={async()=>{
                  if(!confirm(`Burahin ang "${sel.name}"?`))return
                  const {error} = await sb.from('windows').delete().eq('id',sel.id)
                  if (error) return toast('Hindi mabura — may ticket na naka-ugnay.','err')
                  setSel(null); load(); toast('Nabura','ok')
                }}><Ico n="trash" s={14}/></button>
              </div>
            </div>

            <div className="card" style={{padding:17}}>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
                <div>
                  <label className="lbl">Buong pangalan</label>
                  <input className="inp" value={name?.name ?? sel.name}
                    onChange={e=>setName(n=>({name:e.target.value, short_name:n?.short_name ?? sel.short_name ?? ''}))}/>
                </div>
                <div>
                  <label className="lbl">Maikling pangalan (TV)</label>
                  <input className="inp" value={name?.short_name ?? sel.short_name ?? ''}
                    onChange={e=>setName(n=>({name:n?.name ?? sel.name, short_name:e.target.value}))}
                    placeholder="Hal. Lab 1"/>
                </div>
              </div>
              {name && <button className="btn b-pri b-sm" style={{marginTop:12}} onClick={saveName}>
                <Ico n="check" s={14}/>I-save ang pangalan</button>}
            </div>

            <div className="card">
              <div className="card-h"><span className="card-t">Mga serbisyong hawak</span>
                <span style={{fontSize:12,color:'var(--muted)'}}>{mySvc.length} napili</span></div>
              <div style={{padding:7,maxHeight:250,overflowY:'auto'}}>
                {svcs.map(s=>(
                  <label key={s.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',
                    gap:11,padding:'8px 10px',borderRadius:9,cursor:'pointer',
                    background:mySvc.includes(s.id)?'var(--indigo-wash)':'transparent'}}>
                    <span style={{display:'flex',alignItems:'center',gap:9,fontSize:13.5,
                      fontWeight:mySvc.includes(s.id)?600:500}}>
                      <span style={{width:8,height:8,borderRadius:'50%',background:s.color}}/>{s.name}</span>
                    <input type="checkbox" checked={mySvc.includes(s.id)} onChange={()=>toggleSvc(s.id)}
                      style={{width:15,height:15,accentColor:'var(--indigo)'}}/>
                  </label>
                ))}
              </div>
            </div>

            <div className="card">
              <div className="card-h"><span className="card-t">Mga staff na pwede rito</span>
                <span style={{fontSize:12,color:'var(--muted)'}}>{myStaff.length} napili</span></div>
              <div style={{padding:7,maxHeight:250,overflowY:'auto'}}>
                {staff.map(p=>(
                  <label key={p.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',
                    gap:11,padding:'8px 10px',borderRadius:9,cursor:'pointer',
                    background:myStaff.includes(p.id)?'var(--indigo-wash)':'transparent'}}>
                    <span style={{display:'flex',alignItems:'center',gap:9}}>
                      <span className="pip" style={{width:26,height:26,fontSize:10,background:'#dcdcea',color:'var(--muted)'}}>
                        {initials(p.full_name)}</span>
                      <span style={{fontSize:13.5,fontWeight:myStaff.includes(p.id)?600:500}}>{p.full_name}</span>
                    </span>
                    <input type="checkbox" checked={myStaff.includes(p.id)} onChange={()=>toggleStaff(p.id)}
                      style={{width:15,height:15,accentColor:'var(--indigo)'}}/>
                  </label>
                ))}
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  )
}

/* ════════════════════════════════════════════════════════════
   ADMIN — TV displays
   ════════════════════════════════════════════════════════════ */
function Displays() {
  const toast = useToast()
  const [list,setList] = useState([])
  const [wins,setWins] = useState([])
  const [sel,setSel]   = useState(null)
  const [mine,setMine] = useState([])
  const [adding,setAdding] = useState(false)
  const [nw,setNw] = useState({slug:'',name:''})

  const load = async keep => {
    const [{data:d},{data:w}] = await Promise.all([
      sb.from('displays').select('*').order('sort_order'),
      sb.from('windows').select('id,name,short_name').eq('is_active',true).order('sort_order'),
    ])
    setList(d||[]); setWins(w||[])
    const pick = keep ? (d||[]).find(x=>x.id===keep) : (sel ? (d||[]).find(x=>x.id===sel.id) : d?.[0])
    setSel(pick||null)
  }
  useEffect(()=>{ load() },[])
  useEffect(()=>{
    if (!sel) return
    sb.from('display_windows').select('window_id').eq('display_id',sel.id)
      .then(({data})=>setMine((data||[]).map(r=>r.window_id)))
  },[sel?.id])

  const toggle = async id => {
    const has = mine.includes(id)
    setMine(p=>has?p.filter(x=>x!==id):[...p,id])
    const {error} = has
      ? await sb.from('display_windows').delete().eq('display_id',sel.id).eq('window_id',id)
      : await sb.from('display_windows').insert({display_id:sel.id,window_id:id})
    if (error) { toast(error.message,'err'); setMine(p=>has?[...p,id]:p.filter(x=>x!==id)) }
  }
  const add = async e => {
    e.preventDefault()
    const slug = nw.slug.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-')
    if (!slug || !nw.name.trim()) return
    const {data,error} = await sb.from('displays')
      .insert({slug, name:nw.name.trim(), sort_order:(list.length+1)*10}).select().single()
    if (error) return toast(error.message,'err')
    setNw({slug:'',name:''}); setAdding(false); await load(data.id); toast('Naidagdag','ok')
  }
  const url = s => `${location.origin}${location.pathname}?tv=${s}`

  return (
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      <div style={{width:252,flexShrink:0,background:'#fff',borderRight:'1px solid var(--line)',
                   display:'flex',flexDirection:'column'}}>
        <div style={{padding:'15px 16px',borderBottom:'1px solid var(--line-2)'}}>
          <div style={{fontWeight:800,fontSize:14.5}}>Mga TV</div>
          <div style={{fontSize:12,color:'var(--muted)'}}>Isang link bawat departamento</div>
        </div>
        <div style={{flex:1,overflowY:'auto',padding:5}}>
          {list.map(d=>(
            <button key={d.id} onClick={()=>setSel(d)}
              style={{display:'block',width:'100%',padding:'9px 11px',borderRadius:9,textAlign:'left',
                background:sel?.id===d.id?'var(--indigo-wash)':'transparent',
                color:sel?.id===d.id?'var(--indigo)':'var(--text)',fontSize:13.5}}>
              <div style={{fontWeight:sel?.id===d.id?600:500}}>{d.name}</div>
              <div className="num" style={{fontSize:11,color:'var(--faint)',fontWeight:600}}>?tv={d.slug}</div>

        <div style={{padding:10,borderTop:'1px solid var(--line-2)'}}>

              <input className="inp" style={{fontSize:13}} autoFocus placeholder="Pangalan"
                value={nw.name} onChange={e=>setNw(n=>({...n,name:e.target.value}))}/>
              <input className="inp" style={{fontSize:13}} placeholder="slug (hal. lab)"
                value={nw.slug} onChange={e=>setNw(n=>({...n,slug:e.target.value}))}/>
              <div style={{display:'flex',gap:5}}>
                <button className="btn b-pri b-sm" style={{flex:1}}>Idagdag</button>
                <button type="button" className="btn b-out b-sm b-ico" onClick={()=>setAdding(false)}><Ico n="x" s={14}/></button>

                  <Ico n="tv" s={14}/>Buksan</button>

            <div className="card" style={{padding:'14px 17px',display:'flex',alignItems:'center',

                      <input type="checkbox" checked={mine.includes(w.id)} onChange={()=>toggle(w.id)}

                  ))}
