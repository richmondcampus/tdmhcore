<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>TDMH Queuing</title>
<link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;text y='.9em' font-size='90'&gt;🏥&lt;/text&gt;&lt;/svg&gt;"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Archivo:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>
<style>
/* ═══ TDMH tokens — indigo, green, gold from the hospital mark ═══ */
:root{
  --ink:#15183a; --ink-2:#262a52;
  --indigo:#3b3fa3; --indigo-2:#5b60d6; --indigo-wash:#ecedf9;
  --green:#15793f; --green-2:#1f8a4c; --green-wash:#e4f3ea;
  --gold:#c99a2e; --gold-wash:#faf2de;
  --red:#c0453f; --red-wash:#fbecea;
  --paper:#f4f5fa; --card:#fff; --line:#e1e2ee; --line-2:#eff0f6;
  --text:#1c1c33; --muted:#63647f; --faint:#727390;
  /* surfaces used by the sign-in, sidebar, kiosk and TV */
  --surf:#eef0f7; --surf-2:#fff; --surf-3:#e6e8f2;
  --on-surf:#1c1c33; --dim:#63647f; --faint2:#696a83;
  --r:10px; --r-lg:16px;
  --sh:0 1px 2px rgba(21,24,58,.06),0 1px 3px rgba(21,24,58,.04);
  --sh-lg:0 12px 32px rgba(21,24,58,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{font-family:Figtree,system-ui,sans-serif;background:var(--paper);color:var(--text);
     font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#cfcfdd;border-radius:3px}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}
.num{font-family:Archivo,sans-serif;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}

/* ═══ shell ═══ */
.app{display:flex;height:100vh;overflow:hidden}
.rail{width:250px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);
      display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.rail-top{padding:20px 18px 17px;display:flex;align-items:center;gap:10px;
          border-bottom:1px solid var(--line-2)}
.mark{width:38px;height:38px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;
      background:linear-gradient(135deg,var(--indigo-2),var(--green));color:#fff;
      font-family:Archivo;font-weight:900;font-size:15px}
.rail-name{color:var(--text);font-weight:700;font-size:15px;line-height:1.25}
.rail-sub{color:var(--faint);font-size:12px}
.rail-nav{flex:1;padding:12px 11px;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.nav{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:10px;width:100%;
     text-align:left;color:var(--muted);font-size:14.5px;font-weight:500;transition:.14s}
.nav:hover{color:var(--text);background:var(--line-2)}
.nav.on{color:var(--indigo);background:var(--indigo-wash);font-weight:600}
.nav svg{width:17px;height:17px;flex-shrink:0;opacity:.9}
.nav-head{padding:15px 13px 6px;font-size:11.5px;font-weight:700;color:var(--faint);letter-spacing:.02em}
.rail-foot{padding:9px;border-top:1px solid var(--line-2)}
.who{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;background:var(--paper)}
.pip{width:33px;height:33px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
     background:var(--indigo);color:#fff;font-size:11px;font-weight:700}
.who-n{color:var(--text);font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-r{color:var(--faint);font-size:12px;text-transform:capitalize}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}

/* ═══ page furniture ═══ */
.head{padding:26px 30px 0}
.h1{font-size:23px;font-weight:800;letter-spacing:-.015em}
.sub{color:var(--muted);font-size:14.5px;margin-top:2px}
.wrap{padding:20px 30px 30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh)}
.card-h{padding:15px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;
        justify-content:space-between;gap:10px}
.card-t{font-size:14.5px;font-weight:700}

/* ═══ controls ═══ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 17px;
     border-radius:10px;font-size:14.5px;font-weight:600;transition:.13s;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(1px)}
.b-pri{background:var(--indigo);color:#fff}      .b-pri:hover:not(:disabled){background:#32368d}
.b-go{background:var(--green);color:#fff}        .b-go:hover:not(:disabled){background:#1a7442}
.b-gold{background:var(--gold);color:#fff}       .b-gold:hover:not(:disabled){background:#b2871f}
.b-red{background:var(--red);color:#fff}         .b-red:hover:not(:disabled){background:#a93a35}
.b-out{background:#fff;color:var(--text);border:1px solid var(--line)}
.b-out:hover:not(:disabled){background:#fafaff;border-color:#d2d2e2}
.b-ghost{color:var(--muted);padding:6px 9px} .b-ghost:hover{background:var(--line-2);color:var(--text)}
.b-sm{padding:6px 13px;font-size:13.5px} .b-ico{padding:9px;border-radius:9px}
.b-full{width:100%} .b-lg{padding:13px 22px;font-size:15.5px}
.inp{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;
     color:var(--text);outline:none;transition:.13s}
.inp:focus{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(59,63,163,.11)}
.inp::placeholder{color:var(--faint)}
select.inp{cursor:pointer}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.sw{position:relative;width:44px;height:25px;border-radius:13px;background:#d8d8e6;flex-shrink:0;transition:.18s}
.sw.on{background:var(--green)}
.sw i{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;
      box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.18s}
.sw.on i{left:22px}

/* ═══ live board ═══ */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(224px,1fr));gap:13px}
.kpi{padding:20px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.kpi-k{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.kpi-v{font-size:36px;line-height:1.12;margin-top:2px;color:var(--text)}
.kpi-sub{font-size:13px;color:var(--faint);margin-top:3px}
.kpi-sub b{color:var(--muted);font-weight:600}
.kpi-ic{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
.two-col{display:grid;grid-template-columns:1.08fr 1fr;gap:13px;margin-top:13px;align-items:start}
.tally{display:grid;grid-template-columns:repeat(3,1fr)}
.tally-cell{padding:15px 17px;border-right:1px solid var(--line-2)}
.tally-cell:last-child{border-right:none}
.occ{display:flex;align-items:center;justify-content:space-between;gap:12px;
     padding:13px 15px;border-radius:11px;background:var(--paper);margin-bottom:5px}
.occ:last-child{margin-bottom:0}
.occ-w{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.occ-line{font-size:14.5px;margin-top:4px;display:flex;align-items:center;gap:8px;min-width:0}
.occ-line>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.occ-pip{width:25px;height:25px;font-size:9.5px;background:var(--indigo-wash);color:var(--indigo)}
.occ-ago{font-size:11.5px;color:var(--faint);margin-top:3px}
.occ-lbl{font-size:10.5px;font-weight:700;color:var(--faint);letter-spacing:.04em}
.occ-t{font-size:16px;margin-top:2px}
@media(max-width:1040px){.two-col{grid-template-columns:1fr}}

/* ═══ tags ═══ */
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
     font-size:12px;font-weight:600;white-space:nowrap}
.t-wait{background:var(--gold-wash);color:#8a6713}
.t-serv{background:var(--green-wash);color:#166434}
.t-done{background:var(--line-2);color:var(--muted)}
.t-held{background:var(--indigo-wash);color:#2f3285}
.t-skip{background:var(--red-wash);color:#8f2e2a}
.t-step{background:var(--indigo-wash);color:var(--indigo)}

/* ═══ counter workspace ═══ */
.ws{display:flex;height:100vh;overflow:hidden}
.ws-l{width:412px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);
      display:flex;flex-direction:column}
.ws-r{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--paper)}
.ws-h{padding:12px 13px;border-bottom:1px solid var(--line-2)}
.segs{display:flex;background:var(--line-2);border-radius:9px;padding:3px;gap:2px}
.seg{flex:1;padding:7px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--muted);
     display:flex;align-items:center;justify-content:center;gap:5px;transition:.13s}
.seg.on{background:#fff;color:var(--text);box-shadow:var(--sh)}
.cnt{padding:1px 6px;border-radius:9px;font-size:11px;font-weight:700;background:#dadae8;color:var(--muted)}
.seg.on .cnt{background:var(--indigo);color:#fff}
.ws-list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.ws-f{padding:14px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:7px}

.tk{padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;background:#fff;transition:.13s;
    text-align:left;width:100%;display:block}
.tk:hover{border-color:#c3c3d8}
.tk.on{border-color:var(--indigo);background:var(--indigo-wash)}
.tk-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tk-n{font-size:16px}
.tk-s{font-size:12px;font-weight:600}
.tk-m{font-size:12px;color:var(--muted);margin-top:2px}

/* ═══ now-serving panel ═══ */
.now{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
     padding:26px;text-align:center}
.now-n{font-family:Archivo;font-weight:900;font-size:clamp(68px,11vw,124px);line-height:.92;
       letter-spacing:-.03em;color:var(--indigo)}
.now-acts{padding:13px;background:#fff;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.kbd{display:inline-block;padding:1px 5px;border:1px solid var(--line);border-bottom-width:2px;
     border-radius:5px;font-size:10.5px;font-weight:700;color:var(--faint);background:#fff;margin-left:5px}

/* ═══ TV layout picker ═══ */
.lay{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.layb{display:flex;flex-direction:column;align-items:flex-start;gap:7px;padding:13px;
      border:1.5px solid var(--line);border-radius:12px;text-align:left;background:var(--card);
      transition:.14s}
.layb:hover{border-color:#c3c4da}
.layb.on{border-color:var(--indigo);background:var(--indigo-wash)}
.laypic{display:grid;gap:3px;width:100%;height:46px;padding:5px;border-radius:7px;
        background:var(--paper);border:1px solid var(--line-2)}
.laypic i{background:#c9cadd;border-radius:2px;display:block}
.layb.on .laypic i{background:var(--indigo-2)}
.lay-spotlight{grid-template-columns:1.6fr 1fr;grid-template-rows:1fr 1fr}
.lay-spotlight i:nth-child(1){grid-row:1/3}
.lay-grid{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.lay-grid i:nth-child(3){grid-column:1/3}
.lay-list{grid-template-columns:1.3fr 1fr}
.lay-list i:nth-child(1){grid-row:1/3}
.lay-list i:nth-child(3){display:none}
.layt{font-size:13.5px;font-weight:700}
.layd{font-size:11.5px;color:var(--muted);line-height:1.45}
@media(max-width:900px){.lay{grid-template-columns:1fr}}

/* ═══ procedures ═══ */
.proc{display:grid;grid-template-columns:1fr 290px;gap:0;margin-bottom:14px;overflow:hidden}
.proc-main{padding:22px 24px;min-width:0}
.proc-side{padding:22px 24px;border-left:1px solid var(--line-2);background:#fcfcff;
           display:flex;flex-direction:column;gap:13px}
.proc-name{font-size:18px;font-weight:800;letter-spacing:-.015em}
.proc-desc{font-size:13.5px;color:var(--muted);margin-top:3px}
.proc-act{display:flex;align-items:center;justify-content:space-between;gap:12px;
          padding-top:13px;border-top:1px solid var(--line-2)}
.flow{display:flex;gap:0;margin-top:20px;overflow-x:auto;padding-bottom:4px}
.flow-item{min-width:132px;flex:1}
.flow-head{display:flex;align-items:center}
.flow-dot{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
          background:var(--indigo-wash);color:var(--indigo);
          font-family:Archivo;font-weight:800;font-size:13px}
.flow-line{flex:1;height:2px;background:var(--line);min-width:16px}
.flow-k{font-size:11.5px;color:var(--muted);margin-top:10px}
.flow-s{font-size:13.5px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;margin-top:2px}
.chip-dark{background:var(--ink);border-color:var(--ink);color:#fff}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:3px;max-height:210px;overflow-y:auto;
        border:1px solid var(--line);border-radius:10px;padding:7px}
.pick{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;cursor:pointer;
      font-size:13.5px}
.pick.on{background:var(--indigo-wash);font-weight:600}
.steprow{display:flex;align-items:center;gap:8px}
@media(max-width:1100px){.proc{grid-template-columns:1fr}
  .proc-side{border-left:none;border-top:1px solid var(--line-2)}
  .picker{grid-template-columns:1fr}}

/* ═══ settings rows ═══ */
.sgroup{padding:13px 18px;font-size:11.5px;font-weight:800;letter-spacing:.09em;
        color:var(--faint);border-bottom:1px solid var(--line-2)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:20px;
      padding:15px 18px;border-bottom:1px solid var(--line-2)}
.srow:last-child{border-bottom:none}
.srow.off{opacity:.48}
.srow-t{font-size:14.5px;font-weight:650}
.srow-s{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.sw:disabled{cursor:not-allowed}

/* ═══ counter — queue workspace ═══ */
.from{display:flex;align-items:stretch;gap:0;margin:14px 14px 0;border:1px solid var(--line);
      border-radius:10px;overflow:hidden;background:var(--card)}
.from-k{background:var(--ink);color:#fff;font-size:13.5px;font-weight:700;
        padding:11px 17px;display:grid;place-items:center;flex-shrink:0}
.from-sel{flex:1;border:none;outline:none;background:transparent;padding:11px 14px;
          font-size:14.5px;font-weight:600;color:var(--text);cursor:pointer}
.utabs{display:flex;margin:14px 0 0;border-bottom:1px solid var(--line)}
.utab{flex:1;padding:14px 8px 15px;font-size:15px;font-weight:600;color:var(--muted);
      border-bottom:2.5px solid transparent;margin-bottom:-1px;display:flex;
      align-items:center;justify-content:center;gap:7px;transition:.14s}
.utab:hover{color:var(--text)}
.utab.on{color:var(--indigo);border-bottom-color:var(--indigo);font-weight:700}
.ucnt{min-width:21px;height:21px;padding:0 7px;border-radius:11px;display:grid;place-items:center;
      font-size:11.5px;font-weight:800;background:var(--line-2);color:var(--muted)}
.utab.on .ucnt{background:var(--indigo);color:#fff}
.tools{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px}
.pillset{display:flex;gap:5px}
.pillb{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:20px;
       border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--faint);
       letter-spacing:.03em;text-transform:uppercase;transition:.14s}
.pillb.on{background:var(--indigo-wash);border-color:var(--indigo);color:var(--indigo)}
.toolb{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;
       color:var(--muted);letter-spacing:.03em;text-transform:uppercase;padding:5px 7px;border-radius:7px}
.toolb:hover{background:var(--line-2);color:var(--text)}

.qc{display:block;width:100%;text-align:left;padding:17px 19px;border:1px solid var(--line);
    border-left:4px solid transparent;border-radius:11px;background:var(--card);
    box-shadow:var(--sh);transition:.14s}
.qc:hover{border-color:#c9cadd}
.qc.on{border-color:var(--indigo);border-left-color:var(--indigo);
       box-shadow:0 0 0 2px rgba(59,63,163,.12)}
.qc-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.qc-n{font-size:24px;letter-spacing:-.025em}
.qc-svc{font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;
        letter-spacing:.04em;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qc-mid{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:7px}
.qc-lbl{font-size:14px;color:var(--muted)}
.qc-ago{font-size:14px;color:var(--muted);font-weight:600}

.phead{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-shrink:0;
       padding:16px 24px;background:var(--card);border-bottom:1px solid var(--line)}
.phead-t{font-size:24px;font-weight:800;letter-spacing:-.02em}
.autobar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-shrink:0;
         padding:15px 24px;background:var(--card);border-bottom:1px solid var(--line)}
.autobar-t{font-size:15px;font-weight:700}
.autobar-s{font-size:13px;color:var(--muted);margin-top:1px}

.fld{text-align:left}
.fld.row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.fld-k{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--faint)}
.fld-v{font-size:15.5px;font-weight:600;margin-top:5px}
.fld.row .fld-v{margin-top:0}
.side-row{display:flex;align-items:center;justify-content:space-between;gap:10px}

.actbar{display:flex;align-items:center;gap:10px;flex-shrink:0;padding:16px 24px;
        background:var(--card);border-top:1px solid var(--line)}
.dd{position:absolute;bottom:46px;left:0;z-index:60;min-width:250px;padding:5px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-lg)}
.dd-i{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 11px;
      border-radius:8px;font-size:13px;font-weight:500}
.dd-i:hover{background:var(--paper)}
.dd-i .kbd{margin-left:auto}
.dd-sep{height:1px;background:var(--line-2);margin:4px 0}

.tl-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tl-when{font-size:11.5px;color:var(--faint);white-space:nowrap}

/* ═══ counter detail pane ═══ */
.ws-bar{background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px;
        display:flex;align-items:center;justify-content:space-between;gap:14px;flex-shrink:0}
.autosw{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;
        font-weight:600;color:var(--muted);cursor:pointer}
.detail{flex:1;display:grid;grid-template-columns:1fr 372px;gap:17px;
        padding:20px 24px;overflow:hidden;min-height:0}
.detail-mid{overflow-y:auto;display:flex;align-items:flex-start;justify-content:center}
.detail-side{display:flex;flex-direction:column;gap:13px;overflow:hidden;min-height:0}
.tkcard{width:100%;max-width:490px;padding:32px 30px;text-align:center}
.tkcard-k{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--faint)}
.tkcard-n{font-size:clamp(54px,7.6vw,90px);line-height:1;letter-spacing:-.035em;margin:8px 0 0}
.tkcard-rule{height:1px;background:var(--line-2);margin:24px 0 20px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;text-align:left}
.kv dt{font-size:12.5px;color:var(--muted)}
.kv dd{font-size:13.5px;font-weight:600;text-align:right}
.tknote{margin-top:16px;padding:10px 13px;background:var(--paper);border-radius:10px;
        font-size:13px;color:var(--muted);text-align:left}
.tagbox{margin-top:18px;padding-top:16px;border-top:1px solid var(--line-2);text-align:left}
.sidecard{padding:17px 18px}
.side-k{font-size:11.5px;font-weight:800;letter-spacing:.11em;color:var(--faint);display:block}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:8px;
      background:var(--gold-wash);border:1px solid #ecdfbd;color:#7d5e11;
      font-size:12px;font-weight:700;letter-spacing:.02em}
.chip-x button{display:inline-flex;color:#a98b3c;padding:0;margin-left:1px}
.chip-x button:hover{color:#6d4f0c}
.chip-add{background:transparent;border:1px dashed var(--line);color:var(--muted);font-weight:600}
.chip-add:hover{border-color:var(--indigo);color:var(--indigo)}

.path{display:flex;flex-direction:column;gap:2px;margin-top:9px}
.path-row{display:flex;align-items:center;gap:12px;padding:9px 0}
.path-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.path-n{font-size:11.5px;font-weight:700;color:var(--faint)}
.path-s{font-size:14.5px;font-weight:700;margin-top:1px}
.path-t{font-size:12.5px;color:var(--muted);flex-shrink:0}

.tl{margin-top:12px;overflow-y:auto;display:flex;flex-direction:column;gap:15px;padding-right:3px}
.tl-row{display:flex;gap:10px}
.tl-dot{width:7px;height:7px;border-radius:50%;background:var(--indigo);flex-shrink:0;margin-top:5px}
.tl-a{font-size:11.5px;font-weight:800;letter-spacing:.07em;color:var(--indigo)}
.tl-m{font-size:13px;color:var(--muted);margin-top:1px}
.tl-d{font-size:12.5px;color:var(--indigo);margin-top:3px;background:var(--indigo-wash);
      padding:4px 8px;border-radius:7px;display:inline-block}

/* laptops: stack the side rail under the ticket instead of dropping it */
@media(max-width:1500px){
  .ws-l{width:352px}
  .detail{grid-template-columns:1fr;grid-auto-rows:min-content;overflow-y:auto;
          align-content:start}
  .detail-mid{overflow:visible}
  .detail-side{overflow:visible}
  .tl{max-height:300px}
  .tkcard{max-width:none}
}
@media(max-width:1100px){
  .ws-l{width:308px}
  .phead-t{font-size:20px}
  .actbar{flex-wrap:wrap}
}

/* ═══ empty + misc ═══ */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 22px;
       text-align:center;color:var(--muted);gap:4px}
.empty-i{width:46px;height:46px;border-radius:50%;background:var(--line-2);display:grid;place-items:center;
         margin-bottom:8px;color:var(--faint)}
.empty-t{font-weight:700;font-size:15.5px;color:var(--text)}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
      border-radius:50%;animation:sp .7s linear infinite;flex-shrink:0}
.spin.d{border-color:rgba(59,63,163,.2);border-top-color:var(--indigo)}
@keyframes sp{to{transform:rotate(360deg)}}
.mid{display:grid;place-items:center;height:100vh}
.live{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;
      background:var(--green-wash);color:#166434;font-size:12px;font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green-2);position:relative}
.dot::after{content:'';position:absolute;inset:-3px;border-radius:50%;background:var(--green-2);
            opacity:.35;animation:pl 1.8s ease infinite}
.dot.off{background:var(--faint)} .dot.off::after{display:none}
@keyframes pl{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.7);opacity:0}}

/* ═══ table ═══ */
.tb{width:100%;border-collapse:collapse}
.tb th{padding:11px 16px;text-align:left;font-size:12.5px;font-weight:700;color:var(--muted);
       background:#fafafd;border-bottom:1px solid var(--line)}
.tb td{padding:12px 16px;border-bottom:1px solid var(--line-2);font-size:14.5px}
.tb tr:last-child td{border-bottom:none}
.tb tbody tr:hover td{background:#fafafd}

/* ═══ modal ═══ */
.ov{position:fixed;inset:0;background:rgba(21,24,58,.42);backdrop-filter:blur(3px);display:flex;
    align-items:center;justify-content:center;z-index:200;padding:16px;animation:fi .14s}
.md{background:#fff;border-radius:18px;box-shadow:var(--sh-lg);width:100%;max-width:460px;
    max-height:88vh;overflow-y:auto;animation:su .18s}
.md-h{padding:20px 22px 16px;border-bottom:1px solid var(--line-2);display:flex;
      align-items:flex-start;justify-content:space-between;gap:12px;position:sticky;top:0;background:#fff;z-index:2}
.md-t{font-size:18px;font-weight:800;letter-spacing:-.01em}
.md-s{font-size:13.5px;color:var(--muted);margin-top:2px}
.md-b{padding:22px}
.md-f{display:flex;gap:8px;padding-top:16px;margin-top:16px;border-top:1px solid var(--line-2)}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ═══ toasts ═══ */
.toasts{position:fixed;bottom:18px;right:18px;z-index:400;display:flex;flex-direction:column;
        gap:8px;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 15px;border-radius:10px;font-size:13.5px;
       font-weight:500;box-shadow:var(--sh-lg);animation:su .18s;max-width:310px;
       display:flex;align-items:center;gap:8px;border-left:3px solid var(--indigo-2)}
.toast.ok{border-left-color:var(--green-2)} .toast.err{border-left-color:var(--red)}

/* ═══════════ TV DISPLAY ═══════════ */
.tv{height:100vh;background:var(--surf);color:var(--on-surf);display:flex;flex-direction:column;overflow:hidden;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.tv-h{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-shrink:0;
      padding:1.4vh 2vw;background:var(--surf-2);border-bottom:1px solid var(--line)}
.tv-mark{width:3.1vw;min-width:40px;aspect-ratio:1;border-radius:11px;display:grid;place-items:center;
         background:linear-gradient(135deg,var(--indigo-2),var(--green));
         font-family:Archivo;font-weight:900;font-size:1.5vw}
.tv-name{font-size:clamp(14px,1.45vw,23px);font-weight:800;letter-spacing:-.015em;line-height:1.15}
.tv-where{color:var(--green);font-size:clamp(11px,1.05vw,16px);font-weight:700;margin-top:2px}
.tv-clock{font-family:Archivo;font-weight:800;font-size:clamp(20px,2.3vw,38px);font-variant-numeric:tabular-nums;line-height:1}
.tv-date{color:var(--dim);font-size:clamp(10px,.9vw,14px);text-align:right;margin-top:2px}

.tv-body{flex:1;display:grid;grid-template-columns:44% 1fr;gap:1.4vw;padding:1.4vh 2vw;min-height:0}

/* hero — the one bold thing on this screen */
.hero{border-radius:20px;background:var(--surf-2);box-shadow:var(--sh);
      border:1px solid var(--line);display:flex;flex-direction:column;
      justify-content:center;padding:2vh 2.2vw;position:relative;overflow:hidden;min-height:0;
      transition:background .35s,border-color .35s}
.hero.ring{background:linear-gradient(130deg,var(--green) 0%,var(--green-2) 78%);

      box-shadow:0 0 0 3px rgba(47,168,94,.3),0 14px 40px rgba(31,138,76,.3)}
.hero::after{content:'';position:absolute;inset:0;opacity:0;
      background:linear-gradient(100deg,transparent 32%,rgba(255,255,255,.14) 50%,transparent 68%)}
.hero.ring::after{opacity:1;animation:sweep 2.2s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-62%)}100%{transform:translateX(62%)}}
.hero-lbl{font-size:clamp(11px,1vw,16px);font-weight:800;letter-spacing:.14em;
          color:var(--green);margin-bottom:.6vh}
.hero.ring .hero-lbl{color:rgba(255,255,255,.9)}
.hero.ring .hero-rule{background:#fff}
.hero-num{font-family:Archivo;font-weight:900;font-size:clamp(54px,10.5vw,190px);line-height:.84;
          letter-spacing:-.045em;display:flex;position:relative;z-index:1}
.hero-num span{display:inline-block;animation:drop .42s cubic-bezier(.2,.9,.25,1) backwards}
@keyframes drop{from{opacity:0;transform:translateY(-.3em)}to{opacity:1;transform:none}}
.hero-rule{height:4px;width:clamp(50px,7vw,120px);border-radius:3px;margin:1.6vh 0 1.2vh;
           background:var(--green-2);position:relative;z-index:1}
.hero-go{font-size:clamp(12px,1.15vw,19px);color:var(--dim);font-weight:600;position:relative;z-index:1}
.hero.ring .hero-go{color:rgba(255,255,255,.8)}
.hero-win{font-size:clamp(20px,2.7vw,52px);font-weight:800;letter-spacing:-.02em;line-height:1.08;
          margin-top:.3vh;position:relative;z-index:1}
.hero-svc{font-size:clamp(11px,1.05vw,17px);color:var(--dim);margin-top:.8vh;position:relative;z-index:1}
.hero.ring .hero-svc{color:rgba(255,255,255,.72)}
.hero-idle{font-size:clamp(17px,2vw,34px);font-weight:800;color:var(--faint2)}
.hero-idle-s{font-size:clamp(11px,1.05vw,17px);color:var(--faint2);opacity:.8;margin-top:.7vh}

/* counter rail */
.rail-wrap{display:flex;flex-direction:column;min-height:0}
.rail-head{display:flex;align-items:center;justify-content:space-between;
           font-size:clamp(10px,.88vw,13px);font-weight:800;letter-spacing:.12em;
           color:var(--faint2);padding:0 .6vw .9vh}
.rail-rows{flex:1;display:grid;gap:.7vh;align-content:start;min-height:0;overflow:hidden}
.rail-rows.two{grid-template-columns:1fr 1fr;gap:.7vh .9vw}
.crow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:1vw;
      padding:1.05vh 1.1vw;border-radius:11px;background:var(--surf-2);box-shadow:var(--sh);
      border:1px solid var(--line);border-left:4px solid var(--line);
      transition:background .4s,border-color .4s;min-width:0}
.crow.live{background:var(--green-wash);border-left-color:var(--green)}
.crow.lit{background:var(--green);border-color:var(--green);border-left-color:#fff;color:#fff}
.crow.lit .crow-s{color:rgba(255,255,255,.78)}
.crow.lit .pulse{background:#fff}
.crow-w{font-size:clamp(12px,1.25vw,22px);font-weight:700;letter-spacing:-.01em;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow-s{font-size:clamp(9px,.78vw,12.5px);color:var(--dim);margin-top:1px;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow-n{font-family:Archivo;font-weight:900;font-size:clamp(17px,2.1vw,40px);line-height:1;
        letter-spacing:-.025em;text-align:right;white-space:nowrap}
.crow-n.idle{color:var(--faint2);font-weight:700;font-size:clamp(13px,1.3vw,22px)}
.pulse{display:inline-block;width:.5em;height:.5em;border-radius:50%;background:var(--green);
       margin-right:.4em;vertical-align:middle;animation:pz 1.6s ease infinite}
@keyframes pz{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}

/* ── TV layout: counter grid ── */
.tv-grid{flex:1;display:grid;gap:1.4vw;padding:1.6vh 2vw;min-height:0}
.gcell{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;
       background:var(--surf-2);border:1px solid var(--line);box-shadow:var(--sh);
       transition:background .4s,border-color .4s;min-height:0}
.gcell-h{background:var(--indigo);color:#fff;text-align:center;padding:1.1vh 1vw;
         font-size:clamp(12px,1.35vw,22px);font-weight:800;letter-spacing:.04em;
         text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcell.live .gcell-h{background:var(--green)}
.gcell.lit{border-color:var(--green);box-shadow:0 0 0 3px rgba(47,168,94,.3)}
.gcell.lit .gcell-h{background:var(--green)}
.gcell.lit .gcell-b{background:var(--green)}
.gcell.lit .gcell-s{color:rgba(255,255,255,.85)}
.gcell-b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
         gap:.6vh;padding:1.4vh 1vw;transition:background .4s;min-height:0}
.gcell-n{font-family:Archivo;font-weight:900;line-height:.92;letter-spacing:-.035em;
         font-size:clamp(38px,7.4vw,124px)}
.gcell-s{font-size:clamp(11px,1.25vw,20px);font-weight:700;color:var(--dim);
         text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.gcell-idle{font-family:Archivo;font-weight:800;color:var(--faint2);
            font-size:clamp(24px,3.4vw,56px)}

.tv-two{flex:1;display:grid;grid-template-columns:1.35fr 1fr;gap:1.4vw;
        padding:1.6vh 2vw;min-height:0}
.tvcol{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;
       background:var(--surf-2);border:1px solid var(--line);box-shadow:var(--sh);min-height:0}
.tvcol-h{background:var(--indigo);color:#fff;text-align:center;padding:1.1vh 1vw;

.tvcol-h.alt{background:var(--ink)}
.tvcol-b{flex:1;overflow:hidden;padding:1vh .9vw;display:flex;flex-direction:column;gap:.5vh}
.tvcol-empty{color:var(--faint2);font-size:clamp(13px,1.3vw,20px);
             text-align:center;padding:2vh 0;font-weight:600}
.lrow{display:flex;align-items:baseline;justify-content:space-between;gap:1vw;
      padding:.85vh 1vw;border-radius:11px;transition:background .4s}
.lrow.lit{background:var(--green)}
.lrow.lit .lrow-w{color:rgba(255,255,255,.85)}
.lrow-n{font-family:Archivo;font-weight:900;letter-spacing:-.03em;
        font-size:clamp(26px,3.5vw,58px);line-height:1}
.lrow-w{font-size:clamp(10px,1.05vw,17px);font-weight:700;color:var(--dim);
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-aspect-ratio:1/1){.tv-two{grid-template-columns:1fr}}

.tv-foot{display:flex;align-items:center;gap:1.4vw;flex-shrink:0;padding:1.1vh 2vw;
         background:var(--surf-2);border-top:1px solid var(--line);
         font-size:clamp(10px,1vw,15px);color:var(--dim);overflow:hidden;white-space:nowrap}
.foot-k{font-weight:800;letter-spacing:.1em;color:var(--faint2);flex-shrink:0;font-size:.86em}
.recent{display:flex;gap:1.1vw;overflow:hidden;flex:1}
.recent i{font-style:normal;font-family:Archivo;font-weight:800;color:var(--text)}
.waitpill{flex-shrink:0;display:inline-flex;align-items:center;gap:.5em;padding:.35em .9em;

          color:#8a6713;font-weight:700}
.unlock{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:50;
        background:var(--indigo-2);color:#fff;padding:11px 22px;border-radius:11px;
        font-size:13.5px;font-weight:600;box-shadow:var(--sh-lg)}
@media(max-aspect-ratio:1/1){
  .tv-body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .rail-rows.two{grid-template-columns:1fr}
}

/* ═══════════ KIOSK ═══════════ */
.kio{min-height:100vh;background:var(--surf);color:var(--on-surf);display:flex;flex-direction:column;
     padding:0 0 env(safe-area-inset-bottom,0px)}
.kio-h{text-align:center;padding:4.5vh 22px 2vh}
.kio-mark{width:68px;height:68px;border-radius:17px;margin:0 auto 14px;display:grid;place-items:center;
          background:linear-gradient(135deg,var(--indigo-2),var(--green));
          font-family:Archivo;font-weight:900;font-size:30px}
.kio-t{font-size:clamp(20px,3vw,30px);font-weight:800;letter-spacing:-.02em}
.kio-s{color:var(--dim);font-size:14.5px;margin-top:5px}
.kio-b{flex:1;padding:0 4vw 4vh;max-width:1000px;margin:0 auto;width:100%}
.kio-ask{font-size:15px;font-weight:600;color:var(--dim);margin:2.4vh 0 1.2vh}
.svcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:12px}
.svc{padding:22px 16px;border-radius:15px;border:1.5px solid var(--line);
     background:var(--surf-2);color:var(--text);text-align:left;transition:.15s;position:relative;
     box-shadow:var(--sh);min-height:104px;display:flex;flex-direction:column;
     justify-content:flex-end;gap:3px}
.svc:hover{border-color:var(--indigo);transform:translateY(-2px);box-shadow:var(--sh-lg)}
.svc:active{transform:scale(.98)}
.svc-bar{position:absolute;top:16px;left:16px;width:30px;height:4px;border-radius:2px}
.svc-n{font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.svc-f{font-size:12.5px;color:var(--dim)}
.ticket{position:fixed;inset:0;background:rgba(21,24,58,.55);backdrop-filter:blur(6px);z-index:300;
        display:grid;place-items:center;padding:20px;animation:fi .16s}
.ticket-c{background:#fff;color:var(--text);border-radius:22px;padding:38px 32px;text-align:center;
          max-width:360px;width:100%;animation:su .22s}
.ticket-n{font-family:Archivo;font-weight:900;font-size:76px;line-height:1;letter-spacing:-.035em;
          margin:10px 0 4px}

@media(max-width:860px){
  .rail{width:60px}.rail-name,.rail-sub,.nav span,.who-n,.who-r,.nav-head{display:none}
  .nav{justify-content:center;padding:11px}.who{justify-content:center;padding:6px}
  .ws-l{width:232px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  return Math.floor(t/60) + ':' + String(t%60).padStart(2,'0')

/* ─── toasts ─── */
const TCtx = createContext(()=>{})
const useToast = () => useContext(TCtx)
function Toasts({children}) {
  const [list,setList] = useState([])
  const push = useCallback((msg,kind='info')=>{
    const id = Math.random()
    setList(l=>[...l,{id,msg,kind}])
    setTimeout(()=>setList(l=>l.filter(t=>t.id!==id)), 3200)
  },[])
  return <TCtx.Provider value={push}>{children}
    <div className="toasts">{list.map(t=>
      <div key={t.id} className={'toast '+t.kind}>
        <Ico n={t.kind==='err'?'x':'check'} s={14}/>{t.msg}
      </div>)}
    </div>
  </TCtx.Provider>
}

/* ─── speech ─── */
function useSpeech() {
  const ready = useRef(false)
  const unlock = useCallback(()=>{
    if (ready.current || !('speechSynthesis' in window)) return
    const u = new SpeechSynthesisUtterance(' '); u.volume = 0
    window.speechSynthesis.speak(u); ready.current = true
  },[])
  const say = useCallback((number, where, repeat=2)=>{
    if (!('speechSynthesis' in window)) return
    window.speechSynthesis.cancel()
    const spoken = String(number).replace(/([A-Za-z])/g,'$1 ').replace(/(\d)/g,'$1 ').trim()
    for (let i=0;i<Math.max(1,repeat);i++){
      const u = new SpeechSynthesisUtterance(
        i===0 ? `Number ${spoken}. Please proceed to ${where}.` : `${spoken}. ${where}.`)
      u.lang='en-US'; u.rate=.82; u.pitch=1
      window.speechSynthesis.speak(u)
    }
  },[])
  return {unlock, say, isReady:()=>ready.current}
}

/* ════════════════════════════════════════════════════════════
   AUTH
   ════════════════════════════════════════════════════════════ */
function useAuth() {
  const [user,setUser] = useState(null)
  const [me,setMe] = useState(null)
  const [loading,setLoading] = useState(true)

  const load = async u => {
    const {data} = await sb.from('profiles').select('*').eq('id',u.id).maybeSingle()
    setMe(data); setUser(u)
  }
  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{
      if (session?.user) load(session.user).finally(()=>setLoading(false))
      else setLoading(false)
    })
    const {data:{subscription}} = sb.auth.onAuthStateChange((e,s)=>{
      if (e==='SIGNED_IN' && s?.user) load(s.user)
      if (e==='SIGNED_OUT') { setUser(null); setMe(null) }
    })
    return ()=>subscription.unsubscribe()
  },[])

  return {
    user, me, loading,
    isManager: ['admin','manager'].includes(me?.role),
    signIn: (email,password)=>sb.auth.signInWithPassword({email,password}),
    signOut: async ()=>{ try{ await sb.rpc('go_offline') }catch{}; await sb.auth.signOut() },
  }
}

/* ════════════════════════════════════════════════════════════
   TV DISPLAY
   ════════════════════════════════════════════════════════════ */
function TV({slug}) {
  const [data,setData]   = useState(null)
  const [now,setNow]     = useState(new Date())
  const [ring,setRing]   = useState(false)   // hero is flashing a fresh call
  const [litWin,setLit]  = useState(null)    // which counter row to highlight
  const [live,setLive]   = useState(false)
  const [armed,setArmed] = useState(false)
  const speech = useSpeech()
  const seen   = useRef(new Set())
  const audio  = useRef(null)
  const slugRef = useRef(slug)

  /* two-tone chime, the way a real queue board sounds before the voice */
  const chime = useCallback(()=>{
    try {
      if (!audio.current) audio.current = new (window.AudioContext||window.webkitAudioContext)()
      const ac = audio.current
      if (ac.state === 'suspended') ac.resume()
      const gain = ac.createGain()
      gain.connect(ac.destination)
      gain.gain.setValueAtTime(0.0001, ac.currentTime)
      ;[[880,0],[1174.7,0.17]].forEach(([hz,at])=>{
        const o = ac.createOscillator()
        o.type = 'sine'; o.frequency.value = hz
        const g = ac.createGain(); g.connect(gain)
        g.gain.setValueAtTime(0.0001, ac.currentTime+at)
        g.gain.exponentialRampToValueAtTime(0.22, ac.currentTime+at+0.02)
        g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+at+0.42)
        o.connect(g); o.start(ac.currentTime+at); o.stop(ac.currentTime+at+0.45)
      })
      gain.gain.setValueAtTime(1, ac.currentTime)
    } catch {}
  },[])

  const refresh = useCallback(async ()=>{
    const {data:b, error} = await sb.rpc('board',{p_slug:slugRef.current})
    if (!error && b) setData(b)
  },[])

  useEffect(()=>{
    refresh()
    const tick = setInterval(()=>setNow(new Date()),1000)
    const poll = setInterval(refresh, 20000)   // safety net only

    const ch = sb.channel('tv-'+slug)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'announcements'}, p=>{
        const a = p.new
        if (!a || seen.current.has(a.id)) return
        seen.current.add(a.id)
        refresh().then(()=>{
          setData(d=>{
            const onThisTv = !d || (d.rows||[]).some(r=>r.window_id === a.window_id)
            if (onThisTv) {
              setLit(a.window_id); setRing(true)
              chime()
              const rep = d?.settings?.announce_repeat ?? 2
              if (d?.settings?.voice_enabled !== false)
                setTimeout(()=>speech.say(a.number, a.window_name, rep), 620)
              setTimeout(()=>{ setRing(false); setLit(null) }, 10000)
            }
            return d
          })
        })
      })
      .on('postgres_changes',{event:'*',schema:'public',table:'tickets'}, ()=>refresh())
      .subscribe(s=>setLive(s==='SUBSCRIBED'))

    const mid = setInterval(()=>{
      const d = new Date()
      if (d.getHours()===0 && d.getMinutes()===1) location.reload()
    },60000)

    return ()=>{ clearInterval(tick); clearInterval(poll); clearInterval(mid); ch.unsubscribe() }
  },[slug, refresh, chime])

  const arm = useCallback(() => { speech.unlock(); chime(); setArmed(true) }, [chime])

  /* A TV has no touchscreen. Try to open audio by ourselves first — kiosk
     browsers can be set to allow autoplay — and accept any remote button as
     the gesture if the browser still insists on one. */
  useEffect(()=>{
    if (armed) return
    let done = false
    const settle = () => { if (!done) { done = true; setArmed(true) } }
    try {
      const AC = window.AudioContext || window.webkitAudioContext
      if (AC) {
        const ac = new AC()
        if (ac.state === 'running') { speech.unlock(); settle() }
        else ac.resume().then(()=>{ if (ac.state==='running') { speech.unlock(); settle() } })
            .catch(()=>{})
      }
    } catch {}
    const onAny = () => { arm() }
    window.addEventListener('keydown', onAny)
    window.addEventListener('pointerdown', onAny)
    return ()=>{ window.removeEventListener('keydown', onAny)
                 window.removeEventListener('pointerdown', onAny) }
  },[armed, arm])

  if (!data) return <div className="tv" style={{display:'grid',placeItems:'center'}}><div className="spin"/></div>

  const rows   = data.rows || []
  const last   = data.last_call && data.last_call !== null ? data.last_call : null
  const twoUp  = rows.length > 6
  const layout = data.display?.layout || 'spotlight'
  const cols   = Math.min(Math.max(data.display?.columns || 2, 1), 4)

  return (
    <div className="tv" onClick={arm}>
      {!armed && <button className="unlock" onClick={arm}>Press any button on the remote to turn on sound</button>}

      <div className="tv-h">
        <div style={{display:'flex',alignItems:'center',gap:'1vw',minWidth:0}}>
          <div className="tv-mark">T</div>
          <div style={{minWidth:0}}>
            <div className="tv-name">{data.settings?.hospital_name || 'Taytay Doctors Multispecialty Hospital'}</div>
            <div className="tv-where">{data.display?.name || 'Queue Display'}</div>
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:'1.2vw',flexShrink:0}}>
          <span className="dot" style={{opacity:live?1:.25}}/>
          <div>
            <div className="tv-clock">{clock(now)}</div>
            <div className="tv-date">{dateLong(now)}</div>
          </div>
        </div>
      </div>

      {layout === 'grid' ? (
        <div className="tv-grid" style={{gridTemplateColumns:`repeat(${cols},1fr)`}}>
          {rows.length===0 && (
            <div style={{gridColumn:'1/-1',display:'grid',placeItems:'center',
                         color:'var(--faint2)',fontSize:'clamp(16px,2vw,30px)',fontWeight:800}}>
              No counter is open right now.
            </div>
          )}
          {rows.map(r=>{
            const lit = litWin===r.window_id
            return (
              <div key={r.window_id} className={'gcell '+(lit?'lit':r.status==='serving'?'live':'')}>
                <div className="gcell-h">{r.window_name}</div>
                <div className="gcell-b">
                  {r.number ? (
                    <>
                      <div className="gcell-n"
                           style={{color: lit ? '#fff'
                                        : r.status==='done' ? 'var(--faint2)'
                                        : (r.service_color || 'var(--indigo)')}}>{r.number}</div>
                      <div className="gcell-s">{r.service_name}</div>
                    </>
                  ) : <div className="gcell-idle">—</div>}
                </div>
              </div>
            )
          })}
        </div>
      ) : layout === 'list' ? (
        <div className="tv-two">
          <div className="tvcol">
            <div className="tvcol-h">Now Serving</div>
            <div className="tvcol-b">
              {rows.filter(r=>r.number).length===0 && <div className="tvcol-empty">None yet</div>}
              {rows.filter(r=>r.number).map(r=>(
                <div key={r.window_id} className={'lrow '+(litWin===r.window_id?'lit':'')}>
                  <span className="lrow-n"
                        style={{color: litWin===r.window_id ? '#fff'
                                     : (r.service_color || 'var(--indigo)')}}>{r.number}</span>
                  <span className="lrow-w">{r.window_name}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="tvcol">
            <div className="tvcol-h alt">On-going{data.waiting>0 && ` · ${data.waiting}`}</div>
            <div className="tvcol-b">
              {(data.queue||[]).length===0 && <div className="tvcol-empty">Nobody waiting</div>}
              {(data.queue||[]).map((q,i)=>(
                <div key={i} className="lrow">
                  <span className="lrow-n" style={{color:'var(--dim)'}}>{q.number}</span>
                  <span className="lrow-w">{q.service_name}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      ) : (
      <div className="tv-body">
        {/* ── hero: the number being called ── */}
        <div className={'hero '+(ring?'ring':'')}>
          {last ? (
            <>
              <div className="hero-lbl">
                {ring ? (last.kind==='recall' ? 'CALLING AGAIN' : 'NOW CALLING') : 'LAST CALLED'}
              </div>
              <div className="hero-num" key={last.id}
                   style={{color: ring ? '#fff' : (last.service_color || 'var(--indigo)')}}>
                {String(last.number).split('').map((c,i)=>(
                  <span key={i} style={{animationDelay:(i*55)+'ms'}}>{c}</span>
                ))}
              </div>
              <div className="hero-rule"/>
              <div className="hero-go">Please proceed to</div>
              <div className="hero-win">{last.window_name}</div>
              {last.service_name && <div className="hero-svc">{last.service_name}</div>}
            </>
          ) : (
            <div style={{textAlign:'center'}}>
              <div className="hero-idle">No one called yet</div>
              <div className="hero-idle-s">Please wait for your number.</div>
            </div>
          )}
        </div>

        {/* ── counter rail ── */}
        <div className="rail-wrap">
          <div className="rail-head"><span>COUNTER</span><span>NUMERO</span></div>
          <div className={'rail-rows '+(twoUp?'two':'')}>
            {rows.length === 0 && (
              <div style={{color:'var(--faint2)',fontSize:'clamp(12px,1.2vw,18px)',padding:'2vh .6vw'}}>
                No counter is open right now.
              </div>
            )}
            {rows.map(r=>(
              <div key={r.window_id}
                   className={'crow '+(litWin===r.window_id ? 'lit' : r.status==='serving' ? 'live' : '')}>
                <div style={{minWidth:0}}>
                  <div className="crow-w">{r.window_name}</div>
                  <div className="crow-s">{r.service_name || '—'}</div>
                </div>
                {r.number
                  ? <div className="crow-n" style={{color: litWin===r.window_id ? '#fff'
                                                         : r.status==='done' ? 'var(--faint2)'
                                                         : (r.service_color || 'var(--indigo)')}}>
                      {r.status==='serving' && <span className="pulse"/>}{r.number}
                    </div>
                  : <div className="crow-n idle">—</div>}
              </div>
            ))}
          </div>
        </div>
      </div>
      )}

      <div className="tv-foot">
        <span className="foot-k">RECENTLY CALLED</span>
        <div className="recent">
          {(data.recent||[]).length === 0
            ? <span style={{color:'var(--faint2)'}}>none yet</span>
            : data.recent.map((a,i)=>(
                <span key={i}><i>{a.number}</i> <span style={{opacity:.55}}>{a.window_name}</span></span>
              ))}
        </div>
        {data.waiting > 0 && (
          <span className="waitpill">{data.waiting} waiting</span>
        )}
      </div>
    </div>
  )
}

/* ════════════════════════════════════════════════════════════
   KIOSK
   ════════════════════════════════════════════════════════════ */
function Kiosk() {
  const [svcs,setSvcs]   = useState([])
  const [tk,setTk]       = useState(null)
  const [busy,setBusy]   = useState(false)
  const [note,setNote]   = useState('')
  const [now,setNow]     = useState(new Date())

  useEffect(()=>{
    sb.from('services').select('id,code,name,name_fil,color')
      .eq('is_active',true).eq('show_on_kiosk',true).order('sort_order')
      .then(({data})=>setSvcs(data||[]))
    sb.from('settings').select('kiosk_note').eq('id',1).maybeSingle()
      .then(({data})=>setNote(data?.kiosk_note||''))
    const t = setInterval(()=>setNow(new Date()),1000)
    return ()=>clearInterval(t)
  },[])

  const take = async svc => {
    if (busy) return
    setBusy(true)
    const {data,error} = await sb.rpc('issue_ticket',{ p_service_id: svc.id })
    setBusy(false)
    if (error) { alert('Could not get a number. Please ask a staff member.'); return }
    setTk({...data, service:svc})
    setTimeout(()=>setTk(null), 14000)
  }

  return (
    <div className="kio">
      <div className="kio-h">
        <div className="kio-mark">T</div>
        <h1 className="kio-t">Taytay Doctors Multispecialty Hospital</h1>
        <p className="kio-s">{dateLong(now)} · {clock(now)}</p>
      </div>

      <div className="kio-b">
        <div className="kio-ask">What do you need today?</div>
        <div className="svcs">
          {svcs.map(s=>(
            <button key={s.id} className="svc" onClick={()=>take(s)} disabled={busy}>
              <div className="svc-bar" style={{background:s.color}}/>
              <div className="svc-n">{s.name_fil || s.name}</div>
              <div className="svc-f">{s.name_fil ? s.name : s.code}</div>
            </button>
          ))}
          {svcs.length===0 && (
            <div style={{gridColumn:'1/-1',textAlign:'center',color:'var(--faint)',padding:40}}>
              No services are available right now.
            </div>
          )}
        </div>
      </div>

      {tk && (
        <div className="ticket" onClick={()=>setTk(null)}>
          <div className="ticket-c" onClick={e=>e.stopPropagation()}>
            <div style={{fontSize:12.5,fontWeight:700,color:'var(--muted)'}}>Taytay Doctors Multispecialty Hospital</div>
            <div className="ticket-n" style={{color:tk.service?.color||'var(--indigo)'}}>{tk.number}</div>
            <div style={{fontSize:16,fontWeight:700}}>{tk.service?.name_fil || tk.service?.name}</div>
            <div style={{marginTop:17,padding:'11px 14px',background:'var(--paper)',borderRadius:11,
                         fontSize:13,color:'var(--muted)'}}>{note}</div>
            <div style={{fontSize:12,color:'var(--faint)',marginTop:11}}>
              {new Date(tk.created_at||Date.now()).toLocaleString('en-PH',
                {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:true})}
            </div>
            <button className="btn b-pri b-lg b-full" style={{marginTop:17}} onClick={()=>setTk(null)}>
              Thank you
            </button>
          </div>
        </div>
      )}
    </div>
  )
}

/* ════════════════════════════════════════════════════════════
   COUNTER — the daily staff screen
   ════════════════════════════════════════════════════════════ */
function Counter({me}) {
  const toast = useToast()
  const [wins,setWins]   = useState([])
  const [win,setWin]     = useState(null)
  const [svcs,setSvcs]   = useState([])        // services this counter handles
  const [svcFilter,setSvcFilter] = useState('')
  const [waiting,setWaiting] = useState([])
  const [held,setHeld]   = useState([])      // queues this counter is holding
  const [done,setDone]   = useState([])
  const [tab,setTab]     = useState('ongoing')
  const [selId,setSelId] = useState(null)
  const [mine,setMine]   = useState(false)
  const [q,setQ]         = useState('')
  const [showSearch,setShowSearch] = useState(false)
  const [busy,setBusy]   = useState(false)
  const [move,setMove]   = useState(null)
  const [adding,setAdding] = useState(false)
  const [history,setHistory] = useState(false)
  const [menu,setMenu]   = useState(false)
  const [detail,setDetail] = useState(null)
  const [auto,setAuto]   = useState(()=>localStorage.getItem('tdmhq-auto')==='1')
  const [cfg,setCfg]     = useState({})
  const [ask,setAsk]     = useState(null)   // {kind, ticket} — remark / movement prompt
  const [, bump]         = useState(0)
  const chRef = useRef(null)
  const autoRef = useRef(auto)
  useEffect(()=>{ autoRef.current = auto; localStorage.setItem('tdmhq-auto', auto?'1':'0') },[auto])

  useEffect(()=>{
    sb.from('settings').select('*').eq('id',1).maybeSingle().then(({data})=>setCfg(data||{}))
  },[])

  useEffect(()=>{
    (async ()=>{
      let ids = null
      if (!['admin','manager'].includes(me.role)) {
        const {data} = await sb.from('window_staff').select('window_id').eq('user_id',me.id)
        ids = (data||[]).map(r=>r.window_id)
      }
      let qy = sb.from('windows').select('id,name,short_name').eq('is_active',true).order('sort_order')
      if (ids) qy = ids.length ? qy.in('id',ids) : qy.eq('id','00000000-0000-0000-0000-000000000000')
      const {data:w} = await qy
      setWins(w||[])
      const pick = (w||[]).find(x=>x.id===localStorage.getItem('tdmhq-window'))
      if (pick) setWin(pick)
    })()
  },[me.id])

  const load = useCallback(async wid=>{
    if (!wid) return
    const {data:ws} = await sb.from('window_services')
      .select('services!inner(id,code,name,color)').eq('window_id',wid)
    const list = (ws||[]).map(r=>r.services).filter(Boolean)
    setSvcs(list)
    const ids = list.map(s=>s.id)
    if (!ids.length) { setWaiting([]); setServing(null); setDone([]); return }
    const today = new Date().toISOString().slice(0,10)
    const cols = '*,services!tickets_service_id_fkey(code,name,color,allow_multi_serve)'
    const [w,s,dn] = await Promise.all([
      sb.from('tickets').select(cols).eq('ticket_date',today).in('service_id',ids)
        .in('status',['waiting','held']).order('sort_at'),
      sb.from('tickets').select(cols).eq('ticket_date',today).eq('window_id',wid)
        .eq('status','serving').order('called_at'),
      sb.from('tickets').select(cols).eq('ticket_date',today).eq('window_id',wid)
        .in('status',['done','skipped']).order('completed_at',{ascending:false}).limit(40),
    ])
    setWaiting(w.data||[]); setHeld(s.data||[]); setDone(dn.data||[])
  },[])

  useEffect(()=>{
    if (!win) return
    localStorage.setItem('tdmhq-window', win.id)
    load(win.id)
    sb.rpc('beat',{p_window_id:win.id})
    const beat  = setInterval(()=>sb.rpc('beat',{p_window_id:win.id}), 60000)
    const timer = setInterval(()=>bump(n=>n+1), 1000)
    chRef.current?.unsubscribe()
    const ch = sb.channel('counter-'+win.id)
      .on('postgres_changes',{event:'*',schema:'public',table:'tickets'},()=>load(win.id))
      .subscribe()
    chRef.current = ch
    return ()=>{ clearInterval(beat); clearInterval(timer); ch.unsubscribe() }
  },[win?.id, load])

  /* the list currently on screen */
  const pool = tab==='serving' ? held : waiting
  const rows = pool.filter(t=>{
    if (svcFilter && t.service_id !== svcFilter) return false
    if (mine && t.served_by !== me.id) return false
    const v = q.trim().toLowerCase()
    return !v || t.number.toLowerCase().includes(v)
      || (t.patient_name||'').toLowerCase().includes(v)
      || (t.tags||[]).some(g=>g.toLowerCase().includes(v))
  })

  /* keep a sensible selection: follow the serving ticket, else first in list */
  useEffect(()=>{
    setSelId(s => s && [...rows,...held].some(r=>r.id===s) ? s : (rows[0]?.id ?? held[0]?.id ?? null))
  },[tab, waiting.length, held.length, svcFilter])

  const sel = [...rows, ...held].find(r=>r.id===selId) || rows[0] || held[0] || null

  useEffect(()=>{
    if (!sel) { setDetail(null); return }
    sb.rpc('ticket_detail',{p_ticket_id:sel.id}).then(({data})=>setDetail(data||null))
  },[sel?.id, sel?.status, sel?.journey_step, sel?.recall_count, sel?.tags?.length])

  const isServing = sel && sel.status==='serving'
  // which held queues would be released if we called something single-serve now
  const wouldDrop = held.filter(h=>!h.services?.allow_multi_serve).map(h=>h.number)

  const next = async () => {
    if (!win || busy) return
    const dropped = held.filter(h=>!h.services?.allow_multi_serve).map(h=>h.number)
    setBusy(true)
    const {data,error} = await sb.rpc('call_next',{p_window_id:win.id})
    setBusy(false)
    if (error) return toast(error.message,'err')
    if (!data) return toast('No one is waiting.','info')
    setTab('serving')
    toast('Called '+data.number,'ok')
    if (dropped.length) toast(dropped.join(', ')+' went back to the end of the queue','info')
  }
  const serveThis = async t => {
    if (busy) return
    const dropped = held.filter(h=>h.id!==t.id && !h.services?.allow_multi_serve).map(h=>h.number)
    setBusy(true)
    const {error} = await sb.rpc('call_ticket',{p_ticket_id:t.id,p_window_id:win.id})
    setBusy(false)
    if (error) return toast(error.message,'err')
    setTab('serving')
    toast('Called '+t.number,'ok')
    if (dropped.length) toast(dropped.join(', ')+' went back to the end of the queue','info')
  }
  const needsRemark = what => ({
    done:    false,
    held:    cfg.remarks_on_hold,
    skipped: cfg.remarks_on_skip,
    return:  cfg.remarks_on_return,
    cancelled: cfg.remarks_on_remove,
  }[what])

  const act = async (what, detail) => {
    const target = sel && sel.status==='serving' ? sel : held[0]
    if (!target || busy) return
    // Complete may first ask where the patient goes next
    if (what==='done' && cfg.queue_movement && detail===undefined) {
      setAsk({kind:'movement', ticket:target}); return
    }
    if (needsRemark(what) && detail===undefined) {
      setAsk({kind:'remark', action:what, ticket:target}); return
    }
    setBusy(true)
    const {error} =
      what==='recall' ? await sb.rpc('recall_ticket',{p_ticket_id:target.id}) :
      what==='return' ? await sb.rpc('return_ticket',{p_ticket_id:target.id, p_detail:detail||null}) :
      await sb.rpc('set_ticket_status',{p_ticket_id:target.id, p_status:what, p_detail:detail||null})
    setBusy(false); setMenu(false); setAsk(null)
    if (error) return toast(error.message,'err')
    toast({recall:'Called again', done:'Completed', held:'On hold',
           skipped:'Skipped', return:'Returned to queue', cancelled:'Cancelled'}[what]
          + ' · ' + target.number,'ok')
    if (what!=='recall' && held.length<=1) {
      setTab('ongoing'); if (autoRef.current) setTimeout(next,700)
    }
  }

  useEffect(()=>{
    const onKey = e => {
      if (e.target.matches('input,textarea,select') || move || adding || history) return
      const k = e.key.toLowerCase()
      if (k===' ')      { e.preventDefault(); next() }
      else if (isServing && k==='r') act('recall')
      else if (isServing && k==='d') act('done')
      else if (isServing && k==='h' && cfg.enable_hold!==false) act('held')
      else if (isServing && k==='s' && cfg.enable_skip!==false) act('skipped')
    }
    window.addEventListener('keydown',onKey)
    return ()=>window.removeEventListener('keydown',onKey)
  })
  useEffect(()=>{ const c=()=>setMenu(false); window.addEventListener('click',c); return ()=>window.removeEventListener('click',c) },[])

  /* ── counter picker ── */
  if (!win) {
    const hour = new Date().getHours()
    return (
      <div className="mid" style={{padding:22}}>
        <div style={{width:'100%',maxWidth:430}}>
          <div style={{textAlign:'center',marginBottom:22}}>
            <h1 className="h1">{hour<12?'Good morning':hour<18?'Good afternoon':'Good evening'}, {(me.full_name||'').split(' ')[0]}</h1>
            <p className="sub">Which counter are you serving at today?</p>
          </div>
          <div className="card" style={{padding:6,maxHeight:380,overflowY:'auto'}}>
            {wins.length===0 && <div className="empty"><div className="empty-t">No counter assigned to you</div>
              <div>Ask an admin to assign you to one.</div></div>}
            {wins.map(w=>(
              <button key={w.id} className="b-out" onClick={()=>setWin(w)}
                style={{display:'flex',width:'100%',alignItems:'center',justifyContent:'space-between',
                        padding:'13px 15px',borderRadius:11,margin:4,border:'1.5px solid var(--line)'}}>
                <span style={{fontWeight:600}}>{w.name}</span><Ico n="right" s={16}/>
              </button>
            ))}
          </div>
        </div>
      </div>
    )
  }

  return (
    <div className="ws">
      {/* ════ left: the queue ════ */}
      <div className="ws-l">
        <div className="from">
          <span className="from-k">From</span>
          <select className="from-sel" value={svcFilter} onChange={e=>setSvcFilter(e.target.value)}>
            <option value="">All services ({svcs.length})</option>
            {svcs.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
        </div>

        <div className="utabs">
          <button className={'utab '+(tab==='serving'?'on':'')} onClick={()=>setTab('serving')}>
            Current Serving <span className="ucnt">{held.length}</span>
          </button>
          <button className={'utab '+(tab==='ongoing'?'on':'')} onClick={()=>setTab('ongoing')}>
            On-going Queue <span className="ucnt">{waiting.length}</span>
          </button>
        </div>

        <div className="tools">
          <div className="pillset">
            <button className={'pillb '+(mine?'on':'')} onClick={()=>setMine(true)}>
              <Ico n="users" s={12}/>Me</button>
            <button className={'pillb '+(!mine?'on':'')} onClick={()=>setMine(false)}>
              <Ico n="users" s={12}/>All</button>
          </div>
          <button className="toolb" onClick={()=>{setShowSearch(s=>!s); if(showSearch) setQ('')}}>
            <Ico n="search" s={13}/>Search</button>
        </div>
        {showSearch && (
          <div style={{padding:'0 12px 10px'}}>
            <input className="inp" autoFocus value={q} onChange={e=>setQ(e.target.value)}
                   style={{fontSize:13}} placeholder="Number, name or tag…"/>
          </div>
        )}

        <div className="ws-list">
          {rows.length===0 && (
            <div className="empty">
              <div className="empty-i"><Ico n="clock" s={20}/></div>
              <div className="empty-t">{tab==='ongoing'?'No one waiting':'Not serving anyone'}</div>
              <div style={{fontSize:13}}>{tab==='ongoing'
                ? 'New tickets appear here as they are taken.'
                : 'Pick a queue and press Serve Queue.'}</div>
            </div>
          )}
          {rows.map(t=>(
            <button key={t.id} className={'qc '+(sel?.id===t.id?'on':'')} onClick={()=>setSelId(t.id)}>
              <div className="qc-top">
                <span className="num qc-n">{t.number}</span>
                <span className="qc-svc">{t.services?.name}</span>
              </div>
              <div className="qc-mid">
                <span className="qc-lbl">Waiting Time</span>
                <span className="qc-ago">{ago(t.sort_at)}</span>
              </div>
              {(t.tags||[]).length>0 && (
                <div className="chips">{t.tags.map(g=><span key={g} className="chip">{g}</span>)}</div>
              )}
              {t.journey_step>1 && <span className="tag t-step" style={{marginTop:7}}>Step {t.journey_step}</span>}
            </button>
          ))}
        </div>

        <div className="ws-f">
          <button className="btn b-out b-lg b-full" onClick={()=>setAdding(true)}>
            <Ico n="plus" s={16}/>Add Queue</button>
        </div>
      </div>

      {/* ════ right: the ticket ════ */}
      <div className="ws-r">
        <div className="phead">
          <h2 className="phead-t">{win.name}</h2>
          <div style={{display:'flex',gap:8}}>
            <button className="btn b-out" onClick={()=>setHistory(true)}>
              <Ico n="clock" s={15}/>Queue History</button>
            <button className="btn b-out" onClick={()=>{setWin(null);sb.rpc('go_offline')}}>
              <Ico n="out" s={15}/>Leave Window</button>
          </div>
        </div>

        <div className="autobar">
          <div>
            <div className="autobar-t">Auto-serve ongoing queues</div>
            <div className="autobar-s">After completing a queue, automatically call the next one in the list.</div>
          </div>
          <button className={'sw '+(auto?'on':'')} onClick={()=>setAuto(a=>!a)}><i/></button>
        </div>

        {sel ? (
          <>
            <div className="detail">
              <div className="detail-mid">
                <div className="card tkcard">
                  <div className="tkcard-k">QUEUE NUMBER</div>
                  <div className="num tkcard-n" style={{color:sel.services?.color||'var(--indigo)'}}>
                    {sel.number}</div>
                  <div className="tkcard-rule"/>
                  <div className="fld">
                    <div className="fld-k">QUEUE ON</div>
                    <div className="fld-v" style={{color:sel.services?.color,fontWeight:700}}>
                      {sel.services?.name}
                      {sel.services?.allow_multi_serve && (
                        <span className="tag t-step" style={{marginLeft:8,fontWeight:600}}>
                          multiple serving</span>
                      )}</div>
                  </div>
                  {sel.patient_name && (
                    <><div className="tkcard-rule"/>
                    <div className="fld"><div className="fld-k">PATIENT</div>
                      <div className="fld-v">{sel.patient_name}</div></div></>
                  )}
                  <div className="tkcard-rule"/>
                  <div className="fld row">
                    <div className="fld-k">Date / Time Queued</div>
                    <div className="fld-v">{stamp(sel.created_at)}</div>
                  </div>
                  {sel.note && (
                    <><div className="tkcard-rule"/>
                    <div className="fld"><div className="fld-k">NOTE</div>
                      <div className="fld-v" style={{fontWeight:500,color:'var(--muted)'}}>{sel.note}</div></div></>
                  )}
                  <div className="tkcard-rule"/>
                  <TagEditor ticket={sel}
                    onSaved={()=>toast('Tags updated','ok')} onError={m=>toast(m,'err')}/>
                </div>
              </div>

              <div className="detail-side">
                <div className="card sidecard side-row">
                  <span className="side-k" style={{color:'var(--indigo)'}}>WAITING TIME</span>
                  <span style={{color:'var(--indigo)',fontWeight:700,fontSize:14}}>{ago(sel.sort_at)}</span>
                </div>

                {isServing && (
                  <div className="card sidecard side-row">
                    <span className="side-k" style={{color:'var(--green)'}}>SERVING TIME</span>
                    <span className="num" style={{fontSize:17,color:'var(--green)'}}>{mmss(sel.called_at)}</span>
                  </div>
                )}

                {detail && (detail.path||[]).length>1 && (
                  <div className="card sidecard">
                    <div className="side-k">PROCEDURES LIST</div>
                    <div style={{fontSize:13.5,fontWeight:700,marginTop:7}}>Patient journey</div>
                    <div style={{fontSize:11.5,color:'var(--muted)'}}>
                      Step-by-step · {detail.path.length} steps</div>
                    <div className="path">
                      {detail.path.map((p,i)=>{
                        const last = i===detail.path.length-1
                        return (
                          <div key={i} className="path-row">
                            <span className="path-dot" style={{background:last?'var(--indigo)':'var(--green)'}}/>
                            <div style={{flex:1,minWidth:0}}>
                              <div className="path-n">STEP {i+1}</div>
                              <div className="path-s" style={{color:p.service_color}}>{p.service_name}</div>
                            </div>
                            <span className="path-t" style={{color:last?'var(--indigo)':'var(--green)'}}>
                              {last?'Current':'Completed'}</span>
                          </div>
                        )
                      })}
                    </div>
                  </div>
                )}

                <div className="card sidecard" style={{flex:1,minHeight:0,display:'flex',flexDirection:'column'}}>
                  <div className="side-k">TIMELINE</div>
                  <div className="tl">
                    {(detail?.events||[]).length===0 &&
                      <div style={{fontSize:12.5,color:'var(--faint)'}}>Nothing logged yet.</div>}
                    {(detail?.events||[]).map((e,i)=>(
                      <div key={i} className="tl-row">
                        <span className="tl-dot"/>
                        <div style={{minWidth:0,flex:1}}>
                          <div className="tl-head">
                            <span className="tl-a">{(EVENT[e.action]||e.action).toUpperCase()}</span>
                            <span className="tl-when">{stamp(e.created_at)}</span>
                          </div>
                          <div className="tl-m">
                            {e.service_name && <>on <b>{e.service_name}</b> </>}
                            {e.window_name  && <>at <b>{e.window_name}</b> </>}
                            {e.actor_name   && <>by {e.actor_name}</>}
                          </div>
                          {e.detail && <div className="tl-d">{e.detail}</div>}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>

            <div className="actbar">
              {isServing ? (
                <>
                  <div style={{position:'relative'}} onClick={e=>e.stopPropagation()}>
                    <button className="btn b-out b-ico" onClick={()=>setMenu(m=>!m)}><Ico n="more" s={17}/></button>
                    {menu && (
                      <div className="dd">
                        <button className="dd-i" onClick={()=>act('recall')}>
                          <Ico n="bell" s={14}/>Call again<span className="kbd">R</span></button>
                        {cfg.enable_hold!==false && (
                          <button className="dd-i" onClick={()=>act('held')}>
                            <Ico n="pause" s={14}/>Put on hold<span className="kbd">H</span></button>)}
                        {cfg.enable_skip!==false && (
                          <button className="dd-i" onClick={()=>act('skipped')}>
                            <Ico n="skip" s={14}/>Skip<span className="kbd">S</span></button>)}
                        {cfg.enable_return!==false && (
                          <button className="dd-i" onClick={()=>act('return')}>
                            <Ico n="next" s={14}/>Return to on-going queue</button>)}
                        <div className="dd-sep"/>
                        <button className="dd-i" onClick={()=>{setMove({kind:'service'});setMenu(false)}}>
                          <Ico n="route" s={14}/>Send to another department</button>
                        <button className="dd-i" style={{color:'var(--red)'}} onClick={()=>act('cancelled')}>
                          <Ico n="x" s={14}/>Cancel queue</button>
                      </div>
                    )}
                  </div>
                  <div style={{flex:1}}/>
                  <button className="btn b-out b-lg" onClick={()=>act('recall')} disabled={busy}>
                    <Ico n="bell" s={16}/>Call Again</button>
                  <button className="btn b-go b-lg" onClick={()=>act('done')} disabled={busy}>
                    <Ico n="check" s={17}/>Complete<span className="kbd kbd-on">D</span></button>
                </>
              ) : (
                <>
                  <div style={{flex:1}}/>
                  {wouldDrop.length>0 && (
                    <span style={{fontSize:13,color:'var(--muted)',marginRight:4}}>
                      Holding <b className="num">{wouldDrop.join(', ')}</b> — calling this one
                      sends it back to the end of the queue.</span>
                  )}
                  {wouldDrop.length===0 && held.length>0 && (
                    <span style={{fontSize:13,color:'var(--muted)',marginRight:4}}>
                      Holding {held.length} queue{held.length>1?'s':''} — this service allows
                      serving several at once.</span>
                  )}
                  <button className="btn b-pri b-lg" onClick={()=>serveThis(sel)} disabled={busy}>
                    {busy ? <div className="spin"/> : <><Ico n="next" s={17}/>Serve Queue</>}
                  </button>
                </>
              )}
            </div>
          </>
        ) : (
          <div className="empty" style={{flex:1}}>
            <div className="empty-i" style={{width:58,height:58}}><Ico n="desk" s={25}/></div>
            <div className="empty-t" style={{fontSize:16}}>Nothing to show</div>
            <div>Pick a queue on the left, or press Next to call the first in line.</div>
            <button className="btn b-pri b-lg" style={{marginTop:14}} onClick={next} disabled={busy}>
              <Ico n="next" s={17}/>Call next in queue</button>
          </div>
        )}
      </div>

      {move && (move.ticket || sel) && (
        <MoveModal ticket={move.ticket || sel} kind={move.kind} windowId={win.id}
          onClose={()=>setMove(null)} onDone={m=>{ setMove(null); toast(m,'ok') }}/>
      )}
      {adding && (
        <AddQueue windowId={win.id} onClose={()=>setAdding(false)}
          onDone={n=>{ setAdding(false); toast('Queue added: '+n,'ok') }}/>
      )}
      {history && <History rows={done} onClose={()=>setHistory(false)}/>}
      {ask && (
        <AskModal ask={ask} cfg={cfg} windowId={win.id}
          onClose={()=>setAsk(null)}
          onRemark={d=>act(ask.action, d)}
          onFinish={d=>act('done', d||'')}
          onMove={()=>{ const t=ask.ticket; setAsk(null); setMove({kind:'service',ticket:t}) }}/>
      )}
    </div>
  )
}

/* ─── asks for a remark, or where the patient goes next ─── */
function AskModal({ask, cfg, onClose, onRemark, onFinish, onMove}) {
  const [text,setText] = useState('')
  const required = !!cfg.remarks_required
  const movement = ask.kind === 'movement'
  const LABEL = {
    held:'Why is this queue being held?',
    skipped:'Why is this queue being skipped?',
    return:'Why is this queue going back to the line?',
    cancelled:'Why is this queue being cancelled?',
  }
  const submit = e => {
    e.preventDefault()
    if (required && !text.trim()) return
    onRemark(text.trim())
  }
  return (
    <div className="ov" onClick={onClose}>
      <div className="md" style={{maxWidth:440}} onClick={e=>e.stopPropagation()}>
        <div className="md-h">
          <div>
            <div className="md-t">{movement ? 'Where does this patient go next?' : 'Add a remark'}</div>

            <div style={{display:'flex',flexDirection:'column',gap:9}}>
              <button className="btn b-pri b-lg b-full" onClick={onMove}>
                <Ico n="route" s={17}/>Send to another department</button>
              <button className="btn b-go b-lg b-full" onClick={()=>onFinish('')}>
                <Ico n="check" s={17}/>Finish the queue process</button>
            </div>
          </div>
        ) : (
          <form onSubmit={submit} className="md-b">
            <label className="lbl">
              {LABEL[ask.action] || 'Remark'}

            </label>
            <input className="inp" autoFocus value={text} onChange={e=>setText(e.target.value)}
                   placeholder="e.g. patient stepped out"/>
            {required && !text.trim() && (
              <div style={{fontSize:12.5,color:'var(--muted)',marginTop:7}}>

            <div className="md-f">
              <button type="button" className="btn b-out" style={{flex:1}} onClick={onClose}>Cancel</button>

    </div>

}

    <div className="ov" onClick={onClose}>

            <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',
                          color:'var(--faint)'}}><Ico n="search" s={13}/></span>
            <input className="inp" style={{paddingLeft:30}} value={q}
