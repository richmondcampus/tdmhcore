            )}
          </div>
        )}
      </div>
    </div>
  )
}

/* ════════════════════════════════════════════════════════════
   ADMIN — team
   ════════════════════════════════════════════════════════════ */
function Team({me}) {
  const toast = useToast()
  const [list,setList] = useState([])
  const [online,setOnline] = useState({})
  const [q,setQ] = useState('')

  const load = async () => {
    const [{data:p},{data:s}] = await Promise.all([
      sb.from('profiles').select('*').order('full_name'),
      sb.from('sessions').select('user_id,is_online,window_id,windows(name)'),
    ])
    setList(p||[])
    const m = {}; (s||[]).forEach(x=>{ m[x.user_id] = x })
    setOnline(m)
  }
  useEffect(()=>{ load() },[])

  const setRole = async (id,role) => {
    const {error} = await sb.from('profiles').update({role}).eq('id',id)
    if (error) return toast(error.message,'err')
    load(); toast('Na-update ang role','ok')
  }
  const toggleActive = async p => {
    const {error} = await sb.from('profiles').update({is_active:!p.is_active}).eq('id',p.id)
    if (error) return toast(error.message,'err')
    load()
  }

  const shown = list.filter(p=>!q.trim() || (p.full_name||'').toLowerCase().includes(q.toLowerCase()))

  return (
    <>
      <div className="head"><h1 className="h1">Team</h1>
        <p className="sub">{list.length} account · bagong account ay ginagawa sa Supabase Auth, tapos i-set ang role dito</p></div>
      <div className="wrap">
        <div style={{position:'relative',maxWidth:300,marginBottom:13}}>
          <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'var(--faint)'}}>
            <Ico n="search" s={14}/></span>
          <input className="inp" style={{paddingLeft:31}} value={q} onChange={e=>setQ(e.target.value)}
                 placeholder="Hanapin ang staff…"/>
        </div>
        <div className="card" style={{overflow:'hidden'}}>
          <table className="tb">
            <thead><tr><th>Pangalan</th><th>Role</th><th>Kalagayan</th><th>Counter ngayon</th><th></th></tr></thead>
            <tbody>
              {shown.map(p=>{
                const s = online[p.id]
                return (
                  <tr key={p.id}>
                    <td><span style={{display:'inline-flex',alignItems:'center',gap:9}}>
                      <span className="pip" style={{width:29,height:29,fontSize:10.5}}>{initials(p.full_name)}</span>
                      <b>{p.full_name||'—'}</b>{p.id===me.id && <span style={{color:'var(--faint)',fontSize:12}}>(ikaw)</span>}
                    </span></td>
                    <td>
                      <select className="inp" style={{padding:'4px 9px',fontSize:12.5,width:'auto'}}
                        value={p.role} disabled={p.id===me.id}
                        onChange={e=>setRole(p.id,e.target.value)}>
                        <option value="staff">Staff</option>
                        <option value="manager">Manager</option>
                        <option value="admin">Admin</option>
                      </select>
                    </td>
                    <td>{p.is_active ? <span className="tag t-serv">Aktibo</span> : <span className="tag t-skip">Hindi aktibo</span>}</td>
                    <td style={{color:'var(--muted)',fontSize:13}}>
                      {s?.is_online
                        ? <span style={{display:'inline-flex',alignItems:'center',gap:6}}>
                            <span className="dot" style={{width:6,height:6}}/>{s.windows?.name||'naka-online'}</span>
                        : <span style={{color:'var(--faint)'}}>offline</span>}
                    </td>
                    <td style={{textAlign:'right'}}>
                      {p.id!==me.id && (
                        <button className="btn b-out b-sm" onClick={()=>toggleActive(p)}>
                          {p.is_active?'I-off':'I-on'}</button>
                      )}
                    </td>
                  </tr>
                )
              })}
            </tbody>
          </table>
        </div>
      </div>
    </>
  )
}

/* ════════════════════════════════════════════════════════════
   ADMIN — settings
   ════════════════════════════════════════════════════════════ */
function Settings() {
  const toast = useToast()
  const [s,setS] = useState(null)
  const [d,setD] = useState({})
  useEffect(()=>{ sb.from('settings').select('*').eq('id',1).maybeSingle().then(({data})=>setS(data)) },[])
  const v = k => d[k]!==undefined ? d[k] : s?.[k]
  const set = (k,val) => setD(x=>({...x,[k]:val}))
  const dirty = Object.keys(d).length>0

  const save = async () => {
    const {error} = await sb.from('settings').update({
      hospital_name:v('hospital_name'), short_name:v('short_name'),
      voice_enabled:v('voice_enabled'), announce_repeat:Number(v('announce_repeat'))||1,
      priority_ratio:Number(v('priority_ratio'))||3,
      keep_on_tv_secs:Number(v('keep_on_tv_secs'))||45,
      kiosk_note:v('kiosk_note'),
    }).eq('id',1)
    if (error) return toast(error.message,'err')
    const {data} = await sb.from('settings').select('*').eq('id',1).maybeSingle()
    setS(data); setD({}); toast('Na-save','ok')
  }
  if (!s) return <div className="mid"><div className="spin d"/></div>

  return (
    <>
      <div className="head"><h1 className="h1">Mga setting</h1>
        <p className="sub">Nag-aaply sa lahat ng kiosk, TV at counter.</p></div>
      <div className="wrap" style={{maxWidth:640}}>
        <div className="card" style={{padding:17,marginBottom:13}}>
          <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:12}}>
            <div><label className="lbl">Pangalan ng ospital</label>
              <input className="inp" value={v('hospital_name')||''} onChange={e=>set('hospital_name',e.target.value)}/></div>
            <div><label className="lbl">Maikli</label>
              <input className="inp" value={v('short_name')||''} onChange={e=>set('short_name',e.target.value)}/></div>
          </div>
          <div style={{marginTop:13}}>
            <label className="lbl">Paalala sa ticket ng kiosk</label>
            <input className="inp" value={v('kiosk_note')||''} onChange={e=>set('kiosk_note',e.target.value)}/>
          </div>
        </div>

        <div className="card" style={{marginBottom:13}}>
          <div className="card-h"><span className="card-t">Tawag sa TV</span></div>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:14,padding:'13px 17px'}}>
            <div><div style={{fontWeight:600,fontSize:13.5}}>Boses sa TV</div>
              <div style={{fontSize:12.5,color:'var(--muted)'}}>Binabasa ang numero at counter.</div></div>
            <button className={'sw '+(v('voice_enabled')?'on':'')}
              onClick={()=>set('voice_enabled',!v('voice_enabled'))}><i/></button>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,padding:'0 17px 15px'}}>
            <div><label className="lbl">Ilang ulit babasahin</label>
              <input className="inp" type="number" min="1" max="4" value={v('announce_repeat')}
                onChange={e=>set('announce_repeat',e.target.value)}/></div>
            <div><label className="lbl">Gaano katagal mananatili (segundo)</label>
              <input className="inp" type="number" min="5" max="300" value={v('keep_on_tv_secs')}
                onChange={e=>set('keep_on_tv_secs',e.target.value)}/>
              <div style={{fontSize:11.5,color:'var(--faint)',marginTop:4}}>
                Pagkatapos i-tapos, ganito katagal pa makikita sa TV.</div></div>
          </div>
        </div>

        <div className="card" style={{padding:17}}>
          <label className="lbl">Priority bawat regular</label>
          <input className="inp" type="number" min="1" max="10" style={{maxWidth:120}}
            value={v('priority_ratio')} onChange={e=>set('priority_ratio',e.target.value)}/>
          <div style={{fontSize:12.5,color:'var(--muted)',marginTop:7,lineHeight:1.55}}>
            Mauuna ang senior, PWD at buntis. Pero pagkatapos ng <b>{v('priority_ratio')}</b> sunod-sunod
            na priority, isisingit ang isang regular para umusad din ang karaniwang pila.
          </div>
        </div>

        {dirty && (
          <div style={{display:'flex',gap:8,marginTop:13}}>
            <button className="btn b-out" style={{flex:1}} onClick={()=>setD({})}>Kanselahin</button>
            <button className="btn b-pri" style={{flex:1}} onClick={save}><Ico n="check" s={15}/>I-save</button>
          </div>
        )}
      </div>
    </>
  )
}

/* ════════════════════════════════════════════════════════════
   REPORTS
   ════════════════════════════════════════════════════════════ */
function Reports() {
  const iso = d => d.toISOString().slice(0,10)
  const [from,setFrom] = useState(iso(new Date(Date.now()-6*864e5)))
  const [to,setTo]     = useState(iso(new Date()))
  const [kind,setKind] = useState('summary')
  const [rows,setRows] = useState(null)
  const [busy,setBusy] = useState(false)

  const run = async () => {
    setBusy(true); setRows(null)
    const {data} = await sb.from('tickets')
      .select('number,status,priority_type,journey_step,sort_at,called_at,completed_at,patient_name,services(name),windows(name)')
      .gte('ticket_date',from).lte('ticket_date',to).order('sort_at',{ascending:false}).limit(3000)
    const t = data||[]
    if (kind==='log') {
      setRows(t.map(x=>({
        Numero:x.number, Serbisyo:x.services?.name||'—', Counter:x.windows?.name||'—',
        Kalagayan:STATUS[x.status]?.[0]||x.status, Priority:PRI[x.priority_type]||'—',
        Hakbang:x.journey_step, Dumating:hhmm(x.sort_at), Tinawag:hhmm(x.called_at), Tapos:hhmm(x.completed_at),
      })))
    } else {
      const m = {}
      t.forEach(x=>{
        const n = x.services?.name||'—'
        m[n] = m[n] || {Serbisyo:n, Lahat:0, Natapos:0, Nilaktawan:0, _w:[], _s:[]}
        m[n].Lahat++
        if (x.status==='done') m[n].Natapos++
        if (x.status==='skipped') m[n].Nilaktawan++
        if (x.called_at) m[n]._w.push(new Date(x.called_at)-new Date(x.sort_at))
        if (x.completed_at&&x.called_at) m[n]._s.push(new Date(x.completed_at)-new Date(x.called_at))
      })
      const avg = a => a.length ? Math.round(a.reduce((s,v)=>s+v,0)/a.length/60000)+' min' : '—'
      setRows(Object.values(m).map(r=>({
        Serbisyo:r.Serbisyo, Lahat:r.Lahat, Natapos:r.Natapos, Nilaktawan:r.Nilaktawan,
        'Katamtamang hintay':avg(r._w), 'Katamtamang serbisyo':avg(r._s),
      })).sort((a,b)=>b.Lahat-a.Lahat))
    }
    setBusy(false)
  }

  const csv = () => {
    if (!rows?.length) return
    const h = Object.keys(rows[0])
    const body = [h.join(','), ...rows.map(r=>h.map(k=>`"${String(r[k]??'').replace(/"/g,'""')}"`).join(','))].join('\n')
    const a = document.createElement('a')
    a.href = URL.createObjectURL(new Blob([body],{type:'text/csv;charset=utf-8'}))
    a.download = `tdmh-queue-${kind}-${from}-${to}.csv`; a.click()
  }

  return (
    <>
      <div className="head"><h1 className="h1">Mga ulat</h1>
        <p className="sub">Pumili ng petsa, tapos i-export kung kailangan.</p></div>
      <div className="wrap">
        <div className="card" style={{padding:15,display:'flex',gap:11,flexWrap:'wrap',alignItems:'flex-end'}}>
          <div><label className="lbl">Uri</label>
            <select className="inp" style={{width:190}} value={kind} onChange={e=>setKind(e.target.value)}>
              <option value="summary">Buod bawat serbisyo</option>
              <option value="log">Listahan ng ticket</option>
            </select></div>
          <div><label className="lbl">Mula</label>
            <input className="inp" type="date" style={{width:160}} value={from} onChange={e=>setFrom(e.target.value)}/></div>
          <div><label className="lbl">Hanggang</label>
            <input className="inp" type="date" style={{width:160}} value={to} onChange={e=>setTo(e.target.value)}/></div>
          <button className="btn b-pri" onClick={run} disabled={busy}>
            {busy?<div className="spin"/>:<><Ico n="chart" s={15}/>Buuin</>}</button>
          {rows?.length>0 && <button className="btn b-out" onClick={csv}><Ico n="dl" s={15}/>CSV</button>}
        </div>

        {rows && (
          <div className="card" style={{marginTop:13,overflow:'hidden'}}>
            <div className="card-h"><span className="card-t">{rows.length} tala</span></div>
            <div style={{overflowX:'auto',maxHeight:470,overflowY:'auto'}}>
              {rows.length===0
                ? <div className="empty" style={{padding:36}}><div className="empty-t">Walang nakita</div>
                    <div>Subukan ang ibang petsa.</div></div>
                : <table className="tb">
                    <thead><tr>{Object.keys(rows[0]).map(h=><th key={h}>{h}</th>)}</tr></thead>
                    <tbody>{rows.map((r,i)=>(
                      <tr key={i}>{Object.entries(r).map(([k,val])=>
                        <td key={k} className={k==='Numero'?'num':''}>{String(val??'—')}</td>)}</tr>
                    ))}</tbody>
                  </table>}
            </div>
          </div>
        )}
      </div>
    </>
  )
}

/* ════════════════════════════════════════════════════════════
   APP SHELL
   ════════════════════════════════════════════════════════════ */
function Shell() {
  const auth = useAuth()
  const [page,setPage] = useState('counter')
  const [open,setOpen] = useState(true)

  if (auth.loading) return <div className="mid"><div className="spin d" style={{width:30,height:30,borderWidth:3}}/></div>
  if (!auth.user)   return <SignIn onSignIn={auth.signIn}/>
  if (!auth.me)     return <div className="mid"><div className="spin d" style={{width:30,height:30,borderWidth:3}}/></div>

  const me = auth.me
  const nav = (id,label,icon) => (
    <button className={'nav '+(page===id?'on':'')} onClick={()=>setPage(id)}>
      <Ico n={icon}/><span>{label}</span></button>
  )

  const body = {
    counter:  <Counter me={me}/>,
    board:    <Board me={me}/>,
    services: <Services/>,
    windows:  <Windows/>,
    displays: <Displays/>,
    team:     <Team me={me}/>,
    settings: <Settings/>,
    reports:  <Reports/>,
  }[page] || <Counter me={me}/>

  return (
    <div className="app">
      <div className="rail">
        <div className="rail-top">
          <div className="mark">T</div>
          <div style={{minWidth:0}}>
            <div className="rail-name">TDMH Queuing</div>
            <div className="rail-sub">Taytay, Rizal</div>
          </div>
        </div>
        <nav className="rail-nav">
          {nav('counter','Counter','desk')}
          {auth.isManager && nav('board','Live board','board')}
          {auth.isManager && nav('reports','Mga ulat','chart')}

          {auth.isManager && <>
            <button className="nav" onClick={()=>setOpen(o=>!o)}
              style={{justifyContent:'space-between',color:'#50537a',fontSize:11,fontWeight:700,
                      padding:'13px 11px 5px'}}>
              <span>SETUP</span><Ico n={open?'down':'right'} s={12}/>
            </button>
            {open && <>
              {nav('services','Mga serbisyo','board')}
              {nav('windows','Mga counter','desk')}
              {nav('displays','Mga TV','tv')}
              {nav('team','Team','users')}
              {nav('settings','Mga setting','cog')}
            </>}
          </>}

          <div className="nav-head">BUKSAN</div>
          <button className="nav" onClick={()=>window.open('?tv=main','_blank')}>
            <Ico n="tv"/><span>TV display</span></button>
          <button className="nav" onClick={()=>window.open('?kiosk=1','_blank')}>
            <Ico n="kiosk"/><span>Kiosk</span></button>
        </nav>
        <div className="rail-foot">
          <div className="who">
            <div className="pip">{initials(me.full_name)}</div>
            <div style={{flex:1,minWidth:0}}>
              <div className="who-n">{me.full_name}</div>
              <div className="who-r">{me.role}</div>
            </div>
            <button className="btn b-ghost b-ico" onClick={auth.signOut} title="Mag-sign out"
              style={{color:'#7b7ea8'}}><Ico n="out" s={15}/></button>
          </div>
        </div>
      </div>
      <div className="main">{body}</div>
    </div>
  )
}

/* ─── route by query string ─── */
function Root() {
  const p = new URLSearchParams(location.search)
  const tv = p.get('tv')
  if (tv !== null) return <TV slug={tv || 'main'}/>
  if (p.get('kiosk') === '1') return <Kiosk/>
  return <Shell/>
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <Toasts><Root/></Toasts>
)
