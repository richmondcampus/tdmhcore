   ADMIN — service procedures
   ════════════════════════════════════════════════════════════ */
function Procedures() {
  const toast = useToast()
  const [list,setList] = useState([])
  const [svcs,setSvcs] = useState([])
  const [edit,setEdit] = useState(null)      // null | {} for new | row for edit
  const [loading,setLoading] = useState(true)

  const load = async () => {
    const [{data:p},{data:s}] = await Promise.all([
      sb.from('procedures')
        .select('*,procedure_steps(id,step_order,is_optional,services!inner(id,code,name,color)),'
              + 'procedure_origins(service_id,services!inner(id,code,name))')
        .order('sort_order'),
      sb.from('services').select('id,code,name,color').eq('is_active',true).order('name'),
    ])
    setList(p||[]); setSvcs(s||[]); setLoading(false)
  }
  useEffect(()=>{ load() },[])

  const toggleActive = async p => {
    const {error} = await sb.from('procedures').update({is_active:!p.is_active}).eq('id',p.id)
    if (error) return toast(error.message,'err')
    load()
  }
  const remove = async p => {
    if (!confirm(`Delete "${p.name}"? Tickets already on this route keep their history.`)) return
    const {error} = await sb.from('procedures').delete().eq('id',p.id)
    if (error) return toast('Cannot delete — a ticket still references it.','err')
    load(); toast('Deleted','ok')
  }

  if (loading) return <div className="mid"><div className="spin d"/></div>

  return (
    <>
      <div className="head">
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:16}}>
          <div>
            <h1 className="h1">Service Procedures</h1>
            <p className="sub">List of all available procedures</p>
          </div>
          <button className="btn b-pri" onClick={()=>setEdit({})}>
            <Ico n="plus" s={16}/>New Procedure</button>
        </div>
      </div>

      <div className="wrap">
        {list.length===0 && (
          <div className="card empty" style={{padding:50}}>
            <div className="empty-i"><Ico n="route" s={22}/></div>
            <div className="empty-t">No procedures yet</div>
            <div style={{fontSize:13.5,maxWidth:420}}>
              A procedure is a named route through the hospital. Set it once and staff no longer
              have to remember where a patient goes next.
            </div>
            <button className="btn b-pri" style={{marginTop:16}} onClick={()=>setEdit({})}>
              <Ico n="plus" s={16}/>New Procedure</button>
          </div>
        )}

        {list.map(p=>{
          const steps = (p.procedure_steps||[]).slice().sort((a,b)=>a.step_order-b.step_order)
          const origins = p.procedure_origins||[]
          return (
            <div key={p.id} className="card proc" style={{opacity:p.is_active?1:.62}}>
              <div className="proc-main">
                <div className="proc-name">{p.name}</div>
                {p.description && <div className="proc-desc">{p.description}</div>}

                <div className="flow">
                  {steps.length===0 && (
                    <div style={{fontSize:13,color:'var(--faint)',padding:'10px 0'}}>
                      No steps yet — open Edit details to build the route.
                    </div>
                  )}
                  {steps.map((st,i)=>(
                    <div key={st.id} className="flow-item">
                      <div className="flow-head">
                        <span className="flow-dot">{st.step_order}</span>
                        {i < steps.length-1 && <span className="flow-line"/>}
                      </div>
                      <div className="flow-k">
                        Step {st.step_order}{st.is_optional && ' (optional)'}
                      </div>
                      <div className="flow-s" style={{color:st.services?.color}}>
                        {st.services?.name}</div>
                    </div>
                  ))}
                </div>

                <div style={{marginTop:18}}>
                  <div className="side-k">ORIGIN</div>
                  <div className="chips" style={{marginTop:7}}>
                    {origins.length===0
                      ? <span style={{fontSize:12.5,color:'var(--faint)'}}>
                          No origin set — this route cannot be handed out yet.</span>
                      : origins.map(o=>(
                          <span key={o.service_id} className="chip chip-dark">
                            {o.services?.name}</span>))}
                  </div>
                </div>
              </div>

              <div className="proc-side">
                <dl className="kv" style={{gridTemplateColumns:'1fr auto'}}>
                  <dt>Type</dt>
                  <dd>{p.type==='flexible' ? 'Flexible' : 'Step-by-Step'}</dd>
                  <dt>Total Steps</dt>
                  <dd>{steps.length} Step{steps.length===1?'':'s'}</dd>
                  <dt>Assign procedure on complete?</dt>
                  <dd>{p.assign_on_complete ? 'Yes' : 'No'}</dd>
                </dl>
                <div className="proc-act">
                  <span style={{display:'flex',alignItems:'center',gap:8,fontSize:13.5,fontWeight:600}}>
                    <Ico n="bell" s={14}/>Activate Procedure</span>
                  <button className={'sw '+(p.is_active?'on':'')} onClick={()=>toggleActive(p)}><i/></button>
                </div>
                <button className="btn b-out b-full" onClick={()=>setEdit(p)}>
                  <Ico n="edit" s={15}/>Edit Details</button>
                <button className="btn b-ghost b-full b-sm" style={{color:'var(--red)'}}
                        onClick={()=>remove(p)}>Delete procedure</button>
              </div>
            </div>
          )
        })}
      </div>

      {edit && <ProcedureModal row={edit} svcs={svcs}
        onClose={()=>setEdit(null)}
        onSaved={msg=>{ setEdit(null); load(); toast(msg,'ok') }}/>}
    </>
  )
}

/* ─── create / edit one procedure ─── */
function ProcedureModal({row, svcs, onClose, onSaved}) {
  const isNew = !row.id
  const [name,setName]   = useState(row.name || '')
  const [type,setType]   = useState(row.type || '')
  const [desc,setDesc]   = useState(row.description || '')
  const [assign,setAssign] = useState(!!row.assign_on_complete)
  const [origins,setOrigins] = useState(
    (row.procedure_origins||[]).map(o=>o.service_id))
  const [steps,setSteps] = useState(
    (row.procedure_steps||[]).slice().sort((a,b)=>a.step_order-b.step_order)
      .map(s=>({service_id:s.services?.id, is_optional:s.is_optional})))
  const [busy,setBusy]   = useState(false)
  const [err,setErr]     = useState('')

  const toggleOrigin = id =>
    setOrigins(o => o.includes(id) ? o.filter(x=>x!==id) : [...o,id])
  const addStep    = () => setSteps(s=>[...s,{service_id:'',is_optional:false}])
  const setStep    = (i,patch) => setSteps(s=>s.map((x,j)=>j===i?{...x,...patch}:x))
  const dropStep   = i => setSteps(s=>s.filter((_,j)=>j!==i))
  const moveStep   = (i,by) => setSteps(s=>{
    const j=i+by; if (j<0||j>=s.length) return s
    const c=[...s]; [c[i],c[j]]=[c[j],c[i]]; return c
  })

  const save = async e => {
    e.preventDefault(); setErr('')
    if (!name.trim())       return setErr('Give the procedure a name.')
    if (!type)              return setErr('Choose a procedure type.')
    if (!origins.length)    return setErr('Pick at least one origin, or the route can never be handed out.')
    if (!steps.length)      return setErr('Add at least one step.')
    if (steps.some(s=>!s.service_id)) return setErr('Every step needs a service.')
    const seen = new Set()
    for (const s of steps) {
      if (seen.has(s.service_id)) return setErr('The same service appears twice in the route.')
      seen.add(s.service_id)
    }
    setBusy(true)
    try {
      let id = row.id
      const payload = {name:name.trim(), type, description:desc.trim()||null,
                       assign_on_complete:assign}
      if (isNew) {
        const {data,error} = await sb.from('procedures').insert(payload).select().single()
        if (error) throw error
        id = data.id
      } else {
        const {error} = await sb.from('procedures').update(payload).eq('id',id)
        if (error) throw error
        await sb.from('procedure_steps').delete().eq('procedure_id',id)
        await sb.from('procedure_origins').delete().eq('procedure_id',id)
      }
      const {error:se} = await sb.from('procedure_steps').insert(
        steps.map((s,i)=>({procedure_id:id, service_id:s.service_id,
                           step_order:i+1, is_optional:!!s.is_optional})))
      if (se) throw se
      const {error:oe} = await sb.from('procedure_origins').insert(
        origins.map(sid=>({procedure_id:id, service_id:sid})))
      if (oe) throw oe
      onSaved(isNew ? 'Procedure created' : 'Procedure saved')
    } catch(e) { setErr(e.message); setBusy(false) }
  }

  const svcName = id => svcs.find(s=>s.id===id)?.name || '—'

  return (
    <div className="ov" onClick={onClose}>
      <div className="md" style={{maxWidth:620}} onClick={e=>e.stopPropagation()}>
        <div className="md-h">
          <div>
            <div className="md-t">{isNew ? 'New Procedure' : 'Edit Procedure'}</div>
            <div className="md-s">Enter the service procedure details. All fields are required.</div>
          </div>
          <button className="btn b-ghost b-ico" onClick={onClose}><Ico n="x" s={17}/></button>
        </div>

        <form onSubmit={save} className="md-b">
          <div style={{display:'flex',flexDirection:'column',gap:16}}>
            <div>
              <label className="lbl">Template name</label>
              <input className="inp" autoFocus value={name} onChange={e=>setName(e.target.value)}
                     placeholder="e.g. HMO OB Ultrasound"/>
            </div>

            <div>
              <label className="lbl">Procedure type</label>
              <select className="inp" value={type} onChange={e=>setType(e.target.value)}>
                <option value="">Please select type</option>
                <option value="step_by_step">Step-by-Step</option>
                <option value="flexible">Flexible</option>
              </select>
              <div style={{fontSize:12.5,color:'var(--muted)',marginTop:6,lineHeight:1.5}}>
                {type==='flexible'
                  ? 'Staff may take the steps in any order — useful when a department can see the patient whenever it is free.'
                  : type==='step_by_step'
                  ? 'The patient follows the steps in order, and the counter always suggests the next one.'
                  : 'Step-by-Step follows the order you set. Flexible lets staff pick any remaining step.'}
              </div>
            </div>

            <div>
              <label className="lbl">Select origin</label>
              <div style={{fontSize:12.5,color:'var(--muted)',marginBottom:8,lineHeight:1.5}}>
                Where this route can be handed out. A patient queued at any of these services
                can be put on it — the origin itself does not have to be part of the route.
              </div>
              <div className="picker">
                {svcs.map(s=>(
                  <label key={s.id} className={'pick '+(origins.includes(s.id)?'on':'')}>
                    <input type="checkbox" checked={origins.includes(s.id)}
                           onChange={()=>toggleOrigin(s.id)}
                           style={{accentColor:'var(--indigo)'}}/>
                    <span style={{width:8,height:8,borderRadius:'50%',background:s.color,flexShrink:0}}/>
                    {s.name}
                  </label>
                ))}
              </div>
            </div>

            <div>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
                <label className="lbl" style={{marginBottom:0}}>Route</label>
                <button type="button" className="btn b-out b-sm" onClick={addStep}>
                  <Ico n="plus" s={13}/>Add step</button>
              </div>
              {steps.length===0 && (
                <div style={{fontSize:13,color:'var(--faint)',padding:'12px 14px',
                             border:'1px dashed var(--line)',borderRadius:10}}>
                  No steps yet. Add the departments the patient goes through, in order.
                </div>
              )}
              <div style={{display:'flex',flexDirection:'column',gap:7}}>
                {steps.map((st,i)=>(
                  <div key={i} className="steprow">
                    <span className="flow-dot" style={{flexShrink:0}}>{i+1}</span>
                    <select className="inp" style={{flex:1}} value={st.service_id}
                            onChange={e=>setStep(i,{service_id:e.target.value})}>
                      <option value="">Choose a service</option>
                      {svcs.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
                    </select>
                    <label style={{display:'flex',alignItems:'center',gap:6,fontSize:12.5,
                                   color:'var(--muted)',whiteSpace:'nowrap'}}>
                      <input type="checkbox" checked={!!st.is_optional}
                             onChange={e=>setStep(i,{is_optional:e.target.checked})}
                             style={{accentColor:'var(--indigo)'}}/>
                      Optional
                    </label>
                    <button type="button" className="btn b-ghost b-ico b-sm" title="Move up"
                            onClick={()=>moveStep(i,-1)} disabled={i===0}>↑</button>
                    <button type="button" className="btn b-ghost b-ico b-sm" title="Move down"
                            onClick={()=>moveStep(i,1)} disabled={i===steps.length-1}>↓</button>
                    <button type="button" className="btn b-ghost b-ico b-sm" style={{color:'var(--red)'}}
                            onClick={()=>dropStep(i)}><Ico n="x" s={14}/></button>
                  </div>
                ))}
              </div>
              {steps.length>0 && (
                <div style={{fontSize:12.5,color:'var(--muted)',marginTop:9}}>
                  {steps.map((s,i)=>(
                    <span key={i}>{i>0 && ' → '}{svcName(s.service_id)}</span>
                  ))}
                </div>
              )}
            </div>

            <div>
              <label className="lbl">Description (optional)</label>
              <textarea className="inp" rows={2} value={desc} onChange={e=>setDesc(e.target.value)}
                        placeholder="Enter description"/>
            </div>

            <div className="srow" style={{padding:'13px 0',borderBottom:'none'}}>
              <div>
                <div className="srow-t">Assign procedure on complete</div>
                <div className="srow-s">
                  Ask staff whether to put the patient on this route when they finish a queue
                  at one of the origins above.</div>
              </div>
              <button type="button" className={'sw '+(assign?'on':'')}
                      onClick={()=>setAssign(a=>!a)}><i/></button>
            </div>

            {err && <div style={{background:'var(--red-wash)',border:'1px solid #f0c9c7',
              color:'#8f2e2a',padding:'10px 13px',borderRadius:9,fontSize:13}}>{err}</div>}
          </div>

          <div className="md-f">
            <button type="button" className="btn b-out" style={{flex:1}} onClick={onClose}>Cancel</button>
            <button className="btn b-pri" style={{flex:1}} disabled={busy}>
              {busy ? <div className="spin"/> : (isNew ? 'Proceed' : 'Save changes')}
            </button>
          </div>
        </form>
      </div>
    </div>
  )
}

/* ════════════════════════════════════════════════════════════
   ADMIN — service categories
   ════════════════════════════════════════════════════════════ */
function Categories() {
  const toast = useToast()
  const [cats,setCats] = useState([])
  const [svcs,setSvcs] = useState([])
  const [sel,setSel]   = useState(null)
  const [draft,setDraft] = useState({})
  const [adding,setAdding] = useState(false)
  const [nw,setNw] = useState('')

  const load = async keep => {
    const [{data:c},{data:s}] = await Promise.all([
      sb.from('service_categories').select('*').order('sort_order'),
      sb.from('services').select('id,code,name,color,category_id').eq('is_active',true).order('sort_order'),
    ])
    setCats(c||[]); setSvcs(s||[])
    const pick = keep ? (c||[]).find(x=>x.id===keep) : (sel ? (c||[]).find(x=>x.id===sel.id) : c?.[0])
    setSel(pick||null)
  }
  useEffect(()=>{ load() },[])
  useEffect(()=>{ setDraft({}) },[sel?.id])

  const v = k => draft[k]!==undefined ? draft[k] : sel?.[k]
  const set = (k,val) => setDraft(d=>({...d,[k]:val}))
  const dirty = Object.keys(draft).length>0
  const mine = svcs.filter(s=>s.category_id===sel?.id)

  const save = async () => {
    const {error} = await sb.from('service_categories').update({
      name:v('name'), name_fil:v('name_fil'), color:v('color'), is_active:v('is_active'),
    }).eq('id',sel.id)
    if (error) return toast(error.message,'err')
    setDraft({}); await load(sel.id); toast('Saved','ok')
  }
  const add = async e => {
    e.preventDefault()
    if (!nw.trim()) return
    const {data,error} = await sb.from('service_categories')
      .insert({name:nw.trim(), sort_order:(cats.length+1)*10}).select().single()
    if (error) return toast(error.message,'err')
    setNw(''); setAdding(false); await load(data.id); toast('Added','ok')
  }
  const assign = async (serviceId, on) => {
    const {error} = await sb.from('services')
      .update({category_id: on ? sel.id : null}).eq('id',serviceId)
    if (error) return toast(error.message,'err')
    load(sel.id)
  }

  return (
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      <div style={{width:278,flexShrink:0,background:'var(--card)',borderRight:'1px solid var(--line)',
                   display:'flex',flexDirection:'column'}}>
        <div style={{padding:'15px 16px',borderBottom:'1px solid var(--line-2)'}}>
          <div style={{fontWeight:800,fontSize:14.5}}>Service Categories</div>
          <div style={{fontSize:12,color:'var(--muted)'}}>{cats.length} total</div>
        </div>
        <div style={{flex:1,overflowY:'auto',padding:5}}>
          {cats.map(c=>{
            const n = svcs.filter(s=>s.category_id===c.id).length
            return (
              <button key={c.id} onClick={()=>setSel(c)}
                style={{display:'flex',alignItems:'center',gap:9,width:'100%',padding:'10px 11px',
                  borderRadius:9,textAlign:'left',
                  background:sel?.id===c.id?'var(--indigo-wash)':'transparent',
                  color:sel?.id===c.id?'var(--indigo)':'var(--text)',
                  opacity:c.is_active?1:.5}}>
                <span style={{width:9,height:9,borderRadius:'50%',background:c.color,flexShrink:0}}/>
                <span style={{flex:1,fontWeight:sel?.id===c.id?600:500,fontSize:14}}>{c.name}</span>
                <span style={{fontSize:11.5,color:'var(--faint)'}}>{n}</span>
              </button>
            )
          })}
        </div>
        <div style={{padding:10,borderTop:'1px solid var(--line-2)'}}>
          {adding ? (
            <form onSubmit={add} style={{display:'flex',flexDirection:'column',gap:6}}>
              <input className="inp" autoFocus style={{fontSize:13}} value={nw}
                     onChange={e=>setNw(e.target.value)} placeholder="Category name"/>
              <div style={{display:'flex',gap:5}}>
                <button className="btn b-pri b-sm" style={{flex:1}}>Add</button>
                <button type="button" className="btn b-out b-sm b-ico" onClick={()=>setAdding(false)}>
                  <Ico n="x" s={14}/></button>
              </div>
            </form>
          ) : (
            <button className="btn b-pri b-full b-sm" onClick={()=>setAdding(true)}>
              <Ico n="plus" s={14}/>New category</button>
          )}
        </div>
      </div>

      <div style={{flex:1,overflowY:'auto',padding:24}}>
        {!sel ? <div className="empty" style={{paddingTop:80}}>
            <div className="empty-t">Choose a category</div></div> : (
          <div style={{maxWidth:640,display:'flex',flexDirection:'column',gap:14}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
              <div>
                <h2 className="h1" style={{fontSize:19}}>{sel.name}</h2>
                <p className="sub">{mine.length} service{mine.length===1?'':'s'} in this category</p>
              </div>
              <button className="btn b-out b-sm" style={{color:'var(--red)'}} onClick={async()=>{
                if(!confirm(`Delete "${sel.name}"? Its services stay, they just lose the grouping.`))return
                await sb.from('service_categories').delete().eq('id',sel.id)
                setSel(null); load(); toast('Deleted','ok')
              }}><Ico n="trash" s={14}/></button>
            </div>

            <div className="card" style={{padding:18}}>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:13}}>
                <div><label className="lbl">Name</label>
                  <input className="inp" value={v('name')||''} onChange={e=>set('name',e.target.value)}/></div>
                <div><label className="lbl">Filipino name</label>
                  <input className="inp" value={v('name_fil')||''} onChange={e=>set('name_fil',e.target.value)}
                         placeholder="Shown on the kiosk"/></div>
              </div>
              <div style={{marginTop:14}}>
                <label className="lbl">Colour</label>
                <div style={{display:'flex',flexWrap:'wrap',gap:7}}>
                  {SWATCH.map(c=>(
                    <button key={c} type="button" onClick={()=>set('color',c)} aria-label={c}
                      style={{width:26,height:26,borderRadius:'50%',background:c,
                        outline:v('color')===c?`2px solid ${c}`:'none',outlineOffset:2}}/>
                  ))}
                </div>
              </div>
            </div>

            <div className="card">
              <div className="srow">
                <div>
                  <div className="srow-t">Active</div>
                  <div className="srow-s">When off, the kiosk skips this category and shows its
                    services with everything else.</div>
                </div>
                <button className={'sw '+(v('is_active')?'on':'')}
                        onClick={()=>set('is_active',!v('is_active'))}><i/></button>
              </div>
            </div>

            <div className="card">
              <div className="card-h">
                <span className="card-t">Services in this category</span>
                <span style={{fontSize:12,color:'var(--muted)'}}>{mine.length} selected</span>
              </div>
              <div style={{padding:7,maxHeight:360,overflowY:'auto'}}>
                {svcs.map(s=>{
                  const here  = s.category_id===sel.id
                  const other = s.category_id && !here
                  return (
                    <label key={s.id} style={{display:'flex',alignItems:'center',
                      justifyContent:'space-between',gap:11,padding:'9px 11px',borderRadius:9,
                      cursor:'pointer',background:here?'var(--indigo-wash)':'transparent'}}>
                      <span style={{display:'flex',alignItems:'center',gap:9,minWidth:0}}>
                        <span style={{width:8,height:8,borderRadius:'50%',background:s.color,flexShrink:0}}/>
                        <span style={{fontSize:14,fontWeight:here?600:500}}>{s.name}</span>
                        {other && <span style={{fontSize:11.5,color:'var(--faint)'}}>
                          in {cats.find(c=>c.id===s.category_id)?.name}</span>}
                      </span>
                      <input type="checkbox" checked={here} onChange={e=>assign(s.id,e.target.checked)}
                             style={{width:15,height:15,accentColor:'var(--indigo)'}}/>
                    </label>
                  )
                })}
              </div>
            </div>

            {dirty && (
              <div style={{display:'flex',gap:8}}>
                <button className="btn b-out" style={{flex:1}} onClick={()=>setDraft({})}>Cancel</button>
                <button className="btn b-pri" style={{flex:1}} onClick={save}>
                  <Ico n="check" s={15}/>Save</button>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  )
}
/* ════════════════════════════════════════════════════════════
   ADMIN — settings
   ════════════════════════════════════════════════════════════ */
function Settings() {
  const toast = useToast()
  const [s,setS] = useState(null)
  const [d,setD] = useState({})
  useEffect(()=>{ sb.from('settings').select('*').eq('id',1).maybeSingle().then(({data})=>setS(data)) },[])
  const v = k => d[k]!==undefined ? d[k] : s?.[k]
  const set = (k,val) => setD(x=>({...x,[k]:val}))
  const dirty = Object.keys(d).length>0

  const save = async () => {
    const payload = {
      hospital_name:v('hospital_name'), short_name:v('short_name'), kiosk_note:v('kiosk_note'),
      voice_enabled:v('voice_enabled'), announce_repeat:Number(v('announce_repeat'))||1,
      keep_on_tv_secs:Number(v('keep_on_tv_secs'))||45,
      enable_hold:v('enable_hold'), enable_return:v('enable_return'), enable_skip:v('enable_skip'),
      random_numbers:v('random_numbers'), queue_movement:v('queue_movement'),
      remarks_required:v('remarks_required'),
      remarks_on_remove:v('remarks_on_remove'), remarks_on_transfer:v('remarks_on_transfer'),
      remarks_on_skip:v('remarks_on_skip'), remarks_on_movement:v('remarks_on_movement'),
      remarks_on_hold:v('remarks_on_hold'), remarks_on_return:v('remarks_on_return'),
      auto_reset:v('auto_reset'), auto_complete_at:v('auto_complete_at') || null,
    }
    const {error} = await sb.from('settings').update(payload).eq('id',1)
    if (error) return toast(error.message,'err')
    const {data} = await sb.from('settings').select('*').eq('id',1).maybeSingle()
    setS(data); setD({}); toast('Saved','ok')
  }
  if (!s) return <div className="mid"><div className="spin d"/></div>

  const Row = ({k, t, note, disabled, why}) => (
    <div className={'srow '+(disabled?'off':'')}>
      <div style={{minWidth:0}}>
        <div className="srow-t">{t}</div>
        <div className="srow-s">{disabled && why ? why : note}</div>
      </div>
      <button className={'sw '+(v(k)&&!disabled?'on':'')} disabled={disabled}
              onClick={()=>!disabled && set(k,!v(k))}><i/></button>
    </div>
  )
  const Group = ({title, children}) => (
    <div className="card" style={{marginBottom:14}}>
      <div className="sgroup">{title}</div>
      {children}
    </div>
  )

  return (
    <>
      <div className="head">
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:16}}>
          <div>
            <h1 className="h1">Queue Settings</h1>
            <p className="sub">These apply to every kiosk, TV and counter.</p>
          </div>
          {dirty && (
            <div style={{display:'flex',gap:8}}>
              <button className="btn b-out" onClick={()=>setD({})}>Revert changes</button>
              <button className="btn b-pri" onClick={save}><Ico n="check" s={15}/>Save changes</button>
            </div>
          )}
        </div>
      </div>

      <div className="wrap" style={{maxWidth:820}}>
        <Group title="BRANCH">
          <div style={{padding:'16px 18px'}}>
            <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:13}}>
              <div><label className="lbl">Hospital name</label>
                <input className="inp" value={v('hospital_name')||''} onChange={e=>set('hospital_name',e.target.value)}/></div>
              <div><label className="lbl">Short name</label>
                <input className="inp" value={v('short_name')||''} onChange={e=>set('short_name',e.target.value)}/></div>
            </div>
            <div style={{marginTop:13}}>
              <label className="lbl">Note printed on kiosk tickets</label>
              <input className="inp" value={v('kiosk_note')||''} onChange={e=>set('kiosk_note',e.target.value)}/>
            </div>
          </div>
        </Group>

        <Group title="QUEUE SERVING">
          <Row k="enable_hold" t="Enable HOLD queue feature"
               note="Staff can pause a queue. Serving time stops while it is held."/>
          <Row k="enable_return" t="Enable RETURN queue feature"
               note="Staff can send a queue from Current Serving back to the on-going list."/>
          <Row k="enable_skip" t="Enable SKIP queue feature"
               note="Staff can skip a queue. It goes to the back of the line."/>
        </Group>

        <Group title="QUEUE MOVEMENT">
          <Row k="random_numbers" t="Generate random queue numbers"
               note="Numbers use random characters instead of the X001 counting format."/>
          <Row k="queue_movement" t="Enable Queue Movement feature"
               note="After Complete, ask staff whether the patient moves to another department or is finished."/>
        </Group>

        <Group title="REMARKS">
          <Row k="remarks_required" t="Require all remarks fields"
               note="Remarks change from optional to required wherever they are asked for."/>
          <Row k="remarks_on_remove" t="Remarks on Cancel Queue"
               note="Staff enter a remark when a queue is cancelled."/>
          <Row k="remarks_on_transfer" t="Remarks on Transfer Queue"
               note="Staff enter a remark when a queue moves to another service or counter."/>
          <Row k="remarks_on_skip" t="Remarks on Skip Queue"
               note="Staff enter a remark when a queue is skipped."
               disabled={!v('enable_skip')} why="Skip queue is required for this function."/>
          <Row k="remarks_on_movement" t="Remarks on Queue Movement"
               note="Staff enter a remark when a patient is moved to the next department."
               disabled={!v('queue_movement')} why="Queue movement is required for this function."/>
          <Row k="remarks_on_hold" t="Remarks on Hold Queue"
               note="Staff enter a remark when a queue is held."
               disabled={!v('enable_hold')} why="Hold queue is required for this function."/>
          <Row k="remarks_on_return" t="Remarks on Return Queue"
               note="Staff enter a remark when a queue is returned to the on-going list."
               disabled={!v('enable_return')} why="Return queue is required for this function."/>
        </Group>

        <Group title="AUTOMATE QUEUE">
          <Row k="auto_reset" t="Auto-reset queue numbers"
               note="At 12 midnight, anything still pending from the previous day is closed and numbering starts again."/>
          <div className="srow">
            <div style={{minWidth:0}}>
              <div className="srow-t">Auto-complete queues</div>
              <div className="srow-s">Anything still being served is completed automatically at this time. Leave empty to turn off.</div>
            </div>
            <input className="inp" type="time" style={{width:140,flexShrink:0}}
                   value={(v('auto_complete_at')||'').slice(0,5)}
                   onChange={e=>set('auto_complete_at', e.target.value || null)}/>
          </div>
        </Group>

        <Group title="TV ANNOUNCEMENTS">
          <Row k="voice_enabled" t="Voice on the TV"
               note="Reads out the number and the counter when a queue is called."/>
          <div className="srow">
            <div><div className="srow-t">How many times to read it</div>
              <div className="srow-s">The chime plays once, then the number is read this many times.</div></div>
            <input className="inp" type="number" min="1" max="4" style={{width:90,flexShrink:0}}
                   value={v('announce_repeat')} onChange={e=>set('announce_repeat',e.target.value)}/>
          </div>
          <div className="srow">
            <div><div className="srow-t">How long a finished queue stays up</div>
              <div className="srow-s">Seconds a completed number remains on the TV before it disappears.</div></div>
            <input className="inp" type="number" min="5" max="300" style={{width:90,flexShrink:0}}
                   value={v('keep_on_tv_secs')} onChange={e=>set('keep_on_tv_secs',e.target.value)}/>
          </div>
        </Group>

        {dirty && (
          <div style={{display:'flex',gap:8,position:'sticky',bottom:0,padding:'14px 0',
            background:'linear-gradient(transparent,var(--paper) 30%)'}}>
            <button className="btn b-out" style={{flex:1}} onClick={()=>setD({})}>Revert changes</button>
            <button className="btn b-pri" style={{flex:1}} onClick={save}>
              <Ico n="check" s={15}/>Save changes</button>
          </div>
        )}
      </div>
    </>
  )
}

/* ════════════════════════════════════════════════════════════
   REPORTS
   ════════════════════════════════════════════════════════════ */
function Reports() {
  const iso = d => d.toISOString().slice(0,10)
  const [from,setFrom] = useState(iso(new Date(Date.now()-6*864e5)))
  const [to,setTo]     = useState(iso(new Date()))
  const [kind,setKind] = useState('summary')
  const [rows,setRows] = useState(null)
  const [busy,setBusy] = useState(false)

  const run = async () => {
    setBusy(true); setRows(null)
    const {data} = await sb.from('tickets')
      .select('number,status,journey_step,sort_at,called_at,completed_at,patient_name,services(name),windows(name)')
      .gte('ticket_date',from).lte('ticket_date',to).order('sort_at',{ascending:false}).limit(3000)
    const t = data||[]
    if (kind==='log') {
      setRows(t.map(x=>({
        Number:x.number, Service:x.services?.name||'—', Counter:x.windows?.name||'—',
        Status:STATUS[x.status]?.[0]||x.status,
        Step:x.journey_step, Queued:hhmm(x.sort_at), Called:hhmm(x.called_at), Completed:hhmm(x.completed_at),
      })))
    } else {
      const m = {}
      t.forEach(x=>{
        const n = x.services?.name||'—'
        m[n] = m[n] || {Service:n, Total:0, Completed:0, Skipped:0, _w:[], _s:[]}
        m[n].Total++
        if (x.status==='done') m[n].Completed++
        if (x.status==='skipped') m[n].Skipped++
        if (x.called_at) m[n]._w.push(new Date(x.called_at)-new Date(x.sort_at))
        if (x.completed_at&&x.called_at) m[n]._s.push(new Date(x.completed_at)-new Date(x.called_at))
      })
      const avg = a => a.length ? Math.round(a.reduce((s,v)=>s+v,0)/a.length/60000)+' min' : '—'
      setRows(Object.values(m).map(r=>({
        Service:r.Service, Total:r.Total, Completed:r.Completed, Skipped:r.Skipped,
        'Avg. wait':avg(r._w), 'Avg. serve':avg(r._s),
      })).sort((a,b)=>b.Lahat-a.Lahat))
    }
    setBusy(false)
  }

  const csv = () => {
    if (!rows?.length) return
    const h = Object.keys(rows[0])
    const body = [h.join(','), ...rows.map(r=>h.map(k=>`"${String(r[k]??'').replace(/"/g,'""')}"`).join(','))].join('\n')
    const a = document.createElement('a')
    a.href = URL.createObjectURL(new Blob([body],{type:'text/csv;charset=utf-8'}))
    a.download = `tdmh-queue-${kind}-${from}-${to}.csv`; a.click()
  }

  return (
    <>
      <div className="head"><h1 className="h1">Reports</h1>
        <p className="sub">Pick a date range, then export if you need to.</p></div>
      <div className="wrap">
        <div className="card" style={{padding:15,display:'flex',gap:11,flexWrap:'wrap',alignItems:'flex-end'}}>
          <div><label className="lbl">Report</label>
            <select className="inp" style={{width:190}} value={kind} onChange={e=>setKind(e.target.value)}>
              <option value="summary">Summary by service</option>
              <option value="log">Ticket list</option>
            </select></div>
          <div><label className="lbl">From</label>
            <input className="inp" type="date" style={{width:160}} value={from} onChange={e=>setFrom(e.target.value)}/></div>
          <div><label className="lbl">To</label>
            <input className="inp" type="date" style={{width:160}} value={to} onChange={e=>setTo(e.target.value)}/></div>
          <button className="btn b-pri" onClick={run} disabled={busy}>
            {busy?<div className="spin"/>:<><Ico n="chart" s={15}/>Generate</>}</button>
          {rows?.length>0 && <button className="btn b-out" onClick={csv}><Ico n="dl" s={15}/>CSV</button>}
        </div>

        {rows && (
          <div className="card" style={{marginTop:13,overflow:'hidden'}}>
            <div className="card-h"><span className="card-t">{rows.length} rows</span></div>
            <div style={{overflowX:'auto',maxHeight:470,overflowY:'auto'}}>
              {rows.length===0
                ? <div className="empty" style={{padding:36}}><div className="empty-t">Nothing found</div>
                    <div>Try a different date range.</div></div>
                : <table className="tb">
                    <thead><tr>{Object.keys(rows[0]).map(h=><th key={h}>{h}</th>)}</tr></thead>
                    <tbody>{rows.map((r,i)=>(
                      <tr key={i}>{Object.entries(r).map(([k,val])=>
                        <td key={k} className={k==='Number'?'num':''}>{String(val??'—')}</td>)}</tr>
                    ))}</tbody>
                  </table>}
            </div>
          </div>
        )}
      </div>
    </>
  )
}

/* ════════════════════════════════════════════════════════════
   APP SHELL
   ════════════════════════════════════════════════════════════ */
function Shell() {
  const auth = useAuth()
  const [page,setPage] = useState('counter')
  const [open,setOpen] = useState(true)

  if (auth.loading) return <div className="mid"><div className="spin d" style={{width:30,height:30,borderWidth:3}}/></div>
  if (!auth.user)   return <SignIn onSignIn={auth.signIn}/>
  if (!auth.me)     return <div className="mid"><div className="spin d" style={{width:30,height:30,borderWidth:3}}/></div>

  const me = auth.me
  const nav = (id,label,icon) => (
    <button className={'nav '+(page===id?'on':'')} onClick={()=>setPage(id)}>
      <Ico n={icon}/><span>{label}</span></button>
  )

  const body = {
    counter:  <Counter me={me}/>,
    board:    <Board me={me}/>,
    services: <Services/>,
    windows:  <Windows/>,
    categories: <Categories/>,
    procedures: <Procedures/>,
    displays: <Displays/>,
    team:     <Team me={me}/>,
    settings: <Settings/>,
    reports:  <Reports/>,
  }[page] || <Counter me={me}/>

  return (
    <div className="app">
      <div className="rail">
        <div className="rail-top">
          <div className="mark">T</div>
          <div style={{minWidth:0}}>
            <div className="rail-name">TDMH Queuing</div>
            <div className="rail-sub">Taytay, Rizal</div>
          </div>
        </div>
        <nav className="rail-nav">
          {nav('counter','Counter','desk')}
          {auth.isManager && nav('board','Live board','board')}
          {auth.isManager && nav('reports','Reports','chart')}

          {auth.isManager && <>
            <button className="nav" onClick={()=>setOpen(o=>!o)}
              style={{justifyContent:'space-between',color:'var(--faint)',fontSize:11,fontWeight:700,
                      padding:'13px 11px 5px'}}>
              <span>SETUP</span><Ico n={open?'down':'right'} s={12}/>
            </button>
            {open && <>
              {nav('services','Services','board')}
              {nav('windows','Counters','desk')}
              {nav('categories','Categories','grid')}
              {nav('procedures','Procedures','route')}
              {nav('displays','TV displays','tv')}
              {nav('team','Team','users')}
              {nav('settings','Settings','cog')}
            </>}
          </>}

          <div className="nav-head">OPEN</div>
          <button className="nav" onClick={()=>window.open('?tv=main','_blank')}>
            <Ico n="tv"/><span>TV display</span></button>
          <button className="nav" onClick={()=>window.open('?kiosk=1','_blank')}>
            <Ico n="kiosk"/><span>Kiosk</span></button>
        </nav>
        <div className="rail-foot">
          <div className="who">
            <div className="pip">{initials(me.full_name)}</div>
            <div style={{flex:1,minWidth:0}}>
              <div className="who-n">{me.full_name}</div>
              <div className="who-r">{me.role}</div>
            </div>
            <button className="btn b-ghost b-ico" onClick={auth.signOut} title="Sign out">
              <Ico n="out" s={15}/></button>
          </div>
        </div>
      </div>
      <div className="main">{body}</div>
    </div>
  )
}

/* ─── route by query string ─── */
function Root() {
  const p = new URLSearchParams(location.search)
  const tv = p.get('tv')
  if (tv !== null) return <TV slug={tv || 'main'}/>
  if (p.get('kiosk') === '1') return <Kiosk/>
  return <Shell/>
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <Toasts><Root/></Toasts>
)
