                <button className="btn b-pri" style={{flex:1}} onClick={save}><Ico n="check" s={15}/>Save</button>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  )
}

/* ════════════════════════════════════════════════════════════
   ADMIN — windows
   ════════════════════════════════════════════════════════════ */
function Windows() {
  const toast = useToast()
  const [wins,setWins] = useState([])
  const [svcs,setSvcs] = useState([])
  const [staff,setStaff] = useState([])
  const [sel,setSel]   = useState(null)
  const [mySvc,setMySvc] = useState([])
  const [myStaff,setMyStaff] = useState([])
  const [adding,setAdding] = useState(false)
  const [nw,setNw] = useState('')
  const [name,setName] = useState(null)

  const load = async keep => {
    const [{data:w},{data:s},{data:p}] = await Promise.all([
      sb.from('windows').select('*').order('sort_order'),
      sb.from('services').select('id,code,name,color').eq('is_active',true).order('sort_order'),
      sb.from('profiles').select('id,full_name,role').eq('is_active',true).order('full_name'),
    ])
    setWins(w||[]); setSvcs(s||[]); setStaff(p||[])
    const pick = keep ? (w||[]).find(x=>x.id===keep) : (sel ? (w||[]).find(x=>x.id===sel.id) : w?.[0])
    setSel(pick||null)
  }
  useEffect(()=>{ load() },[])
  useEffect(()=>{
    if (!sel) return
    setName(null)
    Promise.all([
      sb.from('window_services').select('service_id').eq('window_id',sel.id),
      sb.from('window_staff').select('user_id').eq('window_id',sel.id),
    ]).then(([a,b])=>{
      setMySvc((a.data||[]).map(r=>r.service_id))
      setMyStaff((b.data||[]).map(r=>r.user_id))
    })
  },[sel?.id])

  const toggleSvc = async id => {
    const has = mySvc.includes(id)
    setMySvc(p=>has?p.filter(x=>x!==id):[...p,id])
    const {error} = has
      ? await sb.from('window_services').delete().eq('window_id',sel.id).eq('service_id',id)
      : await sb.from('window_services').insert({window_id:sel.id,service_id:id})
    if (error) { toast(error.message,'err'); setMySvc(p=>has?[...p,id]:p.filter(x=>x!==id)) }
  }
  const toggleStaff = async id => {
    const has = myStaff.includes(id)
    setMyStaff(p=>has?p.filter(x=>x!==id):[...p,id])
    const {error} = has
      ? await sb.from('window_staff').delete().eq('window_id',sel.id).eq('user_id',id)
      : await sb.from('window_staff').insert({window_id:sel.id,user_id:id})
    if (error) { toast(error.message,'err'); setMyStaff(p=>has?[...p,id]:p.filter(x=>x!==id)) }
  }
  const add = async e => {
    e.preventDefault()
    if (!nw.trim()) return
    const {data,error} = await sb.from('windows')
      .insert({name:nw.trim(), sort_order:(wins.length+1)*10}).select().single()
    if (error) return toast(error.message,'err')
    setNw(''); setAdding(false); await load(data.id); toast('Added','ok')
  }
  const saveName = async () => {
    const {error} = await sb.from('windows')
      .update({name:name.name, short_name:name.short_name}).eq('id',sel.id)
    if (error) return toast(error.message,'err')
    await load(sel.id); toast('Saved','ok')
  }

  return (
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      <div style={{width:252,flexShrink:0,background:'#fff',borderRight:'1px solid var(--line)',
                   display:'flex',flexDirection:'column'}}>
        <div style={{padding:'15px 16px',borderBottom:'1px solid var(--line-2)'}}>
          <div style={{fontWeight:800,fontSize:14.5}}>Counters</div>
          <div style={{fontSize:12,color:'var(--muted)'}}>{wins.length} total</div>
        </div>
        <div style={{flex:1,overflowY:'auto',padding:5}}>
          {wins.map(w=>(
            <button key={w.id} onClick={()=>setSel(w)}
              style={{display:'block',width:'100%',padding:'9px 11px',borderRadius:9,textAlign:'left',
                background:sel?.id===w.id?'var(--indigo-wash)':'transparent',
                color:sel?.id===w.id?'var(--indigo)':'var(--text)',
                fontWeight:sel?.id===w.id?600:500,fontSize:13.5,opacity:w.is_active?1:.45}}>
              {w.name}
            </button>
          ))}
        </div>
        <div style={{padding:10,borderTop:'1px solid var(--line-2)'}}>
          {adding ? (
            <form onSubmit={add} style={{display:'flex',flexDirection:'column',gap:6}}>
              <input className="inp" style={{fontSize:13}} autoFocus placeholder="Counter name"
                value={nw} onChange={e=>setNw(e.target.value)}/>
              <div style={{display:'flex',gap:5}}>
                <button className="btn b-pri b-sm" style={{flex:1}}>Add</button>
                <button type="button" className="btn b-out b-sm b-ico" onClick={()=>setAdding(false)}><Ico n="x" s={14}/></button>
              </div>
            </form>
          ) : (
            <button className="btn b-pri b-full b-sm" onClick={()=>setAdding(true)}><Ico n="plus" s={14}/>New counter</button>
          )}
        </div>
      </div>

      <div style={{flex:1,overflowY:'auto',padding:24}}>
        {!sel ? <div className="empty" style={{paddingTop:80}}><div className="empty-t">Choose a counter</div></div> : (
          <div style={{maxWidth:620,display:'flex',flexDirection:'column',gap:13}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
              <div>
                <h2 className="h1" style={{fontSize:18}}>{sel.name}</h2>
                <p className="sub">Shown on the TV as <b>{sel.short_name || sel.name}</b></p>
              </div>
              <div style={{display:'flex',gap:7}}>
                <button className="btn b-out b-sm" onClick={async()=>{
                  await sb.from('windows').update({is_active:!sel.is_active}).eq('id',sel.id); load(sel.id)
                }}>{sel.is_active?'Turn off':'Turn on'}</button>
                <button className="btn b-out b-sm" style={{color:'var(--red)'}} onClick={async()=>{
                  if(!confirm(`Delete "${sel.name}"?`))return
                  const {error} = await sb.from('windows').delete().eq('id',sel.id)
                  if (error) return toast('Cannot delete — a ticket still references it.','err')
                  setSel(null); load(); toast('Deleted','ok')
                }}><Ico n="trash" s={14}/></button>
              </div>
            </div>

            <div className="card" style={{padding:17}}>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
                <div>
                  <label className="lbl">Full name</label>
                  <input className="inp" value={name?.name ?? sel.name}
                    onChange={e=>setName(n=>({name:e.target.value, short_name:n?.short_name ?? sel.short_name ?? ''}))}/>
                </div>
                <div>
                  <label className="lbl">Short name (TV)</label>
                  <input className="inp" value={name?.short_name ?? sel.short_name ?? ''}
                    onChange={e=>setName(n=>({name:n?.name ?? sel.name, short_name:e.target.value}))}
                    placeholder="e.g. Lab 1"/>
                </div>
              </div>
              {name && <button className="btn b-pri b-sm" style={{marginTop:12}} onClick={saveName}>
                <Ico n="check" s={14}/>Save name</button>}
            </div>

            <div className="card">
              <div className="card-h"><span className="card-t">Services handled here</span>
                <span style={{fontSize:12,color:'var(--muted)'}}>{mySvc.length} selected</span></div>
              <div style={{padding:7,maxHeight:250,overflowY:'auto'}}>
                {svcs.map(s=>(
                  <label key={s.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',
                    gap:11,padding:'8px 10px',borderRadius:9,cursor:'pointer',
                    background:mySvc.includes(s.id)?'var(--indigo-wash)':'transparent'}}>
                    <span style={{display:'flex',alignItems:'center',gap:9,fontSize:13.5,
                      fontWeight:mySvc.includes(s.id)?600:500}}>
                      <span style={{width:8,height:8,borderRadius:'50%',background:s.color}}/>{s.name}</span>
                    <input type="checkbox" checked={mySvc.includes(s.id)} onChange={()=>toggleSvc(s.id)}
                      style={{width:15,height:15,accentColor:'var(--indigo)'}}/>
                  </label>
                ))}
              </div>
            </div>

            <div className="card">
              <div className="card-h"><span className="card-t">Staff allowed here</span>
                <span style={{fontSize:12,color:'var(--muted)'}}>{myStaff.length} selected</span></div>
              <div style={{padding:7,maxHeight:250,overflowY:'auto'}}>
                {staff.map(p=>(
                  <label key={p.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',
                    gap:11,padding:'8px 10px',borderRadius:9,cursor:'pointer',
                    background:myStaff.includes(p.id)?'var(--indigo-wash)':'transparent'}}>
                    <span style={{display:'flex',alignItems:'center',gap:9}}>
                      <span className="pip" style={{width:26,height:26,fontSize:10,background:'#dcdcea',color:'var(--muted)'}}>
                        {initials(p.full_name)}</span>
                      <span style={{fontSize:13.5,fontWeight:myStaff.includes(p.id)?600:500}}>{p.full_name}</span>
                    </span>
                    <input type="checkbox" checked={myStaff.includes(p.id)} onChange={()=>toggleStaff(p.id)}
                      style={{width:15,height:15,accentColor:'var(--indigo)'}}/>
                  </label>
                ))}
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  )
}

/* ════════════════════════════════════════════════════════════

function Displays() {
  const toast = useToast()
  const [list,setList] = useState([])
  const [wins,setWins] = useState([])
  const [sel,setSel]   = useState(null)
  const [mine,setMine] = useState([])
  const [adding,setAdding] = useState(false)
  const [nw,setNw] = useState({slug:'',name:''})

  const load = async keep => {
    const [{data:d},{data:w}] = await Promise.all([
      sb.from('displays').select('*').order('sort_order'),
      sb.from('windows').select('id,name,short_name').eq('is_active',true).order('sort_order'),
    ])
    setList(d||[]); setWins(w||[])
    const pick = keep ? (d||[]).find(x=>x.id===keep) : (sel ? (d||[]).find(x=>x.id===sel.id) : d?.[0])
    setSel(pick||null)
  }
  useEffect(()=>{ load() },[])
  useEffect(()=>{
    if (!sel) return
    sb.from('display_windows').select('window_id').eq('display_id',sel.id)
      .then(({data})=>setMine((data||[]).map(r=>r.window_id)))
  },[sel?.id])

  const toggle = async id => {
    const has = mine.includes(id)
    setMine(p=>has?p.filter(x=>x!==id):[...p,id])
    const {error} = has
      ? await sb.from('display_windows').delete().eq('display_id',sel.id).eq('window_id',id)
      : await sb.from('display_windows').insert({display_id:sel.id,window_id:id})
    if (error) { toast(error.message,'err'); setMine(p=>has?[...p,id]:p.filter(x=>x!==id)) }
  }
  const add = async e => {
    e.preventDefault()
    const slug = nw.slug.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-')
    if (!slug || !nw.name.trim()) return
    const {data,error} = await sb.from('displays')
      .insert({slug, name:nw.name.trim(), sort_order:(list.length+1)*10}).select().single()
    if (error) return toast(error.message,'err')
    setNw({slug:'',name:''}); setAdding(false); await load(data.id); toast('Added','ok')
  }
  const url = s => `${location.origin}${location.pathname}?tv=${s}`

  return (
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      <div style={{width:252,flexShrink:0,background:'#fff',borderRight:'1px solid var(--line)',
                   display:'flex',flexDirection:'column'}}>
        <div style={{padding:'15px 16px',borderBottom:'1px solid var(--line-2)'}}>
          <div style={{fontWeight:800,fontSize:14.5}}>TV displays</div>
          <div style={{fontSize:12,color:'var(--muted)'}}>One link per department</div>
        </div>
        <div style={{flex:1,overflowY:'auto',padding:5}}>
          {list.map(d=>(
            <button key={d.id} onClick={()=>setSel(d)}
              style={{display:'block',width:'100%',padding:'9px 11px',borderRadius:9,textAlign:'left',
                background:sel?.id===d.id?'var(--indigo-wash)':'transparent',
                color:sel?.id===d.id?'var(--indigo)':'var(--text)',fontSize:13.5}}>
              <div style={{fontWeight:sel?.id===d.id?600:500}}>{d.name}</div>
              <div className="num" style={{fontSize:11,color:'var(--faint)',fontWeight:600}}>?tv={d.slug}</div>
            </button>
          ))}
        </div>
        <div style={{padding:10,borderTop:'1px solid var(--line-2)'}}>
          {adding ? (
            <form onSubmit={add} style={{display:'flex',flexDirection:'column',gap:6}}>
              <input className="inp" style={{fontSize:13}} autoFocus placeholder="Name"
                value={nw.name} onChange={e=>setNw(n=>({...n,name:e.target.value}))}/>
              <input className="inp" style={{fontSize:13}} placeholder="slug (e.g. lab)"
                value={nw.slug} onChange={e=>setNw(n=>({...n,slug:e.target.value}))}/>
              <div style={{display:'flex',gap:5}}>
                <button className="btn b-pri b-sm" style={{flex:1}}>Add</button>
                <button type="button" className="btn b-out b-sm b-ico" onClick={()=>setAdding(false)}><Ico n="x" s={14}/></button>
              </div>
            </form>
          ) : (
            <button className="btn b-pri b-full b-sm" onClick={()=>setAdding(true)}><Ico n="plus" s={14}/>New TV</button>
          )}
        </div>
      </div>

      <div style={{flex:1,overflowY:'auto',padding:24}}>
        {!sel ? <div className="empty" style={{paddingTop:80}}><div className="empty-t">Choose a TV</div></div> : (
          <div style={{maxWidth:620,display:'flex',flexDirection:'column',gap:13}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
              <div>
                <h2 className="h1" style={{fontSize:18}}>{sel.name}</h2>
                <p className="sub">Open this link on that department’s TV.</p>
              </div>
              <button className="btn b-out b-sm" style={{color:'var(--red)'}} onClick={async()=>{
                if(!confirm(`Delete "${sel.name}"?`))return
                await sb.from('displays').delete().eq('id',sel.id); setSel(null); load(); toast('Deleted','ok')
              }}><Ico n="trash" s={14}/></button>
            </div>

            <div className="card" style={{padding:17}}>
              <label className="lbl">TV link</label>
              <div style={{display:'flex',gap:8}}>
                <code style={{flex:1,background:'var(--paper)',border:'1px solid var(--line)',borderRadius:9,
                  padding:'9px 12px',fontSize:12.5,color:'var(--indigo)',fontWeight:600,overflow:'hidden',
                  textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{url(sel.slug)}</code>
                <button className="btn b-out b-sm" onClick={()=>{
                  navigator.clipboard?.writeText(url(sel.slug)); toast('Link copied','ok')
                }}>Copy</button>
                <button className="btn b-pri b-sm" onClick={()=>window.open('?tv='+sel.slug,'_blank')}>
                  <Ico n="tv" s={14}/>Open</button>
              </div>
            </div>

            <div className="card" style={{padding:'14px 17px',display:'flex',alignItems:'center',
              justifyContent:'space-between',gap:14}}>
              <div>
                <div style={{fontWeight:600,fontSize:13.5}}>Show every counter</div>
                <div style={{fontSize:12.5,color:'var(--muted)',marginTop:1}}>
                  For the main lobby. When off, pick below which counters appear.</div>
              </div>
              <button className={'sw '+(sel.show_all_windows?'on':'')} onClick={async()=>{
                await sb.from('displays').update({show_all_windows:!sel.show_all_windows}).eq('id',sel.id)
                load(sel.id)
              }}><i/></button>
            </div>

            {!sel.show_all_windows && (
              <div className="card">
                <div className="card-h"><span className="card-t">Counters on this TV</span>
                  <span style={{fontSize:12,color:'var(--muted)'}}>{mine.length} selected</span></div>
                <div style={{padding:7,maxHeight:340,overflowY:'auto'}}>
                  {wins.map(w=>(
                    <label key={w.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',
                      gap:11,padding:'8px 10px',borderRadius:9,cursor:'pointer',
                      background:mine.includes(w.id)?'var(--indigo-wash)':'transparent'}}>
                      <span style={{fontSize:13.5,fontWeight:mine.includes(w.id)?600:500}}>{w.name}</span>
                      <input type="checkbox" checked={mine.includes(w.id)} onChange={()=>toggle(w.id)}
                        style={{width:15,height:15,accentColor:'var(--indigo)'}}/>
                    </label>
                  ))}
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  )
}

/* ════════════════════════════════════════════════════════════
   ADMIN — team
   ════════════════════════════════════════════════════════════ */
function Team({me}) {
  const toast = useToast()
  const [list,setList] = useState([])
  const [online,setOnline] = useState({})
  const [q,setQ] = useState('')

  const load = async () => {
    const [{data:p},{data:s}] = await Promise.all([
      sb.from('profiles').select('*').order('full_name'),
      sb.from('sessions').select('user_id,is_online,window_id,windows(name)'),
    ])
    setList(p||[])
    const m = {}; (s||[]).forEach(x=>{ m[x.user_id] = x })
    setOnline(m)
  }
  useEffect(()=>{ load() },[])

  const setRole = async (id,role) => {
    const {error} = await sb.from('profiles').update({role}).eq('id',id)
    if (error) return toast(error.message,'err')
    load(); toast('Role updated','ok')
  }
  const toggleActive = async p => {
    const {error} = await sb.from('profiles').update({is_active:!p.is_active}).eq('id',p.id)
    if (error) return toast(error.message,'err')
    load()
  }

  const shown = list.filter(p=>!q.trim() || (p.full_name||'').toLowerCase().includes(q.toLowerCase()))

  return (
    <>
      <div className="head"><h1 className="h1">Team</h1>
        <p className="sub">{list.length} accounts · create accounts in Supabase Auth, then set the role here</p></div>
      <div className="wrap">
        <div style={{position:'relative',maxWidth:300,marginBottom:13}}>
          <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'var(--faint)'}}>
            <Ico n="search" s={14}/></span>
          <input className="inp" style={{paddingLeft:31}} value={q} onChange={e=>setQ(e.target.value)}
                 placeholder="Search staff…"/>
        </div>
        <div className="card" style={{overflow:'hidden'}}>
          <table className="tb">
            <thead><tr><th>Name</th><th>Role</th><th>Status</th><th>At a counter</th><th></th></tr></thead>
            <tbody>
              {shown.map(p=>{
                const s = online[p.id]
                return (
                  <tr key={p.id}>
                    <td><span style={{display:'inline-flex',alignItems:'center',gap:9}}>
                      <span className="pip" style={{width:29,height:29,fontSize:10.5}}>{initials(p.full_name)}</span>
                      <b>{p.full_name||'—'}</b>{p.id===me.id && <span style={{color:'var(--faint)',fontSize:12}}>(you)</span>}
                    </span></td>
                    <td>
                      <select className="inp" style={{padding:'4px 9px',fontSize:12.5,width:'auto'}}
                        value={p.role} disabled={p.id===me.id}
                        onChange={e=>setRole(p.id,e.target.value)}>
                        <option value="staff">Staff</option>
                        <option value="manager">Manager</option>
                        <option value="admin">Admin</option>
                      </select>
                    </td>
                    <td>{p.is_active ? <span className="tag t-serv">Active</span> : <span className="tag t-skip">Inactive</span>}</td>
                    <td style={{color:'var(--muted)',fontSize:13}}>
                      {s?.is_online
                        ? <span style={{display:'inline-flex',alignItems:'center',gap:6}}>
                            <span className="dot" style={{width:6,height:6}}/>{s.windows?.name||'signed in'}</span>
                        : <span style={{color:'var(--faint)'}}>offline</span>}
                    </td>
                    <td style={{textAlign:'right'}}>
                      {p.id!==me.id && (
                        <button className="btn b-out b-sm" onClick={()=>toggleActive(p)}>
                          {p.is_active?'Turn off':'Turn on'}</button>
                      )}
                    </td>
                  </tr>
                )
              })}
            </tbody>
          </table>
        </div>
      </div>
    </>
  )
}

/* ════════════════════════════════════════════════════════════
   ADMIN — settings
   ════════════════════════════════════════════════════════════ */
function Settings() {
  const toast = useToast()
  const [s,setS] = useState(null)
  const [d,setD] = useState({})
  useEffect(()=>{ sb.from('settings').select('*').eq('id',1).maybeSingle().then(({data})=>setS(data)) },[])
  const v = k => d[k]!==undefined ? d[k] : s?.[k]
  const set = (k,val) => setD(x=>({...x,[k]:val}))
  const dirty = Object.keys(d).length>0

  const save = async () => {
    const {error} = await sb.from('settings').update({
      hospital_name:v('hospital_name'), short_name:v('short_name'),
      voice_enabled:v('voice_enabled'), announce_repeat:Number(v('announce_repeat'))||1,
      keep_on_tv_secs:Number(v('keep_on_tv_secs'))||45,
      kiosk_note:v('kiosk_note'),
    }).eq('id',1)
    if (error) return toast(error.message,'err')
    const {data} = await sb.from('settings').select('*').eq('id',1).maybeSingle()
    setS(data); setD({}); toast('Saved','ok')
  }
  if (!s) return <div className="mid"><div className="spin d"/></div>

  return (
    <>
      <div className="head"><h1 className="h1">Settings</h1>
        <p className="sub">These apply to every kiosk, TV and counter.</p></div>
      <div className="wrap" style={{maxWidth:640}}>
        <div className="card" style={{padding:17,marginBottom:13}}>
          <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:12}}>
            <div><label className="lbl">Hospital name</label>
              <input className="inp" value={v('hospital_name')||''} onChange={e=>set('hospital_name',e.target.value)}/></div>
            <div><label className="lbl">Short name</label>
              <input className="inp" value={v('short_name')||''} onChange={e=>set('short_name',e.target.value)}/></div>
          </div>
          <div style={{marginTop:13}}>
            <label className="lbl">Note printed on kiosk tickets</label>
            <input className="inp" value={v('kiosk_note')||''} onChange={e=>set('kiosk_note',e.target.value)}/>
          </div>
        </div>

        <div className="card" style={{marginBottom:13}}>
          <div className="card-h"><span className="card-t">TV announcements</span></div>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:14,padding:'13px 17px'}}>
            <div><div style={{fontWeight:600,fontSize:13.5}}>Voice on the TV</div>
              <div style={{fontSize:12.5,color:'var(--muted)'}}>Reads out the number and the counter.</div></div>
            <button className={'sw '+(v('voice_enabled')?'on':'')}
              onClick={()=>set('voice_enabled',!v('voice_enabled'))}><i/></button>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,padding:'0 17px 15px'}}>
            <div><label className="lbl">How many times to read it</label>
              <input className="inp" type="number" min="1" max="4" value={v('announce_repeat')}
                onChange={e=>set('announce_repeat',e.target.value)}/></div>
            <div><label className="lbl">How long it stays up (seconds)</label>
              <input className="inp" type="number" min="5" max="300" value={v('keep_on_tv_secs')}
                onChange={e=>set('keep_on_tv_secs',e.target.value)}/>
              <div style={{fontSize:11.5,color:'var(--faint)',marginTop:4}}>
                After a queue is completed, it stays on the TV this long.</div></div>
          </div>
        </div>

        {dirty && (
          <div style={{display:'flex',gap:8,marginTop:13}}>
            <button className="btn b-out" style={{flex:1}} onClick={()=>setD({})}>Cancel</button>
            <button className="btn b-pri" style={{flex:1}} onClick={save}><Ico n="check" s={15}/>Save</button>
          </div>
        )}
      </div>
    </>
  )
}

/* ════════════════════════════════════════════════════════════
   REPORTS
   ════════════════════════════════════════════════════════════ */
function Reports() {
  const iso = d => d.toISOString().slice(0,10)
  const [from,setFrom] = useState(iso(new Date(Date.now()-6*864e5)))
  const [to,setTo]     = useState(iso(new Date()))
  const [kind,setKind] = useState('summary')
  const [rows,setRows] = useState(null)
  const [busy,setBusy] = useState(false)

  const run = async () => {
    setBusy(true); setRows(null)
    const {data} = await sb.from('tickets')
      .select('number,status,journey_step,sort_at,called_at,completed_at,patient_name,services(name),windows(name)')
      .gte('ticket_date',from).lte('ticket_date',to).order('sort_at',{ascending:false}).limit(3000)
    const t = data||[]
    if (kind==='log') {
      setRows(t.map(x=>({
        Number:x.number, Service:x.services?.name||'—', Counter:x.windows?.name||'—',
        Status:STATUS[x.status]?.[0]||x.status,
        Step:x.journey_step, Queued:hhmm(x.sort_at), Called:hhmm(x.called_at), Completed:hhmm(x.completed_at),
      })))
    } else {
      const m = {}
      t.forEach(x=>{
        const n = x.services?.name||'—'
        m[n] = m[n] || {Service:n, Total:0, Completed:0, Skipped:0, _w:[], _s:[]}
        m[n].Total++
        if (x.status==='done') m[n].Completed++
        if (x.status==='skipped') m[n].Skipped++
        if (x.called_at) m[n]._w.push(new Date(x.called_at)-new Date(x.sort_at))
        if (x.completed_at&&x.called_at) m[n]._s.push(new Date(x.completed_at)-new Date(x.called_at))
      })
      const avg = a => a.length ? Math.round(a.reduce((s,v)=>s+v,0)/a.length/60000)+' min' : '—'
      setRows(Object.values(m).map(r=>({
        Service:r.Service, Total:r.Total, Completed:r.Completed, Skipped:r.Skipped,
        'Avg. wait':avg(r._w), 'Avg. serve':avg(r._s),
      })).sort((a,b)=>b.Lahat-a.Lahat))
    }
    setBusy(false)
  }

  const csv = () => {
    if (!rows?.length) return
    const h = Object.keys(rows[0])
    const body = [h.join(','), ...rows.map(r=>h.map(k=>`"${String(r[k]??'').replace(/"/g,'""')}"`).join(','))].join('\n')
    const a = document.createElement('a')
    a.href = URL.createObjectURL(new Blob([body],{type:'text/csv;charset=utf-8'}))
    a.download = `tdmh-queue-${kind}-${from}-${to}.csv`; a.click()
  }

  return (
    <>
      <div className="head"><h1 className="h1">Reports</h1>
        <p className="sub">Pick a date range, then export if you need to.</p></div>
      <div className="wrap">
        <div className="card" style={{padding:15,display:'flex',gap:11,flexWrap:'wrap',alignItems:'flex-end'}}>
          <div><label className="lbl">Report</label>
            <select className="inp" style={{width:190}} value={kind} onChange={e=>setKind(e.target.value)}>
              <option value="summary">Summary by service</option>
              <option value="log">Ticket list</option>
            </select></div>
          <div><label className="lbl">From</label>
            <input className="inp" type="date" style={{width:160}} value={from} onChange={e=>setFrom(e.target.value)}/></div>
          <div><label className="lbl">To</label>
            <input className="inp" type="date" style={{width:160}} value={to} onChange={e=>setTo(e.target.value)}/></div>
          <button className="btn b-pri" onClick={run} disabled={busy}>
            {busy?<div className="spin"/>:<><Ico n="chart" s={15}/>Generate</>}</button>
          {rows?.length>0 && <button className="btn b-out" onClick={csv}><Ico n="dl" s={15}/>CSV</button>}
        </div>

        {rows && (
          <div className="card" style={{marginTop:13,overflow:'hidden'}}>
            <div className="card-h"><span className="card-t">{rows.length} rows</span></div>
            <div style={{overflowX:'auto',maxHeight:470,overflowY:'auto'}}>
              {rows.length===0
                ? <div className="empty" style={{padding:36}}><div className="empty-t">Nothing found</div>
                    <div>Try a different date range.</div></div>
                : <table className="tb">
                    <thead><tr>{Object.keys(rows[0]).map(h=><th key={h}>{h}</th>)}</tr></thead>
                    <tbody>{rows.map((r,i)=>(
                      <tr key={i}>{Object.entries(r).map(([k,val])=>
                        <td key={k} className={k==='Number'?'num':''}>{String(val??'—')}</td>)}</tr>
                    ))}</tbody>
                  </table>}
            </div>
          </div>
        )}
      </div>
    </>
  )
}

/* ════════════════════════════════════════════════════════════
   APP SHELL
   ════════════════════════════════════════════════════════════ */
function Shell() {
  const auth = useAuth()
  const [page,setPage] = useState('counter')
  const [open,setOpen] = useState(true)

  if (auth.loading) return <div className="mid"><div className="spin d" style={{width:30,height:30,borderWidth:3}}/></div>
  if (!auth.user)   return <SignIn onSignIn={auth.signIn}/>
  if (!auth.me)     return <div className="mid"><div className="spin d" style={{width:30,height:30,borderWidth:3}}/></div>

  const me = auth.me
  const nav = (id,label,icon) => (
    <button className={'nav '+(page===id?'on':'')} onClick={()=>setPage(id)}>
      <Ico n={icon}/><span>{label}</span></button>
  )

  const body = {
    counter:  <Counter me={me}/>,
    board:    <Board me={me}/>,
    services: <Services/>,
    windows:  <Windows/>,
    displays: <Displays/>,
    team:     <Team me={me}/>,
    settings: <Settings/>,
    reports:  <Reports/>,
  }[page] || <Counter me={me}/>

  return (
    <div className="app">
      <div className="rail">
        <div className="rail-top">
          <div className="mark">T</div>
          <div style={{minWidth:0}}>
            <div className="rail-name">TDMH Queuing</div>
            <div className="rail-sub">Taytay, Rizal</div>
          </div>
        </div>
        <nav className="rail-nav">
          {nav('counter','Counter','desk')}
          {auth.isManager && nav('board','Live board','board')}
          {auth.isManager && nav('reports','Reports','chart')}

          {auth.isManager && <>
            <button className="nav" onClick={()=>setOpen(o=>!o)}
              style={{justifyContent:'space-between',color:'var(--faint)',fontSize:11,fontWeight:700,
                      padding:'13px 11px 5px'}}>
              <span>SETUP</span><Ico n={open?'down':'right'} s={12}/>
            </button>
            {open && <>
              {nav('services','Services','board')}
              {nav('windows','Counters','desk')}
              {nav('displays','TV displays','tv')}
              {nav('team','Team','users')}
              {nav('settings','Settings','cog')}
            </>}
          </>}

          <div className="nav-head">OPEN</div>
          <button className="nav" onClick={()=>window.open('?tv=main','_blank')}>
            <Ico n="tv"/><span>TV display</span></button>
          <button className="nav" onClick={()=>window.open('?kiosk=1','_blank')}>
            <Ico n="kiosk"/><span>Kiosk</span></button>
        </nav>
        <div className="rail-foot">
          <div className="who">
            <div className="pip">{initials(me.full_name)}</div>
            <div style={{flex:1,minWidth:0}}>
              <div className="who-n">{me.full_name}</div>
              <div className="who-r">{me.role}</div>
            </div>
            <button className="btn b-ghost b-ico" onClick={auth.signOut} title="Sign out">
              <Ico n="out" s={15}/></button>
          </div>
        </div>
      </div>
      <div className="main">{body}</div>
    </div>
  )
}

/* ─── route by query string ─── */
function Root() {
  const p = new URLSearchParams(location.search)
  const tv = p.get('tv')
  if (tv !== null) return <TV slug={tv || 'main'}/>
  if (p.get('kiosk') === '1') return <Kiosk/>
  return <Shell/>
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <Toasts><Root/></Toasts>
)
</script>
