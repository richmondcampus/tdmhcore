<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>TDMH Queuing</title>
<link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;text y='.9em' font-size='90'&gt;🏥&lt;/text&gt;&lt;/svg&gt;"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Archivo:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>
<style>
/* ═══ TDMH tokens — indigo, green, gold from the hospital mark ═══ */
:root{
  --ink:#15183a; --ink-2:#262a52;
  --indigo:#3b3fa3; --indigo-2:#5b60d6; --indigo-wash:#ecedf9;
  --green:#15793f; --green-2:#1f8a4c; --green-wash:#e4f3ea;
  --gold:#c99a2e; --gold-wash:#faf2de;
  --red:#c0453f; --red-wash:#fbecea;
  --paper:#f4f5fa; --card:#fff; --line:#e1e2ee; --line-2:#eff0f6;
  --text:#1c1c33; --muted:#63647f; --faint:#727390;
  /* surfaces used by the sign-in, sidebar, kiosk and TV */
  --surf:#eef0f7; --surf-2:#fff; --surf-3:#e6e8f2;
  --on-surf:#1c1c33; --dim:#63647f; --faint2:#696a83;
  --r:10px; --r-lg:16px;
  --sh:0 1px 2px rgba(21,24,58,.06),0 1px 3px rgba(21,24,58,.04);
  --sh-lg:0 12px 32px rgba(21,24,58,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{font-family:Figtree,system-ui,sans-serif;background:var(--paper);color:var(--text);
     font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#cfcfdd;border-radius:3px}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}
.num{font-family:Archivo,sans-serif;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}

/* ═══ shell ═══ */
.app{display:flex;height:100vh;overflow:hidden}
.rail{width:214px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);
      display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.rail-top{padding:17px 16px 14px;display:flex;align-items:center;gap:10px;
          border-bottom:1px solid var(--line-2)}
.mark{width:34px;height:34px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;
      background:linear-gradient(135deg,var(--indigo-2),var(--green));color:#fff;
      font-family:Archivo;font-weight:900;font-size:15px}
.rail-name{color:var(--text);font-weight:700;font-size:13.5px;line-height:1.25}
.rail-sub{color:var(--faint);font-size:11px}
.rail-nav{flex:1;padding:10px 9px;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;width:100%;
     text-align:left;color:var(--muted);font-size:13.5px;font-weight:500;transition:.14s}
.nav:hover{color:var(--text);background:var(--line-2)}
.nav.on{color:var(--indigo);background:var(--indigo-wash);font-weight:600}
.nav svg{width:16px;height:16px;flex-shrink:0;opacity:.9}
.nav-head{padding:13px 11px 5px;font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.02em}
.rail-foot{padding:9px;border-top:1px solid var(--line-2)}
.who{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;background:var(--paper)}
.pip{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
     background:var(--indigo);color:#fff;font-size:11px;font-weight:700}
.who-n{color:var(--text);font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-r{color:var(--faint);font-size:11px;text-transform:capitalize}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}

/* ═══ page furniture ═══ */
.head{padding:22px 26px 0}
.h1{font-size:20px;font-weight:800;letter-spacing:-.015em}
.sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.wrap{padding:18px 26px 26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh)}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;
        justify-content:space-between;gap:10px}
.card-t{font-size:13.5px;font-weight:700}

/* ═══ controls ═══ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 15px;
     border-radius:9px;font-size:13.5px;font-weight:600;transition:.13s;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(1px)}
.b-pri{background:var(--indigo);color:#fff}      .b-pri:hover:not(:disabled){background:#32368d}
.b-go{background:var(--green);color:#fff}        .b-go:hover:not(:disabled){background:#1a7442}
.b-gold{background:var(--gold);color:#fff}       .b-gold:hover:not(:disabled){background:#b2871f}
.b-red{background:var(--red);color:#fff}         .b-red:hover:not(:disabled){background:#a93a35}
.b-out{background:#fff;color:var(--text);border:1px solid var(--line)}
.b-out:hover:not(:disabled){background:#fafaff;border-color:#d2d2e2}
.b-ghost{color:var(--muted);padding:6px 9px} .b-ghost:hover{background:var(--line-2);color:var(--text)}
.b-sm{padding:5px 11px;font-size:12.5px} .b-ico{padding:7px;border-radius:8px}
.b-full{width:100%} .b-lg{padding:12px 20px;font-size:15px}
.inp{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;
     color:var(--text);outline:none;transition:.13s}
.inp:focus{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(59,63,163,.11)}
.inp::placeholder{color:var(--faint)}
select.inp{cursor:pointer}
.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.sw{position:relative;width:40px;height:23px;border-radius:12px;background:#d8d8e6;flex-shrink:0;transition:.18s}
.sw.on{background:var(--green)}
.sw i{position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;
      box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.18s}
.sw.on i{left:20px}

/* ═══ live board ═══ */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(224px,1fr));gap:13px}
.kpi{padding:17px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.kpi-k{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.kpi-v{font-size:32px;line-height:1.12;margin-top:2px;color:var(--text)}
.kpi-sub{font-size:12px;color:var(--faint);margin-top:3px}
.kpi-sub b{color:var(--muted);font-weight:600}
.kpi-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
.two-col{display:grid;grid-template-columns:1.08fr 1fr;gap:13px;margin-top:13px;align-items:start}
.tally{display:grid;grid-template-columns:repeat(3,1fr)}
.tally-cell{padding:15px 17px;border-right:1px solid var(--line-2)}
.tally-cell:last-child{border-right:none}
.occ{display:flex;align-items:center;justify-content:space-between;gap:12px;
     padding:11px 12px;border-radius:11px;background:var(--paper);margin-bottom:5px}
.occ:last-child{margin-bottom:0}
.occ-w{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.occ-line{font-size:13.5px;margin-top:4px;display:flex;align-items:center;gap:8px;min-width:0}
.occ-line>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.occ-pip{width:25px;height:25px;font-size:9.5px;background:var(--indigo-wash);color:var(--indigo)}
.occ-ago{font-size:11.5px;color:var(--faint);margin-top:3px}
.occ-lbl{font-size:10.5px;font-weight:700;color:var(--faint);letter-spacing:.04em}
.occ-t{font-size:16px;margin-top:2px}
@media(max-width:1040px){.two-col{grid-template-columns:1fr}}

/* ═══ tags ═══ */
.tag{display:inline-flex;align-items:center;gap:4px;padding:2.5px 8px;border-radius:20px;
     font-size:11.5px;font-weight:600;white-space:nowrap}
.t-wait{background:var(--gold-wash);color:#8a6713}
.t-serv{background:var(--green-wash);color:#166434}
.t-done{background:var(--line-2);color:var(--muted)}
.t-held{background:var(--indigo-wash);color:#2f3285}
.t-skip{background:var(--red-wash);color:#8f2e2a}
.t-step{background:var(--indigo-wash);color:var(--indigo)}

/* ═══ counter workspace ═══ */
.ws{display:flex;height:100vh;overflow:hidden}
.ws-l{width:296px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);
      display:flex;flex-direction:column}
.ws-r{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--paper)}
.ws-h{padding:12px 13px;border-bottom:1px solid var(--line-2)}
.segs{display:flex;background:var(--line-2);border-radius:9px;padding:3px;gap:2px}
.seg{flex:1;padding:6px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted);
     display:flex;align-items:center;justify-content:center;gap:5px;transition:.13s}
.seg.on{background:#fff;color:var(--text);box-shadow:var(--sh)}
.cnt{padding:1px 6px;border-radius:9px;font-size:11px;font-weight:700;background:#dadae8;color:var(--muted)}
.seg.on .cnt{background:var(--indigo);color:#fff}
.ws-list{flex:1;overflow-y:auto;padding:9px;display:flex;flex-direction:column;gap:6px}
.ws-f{padding:11px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:7px}

.tk{padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;background:#fff;transition:.13s;
    text-align:left;width:100%;display:block}
.tk:hover{border-color:#c3c3d8}
.tk.on{border-color:var(--indigo);background:var(--indigo-wash)}
.tk-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tk-n{font-size:16px}
.tk-s{font-size:12px;font-weight:600}
.tk-m{font-size:12px;color:var(--muted);margin-top:2px}

/* ═══ now-serving panel ═══ */
.now{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
     padding:26px;text-align:center}
.now-n{font-family:Archivo;font-weight:900;font-size:clamp(68px,11vw,124px);line-height:.92;
       letter-spacing:-.03em;color:var(--indigo)}
.now-acts{padding:13px;background:#fff;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.kbd{display:inline-block;padding:1px 5px;border:1px solid var(--line);border-bottom-width:2px;
     border-radius:5px;font-size:10.5px;font-weight:700;color:var(--faint);background:#fff;margin-left:5px}

/* ═══ counter detail pane ═══ */
.ws-bar{background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px;
        display:flex;align-items:center;justify-content:space-between;gap:14px;flex-shrink:0}
.autosw{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;
        font-weight:600;color:var(--muted);cursor:pointer}
.detail{flex:1;display:grid;grid-template-columns:1fr 340px;gap:14px;
        padding:16px 18px;overflow:hidden;min-height:0}
.detail-mid{overflow-y:auto;display:flex;align-items:flex-start;justify-content:center}
.detail-side{display:flex;flex-direction:column;gap:11px;overflow:hidden;min-height:0}
.tkcard{width:100%;max-width:430px;padding:26px 24px;text-align:center}
.tkcard-k{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--faint)}
.tkcard-n{font-size:clamp(48px,7vw,76px);line-height:1;letter-spacing:-.035em;margin:8px 0 0}
.tkcard-rule{height:1px;background:var(--line-2);margin:20px 0 16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;text-align:left}
.kv dt{font-size:12.5px;color:var(--muted)}
.kv dd{font-size:13.5px;font-weight:600;text-align:right}
.tknote{margin-top:16px;padding:10px 13px;background:var(--paper);border-radius:10px;
        font-size:13px;color:var(--muted);text-align:left}
.tagbox{margin-top:18px;padding-top:16px;border-top:1px solid var(--line-2);text-align:left}
.sidecard{padding:14px 15px}
.side-k{font-size:10.5px;font-weight:800;letter-spacing:.11em;color:var(--faint);display:block}

.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:7px;
      background:var(--gold-wash);border:1px solid #ecdfbd;color:#7d5e11;
      font-size:11px;font-weight:700;letter-spacing:.02em}
.chip-x button{display:inline-flex;color:#a98b3c;padding:0;margin-left:1px}
.chip-x button:hover{color:#6d4f0c}
.chip-add{background:transparent;border:1px dashed var(--line);color:var(--muted);font-weight:600}
.chip-add:hover{border-color:var(--indigo);color:var(--indigo)}

.path{display:flex;flex-direction:column;gap:2px;margin-top:9px}
.path-row{display:flex;align-items:center;gap:10px;padding:7px 0}
.path-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.path-n{font-size:11px;font-weight:700;color:var(--faint)}
.path-s{font-size:13px;font-weight:700;margin-top:1px}
.path-t{font-size:11.5px;color:var(--muted);flex-shrink:0}

.tl{margin-top:10px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-right:3px}
.tl-row{display:flex;gap:10px}
.tl-dot{width:7px;height:7px;border-radius:50%;background:var(--indigo);flex-shrink:0;margin-top:5px}
.tl-a{font-size:12.5px;font-weight:700}
.tl-m{font-size:11.5px;color:var(--muted);margin-top:1px}
.tl-d{font-size:11.5px;color:var(--indigo);margin-top:3px;background:var(--indigo-wash);
      padding:4px 8px;border-radius:7px;display:inline-block}
.kbd-on{color:rgba(255,255,255,.78);border-color:rgba(255,255,255,.35)}
@media(max-width:1180px){.detail{grid-template-columns:1fr}.detail-side{display:none}}

/* ═══ empty + misc ═══ */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 22px;
       text-align:center;color:var(--muted);gap:4px}
.empty-i{width:46px;height:46px;border-radius:50%;background:var(--line-2);display:grid;place-items:center;
         margin-bottom:8px;color:var(--faint)}
.empty-t{font-weight:700;font-size:14.5px;color:var(--text)}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
      border-radius:50%;animation:sp .7s linear infinite;flex-shrink:0}
.spin.d{border-color:rgba(59,63,163,.2);border-top-color:var(--indigo)}
@keyframes sp{to{transform:rotate(360deg)}}
.mid{display:grid;place-items:center;height:100vh}
.live{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;
      background:var(--green-wash);color:#166434;font-size:12px;font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green-2);position:relative}
.dot::after{content:'';position:absolute;inset:-3px;border-radius:50%;background:var(--green-2);
            opacity:.35;animation:pl 1.8s ease infinite}
.dot.off{background:var(--faint)} .dot.off::after{display:none}
@keyframes pl{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.7);opacity:0}}

/* ═══ table ═══ */
.tb{width:100%;border-collapse:collapse}
.tb th{padding:9px 14px;text-align:left;font-size:11.5px;font-weight:700;color:var(--muted);
       background:#fafafd;border-bottom:1px solid var(--line)}
.tb td{padding:10px 14px;border-bottom:1px solid var(--line-2);font-size:13.5px}
.tb tr:last-child td{border-bottom:none}
.tb tbody tr:hover td{background:#fafafd}

/* ═══ modal ═══ */
.ov{position:fixed;inset:0;background:rgba(21,24,58,.42);backdrop-filter:blur(3px);display:flex;
    align-items:center;justify-content:center;z-index:200;padding:16px;animation:fi .14s}
.md{background:#fff;border-radius:18px;box-shadow:var(--sh-lg);width:100%;max-width:460px;
    max-height:88vh;overflow-y:auto;animation:su .18s}
.md-h{padding:17px 19px 14px;border-bottom:1px solid var(--line-2);display:flex;
      align-items:flex-start;justify-content:space-between;gap:12px;position:sticky;top:0;background:#fff;z-index:2}
.md-t{font-size:16.5px;font-weight:800;letter-spacing:-.01em}
.md-s{font-size:12.5px;color:var(--muted);margin-top:2px}
.md-b{padding:19px}
.md-f{display:flex;gap:8px;padding-top:16px;margin-top:16px;border-top:1px solid var(--line-2)}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ═══ toasts ═══ */
.toasts{position:fixed;bottom:18px;right:18px;z-index:400;display:flex;flex-direction:column;
        gap:8px;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 15px;border-radius:10px;font-size:13.5px;
       font-weight:500;box-shadow:var(--sh-lg);animation:su .18s;max-width:310px;
       display:flex;align-items:center;gap:8px;border-left:3px solid var(--indigo-2)}
.toast.ok{border-left-color:var(--green-2)} .toast.err{border-left-color:var(--red)}

/* ═══════════ TV DISPLAY ═══════════ */
.tv{height:100vh;background:var(--surf);color:var(--on-surf);display:flex;flex-direction:column;overflow:hidden;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.tv-h{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-shrink:0;
      padding:1.4vh 2vw;background:var(--surf-2);border-bottom:1px solid var(--line)}
.tv-mark{width:3.1vw;min-width:40px;aspect-ratio:1;border-radius:11px;display:grid;place-items:center;
         background:linear-gradient(135deg,var(--indigo-2),var(--green));
         font-family:Archivo;font-weight:900;font-size:1.5vw}
.tv-name{font-size:clamp(14px,1.45vw,23px);font-weight:800;letter-spacing:-.015em;line-height:1.15}
.tv-where{color:var(--green);font-size:clamp(11px,1.05vw,16px);font-weight:700;margin-top:2px}
.tv-clock{font-family:Archivo;font-weight:800;font-size:clamp(20px,2.3vw,38px);font-variant-numeric:tabular-nums;line-height:1}
.tv-date{color:var(--dim);font-size:clamp(10px,.9vw,14px);text-align:right;margin-top:2px}

.tv-body{flex:1;display:grid;grid-template-columns:44% 1fr;gap:1.4vw;padding:1.4vh 2vw;min-height:0}

/* hero — the one bold thing on this screen */
.hero{border-radius:20px;background:var(--surf-2);box-shadow:var(--sh);
      border:1px solid var(--line);display:flex;flex-direction:column;
      justify-content:center;padding:2vh 2.2vw;position:relative;overflow:hidden;min-height:0;
      transition:background .35s,border-color .35s}
.hero.ring{background:linear-gradient(130deg,var(--green) 0%,var(--green-2) 78%);
      border-color:var(--green);color:#fff;
      box-shadow:0 0 0 3px rgba(47,168,94,.3),0 14px 40px rgba(31,138,76,.3)}
.hero::after{content:'';position:absolute;inset:0;opacity:0;
      background:linear-gradient(100deg,transparent 32%,rgba(255,255,255,.14) 50%,transparent 68%)}
.hero.ring::after{opacity:1;animation:sweep 2.2s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-62%)}100%{transform:translateX(62%)}}
.hero-lbl{font-size:clamp(11px,1vw,16px);font-weight:800;letter-spacing:.14em;
          color:var(--green);margin-bottom:.6vh}
.hero.ring .hero-lbl{color:rgba(255,255,255,.9)}
.hero.ring .hero-rule{background:#fff}
.hero-num{font-family:Archivo;font-weight:900;font-size:clamp(54px,10.5vw,190px);line-height:.84;
          letter-spacing:-.045em;display:flex;position:relative;z-index:1}
.hero-num span{display:inline-block;animation:drop .42s cubic-bezier(.2,.9,.25,1) backwards}

const STATUS = {waiting:['Waiting','t-wait'], serving:['Serving','t-serv'], done:['Done','t-done'],
                held:['On hold','t-held'], skipped:['Skipped','t-skip'], cancelled:['Cancelled','t-skip']}

const initials = n => (n||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase() || '?'
const clock = d => d.toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true})
const dateLong = d => d.toLocaleDateString('en-PH',{weekday:'long',month:'long',day:'numeric',year:'numeric'})
const hhmm = s => s ? new Date(s).toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit',hour12:true}) : '—'
const ago = s => {
  if (!s) return '—'
  const m = Math.floor((Date.now() - new Date(s))/60000)
  if (m < 1) return 'just now'
  if (m < 60) return m + 'm ago'
  return Math.floor(m/60) + 'h ' + (m%60) + 'm ago'
}
const mmss = s => {
  if (!s) return '0:00'
  const t = Math.max(0, Math.floor((Date.now() - new Date(s))/1000))
  return Math.floor(t/60) + ':' + String(t%60).padStart(2,'0')
}
const Tag = ({s}) => { const [l,c] = STATUS[s]||['—','t-done']; return <span className={'tag '+c}>{l}</span> }

const Ico = ({n,s=16}) => {

    edit:<><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 013 3L12 15l-4 1 1-4z"/></>,
    trash:<><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></>,
    search:<><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></>,
    clock:<><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></>,

    right:<><path d="M9 6l6 6-6 6"/></>,
    dl:<><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></>,
    route:<><circle cx="6" cy="19" r="3"/><circle cx="18" cy="5" r="3"/><path d="M9 19h6a3 3 0 003-3V8"/></>,

  return <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor"

/* ─── toasts ─── */
const TCtx = createContext(()=>{})
const useToast = () => useContext(TCtx)
function Toasts({children}) {
  const [list,setList] = useState([])
  const push = useCallback((msg,kind='info')=>{
    const id = Math.random()
    setList(l=>[...l,{id,msg,kind}])
    setTimeout(()=>setList(l=>l.filter(t=>t.id!==id)), 3200)
  },[])
  return <TCtx.Provider value={push}>{children}
    <div className="toasts">{list.map(t=>
      <div key={t.id} className={'toast '+t.kind}>
        <Ico n={t.kind==='err'?'x':'check'} s={14}/>{t.msg}
      </div>)}
    </div>
  </TCtx.Provider>
}

/* ─── speech ─── */
function useSpeech() {
  const ready = useRef(false)
  const unlock = useCallback(()=>{
    if (ready.current || !('speechSynthesis' in window)) return
    const u = new SpeechSynthesisUtterance(' '); u.volume = 0
    window.speechSynthesis.speak(u); ready.current = true
  },[])
  const say = useCallback((number, where, repeat=2)=>{
    if (!('speechSynthesis' in window)) return
    window.speechSynthesis.cancel()
    const spoken = String(number).replace(/([A-Za-z])/g,'$1 ').replace(/(\d)/g,'$1 ').trim()
    for (let i=0;i<Math.max(1,repeat);i++){
      const u = new SpeechSynthesisUtterance(
        i===0 ? `Number ${spoken}. Please proceed to ${where}.` : `${spoken}. ${where}.`)
      u.lang='en-US'; u.rate=.82; u.pitch=1
      window.speechSynthesis.speak(u)
    }
  },[])
  return {unlock, say, isReady:()=>ready.current}
}

/* ════════════════════════════════════════════════════════════
   AUTH
   ════════════════════════════════════════════════════════════ */
function useAuth() {
  const [user,setUser] = useState(null)
  const [me,setMe] = useState(null)
  const [loading,setLoading] = useState(true)

  const load = async u => {
    const {data} = await sb.from('profiles').select('*').eq('id',u.id).maybeSingle()
    setMe(data); setUser(u)
  }
  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{
      if (session?.user) load(session.user).finally(()=>setLoading(false))
      else setLoading(false)
    })
    const {data:{subscription}} = sb.auth.onAuthStateChange((e,s)=>{
      if (e==='SIGNED_IN' && s?.user) load(s.user)
      if (e==='SIGNED_OUT') { setUser(null); setMe(null) }
    })
    return ()=>subscription.unsubscribe()
  },[])

  return {
    user, me, loading,
    isManager: ['admin','manager'].includes(me?.role),
    signIn: (email,password)=>sb.auth.signInWithPassword({email,password}),
    signOut: async ()=>{ try{ await sb.rpc('go_offline') }catch{}; await sb.auth.signOut() },
  }
}

/* ════════════════════════════════════════════════════════════
   SIGN IN
   ════════════════════════════════════════════════════════════ */
function SignIn({onSignIn}) {

    <div style={{minHeight:'100vh',display:'grid',placeItems:'center',padding:18,

          <div className="mark" style={{width:58,height:58,borderRadius:15,fontSize:25,margin:'0 auto 14px'}}>T</div>

          <div>
            <label className="lbl">Email</label>
            <input className="inp" type="email" required value={email} onChange={e=>setEmail(e.target.value)}
              placeholder="ikaw@tdmh.ph" autoComplete="username"/>
          </div>
          <div>
            <label className="lbl">Password</label>
            <input className="inp" type="password" required value={pass} onChange={e=>setPass(e.target.value)}
              placeholder="••••••••" autoComplete="current-password"/>
          </div>
          {err && <div style={{background:'var(--red-wash)',border:'1px solid #f0c9c7',
            color:'#8f2e2a',padding:'9px 12px',borderRadius:9,fontSize:13}}>{err}</div>}
          <button className="btn b-pri b-lg b-full" disabled={busy} style={{marginTop:3}}>
            {busy ? <div className="spin"/> : 'Sign in'}
          </button>
        </form>
        <p style={{textAlign:'center',color:'var(--faint)',fontSize:12,marginTop:16}}>
          For a TV: <code style={{color:'var(--muted)'}}>?tv=lab</code> &nbsp;·&nbsp;
          Kiosk: <code style={{color:'var(--muted)'}}>?kiosk=1</code>
        </p>
      </div>
    </div>
  )
}

/* ════════════════════════════════════════════════════════════
   TV DISPLAY
   ════════════════════════════════════════════════════════════ */
function TV({slug}) {
  const [data,setData]   = useState(null)
  const [now,setNow]     = useState(new Date())
  const [ring,setRing]   = useState(false)   // hero is flashing a fresh call
  const [litWin,setLit]  = useState(null)    // which counter row to highlight
  const [live,setLive]   = useState(false)
  const [armed,setArmed] = useState(false)
  const speech = useSpeech()
  const seen   = useRef(new Set())
  const audio  = useRef(null)
  const slugRef = useRef(slug)

  /* two-tone chime, the way a real queue board sounds before the voice */
  const chime = useCallback(()=>{
    try {
      if (!audio.current) audio.current = new (window.AudioContext||window.webkitAudioContext)()
      const ac = audio.current
      if (ac.state === 'suspended') ac.resume()
      const gain = ac.createGain()
      gain.connect(ac.destination)
      gain.gain.setValueAtTime(0.0001, ac.currentTime)
      ;[[880,0],[1174.7,0.17]].forEach(([hz,at])=>{
        const o = ac.createOscillator()
        o.type = 'sine'; o.frequency.value = hz
        const g = ac.createGain(); g.connect(gain)
        g.gain.setValueAtTime(0.0001, ac.currentTime+at)
        g.gain.exponentialRampToValueAtTime(0.22, ac.currentTime+at+0.02)
        g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+at+0.42)
        o.connect(g); o.start(ac.currentTime+at); o.stop(ac.currentTime+at+0.45)
      })
      gain.gain.setValueAtTime(1, ac.currentTime)
    } catch {}
  },[])

  const refresh = useCallback(async ()=>{
    const {data:b, error} = await sb.rpc('board',{p_slug:slugRef.current})
    if (!error && b) setData(b)
  },[])

  useEffect(()=>{
    refresh()
    const tick = setInterval(()=>setNow(new Date()),1000)
    const poll = setInterval(refresh, 20000)   // safety net only

    const ch = sb.channel('tv-'+slug)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'announcements'}, p=>{
        const a = p.new
        if (!a || seen.current.has(a.id)) return
        seen.current.add(a.id)
        refresh().then(()=>{
          setData(d=>{
            const onThisTv = !d || (d.rows||[]).some(r=>r.window_id === a.window_id)
            if (onThisTv) {
              setLit(a.window_id); setRing(true)
              chime()
              const rep = d?.settings?.announce_repeat ?? 2
              if (d?.settings?.voice_enabled !== false)
                setTimeout(()=>speech.say(a.number, a.window_name, rep), 620)
              setTimeout(()=>{ setRing(false); setLit(null) }, 10000)
            }
            return d
          })
        })
      })
      .on('postgres_changes',{event:'*',schema:'public',table:'tickets'}, ()=>refresh())
      .subscribe(s=>setLive(s==='SUBSCRIBED'))

    const mid = setInterval(()=>{
      const d = new Date()
      if (d.getHours()===0 && d.getMinutes()===1) location.reload()
    },60000)

    return ()=>{ clearInterval(tick); clearInterval(poll); clearInterval(mid); ch.unsubscribe() }
  },[slug, refresh, chime])

  const arm = () => { speech.unlock(); chime(); setArmed(true) }

  if (!data) return <div className="tv" style={{display:'grid',placeItems:'center'}}><div className="spin"/></div>

  const rows  = data.rows || []
  const last  = data.last_call && data.last_call !== null ? data.last_call : null
  const twoUp = rows.length > 6

  return (
    <div className="tv" onClick={arm}>
      {!armed && <button className="unlock" onClick={arm}>Tap anywhere to turn on sound</button>}

      <div className="tv-h">
        <div style={{display:'flex',alignItems:'center',gap:'1vw',minWidth:0}}>
          <div className="tv-mark">T</div>
          <div style={{minWidth:0}}>
            <div className="tv-name">{data.settings?.hospital_name || 'Taytay Doctors Multispecialty Hospital'}</div>
            <div className="tv-where">{data.display?.name || 'Queue Display'}</div>
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:'1.2vw',flexShrink:0}}>
          <span className="dot" style={{opacity:live?1:.25}}/>
          <div>
            <div className="tv-clock">{clock(now)}</div>
            <div className="tv-date">{dateLong(now)}</div>
          </div>
        </div>
      </div>

      <div className="tv-body">
        {/* ── hero: the number being called ── */}
        <div className={'hero '+(ring?'ring':'')}>
          {last ? (
            <>
              <div className="hero-lbl">
                {ring ? (last.kind==='recall' ? 'CALLING AGAIN' : 'NOW CALLING') : 'LAST CALLED'}
              </div>
              <div className="hero-num" key={last.id}
                   style={{color: ring ? '#fff' : (last.service_color || 'var(--indigo)')}}>
                {String(last.number).split('').map((c,i)=>(
                  <span key={i} style={{animationDelay:(i*55)+'ms'}}>{c}</span>
                ))}
              </div>
              <div className="hero-rule"/>
              <div className="hero-go">Please proceed to</div>
              <div className="hero-win">{last.window_name}</div>
              {last.service_name && <div className="hero-svc">{last.service_name}</div>}
            </>
          ) : (
            <div style={{textAlign:'center'}}>
              <div className="hero-idle">No one called yet</div>
              <div className="hero-idle-s">Please wait for your number.</div>
            </div>
          )}
        </div>

        {/* ── counter rail ── */}
        <div className="rail-wrap">
          <div className="rail-head"><span>COUNTER</span><span>NUMERO</span></div>
          <div className={'rail-rows '+(twoUp?'two':'')}>
            {rows.length === 0 && (
              <div style={{color:'var(--faint2)',fontSize:'clamp(12px,1.2vw,18px)',padding:'2vh .6vw'}}>
                No counter is open right now.
              </div>
            )}
            {rows.map(r=>(
              <div key={r.window_id}
                   className={'crow '+(litWin===r.window_id ? 'lit' : r.status==='serving' ? 'live' : '')}>
                <div style={{minWidth:0}}>
                  <div className="crow-w">{r.window_name}</div>
                  <div className="crow-s">{r.service_name || '—'}</div>
                </div>
                {r.number
                  ? <div className="crow-n" style={{color: litWin===r.window_id ? '#fff'
                                                         : r.status==='done' ? 'var(--faint2)'
                                                         : (r.service_color || 'var(--indigo)')}}>
                      {r.status==='serving' && <span className="pulse"/>}{r.number}
                    </div>
                  : <div className="crow-n idle">—</div>}
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="tv-foot">
        <span className="foot-k">RECENTLY CALLED</span>
        <div className="recent">
          {(data.recent||[]).length === 0
            ? <span style={{color:'var(--faint2)'}}>none yet</span>
            : data.recent.map((a,i)=>(
                <span key={i}><i>{a.number}</i> <span style={{opacity:.55}}>{a.window_name}</span></span>
              ))}
        </div>
        {data.waiting > 0 && (
          <span className="waitpill">{data.waiting} waiting</span>
        )}
      </div>
    </div>
  )
}

/* ════════════════════════════════════════════════════════════
   KIOSK
   ════════════════════════════════════════════════════════════ */
function Kiosk() {
  const [svcs,setSvcs]   = useState([])
  const [tk,setTk]       = useState(null)
  const [busy,setBusy]   = useState(false)
  const [note,setNote]   = useState('')
  const [now,setNow]     = useState(new Date())

  useEffect(()=>{
    sb.from('services').select('id,code,name,name_fil,color')
      .eq('is_active',true).eq('show_on_kiosk',true).order('sort_order')
      .then(({data})=>setSvcs(data||[]))
    sb.from('settings').select('kiosk_note').eq('id',1).maybeSingle()
      .then(({data})=>setNote(data?.kiosk_note||''))
    const t = setInterval(()=>setNow(new Date()),1000)
    return ()=>clearInterval(t)
  },[])

  const take = async svc => {
    if (busy) return
    setBusy(true)
    const {data,error} = await sb.rpc('issue_ticket',{ p_service_id: svc.id })
    setBusy(false)
    if (error) { alert('Could not get a number. Please ask a staff member.'); return }
    setTk({...data, service:svc})
    setTimeout(()=>setTk(null), 14000)
  }

  return (
    <div className="kio">
      <div className="kio-h">
        <div className="kio-mark">T</div>
        <h1 className="kio-t">Taytay Doctors Multispecialty Hospital</h1>
        <p className="kio-s">{dateLong(now)} · {clock(now)}</p>
      </div>

      <div className="kio-b">
        <div className="kio-ask">What do you need today?</div>
        <div className="svcs">
          {svcs.map(s=>(
            <button key={s.id} className="svc" onClick={()=>take(s)} disabled={busy}>
              <div className="svc-bar" style={{background:s.color}}/>
              <div className="svc-n">{s.name_fil || s.name}</div>
              <div className="svc-f">{s.name_fil ? s.name : s.code}</div>
            </button>
          ))}
          {svcs.length===0 && (
            <div style={{gridColumn:'1/-1',textAlign:'center',color:'var(--faint)',padding:40}}>
              No services are available right now.
            </div>
          )}
        </div>
      </div>

      {tk && (
        <div className="ticket" onClick={()=>setTk(null)}>
          <div className="ticket-c" onClick={e=>e.stopPropagation()}>
            <div style={{fontSize:12.5,fontWeight:700,color:'var(--muted)'}}>Taytay Doctors Multispecialty Hospital</div>
            <div className="ticket-n" style={{color:tk.service?.color||'var(--indigo)'}}>{tk.number}</div>
            <div style={{fontSize:16,fontWeight:700}}>{tk.service?.name_fil || tk.service?.name}</div>
            <div style={{marginTop:17,padding:'11px 14px',background:'var(--paper)',borderRadius:11,
                         fontSize:13,color:'var(--muted)'}}>{note}</div>
            <div style={{fontSize:12,color:'var(--faint)',marginTop:11}}>
              {new Date(tk.created_at||Date.now()).toLocaleString('en-PH',
                {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:true})}
            </div>
            <button className="btn b-pri b-lg b-full" style={{marginTop:17}} onClick={()=>setTk(null)}>
              Thank you
            </button>
          </div>
        </div>
      )}
    </div>
  )
}

/* ════════════════════════════════════════════════════════════
   COUNTER — the daily staff screen
   ════════════════════════════════════════════════════════════ */
function Counter({me}) {
  const toast = useToast()
  const [wins,setWins]   = useState([])
  const [win,setWin]     = useState(null)
  const [waiting,setWaiting] = useState([])
  const [serving,setServing] = useState(null)
  const [done,setDone]   = useState([])
  const [tab,setTab]     = useState('ongoing')
  const [history,setHistory] = useState(false)
  const [q,setQ]         = useState('')
  const [busy,setBusy]   = useState(false)
  const [move,setMove]   = useState(null)
  const [adding,setAdding] = useState(false)
  const [detail,setDetail] = useState(null)   // ticket_detail payload
  const [auto,setAuto]   = useState(()=>localStorage.getItem('tdmhq-auto')==='1')
  const [, bump]         = useState(0)
  const chRef = useRef(null)
  const autoRef = useRef(auto)
  useEffect(()=>{ autoRef.current = auto; localStorage.setItem('tdmhq-auto', auto?'1':'0') },[auto])

  /* counters this person may sit at */
  useEffect(()=>{
    (async ()=>{
      let ids = null
      if (!['admin','manager'].includes(me.role)) {
        const {data} = await sb.from('window_staff').select('window_id').eq('user_id',me.id)
        ids = (data||[]).map(r=>r.window_id)
      }
      let qy = sb.from('windows').select('id,name,short_name').eq('is_active',true).order('sort_order')
      if (ids) qy = ids.length ? qy.in('id',ids) : qy.eq('id','00000000-0000-0000-0000-000000000000')
      const {data:w} = await qy
      setWins(w||[])
      const pick = (w||[]).find(x=>x.id===localStorage.getItem('tdmhq-window'))
      if (pick) setWin(pick)
    })()
  },[me.id])

  const load = useCallback(async wid=>{
    if (!wid) return
    const {data:svc} = await sb.from('window_services').select('service_id').eq('window_id',wid)
    const ids = (svc||[]).map(r=>r.service_id)
    if (!ids.length) { setWaiting([]); setServing(null); setDone([]); return }
    const today = new Date().toISOString().slice(0,10)
    const cols = '*,services!tickets_service_id_fkey(code,name,color)'
    const [w,s,dn] = await Promise.all([
      sb.from('tickets').select(cols).eq('ticket_date',today).in('service_id',ids)
        .in('status',['waiting','held']).order('sort_at'),
      sb.from('tickets').select(cols).eq('ticket_date',today).eq('window_id',wid)
        .eq('status','serving').maybeSingle(),
      sb.from('tickets').select(cols).eq('ticket_date',today).eq('window_id',wid)
        .in('status',['done','skipped']).order('completed_at',{ascending:false}).limit(40),
    ])
    setWaiting(w.data||[]); setServing(s.data||null); setDone(dn.data||[])
  },[])

  /* detail pane follows whatever is being served */
  useEffect(()=>{
    if (!serving) { setDetail(null); return }
    sb.rpc('ticket_detail',{p_ticket_id:serving.id}).then(({data})=>setDetail(data||null))
  },[serving?.id, serving?.status, serving?.journey_step, serving?.recall_count])

  useEffect(()=>{
    if (!win) return
    localStorage.setItem('tdmhq-window', win.id)
    load(win.id)
    sb.rpc('beat',{p_window_id:win.id})
    const beat  = setInterval(()=>sb.rpc('beat',{p_window_id:win.id}), 60000)
    const timer = setInterval(()=>bump(n=>n+1), 1000)
    chRef.current?.unsubscribe()
    const ch = sb.channel('counter-'+win.id)
      .on('postgres_changes',{event:'*',schema:'public',table:'tickets'},()=>load(win.id))
      .subscribe()
    chRef.current = ch
    return ()=>{ clearInterval(beat); clearInterval(timer); ch.unsubscribe() }
  },[win?.id, load])

  const next = async () => {
    if (!win || busy) return
    setBusy(true)
    const {data,error} = await sb.rpc('call_next',{p_window_id:win.id})
    setBusy(false)
    if (error) return toast(error.message,'err')
    if (!data) return toast('No one is waiting.','info')
    toast('Called '+data.number,'ok')
  }

  const callThis = async t => {
    setBusy(true)
    const {error} = await sb.rpc('call_ticket',{p_ticket_id:t.id,p_window_id:win.id})
    setBusy(false)
    if (error) return toast(error.message,'err')
    toast('Called '+t.number,'ok')
  }

  const act = async what => {
    if (!serving || busy) return
    setBusy(true)
    const {error} = what==='recall'
      ? await sb.rpc('recall_ticket',{p_ticket_id:serving.id})
      : await sb.rpc('set_ticket_status',{p_ticket_id:serving.id, p_status:what})
    setBusy(false)
    if (error) return toast(error.message,'err')
    toast({recall:'Called again', done:'Completed', held:'On hold', skipped:'Skipped'}[what],'ok')
    if (what!=='recall' && autoRef.current) setTimeout(next, 700)
  }

  /* keyboard: space next · R recall · D done · H hold · S skip */
  useEffect(()=>{
    const onKey = e => {
      if (e.target.matches('input,textarea,select') || move || adding) return
      const k = e.key.toLowerCase()
      if (k===' ')      { e.preventDefault(); next() }
      else if (serving && k==='r') act('recall')
      else if (serving && k==='d') act('done')
      else if (serving && k==='h') act('held')
      else if (serving && k==='s') act('skipped')
    }
    window.addEventListener('keydown',onKey)
    return ()=>window.removeEventListener('keydown',onKey)
  })

  /* ── pick a counter ── */
  if (!win) {
    const hour = new Date().getHours()
    return (
      <div className="mid" style={{padding:22}}>
        <div style={{width:'100%',maxWidth:430}}>
          <div style={{textAlign:'center',marginBottom:22}}>
            <h1 className="h1">{hour<12?'Good morning':hour<18?'Good afternoon':'Good evening'}, {(me.full_name||'').split(' ')[0]}</h1>
            <p className="sub">Which counter are you serving at today?</p>
          </div>
          <div className="card" style={{padding:6,maxHeight:380,overflowY:'auto'}}>
            {wins.length===0 && <div className="empty"><div className="empty-t">No counter assigned to you</div>
              <div>Ask an admin to assign you to one.</div></div>}
            {wins.map(w=>(
              <button key={w.id} className="b-out" onClick={()=>setWin(w)}
                style={{display:'flex',width:'100%',alignItems:'center',justifyContent:'space-between',
                        padding:'13px 15px',borderRadius:11,margin:4,border:'1.5px solid var(--line)'}}>
                <span style={{fontWeight:600}}>{w.name}</span><Ico n="right" s={16}/>
              </button>
            ))}
          </div>
        </div>
      </div>
    )
  }

  const shown = (tab==='ongoing' ? waiting : (serving ? [serving] : [])).filter(t=>{
    const s = q.trim().toLowerCase()
    return !s || t.number.toLowerCase().includes(s)
      || (t.patient_name||'').toLowerCase().includes(s)
      || (t.tags||[]).some(g=>g.toLowerCase().includes(s))
  })

  return (
    <div className="ws">
      {/* ─── queue list ─── */}
      <div className="ws-l">
        <div className="ws-h">
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
            <div>
              <div style={{fontSize:11.5,fontWeight:700,color:'var(--faint)'}}>COUNTER</div>
              <div style={{fontWeight:700,fontSize:14.5}}>{win.name}</div>
            </div>
            <button className="btn b-ghost b-sm" onClick={()=>{setWin(null);sb.rpc('go_offline')}}>Change</button>
          </div>
          <div className="segs">
            <button className={'seg '+(tab==='serving'?'on':'')} onClick={()=>setTab('serving')}>
              Current Serving <span className="cnt">{serving?1:0}</span>
            </button>
            <button className={'seg '+(tab==='ongoing'?'on':'')} onClick={()=>setTab('ongoing')}>
              On-going Queue {waiting.length>0 && <span className="cnt">{waiting.length}</span>}
            </button>
          </div>
          <div style={{position:'relative',marginTop:9}}>
            <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'var(--faint)'}}>
              <Ico n="search" s={13}/></span>
            <input className="inp" style={{paddingLeft:30,paddingTop:7,paddingBottom:7,fontSize:13}}
                   value={q} onChange={e=>setQ(e.target.value)} placeholder="Number, name or tag…"/>
          </div>
        </div>

        <div className="ws-list">
          {shown.length===0 && (
            <div className="empty">
              <div className="empty-i"><Ico n="clock" s={20}/></div>
              <div className="empty-t">{tab==='ongoing'?'No one waiting':'Not serving anyone'}</div>
              <div style={{fontSize:13}}>{tab==='ongoing'
                ? 'New tickets appear here as they are taken.'
                : 'Press Next to call the first person in the queue.'}</div>
            </div>
          )}
          {shown.map(t=>(
            <div key={t.id} className="tk">
              <div className="tk-top">
                <span className="num tk-n">{t.number}</span>
                <span className="tk-s" style={{color:t.services?.color}}>{t.services?.name}</span>
                {t.journey_step>1 && <span className="tag t-step">Step {t.journey_step}</span>}
                {t.status==='held' && <Tag s="held"/>}
              </div>
              {t.patient_name && <div className="tk-m">{t.patient_name}</div>}
              <div className="tk-m">{tab==='ongoing' ? 'Waiting time · '+ago(t.sort_at)
                                                       : 'Called · '+hhmm(t.called_at)}</div>
              {(t.tags||[]).length>0 && (
                <div className="chips">{t.tags.map(g=><span key={g} className="chip">{g}</span>)}</div>
              )}
              {tab==='ongoing' && (
                <button className="btn b-out b-sm" style={{marginTop:8,width:'100%'}}
                        onClick={()=>callThis(t)} disabled={busy}>Call this</button>
              )}
            </div>
          ))}
        </div>

        <div className="ws-f">
          <button className="btn b-out b-full" onClick={()=>setAdding(true)}>
            <Ico n="plus" s={15}/>Add queue</button>
          <button className="btn b-pri b-lg b-full" onClick={next} disabled={busy}>
            {busy ? <div className="spin"/> : <><Ico n="next" s={17}/>Next
              <span className="kbd kbd-on">space</span></>}
          </button>
        </div>
      </div>

      {/* ─── serving + detail ─── */}
      <div className="ws-r">
        <div className="ws-bar">
          <div style={{fontWeight:700,fontSize:15}}>{win.name}</div>
          <div style={{display:'flex',alignItems:'center',gap:14}}>
            <label className="autosw" title="After you finish a queue, the next one is called automatically">
              <span>Auto-serve</span>
              <button className={'sw '+(auto?'on':'')} onClick={()=>setAuto(a=>!a)}><i/></button>
            </label>
            <button className="btn b-out b-sm" onClick={()=>setHistory(true)}>
              <Ico n="clock" s={14}/>Queue history</button>
            <span className="live"><span className="dot"/>Live</span>
          </div>
        </div>

        {serving ? (
          <>
            <div className="detail">
              {/* centre: the ticket */}
              <div className="detail-mid">
                <div className="card tkcard">
                  <div className="tkcard-k">QUEUE NUMBER</div>
                  <div className="num tkcard-n" style={{color:serving.services?.color||'var(--indigo)'}}>
                    {serving.number}</div>
                  <div className="tkcard-rule"/>
                  <dl className="kv">
                    <dt>Service</dt>
                    <dd style={{color:serving.services?.color,fontWeight:700}}>{serving.services?.name}</dd>
                    {serving.patient_name && <><dt>Patient</dt><dd>{serving.patient_name}</dd></>}
                    <dt>Queued at</dt><dd>{hhmm(serving.created_at)}</dd>
                    <dt>Called at</dt><dd>{hhmm(serving.called_at)}</dd>
                    {serving.recall_count>0 && <><dt>Called again</dt><dd>{serving.recall_count}×</dd></>}
                    {serving.journey_step>1 && <><dt>Journey step</dt><dd>Step {serving.journey_step}</dd></>}
                  </dl>
                  {serving.note && <div className="tknote">{serving.note}</div>}
                  <TagEditor ticket={serving}
                    onSaved={()=>toast('Tags updated','ok')}
                    onError={m=>toast(m,'err')}/>
                </div>
              </div>

              {/* right: time, journey, log */}
              <div className="detail-side">
                <div className="card sidecard" style={{display:'flex',alignItems:'center',
                     justifyContent:'space-between',gap:10}}>
                  <span className="side-k" style={{color:'var(--green)'}}>SERVING TIME</span>
                  <span className="num" style={{fontSize:19,color:'var(--green)'}}>{mmss(serving.called_at)}</span>
                </div>

                {detail && (detail.path||[]).length>1 && (
                  <div className="card sidecard">
                    <div className="side-k">PATIENT JOURNEY</div>
                    <div className="path">
                      {detail.path.map((p,i)=>{
                        const last = i===detail.path.length-1
                        return (
                          <div key={i} className="path-row">
                            <span className="path-dot" style={{background:last?'var(--indigo)':'var(--green)'}}/>
                            <div style={{flex:1,minWidth:0}}>
                              <div className="path-n">Step {i+1}</div>
                              <div className="path-s" style={{color:p.service_color}}>{p.service_name}</div>
                            </div>
                            <span className="path-t">{last?'Here now':'Done'}</span>
                          </div>
                        )
                      })}
                    </div>
                  </div>
                )}

                <div className="card sidecard" style={{flex:1,minHeight:0,display:'flex',flexDirection:'column'}}>
                  <div className="side-k">TIMELINE</div>
                  <div className="tl">
                    {(detail?.events||[]).length===0 && (
                      <div style={{fontSize:12.5,color:'var(--faint)'}}>Nothing logged yet.</div>
                    )}
                    {(detail?.events||[]).map((e,i)=>(
                      <div key={i} className="tl-row">
                        <span className="tl-dot"/>
                        <div style={{minWidth:0}}>
                          <div className="tl-a">{EVENT[e.action] || e.action}</div>
                          <div className="tl-m">
                            {hhmm(e.created_at)}
                            {e.window_name  && ' · ' + e.window_name}
                            {e.service_name && ' · ' + e.service_name}
                          </div>
                          {e.actor_name && <div className="tl-m">by {e.actor_name}</div>}
                          {e.detail && <div className="tl-d">{e.detail}</div>}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>

            <div className="now-acts">
              <button className="btn b-out" onClick={()=>act('recall')} disabled={busy}>
                <Ico n="bell" s={15}/>Call again<span className="kbd">R</span></button>
              <button className="btn b-out" onClick={()=>act('held')} disabled={busy}>
                <Ico n="pause" s={15}/>Hold<span className="kbd">H</span></button>
              <button className="btn b-out" onClick={()=>act('skipped')} disabled={busy}>
                <Ico n="skip" s={15}/>Skip<span className="kbd">S</span></button>
              <button className="btn b-out" onClick={()=>setMove({kind:'service'})} disabled={busy}>
                <Ico n="route" s={15}/>Send to another dept</button>
              <div style={{flex:1}}/>
              <button className="btn b-go b-lg" onClick={()=>act('done')} disabled={busy}>
                <Ico n="check" s={17}/>Complete<span className="kbd kbd-on">D</span></button>
            </div>
          </>
        ) : (
          <div className="empty" style={{flex:1}}>
            <div className="empty-i" style={{width:58,height:58}}><Ico n="desk" s={25}/></div>
            <div className="empty-t" style={{fontSize:16}}>Not serving anyone</div>
            <div>Press <b>Next</b> to call the first person in the queue.</div>
            <button className="btn b-pri b-lg" style={{marginTop:14}} onClick={next} disabled={busy}>
              <Ico n="next" s={17}/>Call next in queue</button>
          </div>
        )}
      </div>

      {move && serving && (
        <MoveModal ticket={serving} kind={move.kind} windowId={win.id}
          onClose={()=>setMove(null)} onDone={m=>{ setMove(null); toast(m,'ok') }}/>
      )}
      {adding && (
        <AddQueue windowId={win.id} onClose={()=>setAdding(false)}
          onDone={n=>{ setAdding(false); toast('Queue added: '+n,'ok') }}/>
      )}
      {history && <History rows={done} onClose={()=>setHistory(false)}/>}
    </div>
  )
}

const EVENT = {
  issue:'Queue added', call:'Called', recall:'Called again',
  done:'Completed', held:'Put on hold', skipped:'Skipped', cancelled:'Cancelled',
  waiting:'Returned to queue', move_service:'Sent to another department',
  move_window:'Moved to another counter', tags:'Tags changed',
}

/* ─── what this counter has finished today ─── */
function History({rows, onClose}) {
  const [q,setQ] = useState('')
  const shown = rows.filter(t=>{
    const v = q.trim().toLowerCase()
    return !v || t.number.toLowerCase().includes(v)
      || (t.patient_name||'').toLowerCase().includes(v)
  })
  return (
    <div className="ov" onClick={onClose}>
      <div className="md" style={{maxWidth:560}} onClick={e=>e.stopPropagation()}>

/* ─── tags on the serving ticket ─── */
function TagEditor({ticket, onSaved, onError}) {
  const [tags,setTags] = useState(ticket.tags||[])
  const [open,setOpen] = useState(false)
  const [draft,setDraft] = useState('')
  useEffect(()=>{ setTags(ticket.tags||[]); setOpen(false) },[ticket.id])

  const save = async next => {
    setTags(next)
    const {error} = await sb.rpc('set_ticket_tags',{p_ticket_id:ticket.id, p_tags:next})
    if (error) { onError(error.message); setTags(ticket.tags||[]) } else onSaved()
  }
  const add = e => {
    e.preventDefault()
    const v = draft.trim().toUpperCase()
    if (!v || tags.includes(v)) { setDraft(''); return }
    save([...tags, v]); setDraft(''); setOpen(false)
  }
  return (
    <div className="tagbox">
      <div className="side-k" style={{marginBottom:7}}>TAGS</div>
      <div className="chips">
        {tags.map(g=>(
          <span key={g} className="chip chip-x">{g}
            <button onClick={()=>save(tags.filter(x=>x!==g))} aria-label={'Remove '+g}>
              <Ico n="x" s={11}/></button>
          </span>
        ))}
        {open ? (
          <form onSubmit={add} style={{display:'inline-flex',gap:5}}>
            <input className="inp" autoFocus value={draft} onChange={e=>setDraft(e.target.value)}
                   onBlur={()=>!draft && setOpen(false)}
                   style={{width:180,padding:'4px 9px',fontSize:12}} placeholder="e.g. DR. DELA PAZ"/>
          </form>
        ) : (
          <button className="chip chip-add" onClick={()=>setOpen(true)}>
            <Ico n="plus" s={11}/>Add tag</button>
        )}
      </div>
    </div>
  )
}

/* ─── add a walk-in queue from the counter ─── */
function AddQueue({windowId, onClose, onDone}) {
  const [svcs,setSvcs] = useState([])
  const [svc,setSvc]   = useState('')
  const [name,setName] = useState('')
  const [note,setNote] = useState('')
  const [tags,setTags] = useState([])
  const [draft,setDraft] = useState('')
  const [busy,setBusy] = useState(false)
  const [err,setErr]   = useState('')

  useEffect(()=>{
    sb.from('window_services').select('services!inner(id,code,name,name_fil,color)')
      .eq('window_id',windowId)
      .then(({data})=>{
        const list = (data||[]).map(r=>r.services).filter(Boolean)
        setSvcs(list)
        if (list.length===1) setSvc(list[0].id)
      })
  },[windowId])

  const addTag = e => {
    e.preventDefault()
    const v = draft.trim().toUpperCase()
    if (v && !tags.includes(v)) setTags(t=>[...t,v])
    setDraft('')
  }
  const go = async e => {
    e.preventDefault()
    if (!svc) { setErr('Choose a service first.'); return }
    setBusy(true); setErr('')
    const {data,error} = await sb.rpc('issue_ticket',{
      p_service_id:svc, p_patient_name:name||null, p_tags:tags, p_note:note||null
    })
    setBusy(false)
    if (error) return setErr(error.message)
    onDone(data.number)
  }

  return (
    <div className="ov" onClick={onClose}>
      <div className="md" onClick={e=>e.stopPropagation()}>
        <div className="md-h">
          <div>
            <div className="md-t">Add queue</div>
            <div className="md-s">For a walk-in who did not use the kiosk.</div>
          </div>
          <button className="btn b-ghost b-ico" onClick={onClose}><Ico n="x" s={17}/></button>
        </div>
        <form onSubmit={go} className="md-b">
          <div style={{display:'flex',flexDirection:'column',gap:13}}>
            <div>
              <label className="lbl">Service</label>
              <select className="inp" value={svc} onChange={e=>setSvc(e.target.value)} required>
                <option value="">Choose a service</option>
                {svcs.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
              </select>
            </div>
            <div>
              <label className="lbl">Patient name <span style={{fontWeight:500,color:'var(--faint)'}}>(optional)</span></label>
              <input className="inp" value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Maria Santos"/>
            </div>
            <div>
              <label className="lbl">Note <span style={{fontWeight:500,color:'var(--faint)'}}>(optional)</span></label>
              <input className="inp" value={note} onChange={e=>setNote(e.target.value)} placeholder="e.g. for CBC and urinalysis"/>
            </div>
            <div>
              <label className="lbl">Tags</label>
              <div className="chips" style={{marginBottom:7}}>
                {tags.map(g=>(
                  <span key={g} className="chip chip-x">{g}
                    <button type="button" onClick={()=>setTags(t=>t.filter(x=>x!==g))}><Ico n="x" s={11}/></button>
                  </span>
                ))}
              </div>
              <div style={{display:'flex',gap:7}}>
                <input className="inp" value={draft} onChange={e=>setDraft(e.target.value)}
                       onKeyDown={e=>{ if(e.key==='Enter'){ addTag(e) } }}
                       placeholder="e.g. DR. DELA PAZ — ORTHO"/>
                <button type="button" className="btn b-out" onClick={addTag}>Add</button>
              </div>
            </div>
            {err && <div style={{background:'var(--red-wash)',border:'1px solid #f0c9c7',color:'#8f2e2a',
              padding:'9px 12px',borderRadius:9,fontSize:13}}>{err}</div>}
          </div>
          <div className="md-f">
            <button type="button" className="btn b-out" style={{flex:1}} onClick={onClose}>Cancel</button>
            <button className="btn b-pri" style={{flex:1}} disabled={busy}>
              {busy ? <div className="spin"/> : 'Get a number'}
            </button>
          </div>
        </form>
      </div>
    </div>
  )
}

/* ─── move a patient to the next department (keeps the number) ─── */
function MoveModal({ticket, kind, windowId, onClose, onDone}) {
  const [items,setItems] = useState([])
  const [pick,setPick]   = useState(null)
  const [note,setNote]   = useState('')
  const [busy,setBusy]   = useState(false)
  const [err,setErr]     = useState('')

  useEffect(()=>{
    if (kind==='service')
      sb.from('services').select('id,code,name,name_fil,color').eq('is_active',true)
        .neq('id',ticket.service_id).order('sort_order').then(({data})=>setItems(data||[]))
    else
      sb.from('windows').select('id,name').eq('is_active',true)
        .neq('id',windowId).order('sort_order').then(({data})=>setItems(data||[]))
  },[kind])

  const go = async () => {
    if (!pick) return
    setBusy(true); setErr('')
    const {error} = kind==='service'
      ? await sb.rpc('move_service',{p_ticket_id:ticket.id,p_service_id:pick.id,p_note:note||null})
      : await sb.rpc('move_window',{p_ticket_id:ticket.id,p_window_id:pick.id,p_note:note||null})
    setBusy(false)
    if (error) return setErr(error.message)
    onDone(`${ticket.number} → ${pick.name}`)
  }

  return (
    <div className="ov" onClick={onClose}>
      <div className="md" onClick={e=>e.stopPropagation()}>
        <div className="md-h">
          <div>
            <div className="md-t">Send to another department</div>
            <div className="md-s"><b className="num">{ticket.number}</b> keeps the same number.</div>
          </div>
          <button className="btn b-ghost b-ico" onClick={onClose}><Ico n="x" s={17}/></button>
        </div>
        <div className="md-b">
          <div style={{maxHeight:260,overflowY:'auto',display:'flex',flexDirection:'column',gap:4}}>
            {items.map(it=>(
              <button key={it.id} onClick={()=>setPick(it)}
                style={{display:'flex',alignItems:'center',gap:11,padding:'11px 13px',textAlign:'left',
                  border:`1.5px solid ${pick?.id===it.id?'var(--indigo)':'var(--line)'}`,borderRadius:10,
                  background:pick?.id===it.id?'var(--indigo-wash)':'#fff'}}>
                <span style={{width:17,height:17,borderRadius:'50%',flexShrink:0,display:'grid',placeItems:'center',
                  border:`2px solid ${pick?.id===it.id?'var(--indigo)':'#ccccdd'}`}}>
                  {pick?.id===it.id && <span style={{width:7,height:7,borderRadius:'50%',background:'var(--indigo)'}}/>}
                </span>
                {it.color && <span style={{width:9,height:9,borderRadius:'50%',background:it.color,flexShrink:0}}/>}
                <span style={{fontWeight:600,fontSize:13.5}}>{it.name_fil || it.name}</span>
              </button>
            ))}
          </div>
          <div style={{marginTop:14}}>
            <label className="lbl">Note for the next counter</label>
            <input className="inp" value={note} onChange={e=>setNote(e.target.value)}
                   placeholder="e.g. for CBC and urinalysis"/>
          </div>
          {err && <div style={{background:'var(--red-wash)',border:'1px solid #f0c9c7',color:'#8f2e2a',
            padding:'9px 12px',borderRadius:9,fontSize:13,marginTop:12}}>{err}</div>}
          <div className="md-f">
            <button className="btn b-out" style={{flex:1}} onClick={onClose}>Back</button>
            <button className="btn b-pri" style={{flex:1}} disabled={!pick||busy} onClick={go}>
              {busy ? <div className="spin"/> : 'Send'}
            </button>
          </div>
        </div>
      </div>
    </div>
  )
}

function Board({me}) {
  const [d,setD]     = useState(null)
  const [now,setNow] = useState(new Date())

  const load = useCallback(async ()=>{
    const {data,error} = await sb.rpc('dashboard')
    if (!error && data) setD(data)
  },[])

  useEffect(()=>{
    load()
    const t  = setInterval(()=>setNow(new Date()),1000)
    const ch = sb.channel('admin-board')
      .on('postgres_changes',{event:'*',schema:'public',table:'tickets'},()=>load())
      .on('postgres_changes',{event:'*',schema:'public',table:'sessions'},()=>load())
      .subscribe()
    const slow = setInterval(load, 30000)
    return ()=>{ clearInterval(t); clearInterval(slow); ch.unsubscribe() }
  },[load])

  if (!d) return <div className="mid"><div className="spin d" style={{width:28,height:28,borderWidth:3}}/></div>

  const T = d.totals || {}
  const hour = now.getHours()
  const mins = n => n == null ? '—' : n < 1 ? 'under a minute' : n + ' min'

  const kpi = [
    {k:'Waiting', v:T.waiting ?? 0, sub:'Avg. waiting time', val:mins(T.avg_wait_min),
     ic:'clock', c:'var(--gold)',   bg:'var(--gold-wash)'},
    {k:'Currently serving', v:T.serving ?? 0, sub:'Avg. serving time', val:mins(T.avg_serve_min),
     ic:'desk',  c:'var(--indigo)', bg:'var(--indigo-wash)'},
    {k:'Completed', v:T.done ?? 0, sub:'Tickets issued today', val:(T.issued ?? 0) + '',
     ic:'users', c:'var(--green)',  bg:'var(--green-wash)'},

    ['Completed', T.done ?? 0,      'var(--green)'],
    ['Skipped',   T.skipped ?? 0,   'var(--gold)'],
    ['Cancelled', T.cancelled ?? 0, 'var(--red)'],
  ]

  return (
    <>
      <div className="head">
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:16}}>

            <h1 className="h1">
              {dateLong(now)} — {clock(now)}

            <p className="sub">

          <span className="live"><span className="dot"/>Live</span>
        </div>

        {/* ── headline numbers ── */}

          {kpi.map(x=>(
            <div key={x.k} className="card kpi">
              <div style={{flex:1,minWidth:0}}>
                <div className="kpi-k">{x.k}</div>
                <div className="num kpi-v">{x.v}</div>
                <div className="kpi-sub">{x.sub} <b>{x.val}</b></div>
              </div>
              <div className="kpi-ic" style={{background:x.bg,color:x.c}}><Ico n={x.ic} s={19}/></div>
            </div>
          ))}
        </div>

        <div className="two-col">
          {/* ── left: who is on the floor ── */}
          <div style={{display:'flex',flexDirection:'column',gap:13}}>
            <div className="card kpi">
              <div>
                <div className="kpi-k">On the floor</div>
                <div className="num kpi-v">{d.staff_on} <span style={{fontSize:17,color:'var(--muted)',
                  fontFamily:'Figtree',fontWeight:600}}>of {d.staff_total}</span></div>
                <div className="kpi-sub">staff signed in at a counter</div>
              </div>
              <div className="kpi-ic" style={{background:'var(--indigo-wash)',color:'var(--indigo)'}}>
                <Ico n="users" s={19}/></div>
            </div>

            <div className="card">
              <div className="card-h">
                <span className="card-t">Occupied counters</span>
                <span style={{fontSize:12,color:'var(--muted)'}}>{(d.occupied||[]).length} open</span>
              </div>
              <div style={{padding:8,maxHeight:430,overflowY:'auto'}}>
                {(d.occupied||[]).length===0 && (
                  <div className="empty" style={{padding:30}}>
                    <div className="empty-i"><Ico n="desk" s={20}/></div>
                    <div className="empty-t">No counter is open</div>
                    <div style={{fontSize:13}}>Staff appear here once they sit at a counter.</div>
                  </div>

                {(d.occupied||[]).map(o=>(
                  <div key={o.window_id} className="occ">
                    <div style={{minWidth:0,flex:1}}>
                      <div className="occ-w">{o.window_name}</div>
                      <div className="occ-line">
                        <span className="pip occ-pip">{initials(o.staff_name)}</span>
                        {o.number ? (
                          <span><b>{o.staff_name}</b> — <span className="num">{o.number}</span>
                            <span style={{color:o.service_color}}> · {o.service_name}</span></span>

              <div className="card-h"><span className="card-t">Services today</span></div>

                  <table className="tb">
                    <thead><tr>

                      <th style={{textAlign:'center'}}>Waiting</th>
                      <th style={{textAlign:'center'}}>Serving</th>
                      <th style={{textAlign:'center'}}>Done</th>
                      <th style={{textAlign:'right'}}>Avg. wait</th>
                      <th style={{textAlign:'right'}}>Avg. serve</th>
                    </tr></thead>
                    <tbody>{d.services.map(s=>(
                      <tr key={s.name}>
                        <td><span style={{display:'inline-flex',alignItems:'center',gap:8}}>
                          <span style={{width:8,height:8,borderRadius:'50%',background:s.color,flexShrink:0}}/>
                          <span style={{fontWeight:600}}>{s.name}</span></span></td>
                        <td style={{textAlign:'center',fontWeight:700,color:s.waiting?'var(--gold)':'var(--faint)'}}>{s.waiting||'—'}</td>

// Every swatch clears 4.5:1 against white, so a service colour can never
// become unreadable as a queue number on the TV.
const SWATCH = ['#676bcc','#8164c5','#2b7ab6','#4775bb','#9c58be','#a258ad',
                '#1b8550','#2a8546','#158378','#1b7f99','#bf498c','#ce453c',
                '#986d19','#a66627','#48822b','#3e8436']

function Services() {
  const toast = useToast()
  const [list,setList] = useState([])
  const [sel,setSel]   = useState(null)
  const [draft,setDraft] = useState({})
  const [adding,setAdding] = useState(false)
  const [nw,setNw] = useState({code:'',name:''})

  const load = async (keep) => {
    const {data} = await sb.from('services').select('*').order('sort_order')
    setList(data||[])
    if (keep) setSel((data||[]).find(s=>s.id===keep)||null)
    else if (!sel && data?.length) setSel(data[0])
  }
  useEffect(()=>{ load() },[])
  useEffect(()=>{ setDraft({}) },[sel?.id])

  const v = k => draft[k] !== undefined ? draft[k] : sel?.[k]
  const set = (k,val) => setDraft(d=>({...d,[k]:val}))
  const dirty = Object.keys(draft).length > 0

  const save = async () => {
    const {error} = await sb.from('services').update({
      code:v('code'), name:v('name'), name_fil:v('name_fil'), color:v('color'),
      is_active:v('is_active'), show_on_kiosk:v('show_on_kiosk'),
      sort_order:Number(v('sort_order'))||0,
    }).eq('id',sel.id)
    if (error) return toast(error.message,'err')
    setDraft({}); await load(sel.id); toast('Saved','ok')
  }
  const add = async e => {
    e.preventDefault()
    const code = nw.code.trim().toUpperCase()
    if (!code || !nw.name.trim()) return
    const {data,error} = await sb.from('services')
      .insert({code, name:nw.name.trim(), sort_order:(list.length+1)*10}).select().single()
    if (error) return toast(error.message,'err')
    setNw({code:'',name:''}); setAdding(false); await load(data.id); toast('Added','ok')
  }
  const remove = async () => {
    if (!confirm(`Delete "${sel.name}"? This fails if it already has tickets today.`)) return
    const {error} = await sb.from('services').delete().eq('id',sel.id)
    if (error) return toast('Cannot delete — a ticket or counter still uses it.','err')
    setSel(null); await load(); toast('Deleted','ok')
  }

  return (
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      <div style={{width:252,flexShrink:0,background:'#fff',borderRight:'1px solid var(--line)',
                   display:'flex',flexDirection:'column'}}>
        <div style={{padding:'15px 16px',borderBottom:'1px solid var(--line-2)'}}>
          <div style={{fontWeight:800,fontSize:14.5}}>Services</div>
          <div style={{fontSize:12,color:'var(--muted)'}}>{list.length} total</div>
        </div>
        <div style={{flex:1,overflowY:'auto',padding:5}}>
          {list.map(s=>(
            <button key={s.id} onClick={()=>setSel(s)}
              style={{display:'flex',alignItems:'center',gap:9,width:'100%',padding:'9px 11px',
                borderRadius:9,textAlign:'left',background:sel?.id===s.id?'var(--indigo-wash)':'transparent',
                color:sel?.id===s.id?'var(--indigo)':'var(--text)',fontWeight:sel?.id===s.id?600:500,fontSize:13.5}}>
              <span style={{width:9,height:9,borderRadius:'50%',background:s.color,flexShrink:0,
                opacity:s.is_active?1:.3}}/>
              <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.name}</span>
              <span className="num" style={{fontSize:11,color:'var(--faint)'}}>{s.code}</span>
            </button>
          ))}
        </div>
        <div style={{padding:10,borderTop:'1px solid var(--line-2)'}}>

                <h2 className="h1" style={{fontSize:18}}>{sel.name}</h2>

                <label className="lbl">Colour</label>
                <div style={{display:'flex',flexWrap:'wrap',gap:7}}>

                        outline:v('color')===c?`2px solid ${c}`:'none',outlineOffset:2}}/>

                </div>
              </div>
            </div>

            <div className="card">
              {[['is_active','Active','When off, no new numbers can be taken for it.'],
                ['show_on_kiosk','Show on kiosk','Patients can pick it on the touchscreen.']].map(([k,t,d],i)=>(
                <div key={k} style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:14,
                  padding:'13px 17px',borderTop:i?'1px solid var(--line-2)':'none'}}>
                  <div><div style={{fontWeight:600,fontSize:13.5}}>{t}</div>

                background:'linear-gradient(transparent,var(--paper) 28%)'}}>
