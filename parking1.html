              return(
              <div className="fb" style={{marginBottom:12}}>
                <div className="fbl">Computed Fee</div>
                <div className="fbv">{P(mvTotal)}</div>
                <div className="fbn">Duration: {computed.dur} · {computed.overnight?"🌙 Overnight Rate":"Regular Rate"}{pwdSc?" · ♿ PWD/SC: -"+P(mvDisc)+(computed.overnight?" (overnight windows charged)":" (first 3hrs free)"):""}{lostTicket?" · +₱50 Lost Ticket Fee":""}</div>
              </div>
              );
            })()}
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <button className="btn bg" onClick={()=>{setManualForm({plate:"",name:"",vtype:"car",locId:"compound",slotNum:"",checkin:"",checkout:""});setLostTicket(false);setPwdSc(false);}}>🗑️ Clear</button>
              <button className="btn bp" style={{background:"#9A6700",boxShadow:"0 3px 10px rgba(217,119,6,.3)"}} onClick={doManualPrint} disabled={!manualForm.plate.trim()||!manualForm.checkin}>🖨️ Print Manual Receipt</button>
            </div>
          </div>
        );
      })()}
      {tab==="earnings"&&(
        <div className="pnl">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:7}}>
            <span style={{fontSize:14,fontWeight:700}}>💰 Today's Earnings</span>
            <span style={{fontFamily:"'Atkinson Hyperlegible',sans-serif",fontSize:16,fontWeight:700,color:"#9A6700"}}>{P(todayT)}</span>
          </div>
          <div className="elg">
            {LOCS.map(l=>{const le=todayE.filter(e=>e.loc_id===l.id);return(
              <div className="elc" key={l.id} style={{"--lc":l.color}}>
                <div className="elnm">{l.icon} {l.name}</div>
                <div className="elv">{P(le.reduce((s,e)=>s+Number(e.fee||0),0))}</div>
                <div className="elcnt">{le.length} transactions</div>
              </div>
            );})}
          </div>
          {todayE.length===0?<div className="emp"><div className="ei">💸</div><p>No transactions today yet</p></div>:(
            <div style={{overflowX:"auto"}}><table className="etbl">
              <thead><tr><th>Time</th><th>Ticket</th><th>Plate</th><th>Vehicle</th><th>Location</th><th>Duration</th><th>Checked In By</th><th>Checked Out By</th><th>Amount</th>{user?.role==="admin"&&<th></th>}</tr></thead>
              <tbody>{[...todayE].sort((a,b)=>new Date(b.checkout_at||b.checkout_time||b.checkin_at)-new Date(a.checkout_at||a.checkout_time||a.checkin_at)).map((e,i)=>(
                <tr key={i}>
                  <td style={{fontFamily:"'Atkinson Hyperlegible',sans-serif",fontSize:12.5}}>{fmtT(e.checkout_at||e.checkout_time||e.checkin_at)}</td>
                  <td style={{fontFamily:"'Atkinson Hyperlegible',sans-serif",fontSize:12.5,color:"#5E35B1"}}>{e.ticket_no||"—"}</td>
                  <td><span className="epl">{e.plate}</span></td>
                  <td>{VT[e.vtype]?.icon} {VT[e.vtype]?.label}</td>
                  <td style={{fontSize:12.5}}>{LOCS.find(l=>l.id===e.loc_id)?.short}</td>
                  <td style={{fontFamily:"'Atkinson Hyperlegible',sans-serif",fontSize:12.5}}>{e.dur||e.duration||"—"}</td>
                  <td style={{fontSize:12.5,color:"var(--mu)"}}>{(e.checkin_by||"—").split(" ")[0]}</td>
                  <td style={{fontSize:12.5,color:"var(--mu)"}}>{(e.cashier||"—").split(" ")[0]}</td>
                  <td><span className="eam">{P(e.fee||0)}</span>{e.overnight&&<span style={{fontSize:11.5,color:"#5E35B1",marginLeft:3}}>🌙</span>}</td>
                  {user?.role==="admin"&&<td>{e.status!=="voided"&&<button className="btn bg" title="Revert checkout — ibalik sa slot" style={{padding:"4px 8px",fontSize:13,background:"#F6F2FB",color:"#5E35B1",border:"1px solid #DCCFF2"}} onClick={()=>{setRevertTxn(e);setDelArm(false);}}>↩️</button>}</td>}
                </tr>
              ))}</tbody>
            </table></div>
          )}
        </div>
      )}

      {/* REPORTS — no props needed, fetches own data */}
      {tab==="reports"&&perms.rep&&<ReportsPanel currentUser={user} onFix={e=>{setRevertTxn(e);setDelArm(false);}}/>}

      {/* ACTIVITY */}
      {tab==="activity"&&<ActivityLog actLog={actLog}/>}

      {/* USERS */}
      {tab==="users"&&perms.users&&<UserManagement currentUser={user} toast={toast}/>}

      {/* MODAL: VOID CONFIRMATION */}
      {modal==="void"&&sel?.vehicle&&(()=>{
        const{fee,dur}=calcFee(sel.vehicle.checkin,sel.vehicle.vtype);
        const vt=VT[sel.vehicle.vtype];
        return(
          <div className="ov" onClick={e=>e.target===e.currentTarget&&setModal("checkout")}>
            <div className="mo">
              <div className="mh" style={{background:"#FCF0F0",borderBottom:"1px solid #E8A7A7"}}><h2>⚠️ Void Transaction</h2><p style={{color:"#C62828"}}>This will mark the slot as vacant with no payment collected.</p></div>
              <div className="mb">
                <div className="ir"><span className="ik">Plate</span><span className="iv">{sel.vehicle.plate}</span></div>
                <div className="ir"><span className="ik">Vehicle</span><span className="iv">{vt?.icon} {vt?.label}</span></div>
                <div className="ir"><span className="ik">Duration</span><span className="iv">{dur}</span></div>
                <div className="ir"><span className="ik">Expected Fee</span><span className="iv" style={{color:"#C62828",fontWeight:700}}>{P(fee)}</span></div>
                <div style={{background:"#FCF0F0",border:"1px solid #E8A7A7",borderRadius:8,padding:"10px 12px",fontSize:13.5,color:"#9A1F1F",marginTop:8}}>
                  ⚠️ <strong>{P(fee)}</strong> will be recorded as a <strong>loss</strong> in reports. This action cannot be undone.
                </div>
              </div>
              <div className="mf">
                <button className="btn bg" onClick={()=>setModal("checkout")}>Back</button>
                <button className="btn" style={{background:"#C62828",color:"white",border:"none"}} onClick={doVoid}>Confirm Void</button>
              </div>
            </div>
          </div>
        );
      })()}

      {/* MODAL: CHECK IN */}
      {modal==="checkin"&&sel&&(
        <div className="ov" onClick={e=>e.target===e.currentTarget&&setModal(null)}>
          <div className="mo">
            <div className="mh"><h2>🚗 Vehicle Check In</h2><p>{LOCS.find(l=>l.id===sel.locId)?.name} · {sel.type==="motorcycle"?"Motorcycle":"Car"} Slot #{sel.number}</p></div>
            <div className="mb">
              <div className="fg">
                <label className="fl">Plate Number *</label>
                <input className="fi" placeholder="e.g. ABC 1234" value={form.plate} onChange={e=>setForm(p=>({...p,plate:e.target.value.toUpperCase()}))} autoFocus/>
                {dupPlate&&<div style={{background:"#FCF0F0",border:"1px solid #E8A7A7",borderRadius:8,padding:"7px 10px",fontSize:13,color:"#C62828",marginTop:5}}>⚠️ Already parked at <b>{dupLoc?.name}</b> — Slot #{dupPlate.number}</div>}
              </div>
              <div className="fg"><label className="fl">Driver / Owner Name</label><input className="fi" placeholder="Optional" value={form.name} onChange={e=>setForm(p=>({...p,name:e.target.value}))}/></div>
              <div className="fg">
                <label className="fl">Vehicle Type</label>
                <div className="rrow">{Object.entries(VT).map(([k,v])=><div key={k} className={`rbt ${form.vtype===k?"active":""}`} onClick={()=>setForm(p=>({...p,vtype:k}))}>{v.icon} {v.label}</div>)}</div>
              </div>
              {form.vtype&&<div className="hb">💡 First {VT[form.vtype].fh}h: <b style={{color:"#9A6700"}}>₱{VT[form.vtype].fr}</b> · /hr after: <b style={{color:"#9A6700"}}>₱{VT[form.vtype].sr}</b> · Overnight: <b style={{color:"#9A6700"}}>₱{VT[form.vtype].ovr}</b></div>}
              <div className="phint">🖨️ Parking ticket will print automatically on your Bluetooth/POS printer.</div>
            </div>
            <div className="mf">
              <button className="btn bg" onClick={()=>setModal(null)}>Cancel</button>
              <button className="btn bp" onClick={doCheckin} disabled={!form.plate.trim()||!!dupPlate}>✓ Check In &amp; Print Ticket</button>
            </div>
          </div>
        </div>
      )}

      {/* MODAL: CHECK OUT */}
      {modal==="checkout"&&sel?.vehicle&&(()=>{
        const{fee,pwdFee,dur,overnight}=calcFee(sel.vehicle.checkin,sel.vehicle.vtype);
        const vt=VT[sel.vehicle.vtype];
        // Live PWD/SC discount preview — first 3 regular hrs free; overnight windows still charged
        const mPwdDisc=pwdSc?Math.max(0,fee-pwdFee):0;
        const displayFee=Math.max(0,fee-mPwdDisc)+(lostTicket?50:0);
        return(
          <div className="ov" onClick={e=>e.target===e.currentTarget&&setModal(null)}>
            <div className="mo">
              <div className="mh"><h2>🏁 Vehicle Check Out</h2><p>{LOCS.find(l=>l.id===sel.locId)?.name} · Slot #{sel.number}</p></div>
              <div className="mb">
                <div className="ir"><span className="ik">Ticket #</span><span className="iv" style={{color:"#5E35B1"}}>{sel.vehicle.ticketNo||"—"}</span></div>
                <div className="ir"><span className="ik">Plate</span><span className="iv">{sel.vehicle.plate}</span></div>
                <div className="ir"><span className="ik">Name</span><span className="iv">{sel.vehicle.name}</span></div>
                <div className="ir"><span className="ik">Type</span><span className="iv">{vt?.icon} {vt?.label}</span></div>
                <div className="ir"><span className="ik">Checked In By</span><span className="iv" style={{color:"#5E35B1"}}>{sel.vehicle.checkinBy||"—"}</span></div>
                <div className="ir"><span className="ik">Check-in Time</span><span className="iv">{fmtDT(sel.vehicle.checkin)}</span></div>
                <div className="ir"><span className="ik">Duration</span><span className="iv">{dur}</span></div>
                <div className="fg" style={{marginTop:8}}>
                  <label style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer",background:lostTicket?"#FBEAEA":"#F7F8FB",border:"1.5px solid "+(lostTicket?"#E8A7A7":"var(--bd)"),borderRadius:9,padding:"10px 13px",transition:"all .15s"}}>
                    <input type="checkbox" checked={lostTicket} onChange={e=>{setLostTicket(e.target.checked);}} style={{width:18,height:18,cursor:"pointer",accentColor:"#D32F2F"}}/>
                    <div>
                      <div style={{fontWeight:700,fontSize:14,color:lostTicket?"#C62828":"var(--tx)"}}>🎫 Lost Parking Ticket</div>
                      <div style={{fontSize:13,color:lostTicket?"#C62828":"var(--mu)"}}>Dagdag na ₱50.00 lost ticket fee</div>
                    </div>
                    {lostTicket&&<span style={{marginLeft:"auto",fontFamily:"'Atkinson Hyperlegible',sans-serif",fontWeight:700,color:"#C62828",fontSize:14}}>+₱50</span>}
                  </label>
              <label style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer",background:pwdSc?"#E8EAF6":"#F7F8FB",border:"1.5px solid "+(pwdSc?"#9FA8DA":"var(--bd)"),borderRadius:9,padding:"10px 13px",marginTop:8,transition:"all .15s"}}>
                <input type="checkbox" checked={pwdSc} onChange={e=>setPwdSc(e.target.checked)} style={{width:18,height:18,cursor:"pointer",accentColor:"#3949AB"}}/>
                <div>
                  <div style={{fontWeight:700,fontSize:14,color:pwdSc?"#303F9F":"var(--tx)"}}>♿ PWD / Senior Citizen</div>
                  <div style={{fontSize:13,color:pwdSc?"#303F9F":"var(--mu)"}}>First 3 hours FREE — Taytay ordinance (present valid ID)</div>
                </div>
                {pwdSc&&mPwdDisc>0&&<span style={{marginLeft:"auto",fontFamily:"'Atkinson Hyperlegible',sans-serif",fontWeight:700,color:"#303F9F",fontSize:14}}>-₱{mPwdDisc}</span>}
              </label>
                </div>
                <div className="fb"><div className="fbl">Total Fee</div><div className="fbv">{P(displayFee)}</div><div className="fbn">{overnight?"🌙 Overnight rate (10PM–7AM)":"Regular rate applied"}{pwdSc&&!overnight?" · ♿ PWD/SC first 3hrs free":""}{pwdSc&&overnight?" · ♿ PWD/SC: first 3 regular hrs free (overnight windows charged)":""}{lostTicket?" · +₱50 Lost Ticket Fee":""}</div></div>
                <div className="phint">🖨️ Payment receipt will print automatically.</div>
              </div>
              <div className="mf">
                <button className="btn bg" onClick={()=>{setModal(null);setLostTicket(false);setPwdSc(false);}}>Cancel</button>
                <button className="btn bg" style={{background:"#EEF0F9",color:"#303F9F",border:"1px solid #C5CAE9",flex:"none",padding:"9px 11px"}} title="Reprint check-in ticket" onClick={()=>printThermal({isCheckIn:true,ticketNo:sel.vehicle.ticketNo||"—",plate:sel.vehicle.plate,name:sel.vehicle.name,vtype:sel.vehicle.vtype,locName:LOCS.find(l=>l.id===sel.locId)?.name,slotNum:sel.number,checkin:sel.vehicle.checkin,cashierName:user.name})}>🖨️ Reprint Ticket</button>
                {(user?.role==="admin"||user?.role==="cashier")&&<button className="btn" style={{background:"#FBEAEA",color:"#9A1F1F",border:"1px solid #E8A7A7"}} onClick={()=>setModal("void")}>⚠️ Void</button>}
                <button className="btn bd2" onClick={doCheckout} disabled={processing}>{processing&&<span className="spin"/>}{processing?"Processing…":"Confirm & Print Receipt"}</button>
              </div>
            </div>
          </div>
        );
      })()}

      {/* MODAL: REVERT CHECKOUT */}
      {revertTxn&&(
        <div className="ov" onClick={e=>e.target===e.currentTarget&&!reverting&&setRevertTxn(null)}>
          <div className="mo">
            <div className="mh"><h2>🛠️ Fix Transaction</h2><p>Piliin ang tamang correction para sa maling checkout</p></div>
            <div className="mb">
              <div style={{background:"#F6F2FB",border:"1.5px solid #DCCFF2",borderRadius:10,padding:"12px 14px",marginBottom:12}}>
                <div style={{fontFamily:"'Atkinson Hyperlegible',sans-serif",fontWeight:900,fontSize:18}}>{revertTxn.plate}</div>
                <div style={{fontSize:13.5,color:"var(--mu)",marginTop:4}}>
                  {revertTxn.ticket_no} · {VT[revertTxn.vtype]?.icon} {VT[revertTxn.vtype]?.label} · {LOCS.find(l=>l.id===revertTxn.loc_id)?.name} Slot #{revertTxn.slot_number}
                </div>
                <div style={{fontSize:13.5,color:"var(--mu)",marginTop:2}}>Fee na mabubura: <b style={{color:"#C62828"}}>{P(revertTxn.fee||0)}</b> · Out by {revertTxn.cashier||"—"}</div>
              </div>
              <div className="phint" style={{background:"#FBF3DE",borderColor:"#E6CB84",color:"#6E4A00",marginBottom:8}}>↩️ <b>Revert to Slot</b> — namali ng out, nandyan pa ang sasakyan. Buburahin ang transaction at ibabalik sa slot (same ticket at time in). Kung occupied na ang slot, ililipat sa unang free slot.</div>
              <div className="phint" style={{background:"#E8EAF6",borderColor:"#9FA8DA",color:"#303F9F"}}>♿ <b>Apply PWD/SC</b> — nakalimutan i-apply ang first-3-hrs-free discount. Ire-recompute ang fee, mananatili ang transaction, at i-re-refund ng cashier ang sobra sa customer.{revertTxn.overnight?" 🌙 Overnight: first 3 regular hrs pa rin ang libre — overnight windows babayaran.":""}</div>
              <div style={{marginTop:8,background:"#FCF0F0",border:"1.5px solid #fecaca",borderRadius:9,padding:"10px 13px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,flexWrap:"wrap"}}>
                <div style={{fontSize:13.5,color:"#9A1F1F"}}>🗑️ <b>Duplicate o maling record?</b> Buburahin lang ang transaction — hindi gagalawin ang slot.</div>
                <button className="btn" style={{background:delArm?"#C62828":"#FBEAEA",color:delArm?"#fff":"#9A1F1F",border:"1px solid "+(delArm?"#C62828":"#E8A7A7"),padding:"6px 12px",fontSize:13.5}} onClick={doDeleteRecord} disabled={reverting}>{delArm?"⚠️ Click ulit para burahin":"🗑️ Delete Record"}</button>
              </div>
            </div>
            <div className="mf">
              <button className="btn bg" onClick={()=>setRevertTxn(null)} disabled={reverting}>Cancel</button>
              <button className="btn" style={{background:"#3949AB",color:"#fff",border:"none"}} onClick={doApplyPwd} disabled={reverting||(revertTxn.notes&&revertTxn.notes.includes("PWD_SC_EXEMPT"))}>{reverting?"…":"♿ Apply PWD/SC"}</button>
              <button className="btn" style={{background:"#5E35B1",color:"#fff",border:"none"}} onClick={doRevert} disabled={reverting}>{reverting&&<span className="spin"/>}{reverting?"Processing…":"↩️ Revert to Slot"}</button>
            </div>
          </div>
        </div>
      )}

      {/* MODAL: RECEIPT */}
      {modal==="receipt"&&receipt&&(
        <div className="ov" onClick={e=>e.target===e.currentTarget&&setModal(null)}>
          <div className="mo">
            <div className="mh"><h2>✅ Check Out Complete</h2><p>Taytay Doctors Multispecialty Hospital</p></div>
            <div className="mb">
              <div className="rch"><div className="rct">Payment Receipt</div><div className="rcd">{new Date().toLocaleString("en-PH")}</div></div>
              <div className="tkb"><div style={{fontSize:20}}>🎫</div><div><div className="tkl">Ticket Number</div><div className="tkn">{receipt.ticketNo}</div></div></div>
              <div style={{marginTop:10}}>
                <div className="ir"><span className="ik">Plate No.</span><span className="iv">{receipt.v.plate}</span></div>
                <div className="ir"><span className="ik">Name</span><span className="iv">{receipt.v.name}</span></div>
                <div className="ir"><span className="ik">Vehicle</span><span className="iv">{VT[receipt.v.vtype]?.icon} {VT[receipt.v.vtype]?.label}</span></div>
                <div className="ir"><span className="ik">Location</span><span className="iv">{receipt.loc?.name}</span></div>
                <div className="ir"><span className="ik">Slot #</span><span className="iv">{receipt.slot.number}</span></div>
                <div className="ir"><span className="ik">Time In</span><span className="iv">{fmtDT(receipt.v.checkin)}</span></div>
                <div className="ir"><span className="ik">Duration</span><span className="iv">{receipt.dur}</span></div>
                <div className="ir"><span className="ik">Checked In By</span><span className="iv">{receipt.v.checkinBy||"—"}</span></div>
                <div className="ir"><span className="ik">Checked Out By</span><span className="iv">{user.name}</span></div>
              </div>
              <div className="fb"><div className="fbl">Amount Paid</div><div className="fbv">{P(receipt.fee)}</div><div className="fbn">{receipt.overnight?"🌙 Overnight rate":"Regular hourly rate"}</div></div>
            </div>
            <div className="mf">
              <button className="btn bg" onClick={()=>printThermal({isCheckIn:false,ticketNo:receipt.ticketNo,plate:receipt.v.plate,name:receipt.v.name,vtype:receipt.v.vtype,locName:receipt.loc?.name,slotNum:receipt.slot.number,checkin:receipt.v.checkin,fee:receipt.fee,dur:receipt.dur,overnight:receipt.overnight,cashierName:user.name})}>🖨️ Reprint</button>
              <button className="btn bp" onClick={()=>setModal(null)}>Done ✓</button>
            </div>
          </div>
        </div>
      )}

    </div></>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(TDMHParking));
</script>

<script type="application/javascript">
// ─── PWA MANIFEST (injected inline) ─────────────────────────────────────────
const manifest = {
  name: "TDMH Parking System",
  short_name: "TDMH Parking",
  description: "Taytay Doctors Multispecialty Hospital — Parking Management System",
  start_url: "/",
  display: "standalone",
  orientation: "any",
  background_color: "#F3F5F8",
  theme_color: "#3949AB",
  icons: [
    {
      src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='80' fill='%230f172a'/><text y='.82em' font-size='380' x='66'>🏥</text></svg>",
      sizes: "512x512",
      type: "image/svg+xml",
      purpose: "any maskable"
    }
  ]
};
const blob = new Blob([JSON.stringify(manifest)], {type:"application/json"});
const manifestURL = URL.createObjectURL(blob);
document.getElementById("pwa-manifest").setAttribute("href", manifestURL);

// Service Worker disabled — blob: URL not supported in hosted environments

// ─── INSTALL BANNER ──────────────────────────────────────────────────────────
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredPrompt = e;
  showInstallBanner();
});

function showInstallBanner(){
  if(document.getElementById("pwa-banner")) return;
  const banner = document.createElement("div");
  banner.id = "pwa-banner";
  banner.innerHTML = `
    <div style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9999;background:#1A1D2E;border:1px solid #454B5E;border-radius:14px;padding:13px 18px;display:flex;align-items:center;gap:13px;box-shadow:0 8px 32px rgba(0,0,0,.5);max-width:360px;width:calc(100vw - 32px);font-family:'Atkinson Hyperlegible',sans-serif;animation:pwaSlide .35s ease">
      <div style="font-size:28px;flex-shrink:0">🏥</div>
      <div style="flex:1;min-width:0">
        <div style="color:#EEF0F9;font-size:13px;font-weight:700;line-height:1.3">Install TDMH Parking</div>
        <div style="color:#5A6175;font-size:11px;margin-top:2px">Add to home screen for quick access</div>
      </div>
      <div style="display:flex;gap:7px;flex-shrink:0">
        <button onclick="installPWA()" style="padding:8px 14px;border-radius:8px;border:none;background:linear-gradient(135deg,#303F9F,#3949AB);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">Install</button>
        <button onclick="document.getElementById('pwa-banner').remove()" style="padding:8px 10px;border-radius:8px;border:1px solid #454B5E;background:transparent;color:#5A6175;font-size:12px;cursor:pointer;font-family:inherit">✕</button>
      </div>
    </div>
    <style>@keyframes pwaSlide{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}</style>
  `;
  document.body.appendChild(banner);
}

window.installPWA = async function(){
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  const {outcome} = await deferredPrompt.userChoice;
  console.log("PWA install:", outcome);
  deferredPrompt = null;
  const b = document.getElementById("pwa-banner");
  if(b) b.remove();
};

window.addEventListener("appinstalled", () => {
  console.log("✅ TDMH Parking installed as PWA");
  const b = document.getElementById("pwa-banner");
  if(b) b.remove();
});
</script>
</body>
</html>
