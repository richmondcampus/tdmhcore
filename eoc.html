<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EOC Clearance · TDMH Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#F3F6F6; --surface:#FFFFFF; --ink:#1C2830; --muted:#5D6B72; --line:#D6DEDE;
  --teal:#0E7470; --teal-soft:#DDEFEE; --amber:#B9720F; --amber-soft:#FBEFD9;
  --red:#B03A2E; --red-soft:#F8E1DE; --na:#EEF1F1; --focus:#2563A8;
  --radius:10px; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121A1E; --surface:#1A242A; --ink:#E4ECEE; --muted:#93A3AA; --line:#2C3A41;
    --teal:#3FB7AF; --teal-soft:#16393A; --amber:#E2A24A; --amber-soft:#3A2E1A;
    --red:#E0786C; --red-soft:#3D2220; --na:#202C32; --focus:#7DB3EE; color-scheme:dark;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* Login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px 28px}
.login-box h1{font-size:24px;font-weight:800;margin:0 0 4px;letter-spacing:-.01em}
.login-box p{margin:0 0 22px;color:var(--muted)}
label.f{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}

/* Shell */
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:12px 20px;flex-wrap:wrap}
.brand{font-weight:800;font-size:17px;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
nav.tabs{display:flex;gap:4px;margin-left:12px}
nav.tabs button{border:0;background:none;padding:8px 12px;border-radius:7px;font-weight:600;color:var(--muted);cursor:pointer}
nav.tabs button.on{background:var(--teal-soft);color:var(--teal)}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.who b{color:var(--ink)}
main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
h2{font-size:20px;font-weight:800;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .inp{width:auto;min-width:160px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}

/* Dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:22px}
.kpi{background:var(--surface);padding:16px 18px}
.kpi .v{font-size:28px;font-weight:800;line-height:1.1}
.kpi .l{color:var(--muted);font-size:13px;margin-top:2px}
.board{padding:6px 0}
.brow{display:grid;grid-template-columns:170px 1fr 90px 110px;gap:16px;align-items:center;padding:13px 18px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.brow:first-child{border-top:0}
.brow:hover{background:var(--bg)}
.brow .dn{font-weight:700}
.brow .dn small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.bar{height:14px;border-radius:7px;background:var(--teal-soft);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--teal)}
.bar.has-pend i{border-right:2px solid var(--surface)}
.pend{font-size:22px;font-weight:800;text-align:right;color:var(--amber)}
.pend.zero{color:var(--teal)}
.pend small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.age{font-size:13px;color:var(--muted);text-align:right}
.age.old{color:var(--red);font-weight:600}
.split{display:grid;grid-template-columns:1fr;gap:22px;margin-top:22px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface);position:sticky;top:0}
td.c,th.c{text-align:center}
tr:last-child td{border-bottom:0}

/* Matrix cells */
.cell{width:30px;height:30px;border-radius:7px;display:inline-grid;place-items:center;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;padding:0}
.cell.done{background:var(--teal);border-color:var(--teal);color:#fff}
.cell.pending{border-color:var(--amber);background:var(--amber-soft)}
.cell.na{background:var(--na);border-style:dashed;cursor:default;color:var(--muted)}
.cell svg{width:16px;height:16px}
.status{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.status.ok{background:var(--teal-soft);color:var(--teal)}
.status.open{background:var(--amber-soft);color:var(--amber)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);align-items:center;margin-left:auto}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .cell{width:16px;height:16px;border-radius:4px;cursor:default}

/* Dept queue */
.qhead{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.qcount{font-size:56px;font-weight:800;line-height:.95;color:var(--amber);letter-spacing:-.02em}
.qcount.zero{color:var(--teal)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--surface)}
.qlist{list-style:none;margin:0;padding:0}
.qitem{display:grid;grid-template-columns:auto 90px 1fr auto;gap:16px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.qitem:first-child{border-top:0}
.qitem .eoc{font-weight:800}
.qitem .meta{font-size:12px;color:var(--muted)}
.tick{width:34px;height:34px;border-radius:8px;border:2px solid var(--amber);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0}
.tick.on{background:var(--teal);border-color:var(--teal);color:#fff}
.tick svg{width:18px;height:18px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

/* Encode */
.enc{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.enc .panel{padding:20px}
.enc h3{margin:0 0 4px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;user-select:none}
.chip input{accent-color:var(--teal)}
textarea.inp{min-height:180px;font-family:inherit;resize:vertical}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.row2{display:grid;grid-template-columns:110px 1fr;gap:10px}

/* Modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(10,20,25,.45);display:grid;place-items:center;padding:20px;z-index:20}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:440px;padding:22px;border:1px solid var(--line)}
.modal h3{margin:0 0 6px}
.modal .acts{display:flex;gap:8px;margin-top:20px;align-items:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:9px;display:flex;gap:14px;align-items:center;font-size:14px;z-index:30;box-shadow:0 6px 24px rgba(0,0,0,.2)}
#toast button{background:none;border:0;color:var(--teal-soft);font-weight:700;cursor:pointer}

@media (max-width:820px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .brow{grid-template-columns:1fr 80px;row-gap:8px}
  .brow .bar{grid-column:1/-1;grid-row:2}
  .brow .age{display:none}
  .enc{grid-template-columns:1fr}
  nav.tabs{margin-left:0;order:3;width:100%}
  .qitem{grid-template-columns:auto 1fr;}
  .qitem .eoc{grid-column:2}
  .qitem .nm{grid-column:2}
  .qitem .meta{grid-column:2}
  .qcount{font-size:44px}
}
@media (prefers-reduced-motion:no-preference){.cell,.tick{transition:background .15s,border-color .15s}}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login">
  <form class="login-box" id="loginForm">
    <h1>EOC Clearance</h1>
    <p>Sign in with your department account.</p>
    <label class="f" for="em">Email</label>
    <input class="inp" id="em" type="email" autocomplete="username" required>
    <label class="f" for="pw">Password</label>
    <input class="inp" id="pw" type="password" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <button class="btn primary" style="width:100%;justify-content:center;margin-top:6px" id="loginBtn">Sign in</button>
    <button type="button" class="btn sm" style="border:0;background:none;color:var(--teal);margin-top:12px;padding:0" id="forgotBtn">Forgot password?</button>
  </form>
  <form class="login-box hidden" id="pwForm">
    <h1>Set a new password</h1>
    <p>At least 8 characters.</p>
    <label class="f" for="np1">New password</label><input class="inp" id="np1" type="password" autocomplete="new-password" minlength="8" required>
    <label class="f" for="np2">Type it again</label><input class="inp" id="np2" type="password" autocomplete="new-password" minlength="8" required>
    <div class="err" id="pwErr"></div>
    <button class="btn primary" style="width:100%;justify-content:center;margin-top:6px">Save password</button>
  </form>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <header class="top"><div class="top-in">
    <div class="brand">EOC Clearance<small>TDMH</small></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="who"><span><b id="whoName"></b> · <span id="whoRole"></span></span>
      <button class="btn sm" id="refreshBtn" title="Reload data">Refresh</button>
      <button class="btn sm" id="logoutBtn">Sign out</button></div>
  </div></header>
  <main id="view"></main>
</div>

<div id="modalRoot"></div>
<div id="toast" class="hidden"></div>

<script>
// Separate project from TDMH Core (same project as OPD Records, own eoc_* tables and accounts)
const SUPABASE_URL = 'https://bnwbykbzpjxdvbjfucnv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_PTsRdsQAMoIwR8ssEyfjkg_8oHPjF9-';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth:{ storageKey:'tdmh-eoc-auth', autoRefreshToken:true, persistSession:true }
});

const DEPTS = [
  {k:'lab',      n:'Laboratory',        s:'Lab'},
  {k:'xray',     n:'X-Ray',             s:'X-Ray'},
  {k:'ecg',      n:'ECG',               s:'ECG'},
  {k:'pharmacy', n:'Pharmacy (eGamot)', s:'eGamot'},
  {k:'nurse',    n:'Nurse (YAKAP)',     s:'Nurse'},
  {k:'abstract', n:'Clinical Abstract', s:'Abstract'},
];
const DEPT = Object.fromEntries(DEPTS.map(d=>[d.k,d]));
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';

const S = { roles:[], isAdmin:false, users:[], uq:'', qDept:'all', name:'', tab:null, records:[], tasks:[], f:{month:'all', status:'open', q:'', dept:'all'}, qMode:'pending' };

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monthLabel = p => { if(!p) return ''; const [y,m]=p.split('-'); return new Date(+y,+m-1,1).toLocaleString('en-US',{month:'long',year:'numeric'}); };
const natCmp = (a,b) => String(a).localeCompare(String(b), undefined, {numeric:true});
const daysSince = ts => Math.floor((Date.now()-new Date(ts).getTime())/864e5);
const fmtDate = ts => ts ? new Date(ts).toLocaleString('en-PH',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : '';
const thisMonth = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };

let toastTimer;
function toast(msg, undoFn){
  const t=$('toast'); t.innerHTML = `<span>${esc(msg)}</span>` + (undoFn?'<button id="undoBtn">Undo</button>':'');
  t.classList.remove('hidden'); clearTimeout(toastTimer);
  if(undoFn) $('undoBtn').onclick=()=>{ t.classList.add('hidden'); undoFn(); };
  toastTimer=setTimeout(()=>t.classList.add('hidden'), 5000);
}

async function fetchAll(build){
  const out=[]; const size=1000;
  for(let from=0;;from+=size){
    const {data,error} = await build().range(from, from+size-1);
    if(error) throw error;
    out.push(...data); if(data.length<size) break;
  }
  return out;
}

/* ---------- auth ---------- */
$('loginForm').onsubmit = async e => {
  e.preventDefault(); $('loginErr').textContent=''; $('loginBtn').disabled=true;
  const {error} = await sb.auth.signInWithPassword({email:$('em').value.trim(), password:$('pw').value});
  $('loginBtn').disabled=false;
  if(error){ $('loginErr').textContent='Wrong email or password.'; return; }
  boot();
};
$('forgotBtn').onclick = async ()=>{
  const email=$('em').value.trim();
  if(!email){ $('loginErr').textContent='Type your email first, then tap Forgot password.'; return; }
  await sb.functions.invoke('eoc-admin',{body:{action:'request_reset', email}});
  $('loginErr').style.color='var(--teal)';
  $('loginErr').textContent='If that email has an EOC account, a reset link is on its way. Check your inbox.';
};
let recovering=false;
sb.auth.onAuthStateChange(ev=>{ if(ev==='PASSWORD_RECOVERY'){ recovering=true; show(false); $('loginForm').classList.add('hidden'); $('pwForm').classList.remove('hidden'); } });
$('pwForm').onsubmit = async e=>{
  e.preventDefault(); const a=$('np1').value, b=$('np2').value;
  if(a!==b){ $('pwErr').textContent='The two passwords do not match.'; return; }
  const {error}=await sb.auth.updateUser({password:a});
  if(error){ $('pwErr').textContent=error.message; return; }
  recovering=false; history.replaceState(null,'',location.pathname);
  $('pwForm').classList.add('hidden'); $('loginForm').classList.remove('hidden'); boot(); toast('Password saved');
};
async function adminCall(body){
  const {data,error}=await sb.functions.invoke('eoc-admin',{body});
  if(error){ let m=error.message; try{ m=(await error.context.json()).error||m; }catch(_){} throw new Error(m); }
  if(data?.error) throw new Error(data.error);
  return data;
}
$('logoutBtn').onclick = async ()=>{ await sb.auth.signOut(); location.reload(); };
$('refreshBtn').onclick = ()=> load().then(render);

async function boot(){
  if(recovering) return;
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ show(false); return; }
  const {data:prof, error} = await sb.rpc('eoc_my_profile');
  if(recovering) return;
  const me = Array.isArray(prof)?prof[0]:prof; const roles = me?.roles||[];
  if(error || !roles.length){
    show(false);
    $('loginErr').textContent='This account has no EOC access. Ask the EOC admin to set it up.';
    await sb.auth.signOut(); return;
  }
  S.roles = roles; S.isAdmin = roles.includes('admin');
  S.name = me.full_name || session.user.email; S.myId = me.id;
  $('whoName').textContent = S.name;
  $('whoRole').textContent = S.isAdmin ? 'Admin' : roles.map(r=>DEPT[r]?.s||r).join(' + ');
  S.tab = S.isAdmin ? 'dash' : 'queue';
  buildTabs(); show(true);
  await load(); render();
  setInterval(()=>{ if(document.visibilityState==='visible' && S.tab!=='access' && !document.querySelector('.modal-bg')) load().then(render); }, 60000);
}
function show(app){ $('login').classList.toggle('hidden',app); $('app').classList.toggle('hidden',!app); }

function buildTabs(){
  const t = S.isAdmin
    ? [['dash','Dashboard'],['list','All EOCs'],['encode','Encode'],['access','Access']]
    : [['queue','My queue']];
  $('tabs').innerHTML = t.map(([k,l])=>`<button data-t="${k}" class="${S.tab===k?'on':''}">${l}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{ S.tab=b.dataset.t; buildTabs(); render(); });
}

/* ---------- data ---------- */
async function load(){
  try{
    if(S.isAdmin){
      const rows = await fetchAll(()=>sb.from('eoc_records')
        .select('id,eoc_no,patient_name,period,created_at,eoc_tasks(id,dept,is_done,done_at)')
        .order('created_at',{ascending:false}));
      S.records = rows.map(r=>({...r, t:Object.fromEntries(r.eoc_tasks.map(x=>[x.dept,x]))}))
                      .sort((a,b)=>natCmp(a.eoc_no,b.eoc_no));
    }else{
      const rows = await fetchAll(()=>sb.from('eoc_tasks')
        .select('id,dept,is_done,done_at,eoc_records!inner(eoc_no,patient_name,period,created_at)')
        .in('dept', S.roles.filter(r=>DEPT[r])));
      S.tasks = rows.sort((a,b)=>natCmp(a.eoc_records.eoc_no,b.eoc_records.eoc_no));
    }
  }catch(e){ toast('Could not load data: '+e.message); }
}

function months(list){ return [...new Set(list)].filter(Boolean).sort().reverse(); }
function monthSelect(list, id){
  return `<select class="inp" id="${id}"><option value="all">All months</option>${
    months(list).map(m=>`<option value="${m}" ${S.f.month===m?'selected':''}>${monthLabel(m)}</option>`).join('')}</select>`;
}

/* ---------- render ---------- */
function render(){
  const v=$('view');
  if(S.tab==='dash') v.innerHTML=renderDash();
  else if(S.tab==='list') v.innerHTML=renderList();
  else if(S.tab==='encode') v.innerHTML=renderEncode();
  else if(S.tab==='access') v.innerHTML=renderAccess();
  else v.innerHTML=renderQueue();
  wire();
}

function scoped(){ return S.records.filter(r=>S.f.month==='all'||r.period===S.f.month); }

function renderDash(){
  const recs=scoped();
  const open=recs.filter(r=>Object.values(r.t).some(x=>!x.is_done));
  const pendTasks=recs.reduce((n,r)=>n+Object.values(r.t).filter(x=>!x.is_done).length,0);
  const stats=DEPTS.map(d=>{
    const ts=recs.map(r=>({t:r.t[d.k],r})).filter(x=>x.t);
    const done=ts.filter(x=>x.t.is_done).length, pend=ts.length-done;
    const oldest=ts.filter(x=>!x.t.is_done).reduce((m,x)=>Math.max(m,daysSince(x.r.created_at)),0);
    return {...d,total:ts.length,done,pend,oldest};
  });
  const monthsAll = months(S.records.map(r=>r.period));
  const byMonth = monthsAll.map(m=>{
    const rs=S.records.filter(r=>r.period===m);
    return {m, n:rs.length, cleared:rs.filter(r=>Object.values(r.t).every(x=>x.is_done)).length,
      d:DEPTS.map(d=>rs.filter(r=>r.t[d.k]&&!r.t[d.k].is_done).length)};
  });
  return `
  <h2>Dashboard</h2><p class="sub">Who still has pending EOCs. Click a department to see its list.</p>
  <div class="toolbar">${monthSelect(S.records.map(r=>r.period),'fMonth')}</div>
  <div class="kpis num">
    <div class="kpi"><div class="v">${recs.length}</div><div class="l">EOCs encoded</div></div>
    <div class="kpi"><div class="v" style="color:var(--teal)">${recs.length-open.length}</div><div class="l">Fully cleared</div></div>
    <div class="kpi"><div class="v" style="color:var(--amber)">${open.length}</div><div class="l">Still open</div></div>
    <div class="kpi"><div class="v">${pendTasks}</div><div class="l">Pending checks, all depts</div></div>
  </div>
  <div class="panel board">
    ${stats.map(s=>{
      const pct = s.total? Math.round(s.done/s.total*100):0;
      return `<button class="brow" data-dept="${s.k}">
        <span class="dn">${s.n}<small class="num">${s.done} of ${s.total} done · ${pct}%</small></span>
        <span class="bar ${s.pend?'has-pend':''}"><i style="width:${pct}%"></i></span>
        <span class="pend num ${s.pend?'':'zero'}">${s.pend}<small>pending</small></span>
        <span class="age num ${s.oldest>=7?'old':''}">${s.pend?`oldest ${s.oldest}d`:'all clear'}</span>
      </button>`;}).join('')}
  </div>
  <div class="split"><div>
    <h2 style="font-size:16px;margin-bottom:10px">Pending by month</h2>
    <div class="panel tbl-wrap"><table class="num">
      <thead><tr><th>Month</th><th class="c">EOCs</th><th class="c">Cleared</th>${DEPTS.map(d=>`<th class="c">${d.s}</th>`).join('')}</tr></thead>
      <tbody>${byMonth.length? byMonth.map(b=>`<tr><td>${monthLabel(b.m)}</td><td class="c">${b.n}</td><td class="c">${b.cleared}</td>${
        b.d.map(x=>`<td class="c" style="${x?'color:var(--amber);font-weight:700':'color:var(--muted)'}">${x}</td>`).join('')}</tr>`).join('')
        : `<tr><td colspan="9" class="empty">No EOCs yet. Encode the first batch in the Encode tab.</td></tr>`}</tbody>
    </table></div>
  </div></div>`;
}

function renderList(){
  const q=S.f.q.toLowerCase();
  const rows=scoped().filter(r=>{
    const vals=Object.values(r.t), isOpen=vals.some(x=>!x.is_done);
    if(S.f.status==='open'&&!isOpen) return false;
    if(S.f.status==='cleared'&&isOpen) return false;
    if(S.f.dept!=='all' && !(r.t[S.f.dept]&&!r.t[S.f.dept].is_done)) return false;
    if(q && !(r.eoc_no.toLowerCase().includes(q)||r.patient_name.toLowerCase().includes(q))) return false;
    return true;
  });
  return `
  <h2>All EOCs</h2><p class="sub">Click a box to mark it done for that department. Use Edit to change which departments an EOC needs.</p>
  <div class="toolbar">
    <input class="inp" id="fQ" placeholder="Search EOC or name" value="${esc(S.f.q)}">
    ${monthSelect(S.records.map(r=>r.period),'fMonth')}
    <select class="inp" id="fStatus">
      ${[['open','Open only'],['cleared','Cleared only'],['all','All statuses']].map(([k,l])=>`<option value="${k}" ${S.f.status===k?'selected':''}>${l}</option>`).join('')}
    </select>
    <select class="inp" id="fDept"><option value="all">Any department</option>
      ${DEPTS.map(d=>`<option value="${d.k}" ${S.f.dept===d.k?'selected':''}>Pending at ${d.n}</option>`).join('')}</select>
    <button class="btn sm" id="csvBtn">Export CSV</button>
    <div class="legend"><span><i class="cell done"></i>Done</span><span><i class="cell pending"></i>Pending</span><span><i class="cell na"></i>Not needed</span></div>
  </div>
  <div class="panel tbl-wrap"><table>
    <thead><tr><th>EOC</th><th>Name</th><th>Month</th>${DEPTS.map(d=>`<th class="c">${d.s}</th>`).join('')}<th>Status</th><th></th></tr></thead>
    <tbody>${rows.length? rows.map(r=>{
      const isOpen=Object.values(r.t).some(x=>!x.is_done);
      return `<tr><td class="num"><b>${esc(r.eoc_no)}</b></td><td>${esc(r.patient_name)}</td><td>${monthLabel(r.period)}</td>
      ${DEPTS.map(d=>{const t=r.t[d.k];
        if(!t) return `<td class="c"><span class="cell na" title="Not needed">–</span></td>`;
        return `<td class="c"><button class="cell ${t.is_done?'done':'pending'}" data-task="${t.id}" data-done="${t.is_done}" title="${t.is_done?'Done '+fmtDate(t.done_at):'Pending — click to mark done'}" aria-label="${d.n} ${t.is_done?'done':'pending'}">${t.is_done?CHECK:''}</button></td>`;}).join('')}
      <td><span class="status ${isOpen?'open':'ok'}">${isOpen?'Open':'Cleared'}</span></td>
      <td><button class="btn sm" data-edit="${r.id}">Edit</button></td></tr>`;}).join('')
      : `<tr><td colspan="11" class="empty">No EOCs match these filters.</td></tr>`}</tbody>
  </table></div>
  <p class="hint num">${rows.length} shown</p>`;
}

function renderEncode(){
  return `
  <h2>Encode EOCs</h2><p class="sub">Each EOC appears in the queue of every department you tick below.</p>
  <div class="panel" style="padding:16px 20px;margin-bottom:22px">
    <div class="toolbar" style="margin:0">
      <label class="f" style="margin:0" for="eMonth">Month</label>
      <input class="inp" type="month" id="eMonth" value="${thisMonth()}">
      <span class="f" style="margin:0 0 0 10px">Needs clearance from</span>
      <div class="chips" style="margin:0">${DEPTS.map(d=>`<label class="chip"><input type="checkbox" class="eDept" value="${d.k}" checked>${d.s}</label>`).join('')}</div>
    </div>
  </div>
  <div class="enc">
    <form class="panel" id="oneForm">
      <h3>One EOC</h3>
      <div class="row2">
        <div><label class="f" for="oNo">EOC no.</label><input class="inp num" id="oNo" required></div>
        <div><label class="f" for="oName">Patient name</label><input class="inp" id="oName" required></div>
      </div>
      <button class="btn primary" style="margin-top:16px">Add EOC</button>
    </form>
    <form class="panel" id="bulkForm">
      <h3>Paste a batch</h3>
      <label class="f" for="bTxt">One EOC per line: number, then name</label>
      <textarea class="inp num" id="bTxt" placeholder="111	Dela Cruz, Juan&#10;112	Santos, Maria&#10;113, Reyes, Pedro"></textarea>
      <div class="hint">Copy the EOC and Name columns straight from Excel. Commas also work. EOC numbers already in the system are skipped.</div>
      <div class="hint num" id="bCount"></div>
      <button class="btn primary" style="margin-top:12px">Add batch</button>
    </form>
  </div>`;
}

function renderQueue(){
  const ms = months(S.tasks.map(t=>t.eoc_records.period));
  const q=S.f.q.toLowerCase();
  const myDepts=S.roles.filter(r=>DEPT[r]); const multi=myDepts.length>1;
  const inMonth=S.tasks.filter(t=>(S.f.month==='all'||t.eoc_records.period===S.f.month)&&(S.qDept==='all'||t.dept===S.qDept));
  const deptLabel = S.qDept==='all' ? myDepts.map(r=>DEPT[r].n).join(' + ') : DEPT[S.qDept].n;
  const pend=inMonth.filter(t=>!t.is_done).length;
  const list=inMonth.filter(t=>(S.qMode==='pending')!==t.is_done)
    .filter(t=>!q||t.eoc_records.eoc_no.toLowerCase().includes(q)||t.eoc_records.patient_name.toLowerCase().includes(q));
  if(S.qMode==='done') list.sort((a,b)=>new Date(b.done_at)-new Date(a.done_at));
  return `
  <div class="qhead">
    <div><div class="qcount num ${pend?'':'zero'}">${pend}</div><div style="color:var(--muted);font-weight:600">${pend? 'pending for '+deptLabel : 'Nothing pending — all clear'}</div></div>
    <div class="toolbar" style="margin:0 0 0 auto">
      ${multi?`<div class="seg">${[['all','All mine'],...myDepts.map(r=>[r,DEPT[r].s])].map(([k,l])=>`<button data-qd="${k}" class="${S.qDept===k?'on':''}">${l}</button>`).join('')}</div>`:''}
      <div class="seg"><button data-q="pending" class="${S.qMode==='pending'?'on':''}">Pending</button><button data-q="done" class="${S.qMode==='done'?'on':''}">Done</button></div>
      <input class="inp" id="fQ" placeholder="Search EOC or name" value="${esc(S.f.q)}">
      <select class="inp" id="fMonth"><option value="all">All months</option>${ms.map(m=>`<option value="${m}" ${S.f.month===m?'selected':''}>${monthLabel(m)}</option>`).join('')}</select>
    </div>
  </div>
  <div class="panel"><ul class="qlist">${list.length? list.map(t=>`
    <li class="qitem">
      <button class="tick ${t.is_done?'on':''}" data-task="${t.id}" data-done="${t.is_done}" aria-label="Mark EOC ${esc(t.eoc_records.eoc_no)} ${t.is_done?'not done':'done'}">${t.is_done?CHECK:''}</button>
      <span class="eoc num">${esc(t.eoc_records.eoc_no)}</span>
      <span class="nm">${esc(t.eoc_records.patient_name)}${multi?` <span class="status open" style="background:var(--na);color:var(--muted)">${DEPT[t.dept].s}</span>`:''}</span>
      <span class="meta">${t.is_done?'Done '+fmtDate(t.done_at):monthLabel(t.eoc_records.period)}</span>
    </li>`).join('') : `<li class="empty">${S.qMode==='pending'?'No pending EOCs here.':'Nothing marked done yet.'}</li>`}</ul></div>`;
}

function renderAccess(){
  const q=S.uq.toLowerCase();
  const list=S.users.filter(u=>!q||(u.full_name||'').toLowerCase().includes(q)||(u.email||'').toLowerCase().includes(q));
  const opts=[...DEPTS.map(d=>[d.k,d.s]),['admin','Admin']];
  return `
  <h2>Access</h2><p class="sub">EOC accounts are separate from TDMH Core and OPD Records. One account can clear more than one department — e.g. X-Ray and ECG on the same login.</p>
  <form class="panel" id="addUser" style="padding:16px 20px;margin-bottom:22px">
    <h3 style="margin:0 0 4px;font-size:16px">Add an account</h3>
    <div class="toolbar" style="margin:10px 0 0;align-items:flex-end">
      <div><label class="f" style="margin-top:0" for="aName">Name</label><input class="inp" id="aName" placeholder="e.g. X-Ray Department" required></div>
      <div><label class="f" style="margin-top:0" for="aEmail">Email (login)</label><input class="inp" id="aEmail" type="email" required style="min-width:240px"></div>
      <div><span class="f" style="margin-top:0">Can clear</span><div class="chips" style="margin:0">${opts.map(([k,l])=>`<label class="chip"><input type="checkbox" class="aRole" value="${k}">${l}</label>`).join('')}</div></div>
    </div>
    <div class="toolbar" style="margin:14px 0 0">
      <label class="chip"><input type="radio" name="aMode" value="link" checked>Email them a set-password link</label>
      <label class="chip"><input type="radio" name="aMode" value="pw">I'll set the password</label>
      <input class="inp hidden" id="aPw" type="text" placeholder="Password, 8+ characters" minlength="8">
      <button class="btn primary" id="aBtn">Create account</button>
    </div>
  </form>
  <div class="toolbar"><input class="inp" id="uQ" placeholder="Search name or email" value="${esc(S.uq)}"></div>
  <div class="panel tbl-wrap"><table>
    <thead><tr><th>Account</th>${opts.map(o=>`<th class="c">${o[1]}</th>`).join('')}<th></th></tr></thead>
    <tbody>${!S.usersLoaded?`<tr><td colspan="10" class="empty">Loading accounts…</td></tr>`:
      list.length? list.map(u=>`<tr style="${u.is_active?'':'opacity:.5'}"><td><b>${esc(u.full_name)}</b>${u.is_active?'':' <span class="status open">Disabled</span>'}<div class="hint" style="margin:0">${esc(u.email)}</div></td>
        ${opts.map(([k])=>`<td class="c"><input type="checkbox" class="uRole" data-u="${u.id}" value="${k}" ${u.roles.includes(k)?'checked':''} style="width:18px;height:18px;accent-color:var(--teal)" aria-label="${k}"></td>`).join('')}
        <td style="display:flex;gap:6px"><button class="btn sm" data-save="${u.id}">Save</button>
          <button class="btn sm" data-reset="${u.id}" title="Email a password reset link">Reset link</button>
          ${u.id===S.myId?'':`<button class="btn sm ${u.is_active?'danger':''}" data-active="${u.id}" data-to="${!u.is_active}">${u.is_active?'Disable':'Enable'}</button>`}</td></tr>`).join('')
      : `<tr><td colspan="10" class="empty">No accounts yet. Add the first one above.</td></tr>`}</tbody>
  </table></div>`;
}
async function loadUsers(){
  const {data,error}=await sb.rpc('eoc_list_users');
  if(error){toast('Could not load accounts: '+error.message);return;}
  S.users=data.map(u=>({...u,roles:u.roles||[]})); S.usersLoaded=true; if(S.tab==='access') render();
}
async function saveRoles(id){
  const roles=[...document.querySelectorAll(`.uRole[data-u="${id}"]:checked`)].map(x=>x.value);
  const {error}=await sb.rpc('eoc_set_user_roles',{p_user:id,p_roles:roles});
  if(error){toast('Not saved: '+error.message);return;}
  const u=S.users.find(x=>x.id===id); if(u) u.roles=roles;
  toast(`Saved access for ${u?.full_name||'account'}`);
}
function wireAccess(){
  const mode=()=>document.querySelector('input[name="aMode"]:checked')?.value;
  document.querySelectorAll('input[name="aMode"]').forEach(r=>r.onchange=()=>{ $('aPw').classList.toggle('hidden',mode()!=='pw'); $('aPw').required=mode()==='pw'; });
  if($('addUser')) $('addUser').onsubmit=async e=>{
    e.preventDefault(); $('aBtn').disabled=true;
    try{
      const roles=[...document.querySelectorAll('.aRole:checked')].map(x=>x.value);
      const r=await adminCall({action:mode()==='pw'?'create':'create_with_reset', full_name:$('aName').value.trim(), email:$('aEmail').value.trim(), roles, password:$('aPw').value});
      toast(r.reused?'Account added — this email already had a login here, so it keeps its current password.':
            r.emailed?'Account created — set-password link sent.':'Account created.');
      S.usersLoaded=false; await loadUsers();
    }catch(err){ toast('Not created: '+err.message); }
    if($('aBtn')) $('aBtn').disabled=false;
  };
  document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=async()=>{
    try{ const r=await adminCall({action:'send_reset_link', user_id:b.dataset.reset}); toast(r.emailed?'Reset link sent':'Link made but the email failed to send'); }catch(err){ toast(err.message); }
  });
  document.querySelectorAll('[data-active]').forEach(b=>b.onclick=async()=>{
    const to=b.dataset.to==='true';
    if(!to && !confirm('Disable this account? They will not be able to sign in.')) return;
    try{ await adminCall({action:'set_active', user_id:b.dataset.active, is_active:to}); await loadUsers(); toast(to?'Account enabled':'Account disabled'); }catch(err){ toast(err.message); }
  });
}

/* ---------- interactions ---------- */
function wire(){
  const on=(id,ev,fn)=>{const el=$(id); if(el) el[ev]=fn;};
  on('fMonth','onchange',e=>{S.f.month=e.target.value; render();});
  on('fStatus','onchange',e=>{S.f.status=e.target.value; render();});
  on('fDept','onchange',e=>{S.f.dept=e.target.value; render();});
  on('fQ','oninput',e=>{S.f.q=e.target.value; const pos=e.target.selectionStart; render(); const n=$('fQ'); n.focus(); n.setSelectionRange(pos,pos);});
  on('csvBtn','onclick',exportCsv);
  document.querySelectorAll('.brow').forEach(b=>b.onclick=()=>{ S.f.dept=b.dataset.dept; S.f.status='open'; S.tab='list'; buildTabs(); render(); });
  document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>toggleTask(b.dataset.task, b.dataset.done!=='true'));
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{S.qMode=b.dataset.q; render();});
  document.querySelectorAll('[data-qd]').forEach(b=>b.onclick=()=>{S.qDept=b.dataset.qd; render();});
  on('uQ','oninput',e=>{S.uq=e.target.value; const pos=e.target.selectionStart; render(); const n=$('uQ'); n.focus(); n.setSelectionRange(pos,pos);});
  document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveRoles(b.dataset.save));
  if(S.tab==='access'){ wireAccess(); if(!S.usersLoaded) loadUsers(); }
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));
  on('oneForm','onsubmit',e=>{e.preventDefault(); submitRows([{eoc_no:$('oNo').value.trim(), patient_name:$('oName').value.trim()}]);});
  on('bTxt','oninput',()=>{ const n=parseBulk($('bTxt').value).length; $('bCount').textContent = n? `${n} EOC${n>1?'s':''} ready`:''; });
  on('bulkForm','onsubmit',e=>{e.preventDefault(); const rows=parseBulk($('bTxt').value); if(!rows.length){toast('Nothing to add — check the format.');return;} submitRows(rows,true);});
}

function findTask(id){
  if(S.isAdmin){ for(const r of S.records) for(const t of Object.values(r.t)) if(t.id===id) return t; }
  return S.tasks.find(t=>t.id===id);
}
async function toggleTask(id, done, silent){
  const t=findTask(id); if(!t) return;
  const prev={is_done:t.is_done, done_at:t.done_at};
  t.is_done=done; t.done_at=done?new Date().toISOString():null; render();
  const {error}=await sb.rpc('eoc_set_done',{p_task:id, p_done:done});
  if(error){ Object.assign(t,prev); render(); toast('Not saved: '+error.message); return; }
  if(!silent) toast(done?'Marked done':'Marked pending', ()=>toggleTask(id,!done,true));
}

function parseBulk(txt){
  return txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    let m=l.match(/^([^\t,;]+)[\t,;]\s*(.+)$/) || l.match(/^(\S+)\s+(.+)$/);
    return m?{eoc_no:m[1].trim(), patient_name:m[2].trim()}:null;
  }).filter(r=>r&&r.eoc_no&&r.patient_name);
}
async function submitRows(rows, bulk){
  const month=$('eMonth').value; const depts=[...document.querySelectorAll('.eDept:checked')].map(x=>x.value);
  if(!month){toast('Pick a month first.');return;}
  if(!depts.length){toast('Tick at least one department.');return;}
  const {data,error}=await sb.rpc('eoc_create_bulk',{p_rows:rows, p_period:month+'-01', p_depts:depts});
  if(error){toast('Not saved: '+error.message);return;}
  const sk=data.skipped||[];
  toast(`Added ${data.inserted}` + (sk.length?` · skipped ${sk.length} existing (${sk.slice(0,5).join(', ')}${sk.length>5?'…':''})`:''));
  if(bulk) $('bTxt').value=''; else { $('oNo').value=''; $('oName').value=''; $('oNo').focus(); }
  if($('bCount')) $('bCount').textContent='';
  await load();
}

function openEdit(id){
  const r=S.records.find(x=>x.id===id); if(!r) return;
  $('modalRoot').innerHTML=`<div class="modal-bg"><form class="modal" id="editForm">
    <h3>EOC ${esc(r.eoc_no)}</h3>
    <label class="f" for="xName">Patient name</label><input class="inp" id="xName" value="${esc(r.patient_name)}" required>
    <label class="f" for="xMonth">Month</label><input class="inp" type="month" id="xMonth" value="${r.period.slice(0,7)}" required>
    <span class="f">Needs clearance from</span>
    <div class="chips">${DEPTS.map(d=>`<label class="chip"><input type="checkbox" class="xDept" value="${d.k}" ${r.t[d.k]?'checked':''}>${d.s}${r.t[d.k]?.is_done?' ✓':''}</label>`).join('')}</div>
    <div class="acts"><button type="button" class="btn danger" id="xDel">Delete EOC</button>
      <span style="flex:1"></span><button type="button" class="btn" id="xCancel">Cancel</button><button class="btn primary">Save changes</button></div>
  </form></div>`;
  const close=()=>$('modalRoot').innerHTML='';
  $('xCancel').onclick=close;
  $('modalRoot').querySelector('.modal-bg').onclick=e=>{ if(e.target.classList.contains('modal-bg')) close(); };
  $('xDel').onclick=async()=>{
    if(!confirm(`Delete EOC ${r.eoc_no} and all its department checks?`)) return;
    const {error}=await sb.from('eoc_records').delete().eq('id',r.id);
    if(error){toast('Not deleted: '+error.message);return;}
    close(); toast(`Deleted EOC ${r.eoc_no}`); await load(); render();
  };
  $('editForm').onsubmit=async e=>{
    e.preventDefault();
    const want=new Set([...document.querySelectorAll('.xDept:checked')].map(x=>x.value));
    const add=DEPTS.filter(d=>want.has(d.k)&&!r.t[d.k]).map(d=>d.k);
    const rem=DEPTS.filter(d=>!want.has(d.k)&&r.t[d.k]).map(d=>r.t[d.k]);
    if(rem.some(t=>t.is_done) && !confirm('Some departments you unticked already marked this done. Remove them anyway?')) return;
    const {error:e1}=await sb.from('eoc_records').update({patient_name:$('xName').value.trim(), period:$('xMonth').value+'-01'}).eq('id',r.id);
    const e2 = add.length ? (await sb.from('eoc_tasks').insert(add.map(k=>({eoc_id:r.id, dept:k})))).error : null;
    const e3 = rem.length ? (await sb.from('eoc_tasks').delete().in('id',rem.map(t=>t.id))).error : null;
    const err=e1||e2||e3; if(err){toast('Not saved: '+err.message);return;}
    close(); toast('Changes saved'); await load(); render();
  };
}

function exportCsv(){
  const rows=[['EOC','Name','Month',...DEPTS.map(d=>d.s),'Status']];
  scoped().forEach(r=>rows.push([r.eoc_no,r.patient_name,monthLabel(r.period),
    ...DEPTS.map(d=>!r.t[d.k]?'N/A':r.t[d.k].is_done?'Done':'Pending'),
    Object.values(r.t).some(x=>!x.is_done)?'Open':'Cleared']));
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));
  a.download=`eoc-clearance-${S.f.month}.csv`; a.click();
}

boot();
</script>
</body>
</html>
