/* ---------- scanner access keys (admin) ---------- */
const scanUrl = key => `${getSettings().ticketBase || SETTINGS_DEFAULT.ticketBase}?scan=${key}`;
const keyState = k => k.revoked_at ? ['Revoked', 'pill-red'] : (k.expires_at && new Date(k.expires_at) < new Date()) ? ['Expired', 'pill-gray'] : ['Active', 'pill-green'];

async function loadKeys() {
  const { data, error } = await sb.from('evt_scanner_keys').select('*').eq('event_id', S.event.id).order('created_at');
  const box = $('#keyList'); if (!box) return;
  if (error) { box.textContent = error.message; return; }
  S.keys = data || [];
  box.innerHTML = S.keys.length ? S.keys.map(k => { const [lbl, cls] = keyState(k); return `
    <div class="sr" style="margin-bottom:6px">
      <div class="info"><b>📍 ${esc(k.label)}</b><span class="hint">${k.scan_count} scans${k.last_used_at ? ' · huling gamit ' + esc(fmtShort(k.last_used_at)) : ''} · ${k.expires_at ? 'hanggang ' + esc(fmtShort(k.expires_at)) : 'walang expiry'}</span>
        <span class="hint">${['📷 Scan', k.can_view_list ? '👥 Guest list' : '', k.can_add_guest ? '＋ Walk-in' : ''].filter(Boolean).join(' · ')}</span></div>
      <span class="pill ${cls}">${lbl}</span>
      ${lbl !== 'Revoked' ? `<button class="btn btn-sm" data-ed="${k.id}">Edit</button>` : ''}
      ${lbl === 'Active' ? `<button class="btn btn-sm" data-qr="${k.id}">QR</button><button class="btn btn-sm btn-danger" data-rv="${k.id}">Revoke</button>` : ''}
    </div>`; }).join('') : 'Wala pang scanner QR. Puwedeng isang QR lang para sa lahat ng phones, o isa kada gate.';
  box.querySelectorAll('[data-qr]').forEach(b => b.onclick = () => showKeyQR(S.keys.find(k => k.id === b.dataset.qr)));
  box.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => openKeyModal(S.keys.find(k => k.id === b.dataset.ed)));
  box.querySelectorAll('[data-rv]').forEach(b => b.onclick = async () => {
    const k = S.keys.find(x => x.id === b.dataset.rv);
    if (!confirm(`I-revoke ang "${k.label}"? Hindi na makakapag-scan ang phone na gumagamit nito.`)) return;
    const { error } = await sb.from('evt_scanner_keys').update({ revoked_at: new Date().toISOString() }).eq('id', k.id);
    if (error) return toast(error.message, true);
    toast('Na-revoke'); loadKeys();
  });
}

function openKeyModal(k) {
  if (!k?.id) k = null; // only a saved key is an edit (guards against an Event object being passed in)
  const ev = S.event;
  const def = ev.event_date ? new Date(new Date(ev.event_date).getTime() + 7 * 24 * 3600e3) : new Date(Date.now() + 30 * 24 * 3600e3);
  const noExp = k ? !k.expires_at : false;
  const expVal = k ? (k.expires_at && new Date(k.expires_at) > new Date() ? k.expires_at : def.toISOString()) : def.toISOString();
  const m = modal(`
    <h2>${k ? '✏️ Edit Scanner QR' : '＋ Scanner QR'}</h2>
    <div class="field"><label>Label (gate o grupo) *</label><input id="kLabel" value="${esc(k?.label || '')}" placeholder="Entrance Team / Main Gate"></div>
    <div class="field"><label>Valid hanggang (PH time)</label><input type="datetime-local" id="kExp" value="${toLocalInput(expVal)}" ${noExp ? 'disabled' : ''}></div>
    <label class="row hint" style="margin:-4px 0 12px"><input type="checkbox" id="kNoExp" ${noExp ? 'checked' : ''}> Walang expiry (manual revoke lang)</label>
    <p class="hint" style="margin-bottom:10px">Valid agad ang QR pagkagawa, kaya magagamit mo na rin ito sa testing. Puwede itong gamitin ng maraming phone nang sabay-sabay.</p>
    <div class="field"><label>Access ng scanner</label>
      <label class="row" style="font-size:13px"><input type="checkbox" checked disabled> 📷 Mag-scan at manual check-in</label>
      <label class="row" style="font-size:13px"><input type="checkbox" id="kList" ${k ? (k.can_view_list ? 'checked' : '') : 'checked'}> 👥 Makita ang guest list (pangalan, dept, status; walang email)</label>
      <label class="row" style="font-size:13px"><input type="checkbox" id="kAdd" ${k ? (k.can_add_guest ? 'checked' : '') : 'checked'}> ＋ Mag-register ng walk-in na bisita</label>
    </div>
    <div class="actions"><button class="btn" data-close>Cancel</button><button class="btn btn-green" id="kSave">${k ? 'I-save' : 'Gumawa'}</button></div>`);
  m.querySelector('[data-close]').onclick = () => m.remove();
  $('#kNoExp', m).onchange = e => { $('#kExp', m).disabled = e.target.checked; };
  m.querySelector('#kSave').onclick = async () => {
    const label = $('#kLabel', m).value.trim();
    if (!label) return toast('Ilagay ang label', true);
    const exp = $('#kExp', m).value;
    const row = {
      label, expires_at: $('#kNoExp', m).checked ? null : fromPHInput(exp),
      can_view_list: $('#kList', m).checked, can_add_guest: $('#kAdd', m).checked,
    };
    const q = k ? sb.from('evt_scanner_keys').update(row).eq('id', k.id).select().single()
                : sb.from('evt_scanner_keys').insert({ ...row, event_id: ev.id, created_by: S.user.email }).select().single();
    const { data, error } = await q;
    if (error) return toast(error.message, true);
    m.remove(); await loadKeys();
    if (k) toast('Na-update. Hindi na kailangang i-scan ulit ng mga phone.'); else showKeyQR(data);
  };
  setTimeout(() => $('#kLabel', m)?.focus(), 50);
}

function showKeyQR(k) {
  const url = scanUrl(k.key);
  if (!url.startsWith('https://')) toast('Babala: ilagay muna ang tamang GitHub Pages URL sa "Ticket link base" para gumana ang QR sa phone.', true);
  const m = modal(`
    <h2>📷 Scanner Access · ${esc(k.label)}</h2>
    <div style="text-align:center">
      <canvas id="kQr" width="520" height="520" style="width:260px;height:260px;image-rendering:pixelated"></canvas>
      <p style="font-weight:700;margin-top:6px">${esc(S.event.name)}</p>
      <p class="hint">${k.expires_at ? 'Valid hanggang ' + esc(fmtDate(k.expires_at)) : 'Walang expiry'}</p>
    </div>
    <ol class="hint" style="margin:14px 0 0 18px;line-height:1.7">
      <li>Buksan ng guard ang <b>Camera</b> ng phone at itapat sa QR na ito.</li>
      <li>I-tap ang link at bubukas ang scanner. Pindutin ang <b>Buksan ang camera</b> at i-allow.</li>
      <li>Puwede na siyang mag-scan ng QR ng mga bisita.</li>
    </ol>
    <p class="hint" style="margin-top:10px;color:var(--red)">Huwag i-post o i-share sa GC. Kahit sino na may QR na ito ay makakapag-check in ng bisita.</p>
    <div class="actions">
      <button class="btn" id="kCopy">🔗 Copy link</button>
      <button class="btn" id="kPng">⬇ Download PNG</button>
      <button class="btn btn-primary" data-close>Close</button>
    </div>`);
  drawQR($('#kQr', m).getContext('2d'), url, 0, 0, 520);
  m.querySelector('[data-close]').onclick = () => m.remove();
  m.querySelector('#kCopy').onclick = async () => { await navigator.clipboard.writeText(url).catch(() => {}); toast('Nakopya ang scanner link'); };
  m.querySelector('#kPng').onclick = () => {
    const W = 900, H = 1180, c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
    x.fillStyle = '#2d2a7b'; x.fillRect(0, 0, W, 230); x.fillStyle = '#1f9d55'; x.fillRect(0, 230, W, 10);
    x.textAlign = 'center'; x.fillStyle = 'rgba(255,255,255,.75)'; x.font = '700 26px Inter, sans-serif'; x.fillText('SCANNER ACCESS · STAFF ONLY', W / 2, 75);
    x.fillStyle = '#fff'; x.font = '900 56px Inter, sans-serif'; x.fillText(k.label, W / 2, 150);
    x.font = '500 28px Inter, sans-serif'; x.fillText(S.event.name, W / 2, 200);
    drawQR(x, url, 150, 290, 600);
    x.fillStyle = '#1b1d2e'; x.font = '700 30px Inter, sans-serif'; x.fillText('I-scan gamit ang phone camera para buksan ang scanner', W / 2, 950);
    x.fillStyle = '#6b7090'; x.font = '500 26px Inter, sans-serif';
    x.fillText(k.expires_at ? 'Valid hanggang ' + fmtDate(k.expires_at) : 'Walang expiry', W / 2, 1000);
    x.fillStyle = '#cf3b3b'; x.font = '600 24px Inter, sans-serif'; x.fillText('Huwag i-share. Para lang sa naka-assign na guard.', W / 2, 1060);
    const a = document.createElement('a'); a.href = c.toDataURL('image/png'); a.download = `TDMH-scanner-${k.label.replace(/[^\w]+/g, '-')}.png`; a.click();
  };
}

/* ---------- auto-update: phones (esp. iPhone Safari) can keep an old cached copy ---------- */
let lastUpdateCheck = 0;
async function checkForUpdate() {
  if (Date.now() - lastUpdateCheck < 60e3 || !location.protocol.startsWith('http')) return;
  lastUpdateCheck = Date.now();
  try {
    const res = await fetch(location.pathname + '?_=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const live = ((await res.text()).match(/const APP_VERSION = '([^']+)'/) || [])[1];
    if (!live || live === APP_VERSION) return;
    if (sessionStorage.getItem('evt_reloaded_for') === live) return; // never loop
    if (document.querySelector('.modal-bg[data-lock]')) return;       // don't interrupt invite sending
    sessionStorage.setItem('evt_reloaded_for', live);
    const q = new URLSearchParams();
    const t = params.get('t'); if (t) q.set('t', t);
    if (S.scanKey) q.set('scan', S.scanKey);                           // reopen straight into scanner mode
    q.set('v', live);
    toast('May bagong bersyon. Nire-reload…');
    setTimeout(() => location.replace(location.pathname + '?' + q.toString()), 600);
  } catch {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });

/* ============================================================
   BOOT
   ============================================================ */
(async function boot() {
  setTimeout(checkForUpdate, 1500);
  const t = params.get('t');
  if (t) return renderTicket(t.trim());
  const scan = params.get('scan');
  if (scan) {
    localStorage.setItem('evt_scan_key', scan.trim());
    history.replaceState(null, '', location.pathname); // don't leave the key in the address bar
    return renderScanMode(scan.trim());
  }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return renderLogin();
  await afterLogin(session.user);
})();
