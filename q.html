<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>TDMH Queuing</title>
<link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;text y='.9em' font-size='90'&gt;🏥&lt;/text&gt;&lt;/svg&gt;"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Archivo:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>
<style>
/* ═══ TDMH tokens — indigo, green, gold from the hospital mark ═══ */
:root{
  --ink:#15183a; --ink-2:#262a52;
  /* taken from the hospital mark: green #189c30, indigo #2418b4, gold #fce454 */
  --indigo:#231a9e; --indigo-2:#2418b4; --indigo-wash:#eceaf8;
  --green:#13802a;  --green-2:#189c30;  --green-wash:#e6f4e9;
  --gold:#9a7510;   --gold-2:#fce454;   --gold-wash:#fdf4d8;
  --red:#c0453f; --red-wash:#fbecea;
  --paper:#f4f5fa; --card:#fff; --line:#e1e2ee; --line-2:#eff0f6;
  --text:#1c1c33; --muted:#63647f; --faint:#727390;
  /* surfaces used by the sign-in, sidebar, kiosk and TV */
  --surf:#eef0f7; --surf-2:#fff; --surf-3:#e6e8f2;
  --on-surf:#1c1c33; --dim:#63647f; --faint2:#696a83;
  --r:10px; --r-lg:16px;
  --sh:0 1px 2px rgba(21,24,58,.06),0 1px 3px rgba(21,24,58,.04);
  --sh-lg:0 12px 32px rgba(21,24,58,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{font-family:Figtree,system-ui,sans-serif;background:var(--paper);color:var(--text);
     font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#cfcfdd;border-radius:3px}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}
.num{font-family:Archivo,sans-serif;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}

/* ═══ shell ═══ */
.app{display:flex;height:100vh;overflow:hidden}
.rail{width:250px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);
      display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.rail-top{padding:20px 18px 17px;display:flex;align-items:center;gap:10px;
          border-bottom:1px solid var(--line-2)}
.mark{width:38px;height:38px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;
      background:linear-gradient(135deg,var(--indigo-2),var(--green));color:#fff;
      font-family:Archivo;font-weight:900;font-size:15px}
.rail-name{color:var(--text);font-weight:700;font-size:15px;line-height:1.25}
.rail-sub{color:var(--faint);font-size:12px}
.rail-nav{flex:1;padding:12px 11px;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.nav{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:10px;width:100%;
     text-align:left;color:var(--muted);font-size:14.5px;font-weight:500;transition:.14s}
.nav:hover{color:var(--text);background:var(--line-2)}
.nav.on{color:var(--indigo);background:var(--indigo-wash);font-weight:600}
.nav svg{width:17px;height:17px;flex-shrink:0;opacity:.9}
.nav-head{padding:15px 13px 6px;font-size:11.5px;font-weight:700;color:var(--faint);letter-spacing:.02em}
.rail-foot{padding:9px;border-top:1px solid var(--line-2)}
.who{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;background:var(--paper)}
.pip{width:33px;height:33px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
     background:var(--indigo);color:#fff;font-size:11px;font-weight:700}
.who-n{color:var(--text);font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-r{color:var(--faint);font-size:12px;text-transform:capitalize}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}

/* ═══ page furniture ═══ */
.head{padding:26px 30px 0}
.h1{font-size:23px;font-weight:800;letter-spacing:-.015em}
.sub{color:var(--muted);font-size:14.5px;margin-top:2px}
.wrap{padding:20px 30px 30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh)}
.card-h{padding:15px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;
        justify-content:space-between;gap:10px}
.card-t{font-size:14.5px;font-weight:700}

/* ═══ controls ═══ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 17px;
     border-radius:10px;font-size:14.5px;font-weight:600;transition:.13s;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(1px)}
.b-pri{background:var(--indigo);color:#fff}      .b-pri:hover:not(:disabled){background:#32368d}
.b-go{background:var(--green);color:#fff}        .b-go:hover:not(:disabled){background:#1a7442}
.b-gold{background:var(--gold);color:#fff}       .b-gold:hover:not(:disabled){background:#b2871f}
.b-red{background:var(--red);color:#fff}         .b-red:hover:not(:disabled){background:#a93a35}
.b-out{background:#fff;color:var(--text);border:1px solid var(--line)}
.b-out:hover:not(:disabled){background:#fafaff;border-color:#d2d2e2}
.b-ghost{color:var(--muted);padding:6px 9px} .b-ghost:hover{background:var(--line-2);color:var(--text)}
.b-sm{padding:6px 13px;font-size:13.5px} .b-ico{padding:9px;border-radius:9px}
.b-full{width:100%} .b-lg{padding:13px 22px;font-size:15.5px}
.inp{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;
     color:var(--text);outline:none;transition:.13s}
.inp:focus{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(59,63,163,.11)}
.inp::placeholder{color:var(--faint)}
select.inp{cursor:pointer}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.sw{position:relative;width:44px;height:25px;border-radius:13px;background:#d8d8e6;flex-shrink:0;transition:.18s}
.sw.on{background:var(--green)}
.sw i{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;
      box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.18s}
.sw.on i{left:22px}

/* ═══ live board ═══ */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(224px,1fr));gap:13px}
.kpi{padding:20px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.kpi-k{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.kpi-v{font-size:36px;line-height:1.12;margin-top:2px;color:var(--text)}
.kpi-sub{font-size:13px;color:var(--faint);margin-top:3px}
.kpi-sub b{color:var(--muted);font-weight:600}
.kpi-ic{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
.two-col{display:grid;grid-template-columns:1.08fr 1fr;gap:13px;margin-top:13px;align-items:start}
.tally{display:grid;grid-template-columns:repeat(3,1fr)}
.tally-cell{padding:15px 17px;border-right:1px solid var(--line-2)}
.tally-cell:last-child{border-right:none}
.occ{display:flex;align-items:center;justify-content:space-between;gap:12px;
     padding:13px 15px;border-radius:11px;background:var(--paper);margin-bottom:5px}
.occ:last-child{margin-bottom:0}
.occ-w{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.occ-line{font-size:14.5px;margin-top:4px;display:flex;align-items:center;gap:8px;min-width:0}
.occ-line>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.occ-pip{width:25px;height:25px;font-size:9.5px;background:var(--indigo-wash);color:var(--indigo)}
.occ-ago{font-size:11.5px;color:var(--faint);margin-top:3px}
.occ-lbl{font-size:10.5px;font-weight:700;color:var(--faint);letter-spacing:.04em}
.occ-t{font-size:16px;margin-top:2px}
@media(max-width:1040px){.two-col{grid-template-columns:1fr}}

/* ═══ tags ═══ */
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
     font-size:12px;font-weight:600;white-space:nowrap}
.t-wait{background:var(--gold-wash);color:#8a6713}
.t-serv{background:var(--green-wash);color:#166434}
.t-done{background:var(--line-2);color:var(--muted)}
.t-held{background:var(--indigo-wash);color:#2f3285}
.t-skip{background:var(--red-wash);color:#8f2e2a}
.t-step{background:var(--indigo-wash);color:var(--indigo)}

/* ═══ counter workspace ═══ */
.ws{display:flex;height:100vh;overflow:hidden}
.ws-l{width:412px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);
      display:flex;flex-direction:column}
.ws-r{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--paper)}
.ws-h{padding:12px 13px;border-bottom:1px solid var(--line-2)}
.segs{display:flex;background:var(--line-2);border-radius:9px;padding:3px;gap:2px}
.seg{flex:1;padding:7px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--muted);
     display:flex;align-items:center;justify-content:center;gap:5px;transition:.13s}
.seg.on{background:#fff;color:var(--text);box-shadow:var(--sh)}
.cnt{padding:1px 6px;border-radius:9px;font-size:11px;font-weight:700;background:#dadae8;color:var(--muted)}
.seg.on .cnt{background:var(--indigo);color:#fff}
.ws-list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.ws-f{padding:14px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:7px}

.tk{padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;background:#fff;transition:.13s;
    text-align:left;width:100%;display:block}
.tk:hover{border-color:#c3c3d8}
.tk.on{border-color:var(--indigo);background:var(--indigo-wash)}
.tk-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tk-n{font-size:16px}
.tk-s{font-size:12px;font-weight:600}
.tk-m{font-size:12px;color:var(--muted);margin-top:2px}

/* ═══ now-serving panel ═══ */
.now{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
     padding:26px;text-align:center}
.now-n{font-family:Archivo;font-weight:900;font-size:clamp(68px,11vw,124px);line-height:.92;
       letter-spacing:-.03em;color:var(--indigo)}
.now-acts{padding:13px;background:#fff;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.kbd{display:inline-block;padding:1px 5px;border:1px solid var(--line);border-bottom-width:2px;
     border-radius:5px;font-size:10.5px;font-weight:700;color:var(--faint);background:#fff;margin-left:5px}

/* ═══ TV layout picker ═══ */
.lay{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.layb{display:flex;flex-direction:column;align-items:flex-start;gap:7px;padding:13px;
      border:1.5px solid var(--line);border-radius:12px;text-align:left;background:var(--card);
      transition:.14s}
.layb:hover{border-color:#c3c4da}
.layb.on{border-color:var(--indigo);background:var(--indigo-wash)}
.laypic{display:grid;gap:3px;width:100%;height:46px;padding:5px;border-radius:7px;
        background:var(--paper);border:1px solid var(--line-2)}
.laypic i{background:#c9cadd;border-radius:2px;display:block}
.layb.on .laypic i{background:var(--indigo-2)}
.lay-spotlight{grid-template-columns:1.6fr 1fr;grid-template-rows:1fr 1fr}
.lay-spotlight i:nth-child(1){grid-row:1/3}
.lay-grid{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.lay-grid i:nth-child(3){grid-column:1/3}
.lay-list{grid-template-columns:1.3fr 1fr}
.lay-list i:nth-child(1){grid-row:1/3}
.lay-list i:nth-child(3){display:none}
.layt{font-size:13.5px;font-weight:700}
.layd{font-size:11.5px;color:var(--muted);line-height:1.45}
@media(max-width:900px){.lay{grid-template-columns:1fr}}

/* ═══ procedures ═══ */
.proc{display:grid;grid-template-columns:1fr 290px;gap:0;margin-bottom:14px;overflow:hidden}
.proc-main{padding:22px 24px;min-width:0}
.proc-side{padding:22px 24px;border-left:1px solid var(--line-2);background:#fcfcff;
           display:flex;flex-direction:column;gap:13px}
.proc-name{font-size:18px;font-weight:800;letter-spacing:-.015em}
.proc-desc{font-size:13.5px;color:var(--muted);margin-top:3px}
.proc-act{display:flex;align-items:center;justify-content:space-between;gap:12px;
          padding-top:13px;border-top:1px solid var(--line-2)}
.flow{display:flex;gap:0;margin-top:20px;overflow-x:auto;padding-bottom:4px}
.flow-item{min-width:132px;flex:1}
.flow-head{display:flex;align-items:center}
.flow-dot{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
          background:var(--indigo-wash);color:var(--indigo);
          font-family:Archivo;font-weight:800;font-size:13px}
.flow-line{flex:1;height:2px;background:var(--line);min-width:16px}
.flow-k{font-size:11.5px;color:var(--muted);margin-top:10px}
.flow-s{font-size:13.5px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;margin-top:2px}
.chip-dark{background:var(--ink);border-color:var(--ink);color:#fff}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:3px;max-height:210px;overflow-y:auto;
        border:1px solid var(--line);border-radius:10px;padding:7px}
.pick{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;cursor:pointer;
      font-size:13.5px}
.pick.on{background:var(--indigo-wash);font-weight:600}
.steprow{display:flex;align-items:center;gap:8px}
@media(max-width:1100px){.proc{grid-template-columns:1fr}
  .proc-side{border-left:none;border-top:1px solid var(--line-2)}
  .picker{grid-template-columns:1fr}}

/* ═══ settings rows ═══ */
.sgroup{padding:13px 18px;font-size:11.5px;font-weight:800;letter-spacing:.09em;
        color:var(--faint);border-bottom:1px solid var(--line-2)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:20px;
      padding:15px 18px;border-bottom:1px solid var(--line-2)}
.srow:last-child{border-bottom:none}
.srow.off{opacity:.48}
.srow-t{font-size:14.5px;font-weight:650}
.srow-s{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.sw:disabled{cursor:not-allowed}

/* ═══ counter — queue workspace ═══ */
.from{display:flex;align-items:stretch;gap:0;margin:14px 14px 0;border:1px solid var(--line);
      border-radius:10px;overflow:hidden;background:var(--card)}
.from-k{background:var(--ink);color:#fff;font-size:13.5px;font-weight:700;
        padding:11px 17px;display:grid;place-items:center;flex-shrink:0}
.from-sel{flex:1;border:none;outline:none;background:transparent;padding:11px 14px;
          font-size:14.5px;font-weight:600;color:var(--text);cursor:pointer}
.utabs{display:flex;margin:14px 0 0;border-bottom:1px solid var(--line)}
.utab{flex:1;padding:14px 8px 15px;font-size:15px;font-weight:600;color:var(--muted);
      border-bottom:2.5px solid transparent;margin-bottom:-1px;display:flex;
      align-items:center;justify-content:center;gap:7px;transition:.14s}
.utab:hover{color:var(--text)}
.utab.on{color:var(--indigo);border-bottom-color:var(--indigo);font-weight:700}
.ucnt{min-width:21px;height:21px;padding:0 7px;border-radius:11px;display:grid;place-items:center;
      font-size:11.5px;font-weight:800;background:var(--line-2);color:var(--muted)}
.utab.on .ucnt{background:var(--indigo);color:#fff}
.tools{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px}
.pillset{display:flex;gap:5px}
.pillb{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:20px;
       border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--faint);
       letter-spacing:.03em;text-transform:uppercase;transition:.14s}
.pillb.on{background:var(--indigo-wash);border-color:var(--indigo);color:var(--indigo)}
.toolb{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;
       color:var(--muted);letter-spacing:.03em;text-transform:uppercase;padding:5px 7px;border-radius:7px}
.toolb:hover{background:var(--line-2);color:var(--text)}

.qc{display:block;width:100%;text-align:left;padding:17px 19px;border:1px solid var(--line);
    border-left:4px solid transparent;border-radius:11px;background:var(--card);
    box-shadow:var(--sh);transition:.14s}
.qc:hover{border-color:#c9cadd}
.qc.on{border-color:var(--indigo);border-left-color:var(--indigo);
       box-shadow:0 0 0 2px rgba(59,63,163,.12)}
.qc-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.qc-n{font-size:24px;letter-spacing:-.025em}
.qc-svc{font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;
        letter-spacing:.04em;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qc-mid{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:7px}
.qc-lbl{font-size:14px;color:var(--muted)}
.qc-ago{font-size:14px;color:var(--muted);font-weight:600}

.phead{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-shrink:0;
       padding:16px 24px;background:var(--card);border-bottom:1px solid var(--line)}
.phead-t{font-size:24px;font-weight:800;letter-spacing:-.02em}
.autobar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-shrink:0;
         padding:15px 24px;background:var(--card);border-bottom:1px solid var(--line)}
.autobar-t{font-size:15px;font-weight:700}
.autobar-s{font-size:13px;color:var(--muted);margin-top:1px}

.fld{text-align:left}
.fld.row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.fld-k{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--faint)}
.fld-v{font-size:15.5px;font-weight:600;margin-top:5px}
.fld.row .fld-v{margin-top:0}
.side-row{display:flex;align-items:center;justify-content:space-between;gap:10px}

.actbar{display:flex;align-items:center;gap:10px;flex-shrink:0;padding:16px 24px;
        background:var(--card);border-top:1px solid var(--line)}
.dd{position:absolute;bottom:46px;left:0;z-index:60;min-width:250px;padding:5px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-lg)}
.dd-i{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 11px;
      border-radius:8px;font-size:13px;font-weight:500}
.dd-i:hover{background:var(--paper)}
.dd-i .kbd{margin-left:auto}
.dd-sep{height:1px;background:var(--line-2);margin:4px 0}

.tl-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tl-when{font-size:11.5px;color:var(--faint);white-space:nowrap}

/* ═══ counter detail pane ═══ */
.ws-bar{background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px;
        display:flex;align-items:center;justify-content:space-between;gap:14px;flex-shrink:0}
.autosw{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;
        font-weight:600;color:var(--muted);cursor:pointer}
.detail{flex:1;display:grid;grid-template-columns:1fr 372px;gap:17px;
        padding:20px 24px;overflow:hidden;min-height:0}
.detail-mid{overflow-y:auto;display:flex;align-items:flex-start;justify-content:center}
.detail-side{display:flex;flex-direction:column;gap:13px;overflow:hidden;min-height:0}
.tkcard{width:100%;max-width:490px;padding:32px 30px;text-align:center}
.tkcard-k{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--faint)}
.tkcard-n{font-size:clamp(54px,7.6vw,90px);line-height:1;letter-spacing:-.035em;margin:8px 0 0}
.tkcard-rule{height:1px;background:var(--line-2);margin:24px 0 20px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;text-align:left}
.kv dt{font-size:12.5px;color:var(--muted)}
.kv dd{font-size:13.5px;font-weight:600;text-align:right}
.tknote{margin-top:16px;padding:10px 13px;background:var(--paper);border-radius:10px;
        font-size:13px;color:var(--muted);text-align:left}
.tagbox{margin-top:18px;padding-top:16px;border-top:1px solid var(--line-2);text-align:left}
.sidecard{padding:17px 18px}
.side-k{font-size:11.5px;font-weight:800;letter-spacing:.11em;color:var(--faint);display:block}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:8px;
      background:var(--gold-wash);border:1px solid #ecdfbd;color:#7d5e11;
      font-size:12px;font-weight:700;letter-spacing:.02em}
.chip-x button{display:inline-flex;color:#a98b3c;padding:0;margin-left:1px}
.chip-x button:hover{color:#6d4f0c}
.chip-add{background:transparent;border:1px dashed var(--line);color:var(--muted);font-weight:600}
.chip-add:hover{border-color:var(--indigo);color:var(--indigo)}

.path{display:flex;flex-direction:column;gap:2px;margin-top:9px}
.path-row{display:flex;align-items:center;gap:12px;padding:9px 0}
.path-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.path-n{font-size:11.5px;font-weight:700;color:var(--faint)}
.path-s{font-size:14.5px;font-weight:700;margin-top:1px}
.path-t{font-size:12.5px;color:var(--muted);flex-shrink:0}

.tl{margin-top:12px;overflow-y:auto;display:flex;flex-direction:column;gap:15px;padding-right:3px}
.tl-row{display:flex;gap:10px}
.tl-dot{width:7px;height:7px;border-radius:50%;background:var(--indigo);flex-shrink:0;margin-top:5px}
.tl-a{font-size:11.5px;font-weight:800;letter-spacing:.07em;color:var(--indigo)}
.tl-m{font-size:13px;color:var(--muted);margin-top:1px}
.tl-d{font-size:12.5px;color:var(--indigo);margin-top:3px;background:var(--indigo-wash);
      padding:4px 8px;border-radius:7px;display:inline-block}
.kbd-on{color:rgba(255,255,255,.78);border-color:rgba(255,255,255,.35)}
/* laptops: stack the side rail under the ticket instead of dropping it */
@media(max-width:1500px){
  .ws-l{width:352px}
  .detail{grid-template-columns:1fr;grid-auto-rows:min-content;overflow-y:auto;
          align-content:start}
  .detail-mid{overflow:visible}
  .detail-side{overflow:visible}
  .tl{max-height:300px}
  .tkcard{max-width:none}
}
@media(max-width:1100px){
  .ws-l{width:308px}
  .phead-t{font-size:20px}
  .actbar{flex-wrap:wrap}
}

/* ═══ empty + misc ═══ */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 22px;
       text-align:center;color:var(--muted);gap:4px}
.empty-i{width:46px;height:46px;border-radius:50%;background:var(--line-2);display:grid;place-items:center;
         margin-bottom:8px;color:var(--faint)}
.empty-t{font-weight:700;font-size:15.5px;color:var(--text)}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
      border-radius:50%;animation:sp .7s linear infinite;flex-shrink:0}
.spin.d{border-color:rgba(59,63,163,.2);border-top-color:var(--indigo)}
@keyframes sp{to{transform:rotate(360deg)}}
.mid{display:grid;place-items:center;height:100vh}
.live{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;
      background:var(--green-wash);color:#166434;font-size:12px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green-2);position:relative}
.dot::after{content:'';position:absolute;inset:-3px;border-radius:50%;background:var(--green-2);
            opacity:.35;animation:pl 1.8s ease infinite}
.dot.off{background:var(--faint)} .dot.off::after{display:none}
@keyframes pl{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.7);opacity:0}}

/* ═══ table ═══ */
.tb{width:100%;border-collapse:collapse}
.tb th{padding:11px 16px;text-align:left;font-size:12.5px;font-weight:700;color:var(--muted);
       background:#fafafd;border-bottom:1px solid var(--line)}
.tb td{padding:12px 16px;border-bottom:1px solid var(--line-2);font-size:14.5px}
.tb tr:last-child td{border-bottom:none}
.tb tbody tr:hover td{background:#fafafd}

/* ═══ modal ═══ */
.ov{position:fixed;inset:0;background:rgba(21,24,58,.42);backdrop-filter:blur(3px);display:flex;
    align-items:center;justify-content:center;z-index:200;padding:16px;animation:fi .14s}
.md{background:#fff;border-radius:18px;box-shadow:var(--sh-lg);width:100%;max-width:460px;
    max-height:88vh;overflow-y:auto;animation:su .18s}
.md-h{padding:20px 22px 16px;border-bottom:1px solid var(--line-2);display:flex;
      align-items:flex-start;justify-content:space-between;gap:12px;position:sticky;top:0;background:#fff;z-index:2}
.md-t{font-size:18px;font-weight:800;letter-spacing:-.01em}
.md-s{font-size:13.5px;color:var(--muted);margin-top:2px}
.md-b{padding:22px}
.md-f{display:flex;gap:8px;padding-top:16px;margin-top:16px;border-top:1px solid var(--line-2)}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ═══ toasts ═══ */
.toasts{position:fixed;bottom:18px;right:18px;z-index:400;display:flex;flex-direction:column;
        gap:8px;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 15px;border-radius:10px;font-size:13.5px;
       font-weight:500;box-shadow:var(--sh-lg);animation:su .18s;max-width:310px;
       display:flex;align-items:center;gap:8px;border-left:3px solid var(--indigo-2)}
.toast.ok{border-left-color:var(--green-2)} .toast.err{border-left-color:var(--red)}

/* ═══════════ TV DISPLAY ═══════════ */
.tv{height:100vh;background:var(--surf);color:var(--on-surf);display:flex;flex-direction:column;
    overflow:hidden;
    padding-top:calc(env(safe-area-inset-top,0px) + var(--safe-y,0px));
    padding-bottom:calc(env(safe-area-inset-bottom,0px) + var(--safe-y,0px));
    padding-left:var(--safe-x,0px); padding-right:var(--safe-x,0px)}
.tv-h{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-shrink:0;
      padding:1.3vh 2vw;background:#fff;border-bottom:3px solid var(--green)}
.tv-logo{height:clamp(34px,4.4vh,64px);width:auto;display:block}
.tv-rule{width:2px;align-self:stretch;background:var(--line);margin:.2vh 0}
.tv-where{color:var(--indigo);font-size:clamp(13px,1.5vw,25px);font-weight:800;
          letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;
          overflow:hidden;text-overflow:ellipsis}
.tv-clock{font-family:Archivo;font-weight:800;font-size:clamp(20px,2.3vw,38px);
          font-variant-numeric:tabular-nums;line-height:1;color:var(--ink)}
.tv-date{color:var(--dim);font-size:clamp(10px,.9vw,14px);text-align:right;margin-top:2px}

.tv-body{flex:1;display:grid;grid-template-columns:44% 1fr;gap:1.4vw;padding:1.4vh 2vw;min-height:0}

/* hero — the one bold thing on this screen */
.hero{border-radius:10px;background:#fff;border:1px solid var(--line);
      border-left:10px solid var(--indigo);display:flex;flex-direction:column;
      justify-content:center;padding:2vh 2.4vw;position:relative;overflow:hidden;min-height:0;
      transition:background .3s,border-color .3s}
.hero.ring{background:var(--green);border-color:var(--green);border-left-color:var(--gold-2);color:#fff}
.hero::after{content:'';position:absolute;inset:0;opacity:0;
      background:linear-gradient(100deg,transparent 32%,rgba(255,255,255,.14) 50%,transparent 68%)}
.hero.ring::after{opacity:1;animation:sweep 2.2s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-62%)}100%{transform:translateX(62%)}}
.hero-lbl{font-size:clamp(11px,1vw,16px);font-weight:800;letter-spacing:.14em;
          color:var(--green);margin-bottom:.6vh}
.hero.ring .hero-lbl{color:rgba(255,255,255,.9)}
.hero.ring .hero-rule{background:#fff}
.hero-num{font-family:Archivo;font-weight:900;font-size:clamp(54px,10.5vw,190px);line-height:.84;
          letter-spacing:-.045em;display:flex;position:relative;z-index:1}
.hero-num span{display:inline-block;animation:drop .42s cubic-bezier(.2,.9,.25,1) backwards}
@keyframes drop{from{opacity:0;transform:translateY(-.3em)}to{opacity:1;transform:none}}
.hero-rule{height:4px;width:clamp(50px,7vw,120px);margin:1.6vh 0 1.2vh;
           background:var(--gold-2);position:relative;z-index:1}
.hero-go{font-size:clamp(12px,1.15vw,19px);color:var(--dim);font-weight:600;position:relative;z-index:1}
.hero.ring .hero-go{color:rgba(255,255,255,.8)}
.hero-win{font-size:clamp(20px,2.7vw,52px);font-weight:800;letter-spacing:-.02em;line-height:1.08;
          margin-top:.3vh;position:relative;z-index:1}
.hero-svc{font-size:clamp(11px,1.05vw,17px);color:var(--dim);margin-top:.8vh;position:relative;z-index:1}
.hero.ring .hero-svc{color:rgba(255,255,255,.72)}
.hero-idle{font-size:clamp(17px,2vw,34px);font-weight:800;color:var(--faint2)}
.hero-idle-s{font-size:clamp(11px,1.05vw,17px);color:var(--faint2);opacity:.8;margin-top:.7vh}

/* counter rail */
.rail-wrap{display:flex;flex-direction:column;min-height:0}
.rail-head{display:flex;align-items:center;justify-content:space-between;
           font-size:clamp(10px,.88vw,13px);font-weight:800;letter-spacing:.12em;
           color:var(--indigo);padding:0 .6vw .9vh}
.rail-rows{flex:1;display:grid;gap:.7vh;align-content:start;min-height:0;overflow:hidden}
.rail-rows.two{grid-template-columns:1fr 1fr;gap:.7vh .9vw}
.crow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:1vw;
      padding:1.05vh 1.2vw;border-radius:8px;background:#fff;
      border:1px solid var(--line);border-left:6px solid var(--line);
      transition:background .3s,border-color .3s;min-width:0}
.crow.live{background:var(--green-wash);border-left-color:var(--green-2)}
.crow.lit{background:var(--green);border-color:var(--green);border-left-color:#fff;color:#fff}
.crow.lit .crow-s{color:rgba(255,255,255,.78)}
.crow.lit .pulse{background:#fff}
.crow-w{font-size:clamp(12px,1.25vw,22px);font-weight:700;letter-spacing:-.01em;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow-s{font-size:clamp(9px,.78vw,12.5px);color:var(--dim);margin-top:1px;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow-n{font-family:Archivo;font-weight:900;font-size:clamp(17px,2.1vw,40px);line-height:1;
        letter-spacing:-.025em;text-align:right;white-space:nowrap}
.crow-n.idle{color:var(--faint2);font-weight:700;font-size:clamp(13px,1.3vw,22px)}
.pulse{display:inline-block;width:.5em;height:.5em;border-radius:50%;background:var(--green);
       margin-right:.4em;vertical-align:middle;animation:pz 1.6s ease infinite}
@keyframes pz{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}

/* ── TV layout: counter grid ── */
.tv-grid{flex:1;display:grid;gap:1vw;padding:1.1vh 1.4vw;min-height:0}
.gcell{display:flex;flex-direction:column;border-radius:9px;overflow:hidden;
       background:#fff;border:1px solid var(--line);
       transition:background .3s,border-color .3s;min-height:0}
.gcell-h{display:block;width:100%;background:var(--indigo);color:#fff;text-align:center;
         padding:.9vh 1vw;font-size:var(--hdrsize,20px);font-weight:800;letter-spacing:.04em;
         text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
         flex-shrink:0}
.gcell.live .gcell-h{background:var(--green-2)}
.gcell.lit{border-color:var(--green);box-shadow:0 0 0 4px var(--gold-2)}
.gcell.lit .gcell-h{background:var(--green)}
.gcell.lit .gcell-b{background:var(--green)}
.gcell.lit .gcell-s{color:rgba(255,255,255,.85)}
.gcell-b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
         gap:.4vh;padding:.6vh .6vw;transition:background .3s;min-height:0}
.gcell-n{font-family:Archivo;font-weight:900;line-height:.88;letter-spacing:-.04em;
         font-size:var(--numsize,90px)}
.gcell-s{font-size:var(--svcsize,18px);font-weight:700;color:var(--dim);
         text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.gcell-idle{font-family:Archivo;font-weight:800;color:var(--faint2);
            font-size:calc(var(--numsize,90px) * .42)}

/* ── TV layout: now serving + on-going ── */
.tv-two{flex:1;display:grid;grid-template-columns:1.35fr 1fr;gap:1.4vw;
        padding:1.6vh 2vw;min-height:0}
.tvcol{display:flex;flex-direction:column;border-radius:9px;overflow:hidden;
       background:#fff;border:1px solid var(--line);min-height:0}
.tvcol-h{background:var(--indigo);color:#fff;text-align:center;padding:1.2vh 1vw;
         font-size:clamp(13px,1.5vw,25px);font-weight:800;letter-spacing:.03em}
.tvcol-h.alt{background:var(--ink)}
.tvcol-b{flex:1;overflow:hidden;padding:1vh .9vw;display:flex;flex-direction:column;gap:.5vh}
.tvcol-empty{color:var(--faint2);font-size:clamp(13px,1.3vw,20px);
             text-align:center;padding:2vh 0;font-weight:600}
.lrow{display:flex;align-items:baseline;justify-content:space-between;gap:1vw;
      padding:.85vh 1vw;border-radius:11px;transition:background .4s}
.lrow.lit{background:var(--green)}
.lrow.lit .lrow-w{color:rgba(255,255,255,.85)}
.lrow-n{font-family:Archivo;font-weight:900;letter-spacing:-.03em;
        font-size:clamp(26px,3.5vw,58px);line-height:1}
.lrow-w{font-size:clamp(10px,1.05vw,17px);font-weight:700;color:var(--dim);
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-aspect-ratio:1/1){.tv-two{grid-template-columns:1fr}}

.tv-foot{display:flex;align-items:center;gap:1.4vw;flex-shrink:0;padding:1.1vh 2vw;
         background:var(--ink);border-top:3px solid var(--green);
         font-size:clamp(10px,1vw,15px);color:#a9acd0;overflow:hidden;white-space:nowrap}
.foot-k{font-weight:800;letter-spacing:.1em;color:#7d80ab;flex-shrink:0;font-size:.86em}
.recent{display:flex;gap:1.1vw;overflow:hidden;flex:1}
.recent i{font-style:normal;font-family:Archivo;font-weight:800;color:#fff}
.waitpill{flex-shrink:0;display:inline-flex;align-items:center;gap:.5em;padding:.35em .9em;
          border-radius:6px;background:var(--gold-2);color:#3a2c00;font-weight:800}
.unlock{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:50;
        background:var(--indigo-2);color:#fff;padding:11px 22px;border-radius:11px;
        font-size:13.5px;font-weight:600;box-shadow:var(--sh-lg)}
@media(max-aspect-ratio:1/1){
  .tv-body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .rail-rows.two{grid-template-columns:1fr}
}

/* ═══════════ KIOSK ═══════════ */
.kio{min-height:100vh;background:var(--surf);color:var(--on-surf);display:flex;flex-direction:column;
     padding:0 0 env(safe-area-inset-bottom,0px)}
.kio-h{text-align:center;padding:4.5vh 22px 2vh}
.kio-logo{width:min(70vw,460px);height:auto;margin:0 auto 10px;display:block}
.kio-t{font-size:clamp(20px,3vw,30px);font-weight:800;letter-spacing:-.02em}
.kio-s{color:var(--dim);font-size:14.5px;margin-top:5px}
.kio-b{flex:1;padding:0 4vw 4vh;max-width:1000px;margin:0 auto;width:100%}
.kio-ask{font-size:15px;font-weight:600;color:var(--dim);margin:2.4vh 0 1.2vh}
.svcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:12px}
.svc{padding:22px 16px;border-radius:15px;border:1.5px solid var(--line);
     background:var(--surf-2);color:var(--text);text-align:left;transition:.15s;position:relative;
     box-shadow:var(--sh);min-height:104px;display:flex;flex-direction:column;
     justify-content:flex-end;gap:3px}
.svc:hover{border-color:var(--indigo);transform:translateY(-2px);box-shadow:var(--sh-lg)}
.svc:active{transform:scale(.98)}
.svc-bar{position:absolute;top:16px;left:16px;width:30px;height:4px;border-radius:2px}
.svc-n{font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.svc-f{font-size:12.5px;color:var(--dim)}
.ticket{position:fixed;inset:0;background:rgba(21,24,58,.55);backdrop-filter:blur(6px);z-index:300;
        display:grid;place-items:center;padding:20px;animation:fi .16s}
.ticket-c{background:#fff;color:var(--text);border-radius:22px;padding:38px 32px;text-align:center;
          max-width:360px;width:100%;animation:su .22s}
.ticket-n{font-family:Archivo;font-weight:900;font-size:76px;line-height:1;letter-spacing:-.035em;
          margin:10px 0 4px}

@media(max-width:860px){
  .rail{width:60px}.rail-name,.rail-sub,.nav span,.who-n,.who-r,.nav-head{display:none}
  .nav{justify-content:center;padding:11px}.who{justify-content:center;padding:6px}
  .ws-l{width:232px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const STATUS = {waiting:['Waiting','t-wait'], serving:['Serving','t-serv'], done:['Done','t-done'],
                held:['On hold','t-held'], skipped:['Skipped','t-skip'], cancelled:['Cancelled','t-skip']}

const initials = n => (n||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase() || '?'
const clock = d => d.toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true})
const dateLong = d => d.toLocaleDateString('en-PH',{weekday:'long',month:'long',day:'numeric',year:'numeric'})
const stamp = s => s ? new Date(s).toLocaleString('en-PH',
  {month:'2-digit',day:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true})
  .replace(',',' -') : '—'
const hhmm = s => s ? new Date(s).toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit',hour12:true}) : '—'
const ago = s => {
  if (!s) return '—'
  const m = Math.floor((Date.now() - new Date(s))/60000)
  if (m < 1) return 'just now'
  if (m < 60) return m + 'm ago'
  return Math.floor(m/60) + 'h ' + (m%60) + 'm ago'
}
const mmss = s => {
  if (!s) return '0:00'
  const t = Math.max(0, Math.floor((Date.now() - new Date(s))/1000))
  return Math.floor(t/60) + ':' + String(t%60).padStart(2,'0')
}
const Tag = ({s}) => { const [l,c] = STATUS[s]||['—','t-done']; return <span className={'tag '+c}>{l}</span> }
