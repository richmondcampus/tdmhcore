/* ─── toasts ─── */
const TCtx = createContext(()=>{})
const useToast = () => useContext(TCtx)
function Toasts({children}) {
  const [list,setList] = useState([])
  const push = useCallback((msg,kind='info')=>{
    const id = Math.random()
    setList(l=>[...l,{id,msg,kind}])
    setTimeout(()=>setList(l=>l.filter(t=>t.id!==id)), 3200)
  },[])
  return <TCtx.Provider value={push}>{children}
    <div className="toasts">{list.map(t=>
      <div key={t.id} className={'toast '+t.kind}>
        <Ico n={t.kind==='err'?'x':'check'} s={14}/>{t.msg}
      </div>)}
    </div>
  </TCtx.Provider>
}

/* ─── speech ─── */
function useSpeech() {
  const ready  = useRef(false)
  const voice  = useRef(null)
  const ac     = useRef(null)
  const clips  = useRef(null)      // key -> AudioBuffer
  const keys   = useRef(null)      // Set of keys the voice pack has

  const bridge = () => (typeof window.fully === 'object'
                        && typeof window.fully.textToSpeech === 'function')
                        ? window.fully : null

  /* ── recorded voice pack ──────────────────────────────────────
     Android TV WebViews often have no speechSynthesis at all, so the
     announcement is assembled from short recordings instead. Works on
     any device that can play audio. */
  const ctx = () => {
    if (!ac.current) {
      const AC = window.AudioContext || window.webkitAudioContext
      if (!AC) return null
      try { ac.current = new AC() } catch { return null }
    }
    if (ac.current.state === 'suspended') ac.current.resume().catch(()=>{})
    return ac.current
  }

  useEffect(()=>{
    let dead = false
    ;(async ()=>{
      // the page may be served as /kyoo, /kyoo/ or /kyoo.html, so try the
      // places the voice folder could sit rather than guessing one
      const bases = ['voice/', '/voice/', './voice/', '../voice/']
      let base = null, idx = null
      for (const b of bases) {
        try {
          const r = await fetch(b + 'index.json', {cache:'force-cache'})
          if (!r.ok) continue
          const j = await r.json()
          if (j && Array.isArray(j.keys) && j.keys.length) { base = b; idx = j; break }
        } catch {}
      }
      if (dead || !idx) return
      keys.current = new Set(idx.keys)
      const c = ctx(); if (!c) return
      const store = {}
      await Promise.all(idx.keys.map(async k=>{
        try {
          const res = await fetch(`${base}${k}.mp3`, {cache:'force-cache'})
          if (!res.ok) return
          store[k] = await c.decodeAudioData(await res.arrayBuffer())
        } catch {}
      }))
      if (!dead && Object.keys(store).length) clips.current = store
    })()
    return ()=>{ dead = true }
  },[])

  const slug = t => 'w_' + String(t).toLowerCase().trim()
                      .replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')

  /* The pack holds whole phrases — "Number L A B" and "Please proceed to
     Lab 1" — so only the digits are joins. Falls back to spelling when a
     code or counter has no recording of its own. */
  const buildSeq = (number, where) => {
    const store = clips.current
    const s = String(number).toUpperCase()
    const m = s.match(/^([A-Z]+)(.*)$/)
    const head = m ? m[1] : ''
    const tail = m ? m[2] : s
    const seq = []

    if (head && store['n_'+head]) seq.push('n_'+head)
    else {
      seq.push('x_number')
      for (const ch of head) seq.push('l_'+ch)
    }
    // a whole three-digit number is one recording, so the digits do not
    // have to be stitched one at a time
    if (/^[0-9]{3}$/.test(tail) && store['q_'+tail]) seq.push('q_'+tail)
    else for (const ch of tail) {
      if (/[0-9]/.test(ch)) seq.push('d_'+ch)
      else if (/[A-Z]/.test(ch)) seq.push('l_'+ch)
    }

    const w = slug(where)                      // w_lab_1
    const tailKey = 'p_' + w.slice(2)          // p_lab_1
    if (store[tailKey]) seq.push(tailKey)
    else if (store['x_proceed'] && store[w]) seq.push('x_proceed', w)
    else return null                           // never say half a sentence
    return seq
  }

  const playPack = (number, where) => {
    const store = clips.current, c = ctx()
    if (!store || !c) return false
    const seq = buildSeq(number, where)
    if (!seq) return false
    const bufs = seq.map(k=>store[k])
    if (bufs.some(b=>!b)) return false
    let t = c.currentTime + 0.06
    for (const b of bufs) {
      const src = c.createBufferSource()
      src.buffer = b; src.connect(c.destination); src.start(t)
      t += b.duration + 0.02     // phrases carry their own pacing now
    }
    return true
  }

  const pickVoice = useCallback(()=>{
    const synth = window.speechSynthesis
    if (!synth || typeof synth.getVoices !== 'function') return null
    let all = []
    try { all = synth.getVoices() || [] } catch { return null }
    if (!all.length) return null
    const want = ['en-US','en_US','en-GB','en_GB','en-PH','en_PH','en-AU','en-IN']
    for (const w of want) {
      const v = all.find(x => (x.lang||'').replace('_','-').toLowerCase() === w.replace('_','-').toLowerCase())
      if (v) return v
    }
    return all.find(x => (x.lang||'').toLowerCase().startsWith('en')) || all[0] || null
  },[])

  useEffect(()=>{
    const synth = window.speechSynthesis
    if (!synth) return
    const load = ()=>{ voice.current = pickVoice() }
    load()
    const t = setTimeout(load, 1200)
    synth.addEventListener?.('voiceschanged', load)
    return ()=>{ clearTimeout(t); synth.removeEventListener?.('voiceschanged', load) }
  },[pickVoice])

  const unlock = useCallback(()=>{
    ctx()
    if (ready.current) return
    ready.current = true
    if (bridge()) return
    if (!('speechSynthesis' in window)) return
    const u = new SpeechSynthesisUtterance(' '); u.volume = 0
    window.speechSynthesis.speak(u)
    if (!voice.current) voice.current = pickVoice()
  },[pickVoice])

  const say = useCallback((number, where, repeat=2)=>{
    const n = Math.max(1, repeat)

    // 1. recorded clips — the only path that works on every device
    if (playPack(number, where)) return

    const spoken = String(number).replace(/([A-Za-z])/g,'$1 ').replace(/(\d)/g,'$1 ').trim()
    const first  = `Number ${spoken}. Please proceed to ${where}.`
    const again  = `${spoken}. ${where}.`

    // 2. the kiosk browser's own bridge to Android speech
    const fk = bridge()
    if (fk) {
      // some devices reject an explicit locale but accept the device default
      for (const loc of ['en-US', null]) {
        try {
          for (let i=0;i<n;i++) {
            const t = i===0 ? first : again
            loc ? fk.textToSpeech(t, loc) : fk.textToSpeech(t)
          }
          return
        } catch {}
      }
    }

    // 3. the browser's speech engine
    if (!('speechSynthesis' in window)) return
    window.speechSynthesis.cancel()
    if (!voice.current) voice.current = pickVoice()
    for (let i=0;i<n;i++){
      const u = new SpeechSynthesisUtterance(i===0 ? first : again)
      if (voice.current) { u.voice = voice.current; u.lang = voice.current.lang }
      else u.lang = 'en-US'
      u.rate=.82; u.pitch=1; u.volume=1
      window.speechSynthesis.speak(u)
    }
  },[pickVoice])

  return {unlock, say, isReady:()=>ready.current,
          engine:()=> clips.current ? 'clips' : bridge() ? 'kiosk'
                    : voice.current ? 'browser' : 'none'}
}

/* ════════════════════════════════════════════════════════════
   AUTH
   ════════════════════════════════════════════════════════════ */
function useAuth() {
  const [user,setUser] = useState(null)
  const [me,setMe] = useState(null)
  const [loading,setLoading] = useState(true)

  const load = async u => {
    const {data} = await sb.from('profiles').select('*').eq('id',u.id).maybeSingle()
    setMe(data); setUser(u)
  }
  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{
      if (session?.user) load(session.user).finally(()=>setLoading(false))
      else setLoading(false)
    })
    const {data:{subscription}} = sb.auth.onAuthStateChange((e,s)=>{
      if (e==='SIGNED_IN' && s?.user) load(s.user)
      if (e==='SIGNED_OUT') { setUser(null); setMe(null) }
    })
    return ()=>subscription.unsubscribe()
  },[])

  return {
    user, me, loading,
    isManager: ['admin','manager'].includes(me?.role),
    signIn: (email,password)=>sb.auth.signInWithPassword({email,password}),
    signOut: async ()=>{ try{ await sb.rpc('go_offline') }catch{}; await sb.auth.signOut() },
  }
}

/* ════════════════════════════════════════════════════════════
   SIGN IN
   ════════════════════════════════════════════════════════════ */
function SignIn({onSignIn}) {
  const [email,setEmail] = useState('')
  const [pass,setPass] = useState('')
  const [busy,setBusy] = useState(false)
  const [err,setErr] = useState('')

  const go = async e => {
    e.preventDefault(); setErr(''); setBusy(true)
    const {error} = await onSignIn(email.trim(), pass)
    if (error) { setErr(error.message); setBusy(false) }
  }
  return (
    <div style={{minHeight:'100vh',display:'grid',placeItems:'center',padding:18,
      background:'radial-gradient(900px 460px at 50% -8%,#e4e7f7 0%,#f0f1f8 46%,var(--paper) 100%)'}}>
      <div style={{width:'100%',maxWidth:368}}>
        <div style={{textAlign:'center',marginBottom:26}}>
          <img src={LOGO} alt="Taytay Doctors Multispecialty Hospital"
               style={{width:'100%',maxWidth:300,margin:'0 auto 16px',display:'block'}}/>
          <p style={{color:'var(--muted)',fontSize:14,marginTop:2}}>Queue Management</p>
        </div>
        <form onSubmit={go} style={{background:'var(--card)',border:'1px solid var(--line)',
          boxShadow:'var(--sh-lg)',borderRadius:17,padding:23,display:'flex',flexDirection:'column',gap:14}}>
          <div>
            <label className="lbl">Email</label>
            <input className="inp" type="email" required value={email} onChange={e=>setEmail(e.target.value)}
              placeholder="ikaw@tdmh.ph" autoComplete="username"/>
          </div>
          <div>
            <label className="lbl">Password</label>
            <input className="inp" type="password" required value={pass} onChange={e=>setPass(e.target.value)}
              placeholder="••••••••" autoComplete="current-password"/>
          </div>
          {err && <div style={{background:'var(--red-wash)',border:'1px solid #f0c9c7',
            color:'#8f2e2a',padding:'9px 12px',borderRadius:9,fontSize:13}}>{err}</div>}
          <button className="btn b-pri b-lg b-full" disabled={busy} style={{marginTop:3}}>
            {busy ? <div className="spin"/> : 'Sign in'}
          </button>
        </form>
        <p style={{textAlign:'center',color:'var(--faint)',fontSize:12,marginTop:16}}>
          For a TV: <code style={{color:'var(--muted)'}}>?tv=lab</code> &nbsp;·&nbsp;
          Kiosk: <code style={{color:'var(--muted)'}}>?kiosk=1</code>
        </p>
      </div>
    </div>
  )
}

/* ════════════════════════════════════════════════════════════
   TV DISPLAY
   ════════════════════════════════════════════════════════════ */
function TV({slug}) {
  const [data,setData]   = useState(null)
  const [now,setNow]     = useState(new Date())
  const [ring,setRing]   = useState(false)   // hero is flashing a fresh call
  const [litWin,setLit]  = useState(null)    // which counter row to highlight
  const [live,setLive]   = useState(false)
  const [armed,setArmed] = useState(false)
  const speech = useSpeech()
  const seen   = useRef(new Set())
  const audio  = useRef(null)
  const slugRef = useRef(slug)

  /* two-tone chime, the way a real queue board sounds before the voice */
  const chime = useCallback(()=>{
    try {
      if (!audio.current) audio.current = new (window.AudioContext||window.webkitAudioContext)()
      const ac = audio.current
      if (ac.state === 'suspended') ac.resume()
      const gain = ac.createGain()
      gain.connect(ac.destination)
      gain.gain.setValueAtTime(0.0001, ac.currentTime)
      ;[[880,0],[1174.7,0.17]].forEach(([hz,at])=>{
        const o = ac.createOscillator()
        o.type = 'sine'; o.frequency.value = hz
        const g = ac.createGain(); g.connect(gain)
        g.gain.setValueAtTime(0.0001, ac.currentTime+at)
        g.gain.exponentialRampToValueAtTime(0.22, ac.currentTime+at+0.02)
        g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+at+0.42)
        o.connect(g); o.start(ac.currentTime+at); o.stop(ac.currentTime+at+0.45)
      })
      gain.gain.setValueAtTime(1, ac.currentTime)
    } catch {}
  },[])

  const refresh = useCallback(async ()=>{
    const {data:b, error} = await sb.rpc('board',{p_slug:slugRef.current})
    if (!error && b) setData(b)
  },[])

  useEffect(()=>{
    refresh()
    const tick = setInterval(()=>setNow(new Date()),1000)
    const poll = setInterval(refresh, 20000)   // safety net only

    const ch = sb.channel('tv-'+slug)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'announcements'}, p=>{
        const a = p.new
        if (!a || seen.current.has(a.id)) return
        seen.current.add(a.id)
        refresh().then(()=>{
          setData(d=>{
            const onThisTv = !d || (d.rows||[]).some(r=>r.window_id === a.window_id)
            if (onThisTv) {
              setLit(a.window_id); setRing(true)
              chime()
              const rep = d?.settings?.announce_repeat ?? 2
              if (d?.settings?.voice_enabled !== false)
                setTimeout(()=>speech.say(a.number, a.window_name, rep), 620)
              setTimeout(()=>{ setRing(false); setLit(null) }, 10000)
            }
            return d
          })
        })
      })
      .on('postgres_changes',{event:'*',schema:'public',table:'tickets'}, ()=>refresh())
      .subscribe(s=>setLive(s==='SUBSCRIBED'))

    const mid = setInterval(()=>{
      const d = new Date()
      if (d.getHours()===0 && d.getMinutes()===1) location.reload()
    },60000)

    return ()=>{ clearInterval(tick); clearInterval(poll); clearInterval(mid); ch.unsubscribe() }
  },[slug, refresh, chime])

  const arm = useCallback(() => { speech.unlock(); chime(); setArmed(true) }, [chime])

  /* A TV has no touchscreen. Try to open audio by ourselves first — kiosk
     browsers can be set to allow autoplay — and accept any remote button as
     the gesture if the browser still insists on one. */
  useEffect(()=>{
    if (armed) return
    let done = false
    const settle = () => { if (!done) { done = true; setArmed(true) } }
    try {
      const AC = window.AudioContext || window.webkitAudioContext
      if (AC) {
        const ac = new AC()
        if (ac.state === 'running') { speech.unlock(); settle() }
        else ac.resume().then(()=>{ if (ac.state==='running') { speech.unlock(); settle() } })
            .catch(()=>{})
      }
    } catch {}
    const onAny = () => { arm() }
    window.addEventListener('keydown', onAny)
    window.addEventListener('pointerdown', onAny)
    return ()=>{ window.removeEventListener('keydown', onAny)
                 window.removeEventListener('pointerdown', onAny) }
  },[armed, arm])

  if (!data) return <div className="tv" style={{display:'grid',placeItems:'center'}}><div className="spin"/></div>

  const rows   = data.rows || []
  const last   = data.last_call && data.last_call !== null ? data.last_call : null
  const twoUp  = rows.length > 6
  const layout = data.display?.layout || 'spotlight'
  const cols   = Math.min(Math.max(data.display?.columns || 2, 1), 4)

  /* The number should fill its cell on any screen. vw and vh are relative,
     so dividing by the grid shape adapts to a 32-inch set and a 75-inch one
     alike — the type grows with the tile, not with a fixed ceiling. */
  const safeGuess = () => 2 * Math.min(Math.max(parseFloat(
    new URLSearchParams(location.search).get('safe') ?? '1.5') || 0, 0), 8)
  const cells   = Math.max(rows.length, 1)
  const gcols   = Math.min(cols, cells)
  const grows   = Math.max(1, Math.ceil(cells / gcols))
  const longest = rows.reduce((m,r)=>Math.max(m, (r.number||'').length), 6)
  // width a cell can give the number, allowing for grid gaps and padding
  const cellVW = (92 - safeGuess()) / gcols
  // height left after the cell's own header band and the service line
  const cellVH = Math.max(14, (78 / grows) - 11)
  const numVW  = cellVW / (Math.max(longest, 4) * 0.66)   // .60em a glyph, plus breathing room
  const gridVars = {
    '--numsize': `min(${numVW.toFixed(1)}vw, ${(cellVH * 0.78).toFixed(1)}vh)`,
    '--svcsize': `min(${(cellVW / 14).toFixed(1)}vw, ${Math.min(2.6, cellVH * 0.13).toFixed(1)}vh)`,
    '--hdrsize': `min(${(cellVW / 11).toFixed(1)}vw, 3.4vh)`,
  }

  /* Most TVs crop the edges. ?safe=3 trims a further 3% for stubborn sets. */
  const safe = Math.min(Math.max(parseFloat(
    new URLSearchParams(location.search).get('safe') ?? '1.5') || 0, 0), 8)
  const safeVars = {'--safe-x': safe + 'vw', '--safe-y': safe * 0.8 + 'vh'}

  return (
    <div className="tv" onClick={arm} style={safeVars}>
      {!armed && <button className="unlock" onClick={arm}>Press any button on the remote to turn on sound</button>}

      <div className="tv-h">
        <div style={{display:'flex',alignItems:'center',gap:'1.6vw',minWidth:0}}>
          <img className="tv-logo" src={LOGO} alt=""/>
          <span className="tv-rule"/>
          <div className="tv-where">{data.display?.name || 'Queue Display'}</div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:'1.2vw',flexShrink:0}}>
          <span className="dot" style={{opacity:live?1:.2}}/>
          <div style={{textAlign:'right'}}>
            <div className="tv-clock">{clock(now)}</div>
            <div className="tv-date">{dateLong(now)}</div>
          </div>
        </div>
      </div>

      {layout === 'grid' ? (
        <div className="tv-grid" style={{gridTemplateColumns:`repeat(${gcols},1fr)`, ...gridVars}}>
          {rows.length===0 && (
            <div style={{gridColumn:'1/-1',display:'grid',placeItems:'center',
                         color:'var(--faint2)',fontSize:'clamp(16px,2vw,30px)',fontWeight:800}}>
              No counter is open right now.
            </div>
          )}
          {rows.map(r=>{
            const lit = litWin===r.window_id
            return (
              <div key={r.window_id} className={'gcell '+(lit?'lit':r.status==='serving'?'live':'')}>
                <div className="gcell-h">{r.window_name}</div>
                <div className="gcell-b">
                  {r.number ? (
                    <>
                      <div className="gcell-n"
                           style={{color: lit ? '#fff'
                                        : r.status==='done' ? 'var(--faint2)'
                                        : (r.service_color || 'var(--indigo)')}}>{r.number}</div>
                      <div className="gcell-s">{r.service_name}</div>
                    </>
                  ) : <div className="gcell-idle">—</div>}
                </div>
              </div>
            )
          })}
        </div>
      ) : layout === 'list' ? (
        <div className="tv-two">
          <div className="tvcol">
            <div className="tvcol-h">Now Serving</div>
            <div className="tvcol-b">
              {rows.filter(r=>r.number).length===0 && <div className="tvcol-empty">None yet</div>}
              {rows.filter(r=>r.number).map(r=>(
                <div key={r.window_id} className={'lrow '+(litWin===r.window_id?'lit':'')}>
                  <span className="lrow-n"
                        style={{color: litWin===r.window_id ? '#fff'
                                     : (r.service_color || 'var(--indigo)')}}>{r.number}</span>
                  <span className="lrow-w">{r.window_name}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="tvcol">
            <div className="tvcol-h alt">On-going{data.waiting>0 && ` · ${data.waiting}`}</div>
            <div className="tvcol-b">
              {(data.queue||[]).length===0 && <div className="tvcol-empty">Nobody waiting</div>}
              {(data.queue||[]).map((q,i)=>(
                <div key={i} className="lrow">
                  <span className="lrow-n" style={{color:'var(--dim)'}}>{q.number}</span>
                  <span className="lrow-w">{q.service_name}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      ) : (
      <div className="tv-body">
        {/* ── hero: the number being called ── */}
        <div className={'hero '+(ring?'ring':'')}>
          {last ? (
            <>
              <div className="hero-lbl">
                {ring ? (last.kind==='recall' ? 'CALLING AGAIN' : 'NOW CALLING') : 'LAST CALLED'}
              </div>
              <div className="hero-num" key={last.id}
                   style={{color: ring ? '#fff' : (last.service_color || 'var(--indigo)')}}>
                {String(last.number).split('').map((c,i)=>(
                  <span key={i} style={{animationDelay:(i*55)+'ms'}}>{c}</span>
                ))}
              </div>
              <div className="hero-rule"/>
              <div className="hero-go">Please proceed to</div>
              <div className="hero-win">{last.window_name}</div>
              {last.service_name && <div className="hero-svc">{last.service_name}</div>}
            </>
          ) : (
            <div style={{textAlign:'center'}}>
              <div className="hero-idle">No one called yet</div>
              <div className="hero-idle-s">Please wait for your number.</div>
            </div>
          )}
        </div>

        {/* ── counter rail ── */}
        <div className="rail-wrap">
          <div className="rail-head"><span>COUNTER</span><span>NUMERO</span></div>
          <div className={'rail-rows '+(twoUp?'two':'')}>
            {rows.length === 0 && (
              <div style={{color:'var(--faint2)',fontSize:'clamp(12px,1.2vw,18px)',padding:'2vh .6vw'}}>
                No counter is open right now.
              </div>
            )}
            {rows.map(r=>(
              <div key={r.window_id}
                   className={'crow '+(litWin===r.window_id ? 'lit' : r.status==='serving' ? 'live' : '')}>
                <div style={{minWidth:0}}>
                  <div className="crow-w">{r.window_name}</div>
                  <div className="crow-s">{r.service_name || '—'}</div>
                </div>
                {r.number
                  ? <div className="crow-n" style={{color: litWin===r.window_id ? '#fff'
                                                         : r.status==='done' ? 'var(--faint2)'
                                                         : (r.service_color || 'var(--indigo)')}}>
                      {r.status==='serving' && <span className="pulse"/>}{r.number}
                    </div>
                  : <div className="crow-n idle">—</div>}
              </div>
            ))}
          </div>
        </div>
      </div>
      )}

      <div className="tv-foot">
        <span className="foot-k">RECENTLY CALLED</span>
        <div className="recent">
          {(data.recent||[]).length === 0
            ? <span style={{color:'var(--faint2)'}}>none yet</span>
            : data.recent.map((a,i)=>(
                <span key={i}><i>{a.number}</i> <span style={{opacity:.55}}>{a.window_name}</span></span>
              ))}
        </div>
        {data.waiting > 0 && (
          <span className="waitpill">{data.waiting} waiting</span>
        )}
      </div>
    </div>
  )
}

/* ════════════════════════════════════════════════════════════
   KIOSK
   ════════════════════════════════════════════════════════════ */
function Kiosk() {
  const [svcs,setSvcs]   = useState([])
  const [tk,setTk]       = useState(null)
  const [busy,setBusy]   = useState(false)
  const [note,setNote]   = useState('')
  const [now,setNow]     = useState(new Date())

  useEffect(()=>{
    sb.from('services').select('id,code,name,name_fil,color')
      .eq('is_active',true).eq('show_on_kiosk',true).order('sort_order')
      .then(({data})=>setSvcs(data||[]))
    sb.from('settings').select('kiosk_note').eq('id',1).maybeSingle()
      .then(({data})=>setNote(data?.kiosk_note||''))
    const t = setInterval(()=>setNow(new Date()),1000)
    return ()=>clearInterval(t)
  },[])

  const take = async svc => {
    if (busy) return
    setBusy(true)
    const {data,error} = await sb.rpc('issue_ticket',{ p_service_id: svc.id })
    setBusy(false)
    if (error) { alert('Could not get a number. Please ask a staff member.'); return }
    setTk({...data, service:svc})
    setTimeout(()=>setTk(null), 14000)
  }

  return (
    <div className="kio">
      <div className="kio-h">
        <img className="kio-logo" src={LOGO} alt="Taytay Doctors Multispecialty Hospital"/>
        <p className="kio-s">{dateLong(now)} · {clock(now)}</p>
      </div>

      <div className="kio-b">
        <div className="kio-ask">What do you need today?</div>
        <div className="svcs">
          {svcs.map(s=>(
            <button key={s.id} className="svc" onClick={()=>take(s)} disabled={busy}>
              <div className="svc-bar" style={{background:s.color}}/>
              <div className="svc-n">{s.name_fil || s.name}</div>
              <div className="svc-f">{s.name_fil ? s.name : s.code}</div>
            </button>
          ))}
          {svcs.length===0 && (
            <div style={{gridColumn:'1/-1',textAlign:'center',color:'var(--faint)',padding:40}}>
              No services are available right now.
            </div>
          )}
        </div>
      </div>

      {tk && (
        <div className="ticket" onClick={()=>setTk(null)}>
          <div className="ticket-c" onClick={e=>e.stopPropagation()}>
            <div style={{fontSize:12.5,fontWeight:700,color:'var(--muted)'}}>Taytay Doctors Multispecialty Hospital</div>
            <div className="ticket-n" style={{color:tk.service?.color||'var(--indigo)'}}>{tk.number}</div>
            <div style={{fontSize:16,fontWeight:700}}>{tk.service?.name_fil || tk.service?.name}</div>
            <div style={{marginTop:17,padding:'11px 14px',background:'var(--paper)',borderRadius:11,
                         fontSize:13,color:'var(--muted)'}}>{note}</div>
            <div style={{fontSize:12,color:'var(--faint)',marginTop:11}}>
              {new Date(tk.created_at||Date.now()).toLocaleString('en-PH',
                {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:true})}
            </div>
            <button className="btn b-pri b-lg b-full" style={{marginTop:17}} onClick={()=>setTk(null)}>
              Thank you
            </button>
          </div>
        </div>
      )}
    </div>
  )
}

/* ════════════════════════════════════════════════════════════
   COUNTER — the daily staff screen
   ════════════════════════════════════════════════════════════ */
function Counter({me}) {
  const toast = useToast()
  const [wins,setWins]   = useState([])
  const [win,setWin]     = useState(null)
  const [svcs,setSvcs]   = useState([])        // services this counter handles
  const [svcFilter,setSvcFilter] = useState('')
  const [waiting,setWaiting] = useState([])
  const [held,setHeld]   = useState([])      // queues this counter is holding
  const [done,setDone]   = useState([])
  const [tab,setTab]     = useState('ongoing')
  const [selId,setSelId] = useState(null)
  const [mine,setMine]   = useState(false)
  const [q,setQ]         = useState('')
  const [showSearch,setShowSearch] = useState(false)
  const [busy,setBusy]   = useState(false)
  const [move,setMove]   = useState(null)
  const [adding,setAdding] = useState(false)
  const [history,setHistory] = useState(false)
  const [menu,setMenu]   = useState(false)
  const [detail,setDetail] = useState(null)
  const [auto,setAuto]   = useState(()=>localStorage.getItem('tdmhq-auto')==='1')
  const [cfg,setCfg]     = useState({})
  const [ask,setAsk]     = useState(null)   // {kind, ticket} — remark / movement prompt
  const [, bump]         = useState(0)
  const chRef = useRef(null)
  const autoRef = useRef(auto)
  useEffect(()=>{ autoRef.current = auto; localStorage.setItem('tdmhq-auto', auto?'1':'0') },[auto])

  useEffect(()=>{
    sb.from('settings').select('*').eq('id',1).maybeSingle().then(({data})=>setCfg(data||{}))
  },[])

  useEffect(()=>{
    (async ()=>{
      let ids = null
      if (!['admin','manager'].includes(me.role)) {
        const {data} = await sb.from('window_staff').select('window_id').eq('user_id',me.id)
        ids = (data||[]).map(r=>r.window_id)
      }
      let qy = sb.from('windows').select('id,name,short_name').eq('is_active',true).order('sort_order')
      if (ids) qy = ids.length ? qy.in('id',ids) : qy.eq('id','00000000-0000-0000-0000-000000000000')
      const {data:w} = await qy
      setWins(w||[])
      const pick = (w||[]).find(x=>x.id===localStorage.getItem('tdmhq-window'))
      if (pick) setWin(pick)
    })()
  },[me.id])

  const load = useCallback(async wid=>{
    if (!wid) return
    const {data:ws} = await sb.from('window_services')
      .select('services!inner(id,code,name,color)').eq('window_id',wid)
    const list = (ws||[]).map(r=>r.services).filter(Boolean)
    setSvcs(list)
    const ids = list.map(s=>s.id)
    if (!ids.length) { setWaiting([]); setServing(null); setDone([]); return }
    const today = new Date().toISOString().slice(0,10)
    const cols = '*,services!tickets_service_id_fkey(code,name,color,allow_multi_serve)'
    const [w,s,dn] = await Promise.all([
      sb.from('tickets').select(cols).eq('ticket_date',today).in('service_id',ids)
        .in('status',['waiting','held']).order('sort_at'),
      sb.from('tickets').select(cols).eq('ticket_date',today).eq('window_id',wid)
        .eq('status','serving').order('called_at'),
      sb.from('tickets').select(cols).eq('ticket_date',today).eq('window_id',wid)
        .in('status',['done','skipped']).order('completed_at',{ascending:false}).limit(40),
    ])
    setWaiting(w.data||[]); setHeld(s.data||[]); setDone(dn.data||[])
  },[])

  useEffect(()=>{
    if (!win) return
    localStorage.setItem('tdmhq-window', win.id)
    load(win.id)
    sb.rpc('beat',{p_window_id:win.id})
    const beat  = setInterval(()=>sb.rpc('beat',{p_window_id:win.id}), 60000)
    const timer = setInterval(()=>bump(n=>n+1), 1000)
    chRef.current?.unsubscribe()
    const ch = sb.channel('counter-'+win.id)
      .on('postgres_changes',{event:'*',schema:'public',table:'tickets'},()=>load(win.id))
      .subscribe()
    chRef.current = ch
    return ()=>{ clearInterval(beat); clearInterval(timer); ch.unsubscribe() }
  },[win?.id, load])

  /* the list currently on screen */
  const pool = tab==='serving' ? held : waiting
  const rows = pool.filter(t=>{
    if (svcFilter && t.service_id !== svcFilter) return false
    if (mine && t.served_by !== me.id) return false
    const v = q.trim().toLowerCase()
    return !v || t.number.toLowerCase().includes(v)
      || (t.patient_name||'').toLowerCase().includes(v)
      || (t.tags||[]).some(g=>g.toLowerCase().includes(v))
  })

  /* keep a sensible selection: follow the serving ticket, else first in list */
  useEffect(()=>{
    setSelId(s => s && [...rows,...held].some(r=>r.id===s) ? s : (rows[0]?.id ?? held[0]?.id ?? null))
  },[tab, waiting.length, held.length, svcFilter])

  const sel = [...rows, ...held].find(r=>r.id===selId) || rows[0] || held[0] || null

  useEffect(()=>{
    if (!sel) { setDetail(null); return }
    sb.rpc('ticket_detail',{p_ticket_id:sel.id}).then(({data})=>setDetail(data||null))
  },[sel?.id, sel?.status, sel?.journey_step, sel?.recall_count, sel?.tags?.length])

  const isServing = sel && sel.status==='serving'
  // which held queues would be released if we called something single-serve now
  const wouldDrop = held.filter(h=>!h.services?.allow_multi_serve).map(h=>h.number)

  const next = async () => {
    if (!win || busy) return
    const dropped = held.filter(h=>!h.services?.allow_multi_serve).map(h=>h.number)
    setBusy(true)
    const {data,error} = await sb.rpc('call_next',{p_window_id:win.id})
    setBusy(false)
    if (error) return toast(error.message,'err')
    if (!data) return toast('No one is waiting.','info')
    setTab('serving')
    toast('Called '+data.number,'ok')
    if (dropped.length) toast(dropped.join(', ')+' went back to the end of the queue','info')
  }
  const serveThis = async t => {
    if (busy) return
    const dropped = held.filter(h=>h.id!==t.id && !h.services?.allow_multi_serve).map(h=>h.number)
    setBusy(true)
    const {error} = await sb.rpc('call_ticket',{p_ticket_id:t.id,p_window_id:win.id})
    setBusy(false)
    if (error) return toast(error.message,'err')
    setTab('serving')
    toast('Called '+t.number,'ok')
    if (dropped.length) toast(dropped.join(', ')+' went back to the end of the queue','info')
  }
  const needsRemark = what => ({
    done:    false,
    held:    cfg.remarks_on_hold,
    skipped: cfg.remarks_on_skip,
    return:  cfg.remarks_on_return,
    cancelled: cfg.remarks_on_remove,
  }[what])

  const act = async (what, detail) => {
    const target = sel && sel.status==='serving' ? sel : held[0]
    if (!target || busy) return
    // Complete may first ask where the patient goes next
    if (what==='done' && cfg.queue_movement && detail===undefined) {
      setAsk({kind:'movement', ticket:target}); return
    }
    if (needsRemark(what) && detail===undefined) {
      setAsk({kind:'remark', action:what, ticket:target}); return
    }
    setBusy(true)
    const {error} =
      what==='recall' ? await sb.rpc('recall_ticket',{p_ticket_id:target.id}) :
      what==='return' ? await sb.rpc('return_ticket',{p_ticket_id:target.id, p_detail:detail||null}) :
      await sb.rpc('set_ticket_status',{p_ticket_id:target.id, p_status:what, p_detail:detail||null})
    setBusy(false); setMenu(false); setAsk(null)
    if (error) return toast(error.message,'err')
    toast({recall:'Called again', done:'Completed', held:'On hold',
           skipped:'Skipped', return:'Returned to queue', cancelled:'Cancelled'}[what]
          + ' · ' + target.number,'ok')
    if (what!=='recall' && held.length<=1) {
      setTab('ongoing'); if (autoRef.current) setTimeout(next,700)
    }
  }

  useEffect(()=>{
    const onKey = e => {
      if (e.target.matches('input,textarea,select') || move || adding || history) return
      const k = e.key.toLowerCase()
      if (k===' ')      { e.preventDefault(); next() }
      else if (isServing && k==='r') act('recall')
      else if (isServing && k==='d') act('done')
      else if (isServing && k==='h' && cfg.enable_hold!==false) act('held')
      else if (isServing && k==='s' && cfg.enable_skip!==false) act('skipped')
    }
    window.addEventListener('keydown',onKey)
    return ()=>window.removeEventListener('keydown',onKey)
  })
  useEffect(()=>{ const c=()=>setMenu(false); window.addEventListener('click',c); return ()=>window.removeEventListener('click',c) },[])

  /* ── counter picker ── */
  if (!win) {
    const hour = new Date().getHours()
    return (
      <div className="mid" style={{padding:22}}>
        <div style={{width:'100%',maxWidth:430}}>
          <div style={{textAlign:'center',marginBottom:22}}>
            <h1 className="h1">{hour<12?'Good morning':hour<18?'Good afternoon':'Good evening'}, {(me.full_name||'').split(' ')[0]}</h1>
            <p className="sub">Which counter are you serving at today?</p>
          </div>
          <div className="card" style={{padding:6,maxHeight:380,overflowY:'auto'}}>
            {wins.length===0 && <div className="empty"><div className="empty-t">No counter assigned to you</div>
              <div>Ask an admin to assign you to one.</div></div>}
            {wins.map(w=>(
              <button key={w.id} className="b-out" onClick={()=>setWin(w)}
                style={{display:'flex',width:'100%',alignItems:'center',justifyContent:'space-between',
                        padding:'13px 15px',borderRadius:11,margin:4,border:'1.5px solid var(--line)'}}>
                <span style={{fontWeight:600}}>{w.name}</span><Ico n="right" s={16}/>
              </button>
            ))}
          </div>
        </div>
      </div>
    )
  }

  return (
    <div className="ws">
      {/* ════ left: the queue ════ */}
      <div className="ws-l">
        <div className="from">
          <span className="from-k">From</span>
          <select className="from-sel" value={svcFilter} onChange={e=>setSvcFilter(e.target.value)}>
            <option value="">All services ({svcs.length})</option>
            {svcs.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
        </div>

        <div className="utabs">
          <button className={'utab '+(tab==='serving'?'on':'')} onClick={()=>setTab('serving')}>
            Current Serving <span className="ucnt">{held.length}</span>
          </button>
          <button className={'utab '+(tab==='ongoing'?'on':'')} onClick={()=>setTab('ongoing')}>
            On-going Queue <span className="ucnt">{waiting.length}</span>
          </button>
        </div>

        <div className="tools">
          <div className="pillset">
            <button className={'pillb '+(mine?'on':'')} onClick={()=>setMine(true)}>
              <Ico n="users" s={12}/>Me</button>
            <button className={'pillb '+(!mine?'on':'')} onClick={()=>setMine(false)}>
              <Ico n="users" s={12}/>All</button>
          </div>
          <button className="toolb" onClick={()=>{setShowSearch(s=>!s); if(showSearch) setQ('')}}>
            <Ico n="search" s={13}/>Search</button>
        </div>
        {showSearch && (
          <div style={{padding:'0 12px 10px'}}>
            <input className="inp" autoFocus value={q} onChange={e=>setQ(e.target.value)}
                   style={{fontSize:13}} placeholder="Number, name or tag…"/>
          </div>
        )}

        <div className="ws-list">
          {rows.length===0 && (
            <div className="empty">
              <div className="empty-i"><Ico n="clock" s={20}/></div>
              <div className="empty-t">{tab==='ongoing'?'No one waiting':'Not serving anyone'}</div>
              <div style={{fontSize:13}}>{tab==='ongoing'
                ? 'New tickets appear here as they are taken.'
                : 'Pick a queue and press Serve Queue.'}</div>
            </div>
          )}
          {rows.map(t=>(
            <button key={t.id} className={'qc '+(sel?.id===t.id?'on':'')} onClick={()=>setSelId(t.id)}>
              <div className="qc-top">
                <span className="num qc-n">{t.number}</span>
                <span className="qc-svc">{t.services?.name}</span>
              </div>
              <div className="qc-mid">
                <span className="qc-lbl">Waiting Time</span>
                <span className="qc-ago">{ago(t.sort_at)}</span>
              </div>
              {(t.tags||[]).length>0 && (
                <div className="chips">{t.tags.map(g=><span key={g} className="chip">{g}</span>)}</div>
              )}
              {t.journey_step>1 && <span className="tag t-step" style={{marginTop:7}}>Step {t.journey_step}</span>}
            </button>
          ))}
        </div>

        <div className="ws-f">
          <button className="btn b-out b-lg b-full" onClick={()=>setAdding(true)}>
            <Ico n="plus" s={16}/>Add Queue</button>
        </div>
      </div>

      {/* ════ right: the ticket ════ */}
      <div className="ws-r">
        <div className="phead">
          <h2 className="phead-t">{win.name}</h2>
          <div style={{display:'flex',gap:8}}>
            <button className="btn b-out" onClick={()=>setHistory(true)}>
              <Ico n="clock" s={15}/>Queue History</button>
            <button className="btn b-out" onClick={()=>{setWin(null);sb.rpc('go_offline')}}>
              <Ico n="out" s={15}/>Leave Window</button>
          </div>
        </div>

        <div className="autobar">
          <div>
            <div className="autobar-t">Auto-serve ongoing queues</div>
            <div className="autobar-s">After completing a queue, automatically call the next one in the list.</div>
          </div>
          <button className={'sw '+(auto?'on':'')} onClick={()=>setAuto(a=>!a)}><i/></button>
        </div>

        {sel ? (
          <>
            <div className="detail">
              <div className="detail-mid">
                <div className="card tkcard">
                  <div className="tkcard-k">QUEUE NUMBER</div>
                  <div className="num tkcard-n" style={{color:sel.services?.color||'var(--indigo)'}}>
                    {sel.number}</div>
                  <div className="tkcard-rule"/>
                  <div className="fld">
                    <div className="fld-k">QUEUE ON</div>
                    <div className="fld-v" style={{color:sel.services?.color,fontWeight:700}}>
                      {sel.services?.name}
                      {sel.services?.allow_multi_serve && (
                        <span className="tag t-step" style={{marginLeft:8,fontWeight:600}}>
                          multiple serving</span>
                      )}</div>
                  </div>
                  {sel.patient_name && (
                    <><div className="tkcard-rule"/>
                    <div className="fld"><div className="fld-k">PATIENT</div>
                      <div className="fld-v">{sel.patient_name}</div></div></>
                  )}
                  <div className="tkcard-rule"/>
                  <div className="fld row">
                    <div className="fld-k">Date / Time Queued</div>
                    <div className="fld-v">{stamp(sel.created_at)}</div>
                  </div>
                  {sel.note && (
                    <><div className="tkcard-rule"/>
                    <div className="fld"><div className="fld-k">NOTE</div>
                      <div className="fld-v" style={{fontWeight:500,color:'var(--muted)'}}>{sel.note}</div></div></>
                  )}
                  <div className="tkcard-rule"/>
                  <TagEditor ticket={sel}
                    onSaved={()=>toast('Tags updated','ok')} onError={m=>toast(m,'err')}/>
                </div>
              </div>

              <div className="detail-side">
                <div className="card sidecard side-row">
                  <span className="side-k" style={{color:'var(--indigo)'}}>WAITING TIME</span>
                  <span style={{color:'var(--indigo)',fontWeight:700,fontSize:14}}>{ago(sel.sort_at)}</span>
                </div>

                {isServing && (
                  <div className="card sidecard side-row">
                    <span className="side-k" style={{color:'var(--green)'}}>SERVING TIME</span>
                    <span className="num" style={{fontSize:17,color:'var(--green)'}}>{mmss(sel.called_at)}</span>
                  </div>
                )}

                {detail && (detail.path||[]).length>1 && (
                  <div className="card sidecard">
                    <div className="side-k">PROCEDURES LIST</div>
                    <div style={{fontSize:13.5,fontWeight:700,marginTop:7}}>Patient journey</div>
                    <div style={{fontSize:11.5,color:'var(--muted)'}}>
                      Step-by-step · {detail.path.length} steps</div>
                    <div className="path">
                      {detail.path.map((p,i)=>{
                        const last = i===detail.path.length-1
                        return (
                          <div key={i} className="path-row">
                            <span className="path-dot" style={{background:last?'var(--indigo)':'var(--green)'}}/>
                            <div style={{flex:1,minWidth:0}}>
                              <div className="path-n">STEP {i+1}</div>
                              <div className="path-s" style={{color:p.service_color}}>{p.service_name}</div>
                            </div>
                            <span className="path-t" style={{color:last?'var(--indigo)':'var(--green)'}}>
                              {last?'Current':'Completed'}</span>
                          </div>
                        )
                      })}
                    </div>
                  </div>
                )}

                <div className="card sidecard" style={{flex:1,minHeight:0,display:'flex',flexDirection:'column'}}>
                  <div className="side-k">TIMELINE</div>
                  <div className="tl">
                    {(detail?.events||[]).length===0 &&
                      <div style={{fontSize:12.5,color:'var(--faint)'}}>Nothing logged yet.</div>}
                    {(detail?.events||[]).map((e,i)=>(
                      <div key={i} className="tl-row">
                        <span className="tl-dot"/>
                        <div style={{minWidth:0,flex:1}}>
                          <div className="tl-head">
                            <span className="tl-a">{(EVENT[e.action]||e.action).toUpperCase()}</span>
                            <span className="tl-when">{stamp(e.created_at)}</span>
                          </div>
                          <div className="tl-m">
                            {e.service_name && <>on <b>{e.service_name}</b> </>}
                            {e.window_name  && <>at <b>{e.window_name}</b> </>}
                            {e.actor_name   && <>by {e.actor_name}</>}
                          </div>
                          {e.detail && <div className="tl-d">{e.detail}</div>}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>

            <div className="actbar">
              {isServing ? (
                <>
                  <div style={{position:'relative'}} onClick={e=>e.stopPropagation()}>
                    <button className="btn b-out b-ico" onClick={()=>setMenu(m=>!m)}><Ico n="more" s={17}/></button>
                    {menu && (
                      <div className="dd">
                        <button className="dd-i" onClick={()=>act('recall')}>
                          <Ico n="bell" s={14}/>Call again<span className="kbd">R</span></button>
                        {cfg.enable_hold!==false && (
                          <button className="dd-i" onClick={()=>act('held')}>
                            <Ico n="pause" s={14}/>Put on hold<span className="kbd">H</span></button>)}
                        {cfg.enable_skip!==false && (
                          <button className="dd-i" onClick={()=>act('skipped')}>
                            <Ico n="skip" s={14}/>Skip<span className="kbd">S</span></button>)}
                        {cfg.enable_return!==false && (
                          <button className="dd-i" onClick={()=>act('return')}>
                            <Ico n="next" s={14}/>Return to on-going queue</button>)}
                        <div className="dd-sep"/>
                        <button className="dd-i" onClick={()=>{setMove({kind:'service'});setMenu(false)}}>
                          <Ico n="route" s={14}/>Send to another department</button>
                        <button className="dd-i" style={{color:'var(--red)'}} onClick={()=>act('cancelled')}>
                          <Ico n="x" s={14}/>Cancel queue</button>
                      </div>
                    )}
                  </div>
                  <div style={{flex:1}}/>
                  <button className="btn b-out b-lg" onClick={()=>act('recall')} disabled={busy}>
                    <Ico n="bell" s={16}/>Call Again</button>
                  <button className="btn b-go b-lg" onClick={()=>act('done')} disabled={busy}>
                    <Ico n="check" s={17}/>Complete<span className="kbd kbd-on">D</span></button>
                </>
              ) : (
                <>
                  <div style={{flex:1}}/>
                  {wouldDrop.length>0 && (
                    <span style={{fontSize:13,color:'var(--muted)',marginRight:4}}>
                      Holding <b className="num">{wouldDrop.join(', ')}</b> — calling this one
                      sends it back to the end of the queue.</span>
                  )}
                  {wouldDrop.length===0 && held.length>0 && (
                    <span style={{fontSize:13,color:'var(--muted)',marginRight:4}}>
                      Holding {held.length} queue{held.length>1?'s':''} — this service allows
                      serving several at once.</span>
                  )}
                  <button className="btn b-pri b-lg" onClick={()=>serveThis(sel)} disabled={busy}>
                    {busy ? <div className="spin"/> : <><Ico n="next" s={17}/>Serve Queue</>}
                  </button>
                </>
              )}
            </div>
          </>
        ) : (
          <div className="empty" style={{flex:1}}>
            <div className="empty-i" style={{width:58,height:58}}><Ico n="desk" s={25}/></div>
            <div className="empty-t" style={{fontSize:16}}>Nothing to show</div>
            <div>Pick a queue on the left, or press Next to call the first in line.</div>
            <button className="btn b-pri b-lg" style={{marginTop:14}} onClick={next} disabled={busy}>
              <Ico n="next" s={17}/>Call next in queue</button>
          </div>
        )}
      </div>

      {move && (move.ticket || sel) && (
        <MoveModal ticket={move.ticket || sel} kind={move.kind} windowId={win.id}
          onClose={()=>setMove(null)} onDone={m=>{ setMove(null); toast(m,'ok') }}/>
      )}
      {adding && (
        <AddQueue windowId={win.id} onClose={()=>setAdding(false)}
          onDone={n=>{ setAdding(false); toast('Queue added: '+n,'ok') }}/>
      )}
      {history && <History rows={done} onClose={()=>setHistory(false)}/>}
      {ask && (
        <AskModal ask={ask} cfg={cfg} windowId={win.id}
          onClose={()=>setAsk(null)}
          onRemark={d=>act(ask.action, d)}
          onFinish={d=>act('done', d||'')}
          onMove={()=>{ const t=ask.ticket; setAsk(null); setMove({kind:'service',ticket:t}) }}/>
      )}
    </div>
  )
}

/* ─── asks for a remark, or where the patient goes next ─── */
function AskModal({ask, cfg, onClose, onRemark, onFinish, onMove}) {
  const [text,setText] = useState('')
  const required = !!cfg.remarks_required
  const movement = ask.kind === 'movement'
  const LABEL = {
    held:'Why is this queue being held?',
    skipped:'Why is this queue being skipped?',
    return:'Why is this queue going back to the line?',
    cancelled:'Why is this queue being cancelled?',
  }
  const submit = e => {
    e.preventDefault()
    if (required && !text.trim()) return
    onRemark(text.trim())
  }
  return (
    <div className="ov" onClick={onClose}>
      <div className="md" style={{maxWidth:440}} onClick={e=>e.stopPropagation()}>
        <div className="md-h">
          <div>
            <div className="md-t">{movement ? 'Where does this patient go next?' : 'Add a remark'}</div>
            <div className="md-s">Queue <b className="num">{ask.ticket.number}</b></div>
          </div>
          <button className="btn b-ghost b-ico" onClick={onClose}><Ico n="x" s={17}/></button>
        </div>

        {movement ? (
          <div className="md-b">
            <p style={{fontSize:13.5,color:'var(--muted)',marginBottom:16}}>
              Finishing keeps the same number on record. Sending the patient onward also keeps
              the number — it just moves to the next department’s queue.
            </p>
            <div style={{display:'flex',flexDirection:'column',gap:9}}>
              <button className="btn b-pri b-lg b-full" onClick={onMove}>
                <Ico n="route" s={17}/>Send to another department</button>
              <button className="btn b-go b-lg b-full" onClick={()=>onFinish('')}>
                <Ico n="check" s={17}/>Finish the queue process</button>
            </div>
          </div>
        ) : (
          <form onSubmit={submit} className="md-b">
            <label className="lbl">
              {LABEL[ask.action] || 'Remark'}
              {!required && <span style={{fontWeight:500,color:'var(--faint)'}}> (optional)</span>}
            </label>
            <input className="inp" autoFocus value={text} onChange={e=>setText(e.target.value)}
                   placeholder="e.g. patient stepped out"/>
            {required && !text.trim() && (
              <div style={{fontSize:12.5,color:'var(--muted)',marginTop:7}}>
                A remark is required by your branch settings.</div>
            )}
            <div className="md-f">
              <button type="button" className="btn b-out" style={{flex:1}} onClick={onClose}>Cancel</button>
              <button className="btn b-pri" style={{flex:1}} disabled={required && !text.trim()}>
                Confirm</button>
            </div>
          </form>
        )}
      </div>
    </div>
  )
}

/* ─── timeline labels ─── */

/* ─── what this counter has finished today ─── */
function History({rows, onClose}) {
  const [q,setQ] = useState('')
  const shown = rows.filter(t=>{
    const v = q.trim().toLowerCase()
    return !v || t.number.toLowerCase().includes(v)
      || (t.patient_name||'').toLowerCase().includes(v)
  })
  return (
    <div className="ov" onClick={onClose}>
      <div className="md" style={{maxWidth:560}} onClick={e=>e.stopPropagation()}>
        <div className="md-h">
          <div>
            <div className="md-t">Queue history</div>
            <div className="md-s">What this counter has finished today.</div>
          </div>
          <button className="btn b-ghost b-ico" onClick={onClose}><Ico n="x" s={17}/></button>
        </div>
        <div className="md-b">
          <div style={{position:'relative',marginBottom:12}}>
            <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',
                          color:'var(--faint)'}}><Ico n="search" s={13}/></span>
            <input className="inp" style={{paddingLeft:30}} value={q}
                   onChange={e=>setQ(e.target.value)} placeholder="Number or patient name…"/>
          </div>
          {shown.length===0 ? (
            <div className="empty" style={{padding:30}}>
              <div className="empty-t">{rows.length ? 'Nothing matches' : 'Nothing finished yet'}</div>
              <div style={{fontSize:13}}>{rows.length
                ? 'Try a different number or name.'
                : 'Queues you finish at this counter show up here.'}</div>
            </div>
          ) : (
            <div style={{maxHeight:420,overflowY:'auto',border:'1px solid var(--line)',
                         borderRadius:11,overflow:'hidden'}}>
              <table className="tb">
                <thead><tr><th>Number</th><th>Service</th><th>Status</th><th style={{textAlign:'right'}}>Finished</th></tr></thead>
                <tbody>{shown.map(t=>(
                  <tr key={t.id}>
                    <td className="num" style={{fontWeight:700}}>{t.number}</td>
                    <td style={{color:t.services?.color,fontWeight:600}}>{t.services?.name}</td>
                    <td><Tag s={t.status}/></td>
                    <td style={{textAlign:'right',color:'var(--muted)'}}>{hhmm(t.completed_at)}</td>
                  </tr>))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      </div>
    </div>
  )
}

/* ─── tags on the serving ticket ─── */
function TagEditor({ticket, onSaved, onError}) {
  const [tags,setTags] = useState(ticket.tags||[])
  const [open,setOpen] = useState(false)
  const [draft,setDraft] = useState('')
  useEffect(()=>{ setTags(ticket.tags||[]); setOpen(false) },[ticket.id])

  const save = async next => {
    setTags(next)
    const {error} = await sb.rpc('set_ticket_tags',{p_ticket_id:ticket.id, p_tags:next})
    if (error) { onError(error.message); setTags(ticket.tags||[]) } else onSaved()
  }
  const add = e => {
    e.preventDefault()
    const v = draft.trim().toUpperCase()
    if (!v || tags.includes(v)) { setDraft(''); return }
    save([...tags, v]); setDraft(''); setOpen(false)
  }
  return (
    <div className="tagbox">
      <div className="side-k" style={{marginBottom:7}}>TAGS</div>
      <div className="chips">
        {tags.map(g=>(
          <span key={g} className="chip chip-x">{g}
            <button onClick={()=>save(tags.filter(x=>x!==g))} aria-label={'Remove '+g}>
              <Ico n="x" s={11}/></button>
          </span>
        ))}
        {open ? (
          <form onSubmit={add} style={{display:'inline-flex',gap:5}}>
            <input className="inp" autoFocus value={draft} onChange={e=>setDraft(e.target.value)}
                   onBlur={()=>!draft && setOpen(false)}
                   style={{width:180,padding:'4px 9px',fontSize:12}} placeholder="e.g. DR. DELA PAZ"/>
          </form>
        ) : (
          <button className="chip chip-add" onClick={()=>setOpen(true)}>
            <Ico n="plus" s={11}/>Add tag</button>
        )}
      </div>
    </div>
  )
}

/* ─── add a walk-in queue from the counter ─── */
function AddQueue({windowId, onClose, onDone}) {
  const [svcs,setSvcs] = useState([])
  const [svc,setSvc]   = useState('')
  const [name,setName] = useState('')
  const [note,setNote] = useState('')
  const [tags,setTags] = useState([])
  const [draft,setDraft] = useState('')
  const [busy,setBusy] = useState(false)
  const [err,setErr]   = useState('')

  useEffect(()=>{
    sb.from('window_services').select('services!inner(id,code,name,name_fil,color)')
      .eq('window_id',windowId)
      .then(({data})=>{
        const list = (data||[]).map(r=>r.services).filter(Boolean)
        setSvcs(list)
        if (list.length===1) setSvc(list[0].id)
      })
  },[windowId])

  const addTag = e => {
    e.preventDefault()
    const v = draft.trim().toUpperCase()
    if (v && !tags.includes(v)) setTags(t=>[...t,v])
    setDraft('')
  }
  const go = async e => {
    e.preventDefault()
    if (!svc) { setErr('Choose a service first.'); return }
    setBusy(true); setErr('')
    const {data,error} = await sb.rpc('issue_ticket',{
      p_service_id:svc, p_patient_name:name||null, p_tags:tags, p_note:note||null
    })
    setBusy(false)
    if (error) return setErr(error.message)
    onDone(data.number)
  }

  return (
    <div className="ov" onClick={onClose}>
      <div className="md" onClick={e=>e.stopPropagation()}>
        <div className="md-h">
          <div>
            <div className="md-t">Add queue</div>
            <div className="md-s">For a walk-in who did not use the kiosk.</div>
          </div>
          <button className="btn b-ghost b-ico" onClick={onClose}><Ico n="x" s={17}/></button>
        </div>
        <form onSubmit={go} className="md-b">
          <div style={{display:'flex',flexDirection:'column',gap:13}}>
            <div>
              <label className="lbl">Service</label>
              <select className="inp" value={svc} onChange={e=>setSvc(e.target.value)} required>
                <option value="">Choose a service</option>
                {svcs.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
              </select>
            </div>
            <div>
              <label className="lbl">Patient name <span style={{fontWeight:500,color:'var(--faint)'}}>(optional)</span></label>
              <input className="inp" value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Maria Santos"/>
            </div>
            <div>
              <label className="lbl">Note <span style={{fontWeight:500,color:'var(--faint)'}}>(optional)</span></label>
              <input className="inp" value={note} onChange={e=>setNote(e.target.value)} placeholder="e.g. for CBC and urinalysis"/>
            </div>
            <div>
              <label className="lbl">Tags</label>
              <div className="chips" style={{marginBottom:7}}>
                {tags.map(g=>(
                  <span key={g} className="chip chip-x">{g}
                    <button type="button" onClick={()=>setTags(t=>t.filter(x=>x!==g))}><Ico n="x" s={11}/></button>
                  </span>
                ))}
              </div>
              <div style={{display:'flex',gap:7}}>
                <input className="inp" value={draft} onChange={e=>setDraft(e.target.value)}
                       onKeyDown={e=>{ if(e.key==='Enter'){ addTag(e) } }}
                       placeholder="e.g. DR. DELA PAZ — ORTHO"/>
                <button type="button" className="btn b-out" onClick={addTag}>Add</button>
              </div>
            </div>
            {err && <div style={{background:'var(--red-wash)',border:'1px solid #f0c9c7',color:'#8f2e2a',
              padding:'9px 12px',borderRadius:9,fontSize:13}}>{err}</div>}
          </div>
          <div className="md-f">
            <button type="button" className="btn b-out" style={{flex:1}} onClick={onClose}>Cancel</button>
            <button className="btn b-pri" style={{flex:1}} disabled={busy}>
              {busy ? <div className="spin"/> : 'Get a number'}
            </button>
          </div>
        </form>
      </div>
    </div>
  )
}

/* ─── move a patient to the next department (keeps the number) ─── */
function MoveModal({ticket, kind, windowId, onClose, onDone}) {
  const [items,setItems] = useState([])
  const [pick,setPick]   = useState(null)
  const [note,setNote]   = useState('')
  const [busy,setBusy]   = useState(false)
  const [err,setErr]     = useState('')
  const [req,setReq]     = useState(false)
  useEffect(()=>{
    sb.from('settings').select('remarks_required,remarks_on_transfer,remarks_on_movement')
      .eq('id',1).maybeSingle()
      .then(({data})=>setReq(!!data && !!data.remarks_required
        && (data.remarks_on_transfer || data.remarks_on_movement)))
  },[])

  useEffect(()=>{
    if (kind==='service')
      sb.from('services').select('id,code,name,name_fil,color').eq('is_active',true)
        .neq('id',ticket.service_id).order('sort_order').then(({data})=>setItems(data||[]))
    else
      sb.from('windows').select('id,name').eq('is_active',true)
        .neq('id',windowId).order('sort_order').then(({data})=>setItems(data||[]))
  },[kind])

  const go = async () => {
    if (!pick) return
    if (req && !note.trim()) { setErr('A note is required by your branch settings.'); return }
    setBusy(true); setErr('')
    const {error} = kind==='service'
      ? await sb.rpc('move_service',{p_ticket_id:ticket.id,p_service_id:pick.id,p_note:note||null})
      : await sb.rpc('move_window',{p_ticket_id:ticket.id,p_window_id:pick.id,p_note:note||null})
    setBusy(false)
    if (error) return setErr(error.message)
    onDone(`${ticket.number} → ${pick.name}`)
  }

  return (
    <div className="ov" onClick={onClose}>
      <div className="md" onClick={e=>e.stopPropagation()}>
        <div className="md-h">
          <div>
            <div className="md-t">Send to another department</div>
            <div className="md-s"><b className="num">{ticket.number}</b> keeps the same number.</div>
          </div>
          <button className="btn b-ghost b-ico" onClick={onClose}><Ico n="x" s={17}/></button>
        </div>
        <div className="md-b">
          <div style={{maxHeight:260,overflowY:'auto',display:'flex',flexDirection:'column',gap:4}}>
            {items.map(it=>(
              <button key={it.id} onClick={()=>setPick(it)}
                style={{display:'flex',alignItems:'center',gap:11,padding:'11px 13px',textAlign:'left',
                  border:`1.5px solid ${pick?.id===it.id?'var(--indigo)':'var(--line)'}`,borderRadius:10,
                  background:pick?.id===it.id?'var(--indigo-wash)':'#fff'}}>
                <span style={{width:17,height:17,borderRadius:'50%',flexShrink:0,display:'grid',placeItems:'center',
                  border:`2px solid ${pick?.id===it.id?'var(--indigo)':'#ccccdd'}`}}>
                  {pick?.id===it.id && <span style={{width:7,height:7,borderRadius:'50%',background:'var(--indigo)'}}/>}
                </span>
                {it.color && <span style={{width:9,height:9,borderRadius:'50%',background:it.color,flexShrink:0}}/>}
                <span style={{fontWeight:600,fontSize:13.5}}>{it.name_fil || it.name}</span>
              </button>
            ))}
          </div>
          <div style={{marginTop:14}}>
            <label className="lbl">Note for the next counter
              {req && <span style={{color:'var(--red)'}}> *</span>}</label>
            <input className="inp" value={note} onChange={e=>setNote(e.target.value)}
                   placeholder="e.g. for CBC and urinalysis"/>
          </div>
          {err && <div style={{background:'var(--red-wash)',border:'1px solid #f0c9c7',color:'#8f2e2a',
            padding:'9px 12px',borderRadius:9,fontSize:13,marginTop:12}}>{err}</div>}
          <div className="md-f">
            <button className="btn b-out" style={{flex:1}} onClick={onClose}>Back</button>
            <button className="btn b-pri" style={{flex:1}} disabled={!pick||busy} onClick={go}>
              {busy ? <div className="spin"/> : 'Send'}
            </button>
          </div>
        </div>
      </div>
    </div>
  )
}

/* ════════════════════════════════════════════════════════════
   LIVE BOARD (admin home)
   ════════════════════════════════════════════════════════════ */
function Board({me}) {
  const [d,setD]     = useState(null)
  const [now,setNow] = useState(new Date())

  const load = useCallback(async ()=>{
    const {data,error} = await sb.rpc('dashboard')
    if (!error && data) setD(data)
  },[])

  useEffect(()=>{
    load()
    const t  = setInterval(()=>setNow(new Date()),1000)
    const ch = sb.channel('admin-board')
      .on('postgres_changes',{event:'*',schema:'public',table:'tickets'},()=>load())
      .on('postgres_changes',{event:'*',schema:'public',table:'sessions'},()=>load())
      .subscribe()
    const slow = setInterval(load, 30000)
    return ()=>{ clearInterval(t); clearInterval(slow); ch.unsubscribe() }
  },[load])

  if (!d) return <div className="mid"><div className="spin d" style={{width:28,height:28,borderWidth:3}}/></div>

  const T = d.totals || {}
  const hour = now.getHours()
  const mins = n => n == null ? '—' : n < 1 ? 'under a minute' : n + ' min'

  const kpi = [
    {k:'Waiting', v:T.waiting ?? 0, sub:'Avg. waiting time', val:mins(T.avg_wait_min),
     ic:'clock', c:'var(--gold)',   bg:'var(--gold-wash)'},
    {k:'Currently serving', v:T.serving ?? 0, sub:'Avg. serving time', val:mins(T.avg_serve_min),
     ic:'desk',  c:'var(--indigo)', bg:'var(--indigo-wash)'},
    {k:'Completed', v:T.done ?? 0, sub:'Tickets issued today', val:(T.issued ?? 0) + '',
     ic:'users', c:'var(--green)',  bg:'var(--green-wash)'},

    ['Completed', T.done ?? 0,      'var(--green)'],
    ['Skipped',   T.skipped ?? 0,   'var(--gold)'],

      <div className="head">

          <span className="live"><span className="dot"/>Live</span>
        </div>

        {/* ── headline numbers ── */}

          {kpi.map(x=>(
            <div key={x.k} className="card kpi">
              <div style={{flex:1,minWidth:0}}>

              <div className="kpi-ic" style={{background:x.bg,color:x.c}}><Ico n={x.ic} s={19}/></div>

        </div>

          {/* ── left: who is on the floor ── */}
          <div style={{display:'flex',flexDirection:'column',gap:13}}>
            <div className="card kpi">
              <div>
                <div className="kpi-k">On the floor</div>

                    <tbody>{d.services.map(s=>(
                      <tr key={s.name}>
                        <td><span style={{display:'inline-flex',alignItems:'center',gap:8}}>
                          <span style={{width:8,height:8,borderRadius:'50%',background:s.color,flexShrink:0}}/>
                          <span style={{fontWeight:600}}>{s.name}</span></span></td>
                        <td style={{textAlign:'center',fontWeight:700,color:s.waiting?'var(--gold)':'var(--faint)'}}>{s.waiting||'—'}</td>
                        <td style={{textAlign:'center',fontWeight:700,color:s.serving?'var(--indigo)':'var(--faint)'}}>{s.serving||'—'}</td>
                        <td style={{textAlign:'center',color:'var(--muted)'}}>{s.done||'—'}</td>
                        <td style={{textAlign:'right',color:'var(--muted)',fontSize:12.5}}>
                          {s.avg_wait_min==null?'—':s.avg_wait_min+'m'}</td>
                        <td style={{textAlign:'right',color:'var(--muted)',fontSize:12.5}}>
                          {s.avg_serve_min==null?'—':s.avg_serve_min+'m'}</td>
                      </tr>))}
                    </tbody>
                  </table>
                )}
              </div>
            </div>
          </div>
        </div>
      </div>
    </>
  )
}

   ADMIN — services

// Every swatch clears 4.5:1 against white, so a service colour can never
// become unreadable as a queue number on the TV.
const SWATCH = ['#676bcc','#8164c5','#2b7ab6','#4775bb','#9c58be','#a258ad',
                '#1b8550','#2a8546','#158378','#1b7f99','#bf498c','#ce453c',
                '#986d19','#a66627','#48822b','#3e8436']

function Services() {
  const toast = useToast()
  const [list,setList] = useState([])
  const [sel,setSel]   = useState(null)
  const [draft,setDraft] = useState({})
  const [adding,setAdding] = useState(false)
  const [nw,setNw] = useState({code:'',name:''})

  const load = async (keep) => {
    const {data} = await sb.from('services').select('*').order('sort_order')
    setList(data||[])
    if (keep) setSel((data||[]).find(s=>s.id===keep)||null)
    else if (!sel && data?.length) setSel(data[0])
  }
  useEffect(()=>{ load() },[])
  useEffect(()=>{ setDraft({}) },[sel?.id])

  const v = k => draft[k] !== undefined ? draft[k] : sel?.[k]
  const set = (k,val) => setDraft(d=>({...d,[k]:val}))
  const dirty = Object.keys(draft).length > 0

  const save = async () => {
    const {error} = await sb.from('services').update({
      code:v('code'), name:v('name'), name_fil:v('name_fil'), color:v('color'),
      is_active:v('is_active'), show_on_kiosk:v('show_on_kiosk'),
      allow_multi_serve:v('allow_multi_serve'), sort_order:Number(v('sort_order'))||0,
    }).eq('id',sel.id)
    if (error) return toast(error.message,'err')
    setDraft({}); await load(sel.id); toast('Saved','ok')
  }
  const add = async e => {
    e.preventDefault()
    const code = nw.code.trim().toUpperCase()
    if (!code || !nw.name.trim()) return
    const {data,error} = await sb.from('services')
      .insert({code, name:nw.name.trim(), sort_order:(list.length+1)*10}).select().single()
    if (error) return toast(error.message,'err')
    setNw({code:'',name:''}); setAdding(false); await load(data.id); toast('Added','ok')
  }
  const remove = async () => {
    if (!confirm(`Delete "${sel.name}"? This fails if it already has tickets today.`)) return
    const {error} = await sb.from('services').delete().eq('id',sel.id)
    if (error) return toast('Cannot delete — a ticket or counter still uses it.','err')
    setSel(null); await load(); toast('Deleted','ok')
  }

  return (
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      <div style={{width:278,flexShrink:0,background:'var(--card)',borderRight:'1px solid var(--line)',
                   display:'flex',flexDirection:'column'}}>
        <div style={{padding:'15px 16px',borderBottom:'1px solid var(--line-2)'}}>
          <div style={{fontWeight:800,fontSize:14.5}}>Services</div>
          <div style={{fontSize:12,color:'var(--muted)'}}>{list.length} total</div>
        </div>
        <div style={{flex:1,overflowY:'auto',padding:5}}>
          {list.map(s=>(
            <button key={s.id} onClick={()=>setSel(s)}
              style={{display:'flex',alignItems:'center',gap:9,width:'100%',padding:'9px 11px',
                borderRadius:9,textAlign:'left',background:sel?.id===s.id?'var(--indigo-wash)':'transparent',
                color:sel?.id===s.id?'var(--indigo)':'var(--text)',fontWeight:sel?.id===s.id?600:500,fontSize:13.5}}>
              <span style={{width:9,height:9,borderRadius:'50%',background:s.color,flexShrink:0,
                opacity:s.is_active?1:.3}}/>
              <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.name}</span>
              <span className="num" style={{fontSize:11,color:'var(--faint)'}}>{s.code}</span>
            </button>
          ))}
        </div>
        <div style={{padding:10,borderTop:'1px solid var(--line-2)'}}>
          {adding ? (
            <form onSubmit={add} style={{display:'flex',flexDirection:'column',gap:6}}>
              <input className="inp" style={{fontSize:13}} autoFocus placeholder="Code (e.g. LAB)" maxLength={4}
                value={nw.code} onChange={e=>setNw(n=>({...n,code:e.target.value.toUpperCase()}))}/>
              <input className="inp" style={{fontSize:13}} placeholder="Name"
                value={nw.name} onChange={e=>setNw(n=>({...n,name:e.target.value}))}/>
              <div style={{display:'flex',gap:5}}>
                <button className="btn b-pri b-sm" style={{flex:1}}>Add</button>
                <button type="button" className="btn b-out b-sm b-ico" onClick={()=>setAdding(false)}><Ico n="x" s={14}/></button>
              </div>
            </form>
          ) : (
            <button className="btn b-pri b-full b-sm" onClick={()=>setAdding(true)}><Ico n="plus" s={14}/>New service</button>
          )}
        </div>
      </div>

      <div style={{flex:1,overflowY:'auto',padding:24}}>
        {!sel ? <div className="empty" style={{paddingTop:80}}><div className="empty-t">Choose a service</div></div> : (
          <div style={{maxWidth:620,display:'flex',flexDirection:'column',gap:13}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
              <div>
                <h2 className="h1" style={{fontSize:18}}>{sel.name}</h2>
                <p className="sub">Numbers run from <b className="num">{v('code')}001</b> upward</p>
              </div>
              <button className="btn b-out b-sm" style={{color:'var(--red)'}} onClick={remove}>
                <Ico n="trash" s={14}/>Delete</button>
            </div>

            <div className="card" style={{padding:17}}>
              <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:15}}>
                <div style={{width:60,height:60,borderRadius:14,background:v('color'),display:'grid',
                  placeItems:'center',color:'#fff',flexShrink:0}}>
                  <span className="num" style={{fontSize:17}}>{v('code')}</span>
                </div>
                <div style={{flex:1}}>
                  <label className="lbl">Name</label>
                  <input className="inp" value={v('name')||''} onChange={e=>set('name',e.target.value)}/>
                </div>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
                <div>
                  <label className="lbl">Code (number prefix)</label>
                  <input className="inp" maxLength={4} value={v('code')||''}
                    onChange={e=>set('code',e.target.value.toUpperCase())}/>
                </div>
                <div>
                  <label className="lbl">Filipino name</label>
                  <input className="inp" value={v('name_fil')||''} onChange={e=>set('name_fil',e.target.value)}
                    placeholder="Shown on the kiosk"/>
                </div>
              </div>
              <div style={{marginTop:13}}>
                <label className="lbl">Colour</label>
                <div style={{display:'flex',flexWrap:'wrap',gap:7}}>
                  {SWATCH.map(c=>(
                    <button key={c} onClick={()=>set('color',c)} aria-label={c}
                      style={{width:26,height:26,borderRadius:'50%',background:c,
                        outline:v('color')===c?`2px solid ${c}`:'none',outlineOffset:2}}/>
                  ))}
                </div>
              </div>
            </div>

            <div className="card">
              {[['is_active','Active','When off, no new numbers can be taken for it.'],
                ['show_on_kiosk','Show on kiosk','Patients can pick it on the touchscreen.'],
                ['allow_multi_serve','Allow multiple serving',
                 'A counter can hold several of these at once — for departments where one patient is being prepared while another is attended to. When off, calling a new queue sends the held one back to the line.']].map(([k,t,d],i)=>(
                <div key={k} style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:14,
                  padding:'13px 17px',borderTop:i?'1px solid var(--line-2)':'none'}}>
                  <div><div style={{fontWeight:600,fontSize:13.5}}>{t}</div>
                    <div style={{fontSize:12.5,color:'var(--muted)',marginTop:1}}>{d}</div></div>
                  <button className={'sw '+(v(k)?'on':'')} onClick={()=>set(k,!v(k))}><i/></button>
                </div>
              ))}
            </div>

            {dirty && (
              <div style={{display:'flex',gap:8,position:'sticky',bottom:0,padding:'12px 0',
                background:'linear-gradient(transparent,var(--paper) 28%)'}}>
                <button className="btn b-out" style={{flex:1}} onClick={()=>setDraft({})}>Cancel</button>
                <button className="btn b-pri" style={{flex:1}} onClick={save}><Ico n="check" s={15}/>Save</button>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  )
}

/* ════════════════════════════════════════════════════════════
   ADMIN — windows
